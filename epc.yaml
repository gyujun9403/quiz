# EPC(LTE 코어) 단말 절차. C-SGN(CIoT Serving Gateway Node, MME·S-GW·P-GW 통합 장비) 업무용.
# 일반 EPC 절차를 먼저 다루고, C-SGN에서 쓰는 CIoT 차이점(Control Plane CIoT 최적화, PSM, eDRX)을 얹는다.
# 흐름·용어는 3GPP TS 23.401(Release 19)에 대조. S6a/S13 커맨드는 diameter.yaml, Attach 전체 흐름은
# ims-0018에 있다. 영역별 묶음은 sets.yaml의 csgn-* 세트로 고른다.

# ---------------- ① 등록·인증 ----------------

- id: epc-0001
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "C-SGN(CIoT Serving Gateway Node)이 한 장비 안에 합쳐 구현하는 EPC 기능은?"
  choices:
    - "MME, S-GW (필요하면 P-GW까지)"
    - "eNodeB, MME (무선과 제어)"
    - "HSS, MME (가입자 DB와 제어)"
    - "P-CSCF, S-CSCF (IMS 제어)"
  answer: 0
  explain: |
    C-SGN은 CIoT 배포용 결합 노드 구현 방식이다.
    제어 평면과 사용자 평면 경로의 EPS 엔티티(MME, S-GW, P-GW)를 한 장비에 모아 물리 장비 수를 줄인다.
    외부 인터페이스는 각 기능의 인터페이스 그대로다. 예를 들어 HSS와는 MME처럼 S6a로 연결된다.
    C-SGN은 Control Plane CIoT 최적화 같은 CIoT 소량 데이터 전송 기능을 지원한다.
  ref: "3GPP TS 23.401 Annex L.4"

- id: epc-0002
  type: ox
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "EMM-REGISTERED 상태의 UE는 예외 없이 항상 PDN 연결을 하나 이상 가진다."
  answer: false
  explain: |
    아니다. 보통 EMM-REGISTERED UE는 PDN 연결이 하나 이상 있다. Attach 때 기본 베어러를 만들어 항상 연결 상태를 유지하기 때문이다.
    예외가 "Attach without PDN connectivity"를 지원하는 UE다. 이 UE는 PDN 연결 없이 등록만 할 수 있다.
    PDN 연결 없는 Attach는 C-SGN이 지원하는 CIoT 기능 중 하나다.
  ref: "3GPP TS 23.401 §4.6.2.2, Annex L.4"

- id: epc-0003
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "UE가 Attach Request에 임시 식별자(GUTI) 대신 IMSI를 넣어 보내는 경우는?"
  choices:
    - "유효한 GUTI나 P-TMSI가 없을 때"
    - "같은 MME로 다시 Attach할 때"
    - "이전 Attach가 정상 해제됐을 때"
    - "eNodeB가 IMSI를 요구했을 때"
  answer: 0
  explain: |
    UE는 유효한 GUTI가 있으면 이전 GUTI로 자신을 알린다. IMSI는 유효한 GUTI나 P-TMSI가 없을 때 넣는다.
    또 "PLMN 변경 시 IMSI로 Attach" 설정이 있는 UE가 새 PLMN에 접속할 때도 IMSI를 넣는다.
    MME가 GUTI로 UE를 찾지 못하면 Identity Request로 IMSI를 따로 요청한다.
  ref: "3GPP TS 23.401 §5.3.2.1 (1, 4단계)"

- id: epc-0004
  type: ox
  topic: EPC
  difficulty: advanced
  tags: [concept, message-flow]
  question: "Attach Request가 무결성 보호되어 있고 MME의 무결성 검사도 통과하면, MME는 Attach 중 인증(AKA)을 생략할 수 있다."
  answer: true
  explain: |
    맞다. 다음 경우에는 인증과 NAS 보안 설정이 필수다.
    - 망 어디에도 UE 컨텍스트가 없을 때
    - Attach Request가 무결성 보호되지 않았을 때
    - 무결성 검사에 실패했을 때
    그 밖의 경우에는 인증이 선택 사항이다.
    인증을 하면 MME는 S6a AIR로 받은 인증 벡터를 쓴다(diam-0035).
  ref: "3GPP TS 23.401 §5.3.2.1 (5a단계)"

- id: epc-0005
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "임시 식별자 M-TMSI와 실제 가입자 식별자 IMSI의 대응 관계를 아는 곳은?"
  choices: ["UE와 MME", "UE와 HSS", "eNodeB와 MME", "MME와 S-GW"]
  answer: 0
  explain: |
    M-TMSI는 UE와 MME 사이에서 사용자를 식별한다. M-TMSI와 IMSI의 대응은 UE와 MME만 안다.
    무선 구간에 IMSI를 드러내지 않으려는 사용자 식별자 기밀성 기능이다.
    MME 코드와 M-TMSI를 합친 것이 S-TMSI다. UE는 Service Request를 보낼 때 S-TMSI로 자신을 알린다.
  ref: "3GPP TS 23.401 §5.3.10.3, §5.3.4.1 (1단계)"

- id: epc-0006
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "Attach 중 MME가 S-GW에 기본 베어러(default bearer) 생성을 요청하는 메시지는?"
  choices:
    - "Create Session Request"
    - "Modify Bearer Request"
    - "Update Location Request"
    - "Initial Context Setup Request"
  answer: 0
  explain: |
    MME는 HSS에서 가입자 데이터(ULA)를 받은 뒤 Create Session Request를 S-GW로 보낸다.
    S-GW는 이를 P-GW로 넘겨 기본 베어러와 PDN 연결을 만든다.
    Modify Bearer Request는 나중에 eNodeB 쪽 주소를 S-GW에 알려 하향 경로를 완성할 때 쓴다.
    Update Location Request는 HSS로, Initial Context Setup Request는 eNodeB로 보낸다.
  ref: "3GPP TS 23.401 §5.3.2.1 (12~16, 23단계)"

- id: epc-0007
  type: match
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "EPS의 이동성 관리(EMM)·연결 관리(ECM) 상태와 그 뜻을 짝지어라."
  pairs:
    - {left: "EMM-DEREGISTERED", right: "MME가 UE 위치를 몰라 페이징할 수 없음"}
    - {left: "EMM-REGISTERED", right: "Attach 성공, MME가 TA 목록 단위로 위치를 앎"}
    - {left: "ECM-IDLE", right: "NAS 신호 연결이 없고 S1-MME·S1-U도 없음"}
    - {left: "ECM-CONNECTED", right: "RRC와 S1-MME로 이루어진 신호 연결이 있음"}
  explain: |
    EMM은 등록 여부, ECM은 신호 연결 여부를 나타낸다. 두 축은 따로 움직인다.
    그래서 "EMM-REGISTERED이면서 ECM-IDLE"이 휴지 상태의 일반적인 모습이다.
    ECM-CONNECTED에서는 MME가 UE 위치를 서빙 eNodeB 단위로 안다.
    S1 release가 ECM-CONNECTED를 ECM-IDLE로 바꾼다.
  ref: "3GPP TS 23.401 §4.6.2, §4.6.3"

# ---------------- ② 통신·페이징 ----------------

- id: epc-0008
  type: order
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "ECM-IDLE 상태인 UE 앞으로 하향 데이터가 도착해, 망이 UE를 깨우는 흐름(Network Triggered Service Request)을 순서·방향까지 맞춰라."
  items:
    - {msg: "Downlink Data Notification", from: "S-GW", to: "MME"}
    - {msg: "DDN Ack", from: "MME", to: "S-GW"}
    - {msg: "Paging (S1-AP)", from: "MME", to: "eNodeB"}
    - {msg: "Paging (RRC)", from: "eNodeB", to: "UE"}
    - {msg: "Service Request", from: "UE", to: "MME"}
  decoys:
    - {msg: "Release Access Bearers Req", from: "MME", to: "S-GW"}
    - {msg: "UE Context Release Cmd", from: "MME", to: "eNodeB"}
  explain: |
    S-GW는 하향 사용자 평면 TEID가 없는 UE 앞으로 패킷이 오면 패킷을 버퍼링한다.
    그리고 Downlink Data Notification(DDN)을 MME로 보낸다. MME는 DDN Ack로 답한다.
    MME는 UE가 등록된 Tracking Area의 eNodeB들에 S1-AP Paging을 보내고, eNodeB가 무선으로 UE를 부른다.
    페이징을 받은 UE는 Service Request로 응답한다. 이후 과정은 UE가 시작하는 Service Request와 같다.
    Release Access Bearers와 S1 UE Context Release는 반대로 UE를 휴지 상태로 보내는 S1 release 메시지다.
    다이어그램에서 Service Request는 eNodeB를 거쳐 MME로 가는 NAS 메시지다.
    조각 이름은 Req(Request)·Cmd(Command)로 줄여 적었다.
  ref: "3GPP TS 23.401 §5.3.4.3 (1~5단계)"

- id: epc-0009
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "ECM-IDLE인 UE 앞으로 하향 패킷이 S-GW에 도착했다. S-GW가 하는 일은?"
  choices:
    - "패킷을 버퍼링하고 MME에 DDN을 보낸다"
    - "마지막 eNodeB로 패킷을 그대로 보낸다"
    - "패킷을 버리고 P-GW에 오류를 알린다"
    - "eNodeB들에 직접 Paging을 보낸다"
  answer: 0
  explain: |
    S-GW 컨텍스트에 하향 사용자 평면 TEID가 없으면 UE가 사용자 평면으로 연결되지 않은 상태다.
    S-GW는 패킷을 버퍼링하고 서빙 MME에 Downlink Data Notification(DDN)을 보낸다.
    페이징은 MME가 한다. S-GW는 eNodeB와 신호를 주고받지 않는다.
    마지막 eNodeB 정보는 S1 release 때 S-GW에서 지워졌기 때문에 바로 보낼 수도 없다.
  ref: "3GPP TS 23.401 §5.3.4.3 (1, 2단계), §5.3.5 (3단계)"

- id: epc-0010
  type: short
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "S-GW가 ECM-IDLE UE 앞으로 하향 데이터가 왔다고 MME에 알리는 GTP 메시지의 약어는? (3글자)"
  answer: ["DDN"]
  explain: |
    DDN = Downlink Data Notification. MME는 DDN Ack로 답하고 UE를 페이징한다.
    DDN에는 데이터가 도착한 베어러의 EPS Bearer ID와 ARP(우선순위)가 항상 들어간다.
  ref: "3GPP TS 23.401 §5.3.4.3 (2단계)"

- id: epc-0011
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "MME는 ECM-IDLE UE를 찾기 위해 어느 eNodeB들에 Paging을 보내는가?"
  choices:
    - "UE가 등록된 Tracking Area에 속한 eNodeB들"
    - "UE가 마지막으로 접속했던 eNodeB 하나"
    - "MME에 연결된 모든 eNodeB"
    - "S-GW가 DDN에 적어 보낸 eNodeB"
  answer: 0
  explain: |
    ECM-IDLE에서 MME는 UE 위치를 Tracking Area 목록 단위로만 안다.
    그래서 UE가 등록된 Tracking Area에 속한 각 eNodeB에 Paging을 보낸다.
    마지막 셀 정보(권장 셀 정보)가 있으면 페이징 범위를 줄이는 데 쓸 수 있다.
    UE는 목록에 없는 TA로 옮기면 TAU를 해서 MME가 계속 페이징할 수 있게 한다.
  ref: "3GPP TS 23.401 §5.3.4.3 (3a단계), §4.6.3.1"

- id: epc-0012
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "ECM-IDLE 상태에서 Paging을 받은 UE가 MME에 보내는 NAS 메시지는?"
  choices: ["Service Request", "Attach Request", "Tracking Area Update Request", "Paging Response"]
  answer: 0
  explain: |
    페이징을 받은 ECM-IDLE UE는 UE가 시작하는 Service Request 절차를 그대로 수행한다.
    올릴 데이터가 생긴 UE가 보내는 메시지와 같다.
    Paging Response는 2G/3G 회선 교환에서 쓰는 이름이다. LTE NAS의 페이징 응답은 Service Request다.
    User Plane CIoT 최적화로 RRC 연결을 일시 중단(suspend)해 둔 UE는 대신 Connection Resume 절차를 쓴다.
  ref: "3GPP TS 23.401 §5.3.4.3 (5단계)"

- id: epc-0013
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "ECM-IDLE 상태인 UE의 위치를 MME는 어느 정도까지 아는가?"
  choices:
    - "UE에 할당한 Tracking Area 목록 단위"
    - "UE가 머무는 서빙 eNodeB 단위"
    - "UE가 머무는 서빙 셀 단위"
    - "UE가 등록된 PLMN 단위"
  answer: 0
  explain: |
    EMM-REGISTERED UE의 위치는 적어도 UE에 할당한 TA 목록 단위로 MME가 안다.
    ECM-CONNECTED가 되면 서빙 eNodeB 단위로 알게 된다.
    그래서 휴지 UE를 찾으려면 TA 목록 안의 eNodeB들에 페이징해야 한다.
  ref: "3GPP TS 23.401 §4.6.2.2, §4.6.3.2"

- id: epc-0014
  type: ox
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "UE가 PSM이나 eDRX 상태라 지금 페이징할 수 없으면, MME는 DDN Ack로 S-GW에 하향 데이터를 더 오래 버퍼링하라고 요청할 수 있다."
  answer: true
  explain: |
    맞다. 이것을 extended buffering이라고 한다.
    MME는 DDN Ack에 DL Buffering Requested와 버퍼링 시간(DL Buffering Duration)을 넣는다.
    그 시간 동안 S-GW는 패킷을 모아 두고 DDN을 다시 보내지 않는다.
    UE가 깨어나 신호를 보내면 MME가 사용자 평면을 설정해 버퍼링된 데이터를 내려보낸다.
  ref: "3GPP TS 23.401 §5.3.4.3 (2단계)"

- id: epc-0015
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "eDRX(확장 휴지 모드 DRX)가 적용된 UE 앞으로 DDN이 왔다. MME는 언제 Paging을 보내는가?"
  choices:
    - "UE의 다음 페이징 시점(PO) 직전에"
    - "DDN을 받은 즉시 바로"
    - "UE의 다음 주기적 TAU 때"
    - "UE의 Active Time이 끝난 직후"
  answer: 0
  explain: |
    eDRX UE는 긴 주기마다 잠깐씩만 페이징을 들으므로, MME는 UE의 다음 페이징 시점 직전에 페이징한다.
    UE는 Attach나 TAU 때 eDRX 파라미터를 요청하고, MME가 받아들일지 정한다.
    Active Time은 PSM의 타이머다. PSM에 들어간 UE는 페이징 자체를 받지 않는다.
  ref: "3GPP TS 23.401 §5.3.4.3 (3a단계), §5.13a, §4.3.22"

- id: epc-0016
  type: order
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "ECM-IDLE UE가 보낼 데이터가 생겨 사용자 평면을 다시 세우는 흐름(UE triggered Service Request)을 순서·방향까지 맞춰라."
  items:
    - {msg: "Service Request", from: "UE", to: "MME"}
    - {msg: "Initial Context Setup Req", from: "MME", to: "eNodeB"}
    - {msg: "무선 베어러 설정", from: "eNodeB", to: "UE"}
    - {msg: "Initial Context Setup Cmpl", from: "eNodeB", to: "MME"}
    - {msg: "Modify Bearer Request", from: "MME", to: "S-GW"}
    - {msg: "Modify Bearer Response", from: "S-GW", to: "MME"}
  decoys:
    - {msg: "Downlink Data Notification", from: "S-GW", to: "MME"}
    - {msg: "Create Session Request", from: "MME", to: "S-GW"}
  explain: |
    UE는 S-TMSI와 함께 NAS Service Request를 보낸다. eNodeB는 이를 S1-AP Initial UE Message로 MME에 넘긴다.
    MME는 Initial Context Setup Request로 S-GW 주소와 상향 TEID, 보안 컨텍스트를 eNodeB에 준다.
    eNodeB는 무선 베어러를 세운다. 이때부터 업링크 데이터를 S-GW로 보낼 수 있다.
    eNodeB는 Initial Context Setup Complete로 자기 주소와 하향 TEID를 MME에 알린다.
    MME가 Modify Bearer Request로 이 정보를 S-GW에 넘기면 다운링크도 흐를 수 있다.
    DDN은 망이 시작하는 경우의 메시지이고, Create Session은 새 PDN 연결을 만들 때 쓴다.
    조각 이름은 Req(Request)·Cmpl(Complete)로 줄여 적었다.
  ref: "3GPP TS 23.401 §5.3.4.1 (1~12단계)"

# ---------------- ③ 휴지 (S1 release · PSM) ----------------

- id: epc-0017
  type: order
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "일정 시간 데이터가 없어 eNodeB가 UE를 휴지(ECM-IDLE) 상태로 보내는 S1 release 흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "UE Context Release Req", from: "eNodeB", to: "MME"}
    - {msg: "Release Access Bearers Req", from: "MME", to: "S-GW"}
    - {msg: "Release Access Bearers Resp", from: "S-GW", to: "MME"}
    - {msg: "UE Context Release Cmd", from: "MME", to: "eNodeB"}
    - {msg: "RRC Connection Release", from: "eNodeB", to: "UE"}
    - {msg: "UE Context Release Cmpl", from: "eNodeB", to: "MME"}
  decoys:
    - {msg: "Delete Session Request", from: "MME", to: "S-GW"}
    - {msg: "Detach Request", from: "MME", to: "UE"}
  explain: |
    eNodeB가 사용자 무활동(User Inactivity) 등을 원인으로 S1 UE Context Release Request를 보낸다.
    MME는 Release Access Bearers로 S-GW의 S1-U 베어러(eNodeB 쪽 정보)를 해제한다.
    그다음 S1 UE Context Release Command를 eNodeB에 보낸다.
    eNodeB는 RRC Connection Release로 UE의 무선 연결을 끊고 UE 컨텍스트를 지운 뒤, Release Complete로 확인한다.
    휴지는 PDN 연결과 베어러를 유지한다. 그래서 세션을 지우는 Delete Session이나 등록을 끊는 Detach는 쓰지 않는다.
    MME가 시작하는 S1 release는 첫 단계 없이 Release Access Bearers부터 시작한다.
    조각 이름은 S1-AP의 S1 접두어를 빼고 Req·Resp·Cmd·Cmpl로 줄여 적었다.
  ref: "3GPP TS 23.401 §5.3.5 (Figure 5.3.5-1, 1b~6단계)"

- id: epc-0018
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "eNodeB가 S1 UE Context Release Request에 넣는 원인 값 중, 일정 시간 주고받은 데이터가 없을 때 쓰는 것은?"
  choices: ["User Inactivity", "O&M Intervention", "Unspecified Failure", "Radio Connection With UE Lost"]
  answer: 0
  explain: |
    User Inactivity(사용자 무활동)가 가장 흔한 휴지 진입 원인이다.
    O&M Intervention은 운용자 조작, Unspecified Failure는 분류되지 않은 오류다.
    Radio Connection With UE Lost는 무선 연결이 끊긴 비정상 해제다.
    원인에 따라 GBR 베어러 처리가 다르다. User Inactivity면 MME가 GBR 베어러를 유지한다.
    무선 연결이 끊긴 경우에는 S1 release 뒤 GBR 베어러를 비활성화한다.
  ref: "3GPP TS 23.401 §5.3.5 (1b, 6단계)"

- id: epc-0019
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "S1 release 중 Release Access Bearers Request를 받은 S-GW가 지우는 정보는?"
  choices:
    - "eNodeB 주소와 eNodeB 쪽 TEID"
    - "UE의 모든 베어러와 PDN 연결"
    - "P-GW와 맺은 S5 터널 정보"
    - "자신이 할당한 S1-U 상향 TEID"
  answer: 0
  explain: |
    S-GW는 그 UE의 eNodeB 관련 정보(주소와 TEID)만 지운다. 나머지 S-GW 컨텍스트는 그대로다.
    자신이 할당한 S1-U 설정(상향 주소·TEID)도 유지한다. 그래서 다음 Service Request 때 MME가 이 값을 eNodeB에 다시 준다.
    이후 하향 패킷이 오면 보낼 eNodeB가 없으므로 버퍼링하고 DDN을 보낸다.
  ref: "3GPP TS 23.401 §5.3.5 (3단계)"

- id: epc-0020
  type: ox
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "S1 release로 UE가 ECM-IDLE이 되어도, non-GBR EPS 베어러는 MME와 S-GW에 그대로 남는다."
  answer: true
  explain: |
    맞다. S1 release 뒤 MME는 eNodeB 관련 정보만 지우고, S-GW의 S1-U 설정을 포함한 나머지 컨텍스트를 유지한다.
    non-GBR 베어러는 MME와 S-GW에 모두 보존된다.
    그래서 다시 통신할 때 PDN 연결을 새로 만들지 않고 Service Request만으로 사용자 평면을 되살린다.
  ref: "3GPP TS 23.401 §5.3.5 (6단계)"

- id: epc-0021
  type: ox
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "ECM-IDLE 상태가 되어도 eNodeB에는 그 UE의 컨텍스트가 남아 있다."
  answer: false
  explain: |
    아니다. S1 release가 끝나면 eNodeB는 그 UE의 컨텍스트를 모두 지운다. ECM-IDLE UE에는 S1-MME도 S1-U도 없다.
    예외가 User Plane CIoT 최적화로 RRC 연결을 일시 중단(suspend)한 UE다. 이 경우 eNodeB가 컨텍스트를 보관한다.
    그래서 UE는 Service Request 대신 Connection Resume으로 빠르게 돌아온다.
  ref: "3GPP TS 23.401 §4.6.3.1, §5.3.5"

- id: epc-0022
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [concept]
  question: "PSM(Power Saving Mode)을 쓰는 UE가 실제로 PSM에 들어가는 시점은?"
  choices:
    - "ECM-IDLE이 된 뒤 Active 타이머가 만료될 때"
    - "주기적 TAU 타이머가 만료될 때"
    - "S1 release가 끝나는 바로 그때"
    - "eDRX 주기 하나가 끝날 때"
  answer: 0
  explain: |
    UE는 Attach나 TAU 때 Active Time 값을 요청하고, 망이 값을 정해 준다.
    UE와 MME는 ECM-CONNECTED에서 ECM-IDLE로 바뀔 때 이 값으로 Active 타이머를 시작한다.
    타이머가 만료되면 UE는 무선(Access Stratum) 기능을 끄고 PSM에 들어간다.
    그 전까지는 일반 휴지 상태라 페이징을 받을 수 있다.
    주기적 TAU 타이머는 PSM에서 다시 깨어나는 시점을 정한다.
  ref: "3GPP TS 23.401 §4.3.22"

- id: epc-0023
  type: ox
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "UE가 PSM에 들어가면 MME는 그 UE를 EMM-DEREGISTERED 상태로 바꾼다."
  answer: false
  explain: |
    아니다. MME는 PSM 중인 UE를 EMM-REGISTERED로 보되, 페이징으로는 도달할 수 없다고 본다.
    등록은 유지되므로 UE는 깨어난 뒤 Attach를 다시 할 필요가 없다.
    PSM 중 하향 데이터는 extended buffering 같은 고지연 통신 기능으로 처리한다.
  ref: "3GPP TS 23.401 §4.3.22, §5.3.4.3 (2단계)"

- id: epc-0024
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "PSM에 들어간 UE가 다시 무선 기능을 켜고 망과 통신하는 경우는?"
  choices:
    - "주기적 TAU 시점이 되거나 보낼 데이터가 생길 때"
    - "MME가 Paging을 보내 UE를 깨울 때"
    - "S-GW가 MME에 DDN을 보낼 때"
    - "Active 타이머가 다시 시작될 때"
  answer: 0
  explain: |
    PSM 중에도 UE는 주기적 TAU 타이머 같은 NAS 타이머를 계속 돌린다.
    UE는 주기적 TAU 전에 무선 기능을 다시 켜고 TAU를 한다.
    보낼 데이터가 생기면 언제든 깨어날 수 있다.
    PSM 중에는 무선 기능이 꺼져 있어 페이징을 받지 못한다. DDN이 와도 MME가 깨울 수 없다.
  ref: "3GPP TS 23.401 §4.3.22"

# ---------------- ④ 업링크·다운링크 ----------------

- id: epc-0025
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [message-flow]
  question: "UE triggered Service Request에서 S-GW가 UE 쪽으로 하향 데이터를 보낼 수 있게 되는 시점은?"
  choices:
    - "MME의 Modify Bearer Request로 eNodeB 주소·하향 TEID를 받은 뒤"
    - "UE가 NAS Service Request를 eNodeB로 보낸 직후"
    - "eNodeB가 Initial Context Setup Request를 받은 직후"
    - "UE의 첫 업링크 패킷이 S-GW에 도착한 직후"
  answer: 0
  explain: |
    하향 데이터를 보내려면 S-GW가 eNodeB 주소와 eNodeB 쪽 S1 TEID를 알아야 한다.
    이 정보는 eNodeB → MME(Initial Context Setup Complete) → S-GW(Modify Bearer Request) 순서로 전달된다.
    반대로 eNodeB는 Initial Context Setup Request에서 S-GW 주소와 상향 TEID를 받는다. 그래서 업링크가 먼저 열린다.
  ref: "3GPP TS 23.401 §5.3.4.1 (4, 6~8단계)"

- id: epc-0026
  type: ox
  topic: EPC
  difficulty: basic
  tags: [message-flow]
  question: "Service Request 뒤 UE의 업링크 데이터는 MME가 S-GW에 Modify Bearer Request를 보내기 전에 이미 S-GW에 도착할 수 있다."
  answer: true
  explain: |
    맞다. 무선 베어러가 세워지면 eNodeB는 상향 데이터를 S-GW로 바로 보낼 수 있다.
    S-GW 주소와 상향 TEID는 Initial Context Setup Request로 이미 받았기 때문이다.
    Modify Bearer Request는 그 뒤에 가며, 하향 방향(eNodeB 주소·하향 TEID)을 S-GW에 알려 준다.
  ref: "3GPP TS 23.401 §5.3.4.1 (6~8단계)"

- id: epc-0027
  type: match
  topic: EPC
  difficulty: basic
  tags: [concept, transport]
  question: "EPC 레퍼런스 포인트와 그 구간·역할을 짝지어라."
  pairs:
    - {left: "S1-MME", right: "eNodeB ↔ MME 제어 평면"}
    - {left: "S1-U", right: "eNodeB ↔ S-GW 베어러별 사용자 평면 터널"}
    - {left: "S11", right: "MME ↔ S-GW 제어 평면"}
    - {left: "S5", right: "S-GW ↔ P-GW 사용자 평면 터널과 터널 관리"}
    - {left: "SGi", right: "P-GW ↔ 외부 패킷 데이터망"}
  explain: |
    업링크는 UE → eNodeB → (S1-U) → S-GW → (S5) → P-GW → (SGi) → 외부망으로 흐른다. 다운링크는 그 반대다.
    S1-MME와 S11은 제어 신호용이다. S1-U와 S5는 GTP 기반 사용자 평면 터널이다.
    C-SGN처럼 S-GW와 P-GW를 한 장비에 넣으면 S5는 장비 내부 구간이 된다.
  ref: "3GPP TS 23.401 §4.2.3, Annex L.4"

- id: epc-0028
  type: mcq
  topic: EPC
  difficulty: basic
  tags: [transport]
  question: "S1-U(eNodeB ↔ S-GW) 구간에서 사용자 패킷을 터널로 실어 나르는 프로토콜은?"
  choices: ["GTP-U", "GTP-C", "S1-AP", "Diameter"]
  answer: 0
  explain: |
    S1-U는 GTP-U로 사용자 패킷을 베어러별 터널에 담아 나른다. 터널은 TEID로 구분한다.
    GTP-C는 S11·S5의 제어 메시지(Create Session, Modify Bearer 등)에 쓴다.
    S1-AP는 S1-MME의 제어 프로토콜이고, Diameter는 S6a 같은 가입자 정보 인터페이스에 쓴다.
  ref: "3GPP TS 23.401 §4.2.3"

- id: epc-0029
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "Control Plane CIoT 최적화를 쓰는 UE의 소량 업링크 데이터는 어떻게 망에 전달되는가?"
  choices:
    - "NAS 메시지에 담겨 eNodeB를 거쳐 MME로 간다"
    - "S1-U GTP-U 터널로 S-GW에 바로 간다"
    - "SMS로 바뀌어 MSC를 거쳐 전달된다"
    - "RRC 메시지에만 실려 eNodeB에서 끝난다"
  answer: 0
  explain: |
    Control Plane CIoT 최적화에서는 사용자 데이터를 NAS PDU에 EPS Bearer ID와 함께 담는다.
    eNodeB는 NAS PDU를 S1-AP로 MME에 넘기고, MME가 무결성을 확인하고 복호한다.
    그다음 MME가 S11-U로 S-GW에 넘긴다.
    무선 베어러와 S1-U를 세우지 않아 신호가 줄어든다. 그래서 C-SGN의 소량 데이터 전송에 쓴다.
    S1-U 베어러가 세워져 있으면 UE는 S1-U로 데이터를 보내야 한다.
  ref: "3GPP TS 23.401 §5.3.4B.1, §5.3.4B.2"

- id: epc-0030
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept, transport]
  question: "Control Plane CIoT 최적화에서 MME와 S-GW 사이에 사용자 데이터를 나르는 레퍼런스 포인트는?"
  choices: ["S11-U", "S1-U", "S11", "S5"]
  answer: 0
  explain: |
    S11은 MME와 S-GW 사이의 제어 평면이다. Control Plane CIoT 최적화를 위해 같은 구간에 사용자 평면 S11-U를 둔다.
    S1-U는 eNodeB와 S-GW 사이 구간이라 Control Plane CIoT 최적화에는 쓰지 않는다.
    S5는 S-GW와 P-GW 사이 구간이다.
  ref: "3GPP TS 23.401 §4.2.3, §5.3.4B.1"

- id: epc-0031
  type: ox
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "Control Plane CIoT 최적화에서 업링크 IP 헤더 압축(ROHC)은 eNodeB가 해제한다."
  answer: false
  explain: |
    아니다. 헤더 압축은 UE와 MME 사이에서 한다.
    업링크는 UE가 압축하고 MME가 해제한다. 다운링크는 MME가 압축하고 UE가 해제한다.
    데이터가 NAS PDU에 담겨 eNodeB를 그대로 지나가기 때문이다.
    압축 설정은 PDN 연결을 만들 때 정한다.
  ref: "3GPP TS 23.401 §5.3.4B.1"

- id: epc-0032
  type: mcq
  topic: EPC
  difficulty: advanced
  tags: [concept]
  question: "Control Plane CIoT 최적화로 업링크 데이터를 보내는 UE가, 이후 주고받을 데이터가 없다고 NAS PDU에 함께 알리는 정보는?"
  choices:
    - "Release Assistance Information"
    - "Paging Restriction Information"
    - "DL Buffering Requested"
    - "Active Time"
  answer: 0
  explain: |
    UE는 NAS Release Assistance Information으로 이후 데이터가 없다고 알린다. 응답 하향 데이터가 한 번만 올 예정이라고도 알릴 수 있다.
    MME는 이 정보를 보고 연결을 일찍 해제(S1 release)해 신호와 전력을 아낀다.
    DL Buffering Requested는 MME가 S-GW에 보내는 확장 버퍼링 요청이다.
    Active Time은 PSM 진입 전 대기 시간이다.
  ref: "3GPP TS 23.401 §5.3.4B.2 (1단계), §5.3.5"
