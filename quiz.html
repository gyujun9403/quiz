<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIP/Diameter 퀴즈</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --fg: #1c1c1e;
    --card: #ffffff;
    --border: #d8d8dc;
    --muted: #6e6e73;
    --accent: #0a66c2;
    --accent-bg: #e6f0fa;
    --good-bg: #e4f7e9;
    --good-fg: #157a3d;
    --bad-bg: #fdeaea;
    --bad-fg: #b3221a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f2f2f4;
      --card: #1e1e21;
      --border: #3a3a3d;
      --muted: #9a9a9e;
      --accent: #4da3ff;
      --accent-bg: #142943;
      --good-bg: #123a20;
      --good-fg: #6fdb92;
      --bad-bg: #3a1414;
      --bad-fg: #ff8f87;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    padding-bottom: 48px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .badges { margin-bottom: 10px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    margin-right: 6px;
  }
  .question {
    font-size: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-family: inherit;
    margin: 0 0 16px;
  }
  .question.raw {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    background: var(--bg);
    padding: 10px;
    border-radius: 8px;
  }
  #answer-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .order-label {
    font-size: 12px;
    color: var(--muted);
  }
  .order-pool {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px;
  }
  .order-answer {
    min-height: 44px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 10px 4px;
    background: var(--bg);
  }
  .order-placeholder {
    color: var(--muted);
    font-size: 14px;
    padding: 8px 2px 2px;
  }
  .order-reset {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    text-align: right;
    padding: 4px;
    cursor: pointer;
  }
  button.opt {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 16px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.opt:active { opacity: 0.7; }
  button.opt.chip {
    display: inline-block;
    width: auto;
  }
  button.opt.correct { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-fg); }
  button.opt.wrong { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-fg); }
  button.opt:disabled { cursor: default; opacity: 1; }
  .ox-row { display: flex; gap: 10px; }
  .ox-row button.opt { text-align: center; font-size: 22px; font-weight: 600; padding: 20px; }
  input[type=text] {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 10px;
  }
  .primary {
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .primary:disabled { opacity: 0.4; }
  .secondary {
    width: 100%;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .feedback {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .feedback .verdict { font-weight: 700; margin-bottom: 8px; }
  .feedback .verdict.correct { color: var(--good-fg); }
  .feedback .verdict.wrong { color: var(--bad-fg); }
  .feedback .explain { white-space: pre-wrap; line-height: 1.5; margin: 0 0 10px; }
  .feedback .ref { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .diagram { position: relative; margin: 4px 0 18px; font-size: 12px; }
  .diagram-header { position: relative; height: 30px; }
  .diagram-actor {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 700;
    color: var(--fg);
  }
  .diagram-body { position: relative; }
  .diagram-lifeline {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px dashed var(--muted);
  }
  .diagram-row { position: absolute; left: 0; right: 0; height: 44px; }
  .diagram-msg {
    position: absolute;
    top: 2px;
    text-align: center;
    color: var(--muted);
    background: var(--card);
    padding: 0 4px;
  }
  .diagram-line {
    position: absolute;
    top: 22px;
    height: 1px;
    background: var(--fg);
  }
  .diagram-line::after {
    content: "▶";
    position: absolute;
    top: -7px;
    right: -2px;
    font-size: 11px;
    line-height: 1;
  }
  .diagram-line.rev::after {
    content: "◀";
    right: auto;
    left: -2px;
  }
  .diagram-row.tappable { cursor: pointer; }
  .diagram-row.tappable .diagram-msg { color: var(--accent); }
  .diagram-row.tappable .diagram-line { background: var(--accent); }
  .diagram-row.tappable .diagram-line::after { color: var(--accent); }
  .diagram-row.tappable:active .diagram-msg,
  .diagram-row.tappable:active .diagram-line { opacity: 0.5; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
  .start-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .picker-group { margin-bottom: 18px; }
  .picker-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .picker-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick-btn {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .pick-btn.sel {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .pick-count { font-size: 13px; color: var(--muted); margin: 4px 0 16px; }
  .linkbtn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <button id="deck-change" class="linkbtn"></button>
    <span id="deck-label"></span>
  </header>
  <div id="start" class="card" hidden>
    <div class="start-title">덱 선택</div>
    <div id="topic-group" class="picker-group">
      <div class="picker-label">주제</div>
      <div id="pick-topic" class="picker-row"></div>
    </div>
    <div class="picker-group">
      <div class="picker-label">난이도</div>
      <div id="pick-diff" class="picker-row"></div>
    </div>
    <div id="mode-group" class="picker-group">
      <div class="picker-label">유형</div>
      <div id="pick-mode" class="picker-row"></div>
    </div>
    <div id="pick-count" class="pick-count"></div>
    <button id="start-btn" class="primary">시작</button>
  </div>
  <div id="quiz" class="card" hidden>
    <div id="badges" class="badges"></div>
    <div id="question" class="question"></div>
    <div id="answer-area"></div>
    <button id="pass-btn" class="secondary">모르겠음 (PASS)</button>
    <div id="feedback" class="feedback" hidden>
      <div id="verdict" class="verdict"></div>
      <div id="diagram"></div>
      <p id="explain" class="explain"></p>
      <p id="ref" class="ref"></p>
      <button id="next-btn" class="primary">다음 문제</button>
    </div>
  </div>
  <footer>상태 저장 없음 · 새로고침하면 처음부터</footer>
</div>

<script id="quiz-data" type="application/json">[{"id": "diam-0001", "type": "order", "topic": "Diameter", "difficulty": "basic", "tags": ["message-flow", "command-code"], "question": "IMS 초기 등록 시 Cx 인터페이스에서 오가는 Diameter 커맨드를 순서·방향까지 맞춰라 (I-CSCF·S-CSCF·HSS).", "items": [{"msg": "UAR", "from": "I-CSCF", "to": "HSS"}, {"msg": "UAA", "from": "HSS", "to": "I-CSCF"}, {"msg": "MAR", "from": "S-CSCF", "to": "HSS"}, {"msg": "MAA", "from": "HSS", "to": "S-CSCF"}, {"msg": "SAR", "from": "S-CSCF", "to": "HSS"}, {"msg": "SAA", "from": "HSS", "to": "S-CSCF"}], "explain": "등록 시 Cx는 세 단계다. (1) I-CSCF가 UAR로 사용자 등록을 인가받고 UAA로 S-CSCF\n이름/능력을 받아 S-CSCF를 고른다. (2) 선택된 S-CSCF가 MAR로 인증 벡터를 요청하고\nMAA로 받는다(→ UE에 401 챌린지). (3) UE가 자격증명으로 재등록하면 S-CSCF가 SAR로\n자신을 사용자에 할당하고 SAA로 사용자 프로필을 내려받는다. 즉 UAR→MAR→SAR 순.\n", "ref": "3GPP TS 29.228; TS 29.229 §6.1"}, {"id": "diam-0002", "type": "order", "topic": "Diameter", "difficulty": "basic", "tags": ["message-flow", "command-code"], "question": "착신 호 처리 중 I-CSCF가 사용자를 서빙하는 S-CSCF를 찾기 위한 Cx 교환을 순서·방향까지 맞춰라.", "items": [{"msg": "LIR", "from": "I-CSCF", "to": "HSS"}, {"msg": "LIA", "from": "HSS", "to": "I-CSCF"}], "explain": "착신 INVITE를 받은 I-CSCF는 그 사용자를 현재 담당하는 S-CSCF 이름을 모른다. LIR\n(Location-Info-Request)로 HSS에 물으면 HSS가 LIA로 서빙 S-CSCF 이름을 돌려주고,\nI-CSCF는 그 S-CSCF로 INVITE를 라우팅한다. 등록(UAR)과 달리 착신 경로 탐색용이다.\n", "ref": "3GPP TS 29.228; TS 29.229 §6.1.3"}, {"id": "diam-0003", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "Cx에서 I-CSCF가 사용자의 등록을 인가받고 배정할 S-CSCF 정보를 얻기 위해 HSS로 보내는 커맨드는?", "choices": ["UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "UAR는 등록 인가 요청이다. HSS는 UAA로 로밍 허용 여부와 S-CSCF 능력/이름을 돌려줘\nI-CSCF가 S-CSCF를 고르게 한다. 인증 벡터(MAR)나 서버 할당(SAR)은 이후 S-CSCF가\n수행한다.\n", "ref": "3GPP TS 29.229 §6.1.1"}, {"id": "diam-0004", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "S-CSCF가 사용자를 인증하기 위한 인증 벡터(authentication vector)를 HSS에서 받아오는 Cx 커맨드는?", "choices": ["MAR (Multimedia-Auth-Request)", "UAR (User-Authorization-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "MAR는 인증 벡터 요청이다. HSS는 MAA로 인증 벡터를 내려주고, S-CSCF는 이를 근거로\nUE에 401 인증 챌린지를 보낸다. UAR(인가)·SAR(할당)와 목적이 다르다.\n", "ref": "3GPP TS 29.229 §6.3"}, {"id": "diam-0005", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "인증에 성공한 뒤 S-CSCF가 자신을 사용자에 할당하고 사용자 프로필을 내려받기 위해 HSS로 보내는 Cx 커맨드는?", "choices": ["SAR (Server-Assignment-Request)", "UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "SAR는 서버 할당 요청으로, HSS에 \"이 사용자는 내가 담당한다\"고 등록하고 SAA로\n사용자 프로필(서비스 프로파일)을 받는다. 등록 흐름의 마지막 Cx 단계다.\n", "ref": "3GPP TS 29.229 §6.2"}, {"id": "diam-0006", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "LIR (Location-Info-Request)의 주 용도는?", "choices": ["착신 시 사용자를 현재 서빙하는 S-CSCF의 이름을 HSS에서 조회", "사용자 인증 벡터를 HSS에서 조회", "S-CSCF를 사용자에 할당하고 프로필을 조회", "AS가 HSS의 가입자 데이터를 조회"], "answer": 0, "explain": "LIR는 착신(terminating) 처리에서 I-CSCF가 서빙 S-CSCF 이름을 얻는 데 쓴다. 인증\n벡터는 MAR, 서버 할당은 SAR, 가입자 데이터 조회는 Sh의 UDR로 서로 인터페이스·목적이\n다르다.\n", "ref": "3GPP TS 29.229 §6.1.3"}, {"id": "diam-0007", "type": "short", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code"], "question": "S-CSCF가 HSS에서 인증 벡터를 받기 위해 보내는 Cx 커맨드의 약어는? (3글자)", "answer": ["MAR"], "explain": "MAR = Multimedia-Auth-Request. 인증 벡터 요청 커맨드다(응답은 MAA). Cx 커맨드\n코드는 303.\n", "ref": "3GPP TS 29.229 §6.3; TS 29.230 §5.1"}, {"id": "diam-0008", "type": "short", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code"], "question": "착신 호에서 I-CSCF가 서빙 S-CSCF를 찾기 위해 HSS로 보내는 Cx 커맨드의 약어는? (3글자)", "answer": ["LIR"], "explain": "LIR = Location-Info-Request(응답 LIA). 착신 경로에서 서빙 S-CSCF 이름을 조회한다.\nCx 커맨드 코드는 302.\n", "ref": "3GPP TS 29.229 §6.1.3; TS 29.230 §5.1"}, {"id": "diam-0009", "type": "ox", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "message-flow"], "question": "MAR(Multimedia-Auth-Request)는 I-CSCF가 HSS로 보내는 커맨드다.", "answer": false, "explain": "아니다. MAR를 보내는 것은 S-CSCF다(인증 벡터 요청). I-CSCF가 HSS로 보내는 Cx\n커맨드는 UAR(인가)와 LIR(착신 시 서빙 S-CSCF 조회)다. 인터페이스는 같아도 노드\n역할이 다르다.\n", "ref": "3GPP TS 29.229 §6.3"}, {"id": "diam-0010", "type": "ox", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "message-flow"], "question": "LIR는 착신 호 처리 중 I-CSCF가 사용자를 서빙하는 S-CSCF 이름을 HSS에 조회할 때 사용한다.", "answer": true, "explain": "맞다. 착신 INVITE를 받은 I-CSCF는 서빙 S-CSCF를 모르므로 LIR로 HSS에 물어 LIA로\n이름을 받아 라우팅한다. 발신 등록의 UAR와 구분되는 착신 전용 조회다.\n", "ref": "3GPP TS 29.229 §6.1.3"}, {"id": "diam-0011", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "tags": ["result-code"], "question": "HSS가 요청된 사용자 식별자가 존재하지 않을 때 반환하는 Experimental-Result-Code는?", "choices": ["5001 DIAMETER_ERROR_USER_UNKNOWN", "5003 DIAMETER_ERROR_IDENTITY_NOT_REGISTERED", "5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED", "5002 DIAMETER_ERROR_IDENTITIES_DONT_MATCH"], "answer": 0, "explain": "5001은 \"그 사용자 자체가 HSS에 없음\"이다. 5003은 사용자는 있으나 등록 상태가\n아님, 5005는 이미 등록됨, 5002는 공개/개인 식별자 불일치 — 모두 5xxx(영구 실패)\n대역이지만 원인이 다르다.\n", "ref": "3GPP TS 29.229 §6.2; TS 29.230 §8.1.4"}, {"id": "diam-0012", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "tags": ["result-code"], "question": "이미 등록된 식별자로 등록이 들어와 충돌할 때 HSS가 쓸 수 있는 Experimental-Result-Code는?", "choices": ["5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED", "5001 DIAMETER_ERROR_USER_UNKNOWN", "5004 DIAMETER_ERROR_ROAMING_NOT_ALLOWED", "2001 DIAMETER_FIRST_REGISTRATION"], "answer": 0, "explain": "5005는 \"이미 등록된 식별자\"다. 5001(사용자 없음)·5004(로밍 불가)와 원인이 다르고,\n2001은 성공(첫 등록) 계열이라 애초에 실패가 아니다. 5xxx=영구 실패, 2xxx=성공.\n", "ref": "3GPP TS 29.229; TS 29.230 §8.1"}, {"id": "diam-0013", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "tags": ["result-code", "concept"], "question": "Cx의 5xxx 대역 Experimental-Result-Code는 영구 실패(permanent failure)를 나타낸다.", "answer": true, "explain": "맞다. 3GPP Experimental-Result-Code도 Diameter 대역 규칙을 따른다: 2xxx=성공,\n5xxx=영구 실패. 예: 5001 USER_UNKNOWN. 이 대역 구조를 알면 개별 코드도 앵커링해\n외우기 쉽다.\n", "ref": "3GPP TS 29.230 §8.1"}, {"id": "diam-0014", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "tags": ["result-code", "concept"], "question": "DIAMETER_FIRST_REGISTRATION(2001)은 등록 실패를 나타내는 코드다.", "answer": false, "explain": "아니다. 2001은 2xxx(성공) 대역으로 \"첫 등록 성공\"을 뜻한다. 실패는 5xxx 대역이다\n(예: 5001 USER_UNKNOWN). 2xxx=성공/5xxx=영구실패 대역 구분이 핵심.\n", "ref": "3GPP TS 29.230 §8.1.2"}, {"id": "diam-0015", "type": "short", "topic": "Diameter", "difficulty": "advanced", "tags": ["command-code"], "question": "Cx의 User-Authorization 커맨드(UAR/UAA)에 할당된 Diameter 커맨드 코드 번호는?", "answer": ["300"], "explain": "3GPP TS 29.230은 Cx/Dx 커맨드 코드를 300부터 부여한다: 300 UAR/UAA, 301 SAR/SAA,\n302 LIR/LIA, 303 MAR/MAA. 요청/응답은 같은 코드를 쓰고 R-bit로 구분한다.\n", "ref": "3GPP TS 29.230 §5.1"}, {"id": "diam-0016", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "tags": ["command-code"], "question": "Diameter 커맨드 코드 303에 해당하는 Cx 커맨드 쌍은?", "choices": ["MAR/MAA (Multimedia-Auth)", "UAR/UAA (User-Authorization)", "SAR/SAA (Server-Assignment)", "LIR/LIA (Location-Info)"], "answer": 0, "explain": "300 UAR/UAA, 301 SAR/SAA, 302 LIR/LIA, 303 MAR/MAA 순으로 부여됐다. 303은\nMultimedia-Auth 쌍이다. 코드가 연속 부여됐다는 구조로 외우면 헷갈리지 않는다.\n", "ref": "3GPP TS 29.230 §5.1"}, {"id": "diam-0017", "type": "order", "topic": "Diameter", "difficulty": "basic", "tags": ["message-flow", "command-code"], "question": "애플리케이션 서버(AS)가 Sh 인터페이스로 HSS의 가입자 데이터를 조회하는 교환을 순서·방향까지 맞춰라.", "items": [{"msg": "UDR", "from": "AS", "to": "HSS"}, {"msg": "UDA", "from": "HSS", "to": "AS"}], "explain": "Sh에서 AS는 UDR(User-Data-Request)로 HSS의 가입자 데이터를 조회하고 HSS는 UDA로\n데이터를 돌려준다. Sh는 AS↔HSS 간 데이터 접근/구독 인터페이스로, Cx(등록/인증)와는\n쓰임이 다르다.\n", "ref": "3GPP TS 29.328; TS 29.329"}, {"id": "diam-0018", "type": "order", "topic": "Diameter", "difficulty": "advanced", "tags": ["message-flow", "command-code"], "question": "AS가 Sh로 가입자 데이터 변경 통지를 구독하고, 이후 데이터가 바뀌어 HSS가 통지하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "SNR", "from": "AS", "to": "HSS"}, {"msg": "SNA", "from": "HSS", "to": "AS"}, {"msg": "PNR", "from": "HSS", "to": "AS"}, {"msg": "PNA", "from": "AS", "to": "HSS"}], "explain": "AS가 SNR(Subscribe-Notifications-Request)로 특정 데이터 변경 통지를 구독하면 HSS가\nSNA로 확인한다. 이후 데이터가 바뀌면 HSS가 먼저 PNR(Push-Notification-Request)로\n통지하고 AS가 PNA로 응답한다. PNR만 HSS가 발신한다는 점이 방향 포인트다.\n", "ref": "3GPP TS 29.328; TS 29.329; TS 29.230 §5.1"}, {"id": "diam-0019", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "Sh 인터페이스에서 AS가 HSS의 가입자 데이터를 읽어오기 위해 쓰는 커맨드는?", "choices": ["UDR (User-Data-Request)", "SAR (Server-Assignment-Request)", "MAR (Multimedia-Auth-Request)", "AAR (AA-Request)"], "answer": 0, "explain": "UDR는 Sh의 데이터 조회 커맨드다(응답 UDA). SAR·MAR는 Cx(S-CSCF↔HSS), AAR는\nRx(P-CSCF↔PCRF)로 인터페이스가 다르다. 커맨드를 인터페이스에 묶어 외우는 게 요령.\n", "ref": "3GPP TS 29.328"}, {"id": "diam-0020", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "tags": ["command-code", "message-flow"], "question": "PNR(Push-Notification-Request)는 AS가 HSS로 데이터를 요청할 때 보내는 커맨드다.", "answer": false, "explain": "아니다. PNR는 HSS가 AS로 데이터 변경을 \"밀어주는\"(push) 통지 커맨드라 방향이\nHSS→AS다. AS가 데이터를 요청할 때는 UDR(조회)나 SNR(구독)를 쓴다.\n", "ref": "3GPP TS 29.328; TS 29.329"}, {"id": "diam-0021", "type": "order", "topic": "Diameter", "difficulty": "basic", "tags": ["message-flow", "command-code"], "question": "P-CSCF(AF)가 SIP 세션의 미디어를 Rx로 인가받고, 세션 종료 시 정책을 해제하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "AAR", "from": "P-CSCF", "to": "PCRF"}, {"msg": "AAA", "from": "PCRF", "to": "P-CSCF"}, {"msg": "STR", "from": "P-CSCF", "to": "PCRF"}, {"msg": "STA", "from": "PCRF", "to": "P-CSCF"}], "explain": "세션 설정 시 P-CSCF(AF)는 AAR(AA-Request)로 미디어 정보를 PCRF에 주고 인가/QoS를\n요청하며 AAA로 응답을 받는다. 통화가 끝나면 STR(Session-Termination-Request)로\n세션을 종료하고 STA로 확인한다. Rx는 IMS 세션과 베어러 정책을 잇는 인터페이스다.\n", "ref": "3GPP TS 29.214"}, {"id": "diam-0022", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "concept"], "question": "Rx에서 P-CSCF(AF)가 세션의 미디어 정보를 PCRF에 전달하며 자원 인가를 요청하는 커맨드는?", "choices": ["AAR (AA-Request)", "SAR (Server-Assignment-Request)", "UDR (User-Data-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "AAR는 Rx의 세션/미디어 인가 요청 커맨드다(응답 AAA). SAR/LIR는 Cx, UDR는 Sh로\n각각 인터페이스가 다르다. Rx는 SIP 세션 정보를 정책(PCRF)에 연결한다.\n", "ref": "3GPP TS 29.214"}, {"id": "diam-0023", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "tags": ["command-code", "message-flow"], "question": "Rx에서 PCRF가 AF(P-CSCF)로 세션 중단을 지시할 때 쓰는 커맨드와 방향이 옳은 것은?", "choices": ["ASR — PCRF → AF", "STR — AF → PCRF", "AAR — AF → PCRF", "RAR — AF → PCRF"], "answer": 0, "explain": "ASR(Abort-Session-Request)는 PCRF가 AF로 세션 중단을 지시한다(PCRF→AF). STR는\n반대로 AF가 종료를 알리는 것(AF→PCRF)이고, RAR도 PCRF→AF지만 재인가 요청이다.\nASR/STR/RAR는 Diameter 기본 커맨드(274/275/258)를 재사용한다.\n", "ref": "3GPP TS 29.214; RFC 6733 §3.1"}, {"id": "diam-0024", "type": "ox", "topic": "Diameter", "difficulty": "basic", "tags": ["command-code", "message-flow"], "question": "Rx에서 STR(Session-Termination-Request)는 AF(P-CSCF)가 PCRF로 세션 종료를 알릴 때 보낸다.", "answer": true, "explain": "맞다. 세션이 끝나면 AF(P-CSCF)가 STR로 PCRF에 종료를 알리고 STA로 확인받는다.\n반대로 PCRF가 세션을 강제로 끊는 것은 ASR(PCRF→AF)다 — 방향이 반대다.\n", "ref": "3GPP TS 29.214; RFC 6733 §8.4"}, {"id": "sip-0001", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "RFC 3261이 정의하는 6개 기본 메서드에 포함되지 않는 것은?", "choices": ["REGISTER", "SUBSCRIBE", "CANCEL", "OPTIONS"], "answer": 1, "explain": "RFC 3261은 REGISTER, INVITE, ACK, CANCEL, BYE, OPTIONS 6개를 기본 메서드로\n정의한다. SUBSCRIBE는 이벤트 구독을 위한 확장 메서드로 RFC 3265에서 별도로\n정의되었고, RFC 3261 기본 6종에는 포함되지 않는다.\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0002", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow"], "question": "성공적인 SIP 세션 설정 흐름을 순서대로, 발신/착신 방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "180 Ringing", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "explain": "발신자가 INVITE를 보내면 잠정 응답 100 Trying이 먼저 오고, 착신 단말이\n울리면 180 Ringing이 온다. 착신자가 응답하면 200 OK가 오며, 발신자는\n이를 확인하는 ACK를 보내 세션이 시작된다.\n", "ref": "RFC 3261 §4 (Figure 1)"}, {"id": "sip-0003", "type": "order", "topic": "SIP", "difficulty": "advanced", "tags": ["message-flow", "method"], "question": "발신자가 응답 대기 중 통화를 취소(CANCEL)하는 흐름을 순서대로, 발신/착신 방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "200 OK (CANCEL 응답)", "from": "착신자", "to": "발신자"}, {"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}], "explain": "잠정 응답(100 Trying)을 받은 뒤에만 CANCEL을 보낼 수 있다. UAS는 CANCEL\n요청 자체에는 200 OK로 응답하고, 별도로 원래의 INVITE 트랜잭션은 487\nRequest Terminated로 종료시킨다. 두 응답은 서로 다른 트랜잭션에 대한\n응답이라는 점이 헷갈리기 쉽다.\n", "ref": "RFC 3261 §9.2"}, {"id": "sip-0004", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "CANCEL은 INVITE 요청에 대해서만 사용해야 한다.", "answer": true, "explain": "INVITE 이외의 요청은 즉시 응답되므로 CANCEL을 보내면 경쟁 상태(race\ncondition)가 발생한다. RFC 3261은 CANCEL을 INVITE가 아닌 요청에는\n보내지 말아야 한다(SHOULD NOT)고 규정한다.\n", "ref": "RFC 3261 §9.1"}, {"id": "sip-0005", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["method"], "question": "이미 최종 응답을 받은 요청에 CANCEL을 보내면 그 요청의 처리에 영향을 준다.", "answer": false, "explain": "원래 요청에 대해 이미 최종 응답(2xx~6xx)이 발생했다면, CANCEL은 그\n요청의 처리·세션 상태·응답 생성 어느 것에도 영향을 주지 않는다.\n사실상 아무 효과 없는 요청(no-op)이 된다.\n", "ref": "RFC 3261 §9.2"}, {"id": "sip-0006", "type": "short", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "SIP에서 진행 중인 세션(통화)을 종료할 때 사용하는 메서드는?", "answer": ["BYE"], "explain": "RFC 3261은 BYE를 \"세션을 종료하기 위한\" 메서드로 정의한다. INVITE로\n세션을 시작했다면, 종료는 CANCEL이 아니라 BYE로 한다 — CANCEL은 아직\n최종 응답을 받기 전의 진행 중인 요청을 취소할 때만 쓴다(sip-0004/0005).\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0007", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code", "concept"], "question": "1xx(잠정 응답) 클래스의 성격을 가장 정확히 설명한 것은?", "choices": ["요청이 성공적으로 완료됐음을 뜻한다", "서버가 아직 확정 응답을 갖지 못한 채 처리 중임을 뜻한다", "요청 문법에 오류가 있음을 뜻한다", "사용자가 다른 위치로 옮겨갔음을 뜻한다"], "answer": 1, "explain": "1xx는 확정 응답이 아직 없다는 뜻으로, 서버가 200ms 넘게 걸릴 것 같을 때\n보낸다. 신뢰성 있게 전달되지 않으며(재전송 없음) ACK도 유발하지 않는다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0008", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "1xx 응답은 클라이언트의 ACK 전송을 유발하지 않는다.", "answer": true, "explain": "1xx는 잠정 응답이라 신뢰성 있게 전달되지 않고, ACK도 유발하지 않는다.\nACK는 INVITE에 대한 응답을 확인할 때만 쓰인다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0009", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "486 Busy Here 대신 600 Busy Everywhere를 써야 하는 경우는?", "choices": ["서버가 이 사용자와 관련된 다른 어떤 단말도 응답하지 않을 것임을 알고 있을 때", "더 정중한 표현이 필요할 때", "여러 단말이 동시에 울리는 포킹 상황일 때", "응답을 더 빨리 보내고 싶을 때"], "answer": 0, "explain": "486은 \"이 단말\"만 통화 중이라는 뜻이라 음성사서함 등 다른 경로로 연결될\n여지가 있다. 600은 서버가 어떤 단말로도 연결 안 될 걸 알 때만 쓴다.\n", "ref": "RFC 3261 §21.6.1"}, {"id": "sip-0010", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "Request-URI에 다이얼 문자열이 아직 다 입력되지 않아 불완전할 때 쓰는 응답은?", "choices": ["404 Not Found", "484 Address Incomplete", "485 Ambiguous", "400 Bad Request"], "answer": 1, "explain": "484는 오버랩 다이얼링(자릿수를 늘려가며 재전송)을 지원하기 위한 코드다.\n클라이언트는 484를 받는 동안 계속 더 긴 문자열로 재전송한다.\n", "ref": "RFC 3261 §21.4.22"}, {"id": "sip-0011", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "485 Ambiguous와 300 Multiple Choices는 의미(semantics)가 달라서 별도의 코드로 분리되어 있다.", "answer": true, "explain": "300은 같은 사용자/서비스에 도달하는 여러 경로가 있다는 뜻으로 자동 선택도\n가능하지만, 485는 Request-URI 자체가 여러 사람 중 누구인지 애매하다는\n뜻이라 사람이 개입해 골라야 한다.\n", "ref": "RFC 3261 §21.4.23"}, {"id": "sip-0012", "type": "short", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "프록시 서버가(사용자가 아니라) 클라이언트 인증을 요구할 때 쓰는 응답 코드는?", "answer": ["407"], "explain": "401은 UAS/registrar가, 407은 프록시가 쓴다는 게 핵심 구분이다. 통신사업자\n게이트웨이처럼 \"채널 접근\" 자체에 인증이 필요한 경우 407을 쓴다.\n", "ref": "RFC 3261 §21.4.8"}, {"id": "sip-0013", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "483 Too Many Hops가 발생하는 조건은?", "choices": ["Max-Forwards 헤더 값이 0인 요청을 받음", "서버가 루프를 감지함", "요청 URI가 존재하지 않는 도메인을 가리킴", "메시지 크기가 서버 한도를 초과함"], "answer": 0, "explain": "483은 Max-Forwards=0으로 명확히 정의된다. 반면 482 Loop Detected는\n(Max-Forwards와 별개로) 서버가 실제 루프를 감지했을 때 쓰는, 조건이\n다른 코드다.\n", "ref": "RFC 3261 §21.4.21"}, {"id": "sip-0014", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "482 Loop Detected와 483 Too Many Hops는 둘 다 Max-Forwards 값이 0이 되는 같은 조건에서 발생한다.", "answer": false, "explain": "483만 Max-Forwards=0으로 명시적으로 정의된다. 482는 서버가 루프를\n감지했을 때 쓰는 별개의 메커니즘이다.\n", "ref": "RFC 3261 §21.4.20, §21.4.21"}, {"id": "sip-0015", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "상대방이 이미 다른 통화를 처리 중이라 이 통화에 응답할 수 없을 때 가장 적합한 코드는?", "choices": ["480 Temporarily Unavailable", "486 Busy Here", "487 Request Terminated", "600 Busy Everywhere"], "answer": 1, "explain": "480은 로그아웃·방해금지 등 응대 불가 상태 전반을 포괄하는 코드고, 486은\n그중 \"다른 통화 처리 중\"이라는 이유를 더 정확히 알려주고 싶을 때 쓴다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0016", "type": "short", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "SIP 응답 코드 486의 영문 명칭은?", "answer": ["Busy Here"], "explain": "486 Busy Here — 상대방 단말은 연결됐지만 지금 이 단말에서는 추가 통화를\n받을 수 없다는 뜻이다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0017", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "487 Request Terminated이 발생하는 원인은?", "choices": ["BYE 또는 CANCEL에 의해 원래 요청이 종료됨", "요청이 제 시간 안에 처리되지 못함", "서버 내부 오류가 발생함", "요청 문법이 잘못됨"], "answer": 0, "explain": "487은 진행 중이던 요청(주로 INVITE)이 BYE나 CANCEL로 인해 중단됐을 때\n그 원래 요청에 대한 최종 응답으로 온다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0018", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "CANCEL 요청 자체에 대한 응답으로 487 Request Terminated이 올 수 있다.", "answer": false, "explain": "487은 CANCEL로 인해 종료되는 \"원래 요청\"(예: INVITE)에 대한 응답이다.\nCANCEL 요청 자체는 항상 200 OK로 응답되며, CANCEL에 대한 응답으로\n487이 오는 일은 없다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0019", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "301 Moved Permanently를 받으면 클라이언트는 로컬 주소록을 새 주소로 갱신하는 것이 권장된다.", "answer": true, "explain": "301은 영구 이동이므로, 요청자는 주소록·캐시 등을 새 주소로 갱신하고\n이후 요청도 그 주소로 보내는 게 권장된다. 302(일시 이동)는 이렇게까지\n하지 않는다.\n", "ref": "RFC 3261 §21.3.2"}, {"id": "sip-0020", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "302 Moved Temporarily 응답에 만료 시간이 없으면, 그 Contact 주소는 이후에도 계속 캐시해서 재사용해도 된다.", "answer": false, "explain": "명시적 만료 시간이 없으면 그 주소는 딱 한 번의 재시도(recursing)에만\n유효하며, 향후 트랜잭션을 위해 캐시하면 안 된다(MUST NOT).\n", "ref": "RFC 3261 §21.3.3"}, {"id": "sip-0021", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "503 Service Unavailable을 Retry-After 헤더 없이 받았을 때 클라이언트는 어떻게 동작해야 하는가?", "choices": ["500 Server Internal Error를 받은 것처럼 동작한다", "1분 뒤 같은 요청을 그대로 재전송한다", "요청을 완전히 포기한다", "즉시 같은 서버로 요청을 다시 보낸다"], "answer": 0, "explain": "Retry-After가 없으면 클라이언트는 500을 받은 것처럼(MUST) 동작해야\n한다. Retry-After가 있다면 그 시간 동안은 해당 서버로 다른 요청도\n보내지 않는 게 권장된다.\n", "ref": "RFC 3261 §21.5.4"}, {"id": "sip-0022", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "서버가 요청 메서드 자체를 전혀 지원하지 않아(어떤 사용자에 대해서도) 처리할 수 없을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "400 Bad Request", "503 Service Unavailable"], "answer": 1, "explain": "501은 서버가 그 메서드 자체를 지원하지 않을 때(UAS가 메서드를 인식조차\n못 함) 쓴다. 메서드는 인식하지만 그 주소에서만 허용 안 되는 경우는\n405다.\n", "ref": "RFC 3261 §21.5.2"}, {"id": "sip-0023", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "서버가 요청 메서드를 인식은 하지만, 그 Request-URI가 가리키는 주소에서는 허용하지 않을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "406 Not Acceptable", "403 Forbidden"], "answer": 0, "explain": "405는 메서드 자체는 알지만 그 주소에서 허용 안 될 때, 501은 메서드\n자체를 서버가 아예 지원 안 할 때 쓴다. 405 응답에는 허용되는 메서드\n목록을 Allow 헤더로 반드시 포함해야 한다.\n", "ref": "RFC 3261 §21.4.6, §21.5.2"}, {"id": "sip-0024", "type": "ox", "topic": "SIP", "difficulty": "advanced", "tags": ["response-code"], "question": "504 Server Time-out은 서버가 접근한 외부(다운스트림) 서버로부터 제때 응답을 받지 못했을 때 쓰고, 408 Request Timeout은 서버 자신이 제 시간에 응답을 만들어내지 못했을 때 쓴다.", "answer": true, "explain": "408은 서버 자체가 시간 내 응답을 못 만든 경우(예: 사용자 위치 파악\n지연)를 포괄하고, 504는 그 원인이 서버가 접근한 외부 서버의 응답\n지연일 때 쓰는 더 구체적인 코드다.\n", "ref": "RFC 3261 §21.4.9, §21.5.5"}, {"id": "sip-0025", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code", "concept"], "question": "SIP이 HTTP/1.1 응답 코드 체계를 확장하면서 새로 정의한 클래스는?", "choices": ["1xx", "3xx", "5xx", "6xx"], "answer": 3, "explain": "SIP 응답 코드는 HTTP/1.1을 기반으로 하되 그중 적절한 것만 가져다\n쓰고, 6xx(Global Failures)는 SIP이 새로 정의한 클래스다.\n", "ref": "RFC 3261 §21"}, {"id": "sip-0026", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code", "concept"], "question": "3xx 응답은 4xx/5xx/6xx와 마찬가지로 확정적 실패(definite failure)로 분류된다.", "answer": false, "explain": "4xx는 \"특정 서버로부터의 확정적 실패 응답\"으로 명시되지만, 3xx는\n실패가 아니라 사용자의 새 위치나 대체 서비스 정보를 알려주는\n응답이다.\n", "ref": "RFC 3261 §21.3, §21.4"}, {"id": "sip-0027", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow", "method"], "question": "단말이 등록 서버에 처음 등록할 때, 인증 챌린지를 포함한 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "REGISTER", "from": "단말", "to": "등록서버"}, {"msg": "401 Unauthorized", "from": "등록서버", "to": "단말"}, {"msg": "REGISTER (인증정보 포함)", "from": "단말", "to": "등록서버"}, {"msg": "200 OK", "from": "등록서버", "to": "단말"}], "explain": "단말이 처음 REGISTER를 보내면 등록 서버(registrar)는 인증을 요구하며\n401 Unauthorized로 챌린지한다. 단말은 자격증명(Digest)을 담아 REGISTER를\n다시 보내고, 서버가 이를 확인하면 200 OK로 등록이 완료된다. 401은\n등록 서버/UAS가 보내는 인증 요구이며, 프록시는 407을 쓴다(sip-0012).\n", "ref": "RFC 3665 §2.1; RFC 3261 §10, §21.4.2"}, {"id": "sip-0028", "type": "short", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "단말이 자신의 현재 접속 위치를 등록 서버에 등록(위치 바인딩)할 때 쓰는 메서드는?", "answer": ["REGISTER"], "explain": "REGISTER는 사용자의 공개 주소(AOR, Address-of-Record)를 단말의 현재\nContact 주소에 바인딩해, 이후 그 사용자에게 오는 요청이 현재 단말로\n라우팅되게 한다. 위치 등록이 SIP 이동성의 출발점이다.\n", "ref": "RFC 3261 §10.1"}, {"id": "sip-0029", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "REGISTER는 사용자의 공개 주소(AOR)를 현재 접속 위치(Contact)에 바인딩해 등록 서버가 그 사용자의 위치를 알게 하는 메서드다.", "answer": true, "explain": "맞다. REGISTER의 목적은 AOR↔Contact 바인딩이다. 이 바인딩 덕분에 누군가\n그 AOR로 INVITE를 보내면 등록 서버/프록시가 현재 단말 위치로 요청을\n넘길 수 있다.\n", "ref": "RFC 3261 §10.1"}, {"id": "sip-0030", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow"], "question": "착신자가 통화를 끊는 경우까지 포함한 기본 호의 전체 흐름(설정→종료)을 순서·방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "180 Ringing", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}, {"msg": "BYE", "from": "착신자", "to": "발신자"}, {"msg": "200 OK (BYE 응답)", "from": "발신자", "to": "착신자"}], "explain": "설정 절반은 sip-0002와 같다(INVITE→100→180→200→ACK). 통화가 끝나면\n확립된 세션을 종료하려고 한쪽이 BYE를 보내고, 상대는 200 OK로 응답한다.\n여기서는 착신자가 먼저 끊었으므로 BYE는 착신자→발신자, 그 200 OK는\n발신자→착신자다. 세션 종료는 CANCEL이 아니라 BYE로 한다.\n", "ref": "RFC 3261 §4 (Figure 1), §15.1"}, {"id": "sip-0031", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["method", "message-flow"], "question": "INVITE에 대한 200 OK(2xx 최종 응답)를 받은 발신자가 3-way 핸드셰이크를 완성하려고 마지막으로 보내는 메시지는?", "choices": ["ACK", "BYE", "200 OK", "CANCEL"], "answer": 0, "explain": "INVITE의 3-way 핸드셰이크는 INVITE → 200 OK → ACK로 완성된다. 발신자는\n2xx를 받을 때마다 이를 확인하는 ACK를 보내야 세션이 확립된다. BYE는 이미\n확립된 세션의 종료, CANCEL은 최종 응답 전 취소용이라 여기선 아니다.\n", "ref": "RFC 3261 §13.2.2.4"}, {"id": "sip-0032", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["method"], "question": "아직 응답이 오지 않아 확립되지 않은(진행 중인 INVITE) 통화를 중단할 때는 BYE를 보낸다.", "answer": false, "explain": "아니다. BYE는 이미 확립된 세션(다이얼로그)을 종료하는 메서드다. 아직\n최종 응답을 받기 전 진행 중인 INVITE를 멈추려면 CANCEL을 쓴다. 확립\n전=CANCEL, 확립 후=BYE로 구분한다.\n", "ref": "RFC 3261 §15.1, §9.1"}, {"id": "sip-0033", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "착신 단말이 INVITE를 받아 사용자에게 착신을 알리는(전화가 울리는) 중임을 나타내는 응답은?", "choices": ["180 Ringing", "100 Trying", "183 Session Progress", "200 OK"], "answer": 0, "explain": "180 Ringing은 착신 UA가 사용자에게 알림(벨)을 울리는 중이라는 잠정\n응답이다. 100 Trying은 요청을 받아 처리 중이라는 뜻일 뿐 아직 벨은\n울리지 않았고, 200 OK는 착신자가 실제로 응답(수락)했을 때다.\n", "ref": "RFC 3261 §21.1.2"}, {"id": "sip-0034", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "180 Ringing 응답을 받았다면 착신자가 전화를 받아 통화가 연결된 것이다.", "answer": false, "explain": "아니다. 180은 상대 단말이 \"울리는 중\"이라는 잠정 응답일 뿐, 아직 받지\n않았다. 착신자가 실제로 받아 통화가 연결되면 200 OK가 온다. 이 구분이\n콜 상태 파악의 기본이다.\n", "ref": "RFC 3261 §21.1.2, §21.2.1"}, {"id": "sip-0035", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "100 Trying 응답의 의미로 가장 정확한 것은?", "choices": ["요청을 받아 처리 중이다(아직 최종 응답 아님)", "착신 단말이 사용자에게 착신을 알리는 중이다", "착신자가 통화를 수락했다", "요청한 사용자를 찾을 수 없다"], "answer": 0, "explain": "100 Trying은 다음 홉이 요청을 받아 처리 중이라는 잠정 응답이다. 벨이\n울리는 것은 180, 수락은 200 OK, 사용자 없음은 404다 — 100은 그 어느\n것도 아니고 \"받아서 처리 시작\"만 뜻한다.\n", "ref": "RFC 3261 §21.1.1"}, {"id": "sip-0036", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "100 Trying은 요청을 받아 처리 중임을 알리는 잠정(1xx) 응답이며, 최종 응답이 아니다.", "answer": true, "explain": "맞다. 100 Trying은 잠정 응답으로 \"요청을 받아 처리 중\"이라는 뜻이다.\n최종 응답(2xx~6xx)이 아니므로 이것만으로 통화가 성사·실패한 것은 아니다.\n최종 결과는 180 뒤의 200 OK나 4xx~6xx로 온다.\n", "ref": "RFC 3261 §21.1.1"}, {"id": "sip-0037", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "183 Session Progress가 쓰이는 대표적 상황은?", "choices": ["최종 응답 전에 통화 진행 정보(예: 초기 미디어/네트워크 링백)를 전달할 때", "요청 문법 오류를 알릴 때", "착신자가 통화를 수락했을 때", "서버가 사용자를 찾지 못했을 때"], "answer": 0, "explain": "183은 최종 응답 전에 \"통화 진행 상황\"을 전달하는 잠정 응답으로, 흔히\n초기 미디어(통신사 안내음·네트워크 링백)를 흘려보낼 때 쓴다. 달리\n분류되지 않는 진행 정보를 전달하는 용도라는 점이 180과의 차이다.\n", "ref": "RFC 3261 §21.1.5"}, {"id": "sip-0038", "type": "short", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "요청이 성공했음을 나타내는 SIP 2xx 최종 응답 코드의 번호(3자리)는?", "answer": ["200"], "explain": "200 OK는 요청이 성공했음을 뜻하는 대표 최종 응답이다. INVITE에 대한\n200 OK는 착신자가 통화를 수락했다는 의미이며, 발신자는 이를 ACK로\n확인해 세션을 확립한다.\n", "ref": "RFC 3261 §21.2.1"}, {"id": "sip-0039", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "서버가 Request-URI의 도메인에 해당 사용자가 존재하지 않는다는 확정 정보를 가졌을 때 보내는 응답은?", "choices": ["404 Not Found", "403 Forbidden", "480 Temporarily Unavailable", "400 Bad Request"], "answer": 0, "explain": "404 Not Found는 \"그 도메인에 그 사용자가 없다\"는 확정적 정보를 뜻한다.\n480은 사용자는 있으나 지금 응대 불가, 403은 이해했지만 거부, 400은 요청\n문법 오류다 — 원인이 서로 달라 혼동하면 안 된다.\n", "ref": "RFC 3261 §21.4.5"}, {"id": "sip-0040", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "404 Not Found는 요청 메시지의 문법 자체가 잘못됐다는 뜻이다.", "answer": false, "explain": "아니다. 문법 오류는 400 Bad Request다. 404는 문법은 정상이지만 그\n도메인에 해당 사용자가 존재하지 않는다는 뜻이다. 둘은 원인이 완전히\n다르다.\n", "ref": "RFC 3261 §21.4.5"}, {"id": "sip-0041", "type": "mcq", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "서버가 요청을 이해했지만 수행을 거부하며, 인증을 다시 시도해도 소용없어 재시도하면 안 되는 응답은?", "choices": ["403 Forbidden", "401 Unauthorized", "407 Proxy Authentication Required", "404 Not Found"], "answer": 0, "explain": "403 Forbidden은 서버가 요청을 이해했으나 거부하며, 인증(자격증명)으로도\n해결되지 않으니 재시도하지 말라는 뜻이다. 반면 401/407은 자격증명을\n갖춰 다시 보내면 통과할 수 있는 \"인증 요구\"라는 점이 결정적 차이다.\n", "ref": "RFC 3261 §21.4.4"}, {"id": "sip-0042", "type": "ox", "topic": "SIP", "difficulty": "basic", "tags": ["response-code"], "question": "401 Unauthorized는 자격증명을 갖춰 다시 시도하면 통과할 수 있지만, 403 Forbidden은 인증을 다시 시도해도 거부된다.", "answer": true, "explain": "맞다. 401은 \"인증이 필요하다\"는 요구라 올바른 자격증명으로 재시도하면\n성공할 수 있다. 403은 \"이해했지만 거부\"이며 인증으로 해결되지 않으니\n같은 요청을 반복하면 안 된다.\n", "ref": "RFC 3261 §21.4.2, §21.4.4"}, {"id": "sip-0043", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow", "method"], "question": "이미 등록된 단말이 모든 위치 등록을 해제(로그아웃)하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "REGISTER (Expires: 0, Contact: *)", "from": "단말", "to": "등록서버"}, {"msg": "200 OK", "from": "등록서버", "to": "단말"}], "explain": "등록 해제는 새 REGISTER를 만료값 0으로 보내 기존 바인딩을 지우는 것이다.\nContact를 \"*\"로 주고 Expires를 0으로 하면 그 AOR의 모든 등록이 제거된다.\n서버는 200 OK로 확인한다. 등록(sip-0027)과 정반대 동작이다.\n", "ref": "RFC 3665 §2.4; RFC 3261 §10.2.2"}, {"id": "sip-0044", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow", "method"], "question": "통화 중이던 발신자가 전화를 끊어 세션을 종료하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "BYE", "from": "발신자", "to": "착신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}], "explain": "확립된 세션의 종료는 BYE로 한다. 끊는 쪽(여기선 발신자)이 BYE를 보내고\n상대가 200 OK로 확인하면 세션이 끝난다. 어느 쪽이든 먼저 BYE를 보낼 수\n있으며, 방향은 \"끊는 쪽 → 상대\"다.\n", "ref": "RFC 3261 §15.1"}, {"id": "sip-0045", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow", "response-code"], "question": "발신자가 전화를 걸었으나 착신자가 통화 중이라 연결되지 못하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "486 Busy Here", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "explain": "착신 단말이 통화 중이면 486 Busy Here로 거절한다. 발신자는 이 최종 응답을\n받고 ACK로 확인한다 — ACK는 2xx뿐 아니라 486 같은 실패(비-2xx) 최종\n응답도 확인한다는 점이 핵심이다.\n", "ref": "RFC 3261 §17.1.1.3, §21.4.24"}, {"id": "sip-0046", "type": "order", "topic": "SIP", "difficulty": "basic", "tags": ["message-flow", "response-code"], "question": "발신자가 전화를 걸었으나 착신자가 지금 응대할 수 없어(부재/방해금지 등) 연결되지 못하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "480 Temporarily Unavailable", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "explain": "착신자가 로그아웃·방해금지 등으로 지금 응대할 수 없으면 480 Temporarily\nUnavailable로 응답한다. 발신자는 이 최종 응답도 ACK로 확인한다. 486(통화중,\nsip-0045)과 원인이 다르다 — 480은 \"응대 불가 상태 전반\"이다.\n", "ref": "RFC 3261 §17.1.1.3, §21.4.18"}]</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  if (!DATA.length) {
    document.getElementById("app").textContent = "문제가 없습니다.";
    return;
  }

  var POOL = [];
  var deck = [];
  var current = null;
  var answered = false;
  var DIFF_LABEL = { basic: "기본", advanced: "심화" };
  var MODE_LABEL = { "__all__": "전체", order: "순서맞추기", noorder: "순서제외" };
  var sel = { topic: "__all__", difficulty: "__all__", mode: "__all__" };

  var elHdr = document.getElementById("hdr");
  var elDeckChange = document.getElementById("deck-change");
  var elStart = document.getElementById("start");
  var elQuiz = document.getElementById("quiz");
  var elTopicGroup = document.getElementById("topic-group");
  var elModeGroup = document.getElementById("mode-group");
  var elPickTopic = document.getElementById("pick-topic");
  var elPickDiff = document.getElementById("pick-diff");
  var elPickMode = document.getElementById("pick-mode");
  var elPickCount = document.getElementById("pick-count");
  var elStartBtn = document.getElementById("start-btn");
  var elDeckCount = document.getElementById("deck-label");
  var elBadges = document.getElementById("badges");
  var elQuestion = document.getElementById("question");
  var elAnswerArea = document.getElementById("answer-area");
  var elFeedback = document.getElementById("feedback");
  var elVerdict = document.getElementById("verdict");
  var elDiagram = document.getElementById("diagram");
  var elExplain = document.getElementById("explain");
  var elRef = document.getElementById("ref");
  var elNextBtn = document.getElementById("next-btn");
  var elPassBtn = document.getElementById("pass-btn");

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function nextQuestion() {
    if (deck.length === 0) deck = shuffle(POOL);
    return deck.pop();
  }

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.cls) e.className = opts.cls;
    return e;
  }

  function looksRaw(text) {
    return text.indexOf("\n") !== -1;
  }

  function showFeedback(isCorrect, explain, ref, diagramNode) {
    answered = true;
    elPassBtn.hidden = true;
    elVerdict.textContent = isCorrect ? "정답" : "오답";
    elVerdict.className = "verdict " + (isCorrect ? "correct" : "wrong");
    elDiagram.innerHTML = "";
    if (diagramNode) elDiagram.appendChild(diagramNode);
    elExplain.textContent = explain;
    elRef.textContent = "ref: " + ref;
    elFeedback.hidden = false;
  }

  // 참가자 목록: q.items를 순서대로 훑으며 처음 등장하는 순서로 레인을 고정한다.
  function collectActors(items) {
    var actors = [];
    items.forEach(function (it) {
      if (actors.indexOf(it.from) === -1) actors.push(it.from);
      if (actors.indexOf(it.to) === -1) actors.push(it.to);
    });
    return actors;
  }

  // 이 문제의 정답에 실제로 등장하는 (from, to) 조합만. 방향 토글은 이 목록만 순환한다 —
  // actor를 전부 조합(N*(N-1))하면 참가자가 늘수록(HSS/EIR/OFCS 등) 실제로 안 쓰이는
  // 조합까지 순환에 끼어들어 탭 수만 늘어난다.
  function collectPairs(items) {
    var pairs = [];
    items.forEach(function (it) {
      var exists = pairs.some(function (p) { return p[0] === it.from && p[1] === it.to; });
      if (!exists) pairs.push([it.from, it.to]);
    });
    return pairs;
  }

  // 좌표(퍼센트)를 직접 계산해서 화살표가 항상 정확히 두 lifeline 사이에 걸치게 한다
  // (그리드 칸 경계에 맞추면 lifeline이 칸 "중앙"에 있어서 살짝 어긋난다).
  // actors: 참가자 목록(레인 순서 고정). rows: [{msg, from, to}, ...] 위에서부터 순서대로.
  // onRowClick(rowIndex)를 주면 각 줄이 탭 가능해진다(방향 전환용) — 안 주면 읽기 전용.
  var DIAGRAM_ROW_H = 44;

  function renderDiagram(actors, rows, onRowClick) {
    var n = actors.length;
    var xOf = function (i) { return (i + 0.5) / n * 100; };

    var wrap = el("div", { cls: "diagram" });

    var header = el("div", { cls: "diagram-header" });
    actors.forEach(function (a, i) {
      var box = el("div", { cls: "diagram-actor", text: a });
      box.style.left = xOf(i) + "%";
      header.appendChild(box);
    });
    wrap.appendChild(header);

    var body = el("div", { cls: "diagram-body" });
    body.style.height = (Math.max(rows.length, 1) * DIAGRAM_ROW_H + 10) + "px";

    actors.forEach(function (a, i) {
      var line = el("div", { cls: "diagram-lifeline" });
      line.style.left = xOf(i) + "%";
      body.appendChild(line);
    });

    rows.forEach(function (r, idx) {
      var fromIdx = actors.indexOf(r.from);
      var toIdx = actors.indexOf(r.to);
      var rev = toIdx < fromIdx;
      var x1 = xOf(Math.min(fromIdx, toIdx));
      var x2 = xOf(Math.max(fromIdx, toIdx));

      var row = el("div", { cls: "diagram-row" + (onRowClick ? " tappable" : "") });
      row.style.top = (idx * DIAGRAM_ROW_H) + "px";

      var msg = el("div", { cls: "diagram-msg", text: (idx + 1) + ". " + r.msg });
      msg.style.left = x1 + "%";
      msg.style.width = (x2 - x1) + "%";

      var line = el("div", { cls: "diagram-line" + (rev ? " rev" : "") });
      line.style.left = x1 + "%";
      line.style.width = (x2 - x1) + "%";

      row.appendChild(msg);
      row.appendChild(line);
      if (onRowClick) {
        row.addEventListener("click", function () { onRowClick(idx); });
      }
      body.appendChild(row);
    });

    wrap.appendChild(body);
    return wrap;
  }

  // 정답 순서/방향(q.items)을 읽기 전용 시퀀스 다이어그램으로 그린다. 채점 후 reveal에서만 쓴다.
  function buildDiagram(items) {
    return renderDiagram(collectActors(items), items, null);
  }

  function renderMcq(q) {
    var order = shuffle(q.choices.map(function (c, i) { return i; }));
    order.forEach(function (origIndex) {
      var btn = el("button", { cls: "opt", text: q.choices[origIndex] });
      btn.addEventListener("click", function () {
        if (answered) return;
        var isCorrect = origIndex === q.answer;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect) {
          Array.prototype.forEach.call(elAnswerArea.children, function (b, i) {
            if (order[i] === q.answer) b.classList.add("correct");
          });
        }
        Array.prototype.forEach.call(elAnswerArea.children, function (b) { b.disabled = true; });
        showFeedback(isCorrect, q.explain, q.ref);
      });
      elAnswerArea.appendChild(btn);
    });
  }

  function renderOx(q) {
    var row = el("div", { cls: "ox-row" });
    [true, false].forEach(function (val) {
      var btn = el("button", { cls: "opt", text: val ? "O" : "X" });
      btn.addEventListener("click", function () {
        if (answered) return;
        var isCorrect = val === q.answer;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect) {
          Array.prototype.forEach.call(row.children, function (b, i) {
            if ([true, false][i] === q.answer) b.classList.add("correct");
          });
        }
        Array.prototype.forEach.call(row.children, function (b) { b.disabled = true; });
        showFeedback(isCorrect, q.explain, q.ref);
      });
      row.appendChild(btn);
    });
    elAnswerArea.appendChild(row);
  }

  function renderShort(q) {
    var input = el("input");
    input.type = "text";
    input.autocapitalize = "off";
    input.autocomplete = "off";
    var submit = el("button", { cls: "primary", text: "확인" });
    submit.addEventListener("click", function () {
      if (answered) return;
      var given = input.value.trim().toLowerCase();
      var isCorrect = q.answer.some(function (a) { return a.trim().toLowerCase() === given; });
      input.disabled = true;
      submit.disabled = true;
      showFeedback(isCorrect, q.explain + "\n정답: " + q.answer[0], q.ref);
    });
    elAnswerArea.appendChild(input);
    elAnswerArea.appendChild(submit);
  }

  function renderOrder(q) {
    // uid == 정답 순서상의 인덱스(q.items 기준). 중복 문구가 있어도 안전하게 구분된다.
    var actors = collectActors(q.items);
    var pairs = collectPairs(q.items);
    var pool = shuffle(q.items.map(function (item, uid) { return { item: item, uid: uid }; }));
    var poolEl = el("div", { cls: "order-pool" });
    var answerEl = el("div", { cls: "order-answer" });
    // chosen[i] = { uid, item, pairIndex } — 탭한 순서대로. pairIndex는 무작위 초기값이라
    // 방향을 안 건드리면 자동으로 맞는 일이 없다.
    var chosen = [];

    function renderPool() {
      poolEl.innerHTML = "";
      pool.forEach(function (p) {
        if (chosen.some(function (c) { return c.uid === p.uid; })) return;
        var btn = el("button", { cls: "opt chip", text: p.item.msg });
        btn.addEventListener("click", function () {
          if (answered) return;
          chosen.push({ uid: p.uid, item: p.item, pairIndex: Math.floor(Math.random() * pairs.length) });
          renderPool();
          renderAnswer();
        });
        poolEl.appendChild(btn);
      });
    }

    function renderAnswer() {
      answerEl.innerHTML = "";
      var rows = chosen.map(function (entry) {
        var pair = pairs[entry.pairIndex];
        return { msg: entry.item.msg, from: pair[0], to: pair[1] };
      });
      answerEl.appendChild(renderDiagram(actors, rows, function (idx) {
        if (answered) return;
        chosen[idx].pairIndex = (chosen[idx].pairIndex + 1) % pairs.length;
        renderAnswer();
      }));
      if (chosen.length === 0) {
        answerEl.appendChild(el("div", {
          cls: "order-placeholder",
          text: "위에서 순서대로 탭 → 담긴 항목을 다시 탭하면 방향 전환"
        }));
      }
    }

    var resetBtn = el("button", { cls: "order-reset", text: "↺ 처음부터" });
    resetBtn.addEventListener("click", function () {
      if (answered) return;
      chosen = [];
      renderPool();
      renderAnswer();
    });

    var submit = el("button", { cls: "primary", text: "확인" });
    submit.addEventListener("click", function () {
      if (answered) return;
      if (chosen.length !== q.items.length) return;
      var isCorrect = chosen.every(function (entry, i) {
        var pair = pairs[entry.pairIndex];
        return entry.uid === i && pair[0] === entry.item.from && pair[1] === entry.item.to;
      });
      submit.disabled = true;
      showFeedback(isCorrect, q.explain, q.ref, buildDiagram(q.items));
    });

    renderPool();
    renderAnswer();

    elAnswerArea.appendChild(el("div", { cls: "order-label", text: "탭해서 순서대로 선택" }));
    elAnswerArea.appendChild(poolEl);
    elAnswerArea.appendChild(el("div", { cls: "order-label", text: "내 답안 (탭하면 방향 전환)" }));
    elAnswerArea.appendChild(answerEl);
    elAnswerArea.appendChild(resetBtn);
    elAnswerArea.appendChild(submit);
  }

  function render(q) {
    current = q;
    answered = false;
    elBadges.innerHTML = "";
    elBadges.appendChild(el("span", { cls: "badge", text: DIFF_LABEL[q.difficulty] || q.difficulty }));
    q.tags.forEach(function (t) {
      elBadges.appendChild(el("span", { cls: "badge", text: t }));
    });
    elDeckCount.textContent = "남은 " + deck.length + "문제";
    elQuestion.textContent = q.question;
    elQuestion.className = "question" + (looksRaw(q.question) ? " raw" : "");
    elAnswerArea.innerHTML = "";
    elFeedback.hidden = true;
    elPassBtn.hidden = false;

    if (q.type === "mcq") renderMcq(q);
    else if (q.type === "ox") renderOx(q);
    else if (q.type === "short") renderShort(q);
    else if (q.type === "order") renderOrder(q);
  }

  elNextBtn.addEventListener("click", function () {
    render(nextQuestion());
  });

  elPassBtn.addEventListener("click", function () {
    if (answered) return;
    render(nextQuestion());
  });

  // ---- 덱 선택 화면 ----
  // 선택지는 데이터에 실제 존재하는 값에서만 만든다. 없는 주제/난이도 버튼은 안 만든다.
  var topicVals = [];
  DATA.forEach(function (q) { if (topicVals.indexOf(q.topic) === -1) topicVals.push(q.topic); });
  var diffVals = ["basic", "advanced"].filter(function (d) {
    return DATA.some(function (q) { return q.difficulty === d; });
  });

  function matching() {
    return DATA.filter(function (q) {
      var modeOk = sel.mode === "__all__" ||
                   (sel.mode === "order" && q.type === "order") ||
                   (sel.mode === "noorder" && q.type !== "order");
      return (sel.topic === "__all__" || q.topic === sel.topic) &&
             (sel.difficulty === "__all__" || q.difficulty === sel.difficulty) &&
             modeOk;
    });
  }

  function makeRow(container, key, values, labelFn) {
    container.innerHTML = "";
    var opts = [{ v: "__all__", label: "전체" }];
    values.forEach(function (v) { opts.push({ v: v, label: labelFn(v) }); });
    opts.forEach(function (o) {
      var btn = el("button", { cls: "pick-btn" + (sel[key] === o.v ? " sel" : ""), text: o.label });
      btn.addEventListener("click", function () { sel[key] = o.v; refreshPicker(); });
      container.appendChild(btn);
    });
  }

  // 유형(순서맞추기)은 type 필드값 하나에 대응하지 않고 "order냐 아니냐"라 makeRow로 못 만든다.
  function makeModeRow() {
    elPickMode.innerHTML = "";
    ["__all__", "order", "noorder"].forEach(function (v) {
      var btn = el("button", { cls: "pick-btn" + (sel.mode === v ? " sel" : ""), text: MODE_LABEL[v] });
      btn.addEventListener("click", function () { sel.mode = v; refreshPicker(); });
      elPickMode.appendChild(btn);
    });
  }

  function refreshPicker() {
    makeRow(elPickTopic, "topic", topicVals, function (t) { return t; });
    makeRow(elPickDiff, "difficulty", diffVals, function (d) { return DIFF_LABEL[d] || d; });
    makeModeRow();
    var n = matching().length;
    elPickCount.textContent = n + "문제";
    elStartBtn.disabled = n === 0;
  }

  function filterLabel() {
    var parts = [sel.topic === "__all__" ? "전체" : sel.topic];
    parts.push(sel.difficulty === "__all__" ? "전체" : DIFF_LABEL[sel.difficulty]);
    if (sel.mode !== "__all__") parts.push(MODE_LABEL[sel.mode]);
    return parts.join(" · ") + " ▾";
  }

  function showStart() {
    elQuiz.hidden = true;
    elHdr.hidden = true;
    elFeedback.hidden = true;
    elStart.hidden = false;
    refreshPicker();
  }

  function startQuiz() {
    POOL = matching();
    if (!POOL.length) return;
    deck = [];
    elStart.hidden = true;
    elQuiz.hidden = false;
    elHdr.hidden = false;
    elDeckChange.textContent = filterLabel();
    render(nextQuestion());
  }

  elStartBtn.addEventListener("click", startQuiz);
  elDeckChange.addEventListener("click", showStart);

  // 주제가 하나뿐이면 '전체'와 중복이라 주제 선택 줄은 숨긴다.
  if (topicVals.length <= 1) elTopicGroup.hidden = true;
  // order 타입 문제가 없으면 유형 필터도 의미 없으니 숨긴다.
  if (!DATA.some(function (q) { return q.type === "order"; })) elModeGroup.hidden = true;

  showStart();
})();
</script>
</body>
