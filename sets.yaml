# 문제 묶음(세트). 시작 화면의 '세트' 줄에 이 순서대로 나온다.
# 세트를 고르면 그 세트의 문제만 출제하고, 주제·난이도·유형 필터는 그 안에서 다시 적용된다.
# - id: 세트 식별자(소문자·숫자·하이픈). name: 화면에 보일 이름.
# - ids: 문제 ID 목록. 한 문제가 여러 세트에 들어가도 된다. 없는 ID는 검증기가 거부한다.
# - include: 다른 세트를 통째로 묶는다(한 단계만 허용).

- id: csgn
  name: "C-SGN 전체"
  include: [csgn-reg, csgn-paging, csgn-idle, csgn-data]

- id: csgn-reg
  name: "C-SGN ① 등록·인증"
  ids: [ims-0018, diam-0034, diam-0035, diam-0036, diam-0037, diam-0038, diam-0039,
        epc-0001, epc-0002, epc-0003, epc-0004, epc-0005, epc-0006, epc-0007]

- id: csgn-paging
  name: "C-SGN ② 통신·페이징"
  ids: [epc-0008, epc-0009, epc-0010, epc-0011, epc-0012, epc-0013, epc-0014, epc-0015,
        epc-0016]

- id: csgn-idle
  name: "C-SGN ③ 휴지(S1 release)"
  ids: [epc-0007, epc-0013, epc-0015, epc-0017, epc-0018, epc-0019, epc-0020, epc-0021,
        epc-0022, epc-0023, epc-0024]

- id: csgn-data
  name: "C-SGN ④ 업링크·다운링크"
  ids: [epc-0006, epc-0016, epc-0025, epc-0026, epc-0027, epc-0028, epc-0029, epc-0030,
        epc-0031, epc-0032]
