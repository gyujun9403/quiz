- id: sip-0001
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "RFC 3261이 정의하는 6개 기본 메서드에 포함되지 않는 것은?"
  choices: ["REGISTER", "SUBSCRIBE", "CANCEL", "OPTIONS"]
  answer: 1
  explain: |
    RFC 3261은 REGISTER, INVITE, ACK, CANCEL, BYE, OPTIONS 6개를 기본 메서드로
    정의한다. SUBSCRIBE는 이벤트 구독을 위한 확장 메서드로 RFC 3265에서 별도로
    정의되었고, RFC 3261 기본 6종에는 포함되지 않는다.
  ref: "RFC 3261 §7.1"

- id: sip-0002
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow]
  question: "성공적인 SIP 세션 설정 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "180 Ringing", from: "착신자", to: "발신자"}
    - {msg: "200 OK", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  decoys:
    - {msg: "CANCEL", from: "발신자", to: "착신자"}
    - {msg: "487 Request Terminated", from: "착신자", to: "발신자"}
  explain: |
    발신자가 INVITE를 보내면 잠정 응답 100 Trying이 먼저 오고, 착신 단말이
    울리면 180 Ringing이 온다. 착신자가 응답하면 200 OK가 오며, 발신자는
    이를 확인하는 ACK를 보내 세션이 시작된다.
  ref: "RFC 3261 §4 (Figure 1)"

- id: sip-0003
  type: order
  topic: SIP
  difficulty: advanced
  tags: [message-flow, method]
  question: "발신자가 응답 대기 중 통화를 취소(CANCEL)하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "CANCEL", from: "발신자", to: "착신자"}
    - {msg: "200 OK (CANCEL 응답)", from: "착신자", to: "발신자"}
    - {msg: "487 Request Terminated", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  decoys:
    - {msg: "BYE", from: "발신자", to: "착신자"}
    - {msg: "486 Busy Here", from: "착신자", to: "발신자"}
  explain: |
    잠정 응답(100 Trying)을 받은 뒤에만 CANCEL을 보낼 수 있다. UAS는 CANCEL
    요청 자체에는 200 OK로 응답하고, 별도로 원래의 INVITE 트랜잭션은 487
    Request Terminated로 종료시킨다. 두 응답은 서로 다른 트랜잭션에 대한
    응답이라는 점이 헷갈리기 쉽다.
    487은 INVITE에 대한 실패(비-2xx) 최종 응답이므로 발신자가 ACK로 확인한다.
    실패 최종 응답이 오면 다이얼로그가 남지 않으므로 BYE는 보내지 않는다. 486은
    착신자가 통화 중일 때의 거절이고, 발신자가 취소한 경우는 487이다.
  ref: "RFC 3261 §9.2, §15, §17.1.1.2; RFC 3665 §3.8"

- id: sip-0004
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "CANCEL은 INVITE 요청에 대해서만 사용해야 한다."
  answer: true
  explain: |
    INVITE 이외의 요청은 즉시 응답되므로 CANCEL을 보내면 경쟁 상태(race
    condition)가 발생한다. RFC 3261은 CANCEL을 INVITE가 아닌 요청에는
    보내지 말아야 한다(SHOULD NOT)고 규정한다.
  ref: "RFC 3261 §9.1"

- id: sip-0005
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method]
  question: "이미 최종 응답을 받은 요청에 CANCEL을 보내면 그 요청의 처리에 영향을 준다."
  answer: false
  explain: |
    원래 요청에 대해 이미 최종 응답(2xx~6xx)이 발생했다면, CANCEL은 그
    요청의 처리·세션 상태·응답 생성 어느 것에도 영향을 주지 않는다.
    사실상 아무 효과 없는 요청(no-op)이 된다.
  ref: "RFC 3261 §9.2"

- id: sip-0006
  type: short
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "SIP에서 진행 중인 세션(통화)을 종료할 때 사용하는 메서드는?"
  answer: ["BYE"]
  explain: |
    RFC 3261은 BYE를 "세션을 종료하기 위한" 메서드로 정의한다. INVITE로
    세션을 시작했다면, 종료는 CANCEL이 아니라 BYE로 한다 — CANCEL은 아직
    최종 응답을 받기 전의 진행 중인 요청을 취소할 때만 쓴다(sip-0004/0005).
  ref: "RFC 3261 §7.1"

- id: sip-0007
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "1xx(잠정 응답) 클래스의 성격을 가장 정확히 설명한 것은?"
  choices:
    - "요청이 처리되어 성공적으로 완료됐음을 확정해서 알린다"
    - "서버가 아직 확정 응답을 갖지 못한 채 처리 중임을 뜻한다"
    - "요청 메시지의 문법에 오류가 있어 처리할 수 없음을 뜻한다"
    - "사용자가 다른 위치로 옮겨가 새 주소로 다시 요청해야 함을 뜻한다"
  answer: 1
  explain: |
    1xx는 확정 응답이 아직 없다는 뜻으로, 서버가 200ms 넘게 걸릴 것 같을 때
    보낸다. 신뢰성 있게 전달되지 않으며(재전송 없음) ACK도 유발하지 않는다.
  ref: "RFC 3261 §21.1"

- id: sip-0008
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "1xx 응답은 클라이언트의 ACK 전송을 유발하지 않는다."
  answer: true
  explain: |
    1xx는 잠정 응답이라 신뢰성 있게 전달되지 않고, ACK도 유발하지 않는다.
    ACK는 INVITE에 대한 응답을 확인할 때만 쓰인다.
  ref: "RFC 3261 §21.1"

- id: sip-0009
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "486 Busy Here 대신 600 Busy Everywhere를 써야 하는 경우는?"
  choices:
    - "서버가 이 사용자와 관련된 다른 어떤 단말도 응답하지 않을 것임을 알고 있을 때"
    - "통화 중이라는 사실을 486보다 정중한 표현으로 발신자에게 알리고 싶을 때"
    - "포킹으로 여러 단말이 동시에 울리는 중 이 단말 하나만 통화 중일 때"
    - "단말이 지금은 통화 중이지만 몇 분 뒤에는 받을 수 있다고 예상될 때"
  answer: 0
  explain: |
    486은 "이 단말"만 통화 중이라는 뜻이라 음성사서함 등 다른 경로로 연결될
    여지가 있다. 600은 서버가 어떤 단말로도 연결 안 될 걸 알 때만 쓴다.
  ref: "RFC 3261 §21.6.1"

- id: sip-0010
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "Request-URI에 다이얼 문자열이 아직 다 입력되지 않아 불완전할 때 쓰는 응답은?"
  choices: ["404 Not Found", "484 Address Incomplete", "485 Ambiguous", "400 Bad Request"]
  answer: 1
  explain: |
    484는 오버랩 다이얼링(자릿수를 늘려가며 재전송)을 지원하기 위한 코드다.
    클라이언트는 484를 받는 동안 계속 더 긴 문자열로 재전송한다.
  ref: "RFC 3261 §21.4.22"

- id: sip-0011
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "485 Ambiguous와 300 Multiple Choices는 의미(semantics)가 달라서 별도의
    코드로 분리되어 있다."
  answer: true
  explain: |
    300은 같은 사용자/서비스에 도달하는 여러 경로가 있다는 뜻으로 자동 선택도
    가능하지만, 485는 Request-URI 자체가 여러 사람 중 누구인지 애매하다는
    뜻이라 사람이 개입해 골라야 한다.
  ref: "RFC 3261 §21.4.23"

- id: sip-0012
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "프록시 서버가(사용자가 아니라) 클라이언트 인증을 요구할 때 쓰는 응답 코드는?"
  answer: ["407"]
  explain: |
    401은 UAS/registrar가, 407은 프록시가 쓴다는 게 핵심 구분이다. 통신사업자
    게이트웨이처럼 "채널 접근" 자체에 인증이 필요한 경우 407을 쓴다.
  ref: "RFC 3261 §21.4.8"

- id: sip-0013
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "483 Too Many Hops가 발생하는 조건은?"
  choices:
    - "Max-Forwards 헤더 값이 0인 요청을 받음"
    - "서버가 루프를 감지함"
    - "요청 URI가 존재하지 않는 도메인을 가리킴"
    - "메시지 크기가 서버 한도를 초과함"
  answer: 0
  explain: |
    483은 Max-Forwards=0으로 명확히 정의된다. 반면 482 Loop Detected는
    (Max-Forwards와 별개로) 서버가 실제 루프를 감지했을 때 쓰는, 조건이
    다른 코드다.
  ref: "RFC 3261 §21.4.21"

- id: sip-0014
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "482 Loop Detected와 483 Too Many Hops는 둘 다 Max-Forwards 값이 0이 되는
    같은 조건에서 발생한다."
  answer: false
  explain: |
    483만 Max-Forwards=0으로 명시적으로 정의된다. 482는 서버가 루프를
    감지했을 때 쓰는 별개의 메커니즘이다.
  ref: "RFC 3261 §21.4.20, §21.4.21"

- id: sip-0015
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "상대방이 이미 다른 통화를 처리 중이라 이 통화에 응답할 수 없을 때 가장
    적합한 코드는?"
  choices: ["480 Temporarily Unavailable", "486 Busy Here", "487 Request Terminated", "600 Busy Everywhere"]
  answer: 1
  explain: |
    480은 로그아웃·방해금지 등 응대 불가 상태 전반을 포괄하는 코드고, 486은
    그중 "다른 통화 처리 중"이라는 이유를 더 정확히 알려주고 싶을 때 쓴다.
  ref: "RFC 3261 §21.4.24"

- id: sip-0016
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "SIP 응답 코드 486의 영문 명칭은?"
  answer: ["Busy Here"]
  explain: |
    486 Busy Here — 상대방 단말은 연결됐지만 지금 이 단말에서는 추가 통화를
    받을 수 없다는 뜻이다.
  ref: "RFC 3261 §21.4.24"

- id: sip-0017
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "487 Request Terminated이 발생하는 원인은?"
  choices:
    - "BYE 또는 CANCEL에 의해 원래 요청이 종료됨"
    - "요청이 제 시간 안에 처리되지 못함"
    - "서버 내부 오류가 발생함"
    - "요청 문법이 잘못됨"
  answer: 0
  explain: |
    487은 진행 중이던 요청(주로 INVITE)이 BYE나 CANCEL로 인해 중단됐을 때
    그 원래 요청에 대한 최종 응답으로 온다.
  ref: "RFC 3261 §21.4.25"

- id: sip-0018
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "CANCEL 요청 자체에 대한 응답으로 487 Request Terminated이 올 수 있다."
  answer: false
  explain: |
    487은 CANCEL로 인해 종료되는 "원래 요청"(예: INVITE)에 대한 응답이다.
    CANCEL 요청 자체는 항상 200 OK로 응답되며, CANCEL에 대한 응답으로
    487이 오는 일은 없다.
  ref: "RFC 3261 §21.4.25"

- id: sip-0019
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "301 Moved Permanently를 받으면 클라이언트는 로컬 주소록을 새 주소로
    갱신하는 것이 권장된다."
  answer: true
  explain: |
    301은 영구 이동이므로, 요청자는 주소록·캐시 등을 새 주소로 갱신하고
    이후 요청도 그 주소로 보내는 게 권장된다. 302(일시 이동)는 이렇게까지
    하지 않는다.
  ref: "RFC 3261 §21.3.2"

- id: sip-0020
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "302 Moved Temporarily 응답에 만료 시간이 없으면, 그 Contact 주소는
    이후에도 계속 캐시해서 재사용해도 된다."
  answer: false
  explain: |
    명시적 만료 시간이 없으면 그 주소는 딱 한 번의 재시도(recursing)에만
    유효하며, 향후 트랜잭션을 위해 캐시하면 안 된다(MUST NOT).
  ref: "RFC 3261 §21.3.3"

- id: sip-0021
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "503 Service Unavailable을 Retry-After 헤더 없이 받았을 때 클라이언트는
    어떻게 동작해야 하는가?"
  choices:
    - "500 Server Internal Error와 같이 취급한다"
    - "1분 동안 기다렸다가 같은 요청을 그대로 재전송한다"
    - "그 요청을 완전히 포기하고 다시 시도하지 않는다"
    - "응답을 무시하고 즉시 같은 서버로 요청을 다시 보낸다"
  answer: 0
  explain: |
    Retry-After가 없으면 클라이언트는 500을 받은 것처럼(MUST) 동작해야
    한다. Retry-After가 있다면 그 시간 동안은 해당 서버로 다른 요청도
    보내지 않는 게 권장된다.
  ref: "RFC 3261 §21.5.4"

- id: sip-0022
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "서버가 요청 메서드 자체를 전혀 지원하지 않아(어떤 사용자에 대해서도)
    처리할 수 없을 때 쓰는 코드는?"
  choices: ["405 Method Not Allowed", "501 Not Implemented", "400 Bad Request", "503 Service Unavailable"]
  answer: 1
  explain: |
    501은 서버가 그 메서드 자체를 지원하지 않을 때(UAS가 메서드를 인식조차
    못 함) 쓴다. 메서드는 인식하지만 그 주소에서만 허용 안 되는 경우는
    405다.
  ref: "RFC 3261 §21.5.2"

- id: sip-0023
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "서버가 요청 메서드를 인식은 하지만, 그 Request-URI가 가리키는 주소에서는
    허용하지 않을 때 쓰는 코드는?"
  choices: ["405 Method Not Allowed", "501 Not Implemented", "406 Not Acceptable", "403 Forbidden"]
  answer: 0
  explain: |
    405는 메서드 자체는 알지만 그 주소에서 허용 안 될 때, 501은 메서드
    자체를 서버가 아예 지원 안 할 때 쓴다. 405 응답에는 허용되는 메서드
    목록을 Allow 헤더로 반드시 포함해야 한다.
  ref: "RFC 3261 §21.4.6, §21.5.2"

- id: sip-0024
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "504 Server Time-out은 서버가 접근한 외부(다운스트림) 서버로부터 제때
    응답을 받지 못했을 때 쓰고, 408 Request Timeout은 서버 자신이 제 시간에
    응답을 만들어내지 못했을 때 쓴다."
  answer: true
  explain: |
    408은 서버 자체가 시간 내 응답을 못 만든 경우(예: 사용자 위치 파악
    지연)를 포괄하고, 504는 그 원인이 서버가 접근한 외부 서버의 응답
    지연일 때 쓰는 더 구체적인 코드다.
  ref: "RFC 3261 §21.4.9, §21.5.5"

- id: sip-0025
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "SIP이 HTTP/1.1 응답 코드 체계를 확장하면서 새로 정의한 클래스는?"
  choices: ["1xx", "3xx", "5xx", "6xx"]
  answer: 3
  explain: |
    SIP 응답 코드는 HTTP/1.1을 기반으로 하되 그중 적절한 것만 가져다
    쓰고, 6xx(Global Failures)는 SIP이 새로 정의한 클래스다.
  ref: "RFC 3261 §21"

- id: sip-0026
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "3xx 응답은 4xx/5xx/6xx와 마찬가지로 확정적 실패(definite failure)로
    분류된다."
  answer: false
  explain: |
    4xx는 "특정 서버로부터의 확정적 실패 응답"으로 명시되지만, 3xx는
    실패가 아니라 사용자의 새 위치나 대체 서비스 정보를 알려주는
    응답이다.
  ref: "RFC 3261 §21.3, §21.4"

- id: sip-0027
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, method]
  question: "단말이 등록 서버에 처음 등록할 때, 인증 챌린지를 포함한 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "REGISTER", from: "단말", to: "등록서버"}
    - {msg: "401 Unauthorized", from: "등록서버", to: "단말"}
    - {msg: "REGISTER (인증정보 포함)", from: "단말", to: "등록서버"}
    - {msg: "200 OK", from: "등록서버", to: "단말"}
  decoys:
    - {msg: "407 Proxy Authentication Required", from: "등록서버", to: "단말"}
    - {msg: "ACK", from: "단말", to: "등록서버"}
  explain: |
    단말이 처음 REGISTER를 보내면 등록 서버(registrar)는 인증을 요구하며
    401 Unauthorized로 챌린지한다. 단말은 자격증명(Digest)을 담아 REGISTER를
    다시 보내고, 서버가 이를 확인하면 200 OK로 등록이 완료된다. 401은
    등록 서버/UAS가 보내는 인증 요구이며, 프록시는 407을 쓴다(sip-0012).
    REGISTER는 비-INVITE 요청이므로 401이나 200 OK를 받아도 ACK를 보내지 않는다.
  ref: "RFC 3665 §2.1; RFC 3261 §10, §17.1.2.1, §21.4.2, §22.1"

- id: sip-0028
  type: short
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "단말이 자신의 현재 접속 위치를 등록 서버에 등록(위치 바인딩)할 때 쓰는 메서드는?"
  answer: ["REGISTER"]
  explain: |
    REGISTER는 사용자의 공개 주소(AOR, Address-of-Record)를 단말의 현재
    Contact 주소에 바인딩해, 이후 그 사용자에게 오는 요청이 현재 단말로
    라우팅되게 한다. 위치 등록이 SIP 이동성의 출발점이다.
  ref: "RFC 3261 §10.1"

- id: sip-0029
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "REGISTER는 사용자의 공개 주소(AOR)를 현재 접속 위치(Contact)에 바인딩해 등록
    서버가 그 사용자의 위치를 알게 하는 메서드다."
  answer: true
  explain: |
    맞다. REGISTER의 목적은 AOR↔Contact 바인딩이다. 이 바인딩 덕분에 누군가
    그 AOR로 INVITE를 보내면 등록 서버/프록시가 현재 단말 위치로 요청을
    넘길 수 있다.
  ref: "RFC 3261 §10.1"

- id: sip-0030
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow]
  question: "착신자가 통화를 끊는 경우까지 포함한 기본 호의 전체 흐름(설정→종료)을 순서·방향까지 맞춰라."
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "180 Ringing", from: "착신자", to: "발신자"}
    - {msg: "200 OK", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
    - {msg: "BYE", from: "착신자", to: "발신자"}
    - {msg: "200 OK (BYE 응답)", from: "발신자", to: "착신자"}
  decoys:
    - {msg: "CANCEL", from: "발신자", to: "착신자"}
    - {msg: "487 Request Terminated", from: "착신자", to: "발신자"}
  explain: |
    설정 절반은 sip-0002와 같다(INVITE→100→180→200→ACK). 통화가 끝나면
    확립된 세션을 종료하려고 한쪽이 BYE를 보내고, 상대는 200 OK로 응답한다.
    여기서는 착신자가 먼저 끊었으므로 BYE는 착신자→발신자, 그 200 OK는
    발신자→착신자다. 세션 종료는 CANCEL이 아니라 BYE로 한다.
  ref: "RFC 3261 §4 (Figure 1), §15.1"

- id: sip-0031
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method, message-flow]
  question: "INVITE에 대한 200 OK(2xx 최종 응답)를 받은 발신자가 3-way 핸드셰이크를 완성하려고
    마지막으로 보내는 메시지는?"
  choices: ["ACK", "BYE", "200 OK", "CANCEL"]
  answer: 0
  explain: |
    INVITE의 3-way 핸드셰이크는 INVITE → 200 OK → ACK로 완성된다. 발신자는
    2xx를 받을 때마다 이를 확인하는 ACK를 보내야 세션이 확립된다. BYE는 이미
    확립된 세션의 종료, CANCEL은 최종 응답 전 취소용이라 여기선 아니다.
  ref: "RFC 3261 §13.2.2.4"

- id: sip-0032
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "아직 응답이 오지 않아 확립되지 않은(진행 중인 INVITE) 통화를 중단할 때는 BYE를 보낸다."
  answer: false
  explain: |
    아니다. BYE는 이미 확립된 세션(다이얼로그)을 종료하는 메서드다. 아직
    최종 응답을 받기 전 진행 중인 INVITE를 멈추려면 CANCEL을 쓴다. 확립
    전=CANCEL, 확립 후=BYE로 구분한다.
  ref: "RFC 3261 §15.1, §9.1"

- id: sip-0033
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "착신 단말이 INVITE를 받아 사용자에게 착신을 알리는(전화가 울리는) 중임을 나타내는 응답은?"
  choices: ["180 Ringing", "100 Trying", "183 Session Progress", "200 OK"]
  answer: 0
  explain: |
    180 Ringing은 착신 UA가 사용자에게 알림(벨)을 울리는 중이라는 잠정
    응답이다. 100 Trying은 요청을 받아 처리 중이라는 뜻일 뿐 아직 벨은
    울리지 않았고, 200 OK는 착신자가 실제로 응답(수락)했을 때다.
  ref: "RFC 3261 §21.1.2"

- id: sip-0034
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "180 Ringing 응답을 받았다면 착신자가 전화를 받아 통화가 연결된 것이다."
  answer: false
  explain: |
    아니다. 180은 상대 단말이 "울리는 중"이라는 잠정 응답일 뿐, 아직 받지
    않았다. 착신자가 실제로 받아 통화가 연결되면 200 OK가 온다. 이 구분이
    콜 상태 파악의 기본이다.
  ref: "RFC 3261 §21.1.2, §21.2.1"

- id: sip-0035
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "100 Trying 응답의 의미로 가장 정확한 것은?"
  choices:
    - "요청을 받아 처리 중이다(아직 최종 응답 아님)"
    - "착신 단말이 사용자에게 착신을 알리는 중이다"
    - "착신자가 통화를 수락했다"
    - "요청한 사용자를 찾을 수 없다"
  answer: 0
  explain: |
    100 Trying은 다음 홉이 요청을 받아 처리 중이라는 잠정 응답이다. 벨이
    울리는 것은 180, 수락은 200 OK, 사용자 없음은 404다 — 100은 그 어느
    것도 아니고 "받아서 처리 시작"만 뜻한다.
  ref: "RFC 3261 §21.1.1"

- id: sip-0037
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "183 Session Progress가 쓰이는 대표적 상황은?"
  choices:
    - "최종 응답 전에 진행 정보(초기 미디어·링백 등)를 전달할 때"
    - "요청 메시지의 문법 오류를 발신자에게 알릴 때"
    - "착신자가 전화를 받아 통화를 수락했을 때"
    - "서버가 요청한 사용자를 찾지 못했을 때"
  answer: 0
  explain: |
    183은 최종 응답 전에 "통화 진행 상황"을 전달하는 잠정 응답으로, 흔히
    초기 미디어(통신사 안내음·네트워크 링백)를 흘려보낼 때 쓴다. 달리
    분류되지 않는 진행 정보를 전달하는 용도라는 점이 180과의 차이다.
  ref: "RFC 3261 §21.1.5"

- id: sip-0038
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "요청이 성공했음을 나타내는 SIP 2xx 최종 응답 코드의 번호(3자리)는?"
  answer: ["200"]
  explain: |
    200 OK는 요청이 성공했음을 뜻하는 대표 최종 응답이다. INVITE에 대한
    200 OK는 착신자가 통화를 수락했다는 의미이며, 발신자는 이를 ACK로
    확인해 세션을 확립한다.
  ref: "RFC 3261 §21.2.1"

- id: sip-0039
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "서버가 Request-URI의 도메인에 해당 사용자가 존재하지 않는다는 확정 정보를 가졌을 때 보내는 응답은?"
  choices: ["404 Not Found", "403 Forbidden", "480 Temporarily Unavailable", "400 Bad Request"]
  answer: 0
  explain: |
    404 Not Found는 "그 도메인에 그 사용자가 없다"는 확정적 정보를 뜻한다.
    480은 사용자는 있으나 지금 응대 불가, 403은 이해했지만 거부, 400은 요청
    문법 오류다 — 원인이 서로 달라 혼동하면 안 된다.
  ref: "RFC 3261 §21.4.5"

- id: sip-0040
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "404 Not Found는 요청 메시지의 문법 자체가 잘못됐다는 뜻이다."
  answer: false
  explain: |
    아니다. 문법 오류는 400 Bad Request다. 404는 문법은 정상이지만 그
    도메인에 해당 사용자가 존재하지 않는다는 뜻이다. 둘은 원인이 완전히
    다르다.
  ref: "RFC 3261 §21.4.5"

- id: sip-0041
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "서버가 요청을 이해했지만 수행을 거부하며, 인증을 다시 시도해도 소용없어 재시도하면 안 되는 응답은?"
  choices: ["403 Forbidden", "401 Unauthorized", "407 Proxy Authentication Required", "404 Not Found"]
  answer: 0
  explain: |
    403 Forbidden은 서버가 요청을 이해했으나 거부하며, 인증(자격증명)으로도
    해결되지 않으니 재시도하지 말라는 뜻이다. 반면 401/407은 자격증명을
    갖춰 다시 보내면 통과할 수 있는 "인증 요구"라는 점이 결정적 차이다.
  ref: "RFC 3261 §21.4.4"

- id: sip-0042
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "401 Unauthorized는 자격증명을 갖춰 다시 시도하면 통과할 수 있지만, 403 Forbidden은
    인증을 다시 시도해도 거부된다."
  answer: true
  explain: |
    맞다. 401은 "인증이 필요하다"는 요구라 올바른 자격증명으로 재시도하면
    성공할 수 있다. 403은 "이해했지만 거부"이며 인증으로 해결되지 않으니
    같은 요청을 반복하면 안 된다.
  ref: "RFC 3261 §21.4.2, §21.4.4"

- id: sip-0043
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, method]
  question: "이미 등록된 단말이 모든 위치 등록을 해제(로그아웃)하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "REGISTER (Expires: 0, Contact: *)", from: "단말", to: "등록서버"}
    - {msg: "200 OK", from: "등록서버", to: "단말"}
  decoys:
    - {msg: "CANCEL", from: "단말", to: "등록서버"}
    - {msg: "BYE", from: "단말", to: "등록서버"}
  explain: |
    등록 해제는 새 REGISTER를 만료값 0으로 보내 기존 바인딩을 지우는 것이다.
    Contact를 "*"로 주고 Expires를 0으로 하면 그 AOR의 모든 등록이 제거된다.
    서버는 200 OK로 확인한다. 등록(sip-0027)과 정반대 동작이다.
    CANCEL은 아직 최종 응답이 오지 않은 INVITE를 취소할 때 쓰고, BYE는 세션을
    끝낼 때 쓴다. 둘 다 등록 해제에는 쓰지 않는다.
  ref: "RFC 3665 §2.4; RFC 3261 §9.1, §10.2.2, §15"

- id: sip-0044
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, method]
  question: "통화 중이던 발신자가 전화를 끊어 세션을 종료하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "BYE", from: "발신자", to: "착신자"}
    - {msg: "200 OK", from: "착신자", to: "발신자"}
  decoys:
    - {msg: "CANCEL", from: "발신자", to: "착신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  explain: |
    확립된 세션의 종료는 BYE로 한다. 끊는 쪽(여기선 발신자)이 BYE를 보내고
    상대가 200 OK로 확인하면 세션이 끝난다. 어느 쪽이든 먼저 BYE를 보낼 수
    있으며, 방향은 "끊는 쪽 → 상대"다.
    CANCEL은 아직 연결되지 않은 INVITE를 취소할 때 쓴다. ACK는 INVITE에 대한 최종
    응답만 확인하므로 BYE의 200 OK에는 보내지 않는다.
  ref: "RFC 3261 §9.1, §15.1, §17.1.2.1"

- id: sip-0045
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, response-code]
  question: "발신자가 전화를 걸었으나 착신자가 통화 중이라 연결되지 못하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "486 Busy Here", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  decoys:
    - {msg: "487 Request Terminated", from: "착신자", to: "발신자"}
    - {msg: "BYE", from: "발신자", to: "착신자"}
  explain: |
    착신 단말이 통화 중이면 486 Busy Here로 거절한다. 발신자는 이 최종 응답을
    받고 ACK로 확인한다 — ACK는 2xx뿐 아니라 486 같은 실패(비-2xx) 최종
    응답도 확인한다는 점이 핵심이다.
    487은 발신자가 CANCEL로 취소했을 때의 응답이다. 실패 최종 응답 뒤에는
    다이얼로그가 남지 않으므로 BYE도 보내지 않는다.
  ref: "RFC 3261 §15, §17.1.1.3, §21.4.24, §21.4.25"

- id: sip-0046
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, response-code]
  question: "발신자가 전화를 걸었으나 착신자가 지금 응대할 수 없어(부재/방해금지 등) 연결되지 못하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "480 Temporarily Unavailable", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  decoys:
    - {msg: "486 Busy Here", from: "착신자", to: "발신자"}
    - {msg: "BYE", from: "발신자", to: "착신자"}
  explain: |
    착신자가 로그아웃·방해금지 등으로 지금 응대할 수 없으면 480 Temporarily
    Unavailable로 응답한다. 발신자는 이 최종 응답도 ACK로 확인한다. 486(통화중,
    sip-0045)과 원인이 다르다 — 480은 "응대 불가 상태 전반"이다.
    실패 최종 응답 뒤에는 다이얼로그가 남지 않으므로 BYE는 보내지 않는다.
  ref: "RFC 3261 §15, §17.1.1.3, §21.4.18"

- id: sip-0047
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "요청이 거쳐온 경로를 기록해 응답이 되돌아갈 길을 알려주고, branch 값으로 트랜잭션
    식별과 루프 감지에 쓰이는 헤더는?"
  choices: ["Via", "Route", "Contact", "CSeq"]
  answer: 0
  explain: |
    Via는 요청이 지나온 각 홉을 쌓아 기록한다. 응답은 이 Via 스택을 역순으로 따라
    돌아가고, branch 파라미터는 트랜잭션을 유일하게 식별하며 루프 감지에도 쓰인다.
  ref: "RFC 3261 §8.1.1.7, §20.42"

- id: sip-0048
  type: short
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "RFC 3261에서 Via의 branch 값이 트랜잭션 식별자로 쓰이려면 반드시 이 문자열로
    시작해야 한다. 그 매직 쿠키는?"
  answer: ["z9hG4bK"]
  explain: |
    branch는 z9hG4bK로 시작해야 RFC 3261을 따르는 새 방식임이 보장된다(구버전 값과 충돌
    방지). 이 접두어 뒤의 값이 트랜잭션을 유일하게 식별한다.
  ref: "RFC 3261 §8.1.1.7"

- id: sip-0049
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header, concept]
  question: "두 UA 사이의 지속적 관계인 '다이얼로그(dialog)'를 유일하게 식별하는 3요소는?"
  choices:
    - "Call-ID + From 태그 + To 태그"
    - "Via의 branch 값"
    - "CSeq 번호 + 메서드"
    - "Request-URI + Contact"
  answer: 0
  explain: |
    다이얼로그는 Call-ID와 양쪽 태그(From 태그·To 태그)의 조합으로 식별된다. branch는
    '트랜잭션'을 식별하는 것으로 레벨이 다르다(트랜잭션이 다이얼로그보다 작은 단위).
  ref: "RFC 3261 §12"

- id: sip-0050
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "CSeq 헤더가 담는 두 가지 정보는?"
  choices:
    - "순서 번호 + 메서드 이름"
    - "출발지 IP + 포트"
    - "Call-ID + 태그"
    - "만료 시간 + 우선순위"
  answer: 0
  explain: |
    CSeq는 '순서 번호 + 메서드'다(예: "314159 INVITE"). 같은 다이얼로그 내 요청 순서를
    매기고 재전송과 새 요청을 구분한다. ACK/CANCEL은 짝이 되는 요청과 같은 번호를 쓴다.
  ref: "RFC 3261 §8.1.1.5, §20.16"

- id: sip-0051
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "INVITE/200 OK에 담겨, 이후 후속 요청(re-INVITE·BYE 등)을 상대에게 직접 보낼
    주소를 알려주는 헤더는?"
  choices: ["Contact", "Via", "Route", "From"]
  answer: 0
  explain: |
    Contact는 그 UA에 직접 도달할 URI다. REGISTER에서는 AOR에 바인딩할 주소, 다이얼로그
    설정(INVITE/200)에서는 후속 요청의 목적지로 쓰인다. Via(경로 기록)·Route(강제 경로)와
    역할이 다르다.
  ref: "RFC 3261 §20.10"

- id: sip-0052
  type: short
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "SIP UAC가 요청을 만들 때 Max-Forwards의 권장 초기값(정수)은?"
  answer: ["70"]
  explain: |
    RFC 3261은 초기값으로 70을 권장한다. 각 프록시가 1씩 줄이고 0이 되면 483 Too Many
    Hops로 응답한다 — 루프로 인한 무한 전달을 막는 안전장치다(sip-0013).
  ref: "RFC 3261 §8.1.1.6"

- id: sip-0053
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header]
  question: "프록시가 다이얼로그의 이후 요청들도 반드시 자신을 거치게 하려고 초기 요청/응답에
    자신의 URI를 추가하는 헤더는?"
  choices: ["Record-Route", "Route", "Via", "Contact"]
  answer: 0
  explain: |
    프록시는 Record-Route에 자신의 URI를 넣어 경로에 남는다. 그러면 UA들은 이후 요청에
    Route 헤더로 그 경로를 강제한다. Record-Route(경로에 남겠다는 선언) vs Route(그 경로로
    보내라는 지시)를 구분해야 한다.
  ref: "RFC 3261 §16.6, §20.30, §20.34"

- id: sip-0054
  type: ox
  topic: SIP
  difficulty: basic
  tags: [header, concept]
  question: "Via의 branch는 트랜잭션을 식별하고, Call-ID와 양쪽 태그(From/To 태그)는
    다이얼로그를 식별한다."
  answer: true
  explain: |
    맞다. 두 식별 레벨이 다르다: 트랜잭션(요청+그 응답들)은 branch로, 다이얼로그(UA 간 지속
    관계)는 Call-ID+From 태그+To 태그로 식별한다.
  ref: "RFC 3261 §12, §17"

- id: sip-0055
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [concept, method]
  question: "REGISTER 요청을 받아 사용자의 AOR↔현재 위치 바인딩을 위치 서비스(location
    service)에 저장하는 SIP 엔티티는?"
  choices: ["Registrar", "Proxy 서버", "Redirect 서버", "UAC"]
  answer: 0
  explain: |
    Registrar는 REGISTER를 처리해 위치 바인딩을 저장한다. 이후 프록시가 그 위치 정보를
    조회해 요청을 라우팅한다. 등록 접수(Registrar)와 라우팅(Proxy)은 역할이 나뉜다.
  ref: "RFC 3261 §10"

- id: sip-0056
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [concept, response-code]
  question: "요청을 대신 전달하지 않고, 클라이언트에게 '다른 주소로 다시 보내라'며 3xx로 새
    위치를 알려주는 엔티티는?"
  choices: ["Redirect 서버", "Proxy 서버", "Registrar", "UAS"]
  answer: 0
  explain: |
    Redirect 서버는 3xx(예: 302)로 Contact에 새 주소를 담아 응답하고, 재요청은 클라이언트가
    한다. 반면 Proxy는 요청을 자신이 다음 홉으로 전달한다.
  ref: "RFC 3261 §8.1.3.4, §21.3"

- id: sip-0057
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "OPTIONS 메서드의 주 용도는?"
  choices:
    - "상대 UA/서버의 능력(지원 메서드·코덱 등)을 조회"
    - "진행 중인 세션(통화)을 종료하고 자원을 해제"
    - "단말의 현재 접속 위치를 등록 서버에 등록"
    - "상대와 새로운 미디어 세션(통화)을 설정"
  answer: 0
  explain: |
    OPTIONS는 세션을 만들지 않고 상대의 능력을 묻는다. 응답의 Allow/Accept 등에 지원
    메서드·미디어가 담긴다. 도달성 확인(keep-alive) 용도로도 흔히 쓰인다.
  ref: "RFC 3261 §11"

- id: sip-0058
  type: ox
  topic: SIP
  difficulty: basic
  tags: [header, concept]
  question: "요청을 실제로 어디로 보낼지는 To 헤더가 아니라 Request-URI가 결정한다."
  answer: true
  explain: |
    맞다. To는 '논리적 수신자 표시'일 뿐이고, 실제 라우팅 목적지는 Request-URI다. 프록시는
    Request-URI를 보고 다음 홉을 정한다. 둘이 초기엔 같아 보여도 역할이 다르다.
  ref: "RFC 3261 §8.1.1.1"

- id: sip-0059
  type: ox
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "CSeq 순서 번호는 한 다이얼로그 안에서 모든 요청에 걸쳐 동일한 값으로 유지된다."
  answer: false
  explain: |
    아니다. CSeq 순서 번호는 새 요청마다 증가한다(재전송은 예외로 같은 값 유지). 다이얼로그
    내내 고정되는 것은 Call-ID다. Call-ID(고정)와 CSeq(증가)를 혼동하면 안 된다.
  ref: "RFC 3261 §8.1.1.5"

- id: sip-0060
  type: ox
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "Contact 헤더는 REGISTER에서만 쓰이고 INVITE나 200 OK에는 쓰이지 않는다."
  answer: false
  explain: |
    아니다. Contact는 다이얼로그를 만드는 INVITE와 그 200 OK에도 들어가, 이후 후속
    요청(re-INVITE·BYE)의 직접 목적지로 쓰인다. REGISTER 전용이 아니다.
  ref: "RFC 3261 §20.10"

- id: sip-0061
  type: match
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "호가 연결되지 못하고 끝날 때 자주 보는 응답 코드와 그 의미를 짝지어라."
  pairs:
    - {left: "404 Not Found", right: "그 도메인에 해당 사용자가 아예 없음"}
    - {left: "480 Temporarily Unavailable", right: "사용자는 있으나 지금 응대 불가(로그아웃·방해금지 등)"}
    - {left: "486 Busy Here", right: "착신 단말이 다른 통화를 처리 중"}
    - {left: "487 Request Terminated", right: "진행 중이던 요청이 CANCEL·BYE로 중단됨"}
  explain: |
    네 코드 모두 4xx(요청 실패)지만 실패 이유가 다르다. 404는 사용자가 존재하지 않는다는
    확정 정보다. 480은 사용자는 존재하지만 지금 연결할 수 없는 상태 전반을 뜻한다. 486은
    그중 "이 단말이 통화 중"이라는 이유를 구체적으로 알린다. 487은 상대 상태와 무관하게
    발신 측이 CANCEL 등으로 원래 요청을 중단했을 때 그 원래 요청에 대한 최종 응답이다.
  ref: "RFC 3261 §21.4.5, §21.4.18, §21.4.24, §21.4.25"

- id: sip-0062
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "100 Trying은 180 Ringing 같은 다른 잠정 응답과 달리, stateful 프록시가 상류(발신 쪽)로 전달하지 않는다."
  answer: true
  explain: |
    맞다. 100 Trying은 "다음 홉이 요청을 받았다"는 홉 단위 확인이다. 그래서 stateful
    프록시는 하류에서 받은 100을 상류로 넘기지 않는다. 180·183 같은 나머지 잠정 응답은
    즉시 전달한다. 발신자가 받은 100은 첫 홉이 보낸 것일 수 있으므로, 100을 받았다고
    착신 단말까지 도달했다는 뜻은 아니다.
  ref: "RFC 3261 §16.7, §21.1.1"

- id: sip-0063
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header]
  question: |
    다음 INVITE에서 이 요청이 만든 트랜잭션을 식별하는 값은?

    INVITE sip:bob@biloxi.com SIP/2.0
    Via: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8
    Max-Forwards: 70
    To: Bob <sip:bob@biloxi.com>
    From: Alice <sip:alice@atlanta.com>;tag=1928301774
    Call-ID: a84b4c76e66710
    CSeq: 314159 INVITE
    Contact: <sip:alice@pc33.atlanta.com>
    Content-Type: application/sdp
    Content-Length: 142
  choices: ["z9hG4bKnashds8", "a84b4c76e66710", "1928301774", "314159"]
  answer: 0
  explain: |
    Via의 branch 값(z9hG4bK로 시작)이 이 요청이 만든 트랜잭션을 식별한다. a84b4c76e66710은
    Call-ID로, 양쪽 태그와 함께 다이얼로그를 식별한다. 1928301774는 From 태그이고,
    314159는 CSeq 순서 번호다. 메시지는 RFC 3261 예시(Alice가 첫 프록시로 보내는 F1)다.
  ref: "RFC 3261 §8.1.1.7, §24.2"

- id: sip-0064
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header, concept]
  question: |
    다음 INVITE의 To 헤더에 tag가 없는 이유는?

    INVITE sip:bob@biloxi.com SIP/2.0
    Via: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8
    Max-Forwards: 70
    To: Bob <sip:bob@biloxi.com>
    From: Alice <sip:alice@atlanta.com>;tag=1928301774
    Call-ID: a84b4c76e66710
    CSeq: 314159 INVITE
    Contact: <sip:alice@pc33.atlanta.com>
    Content-Type: application/sdp
    Content-Length: 142
  choices:
    - "다이얼로그가 아직 없는 첫 요청이라, To 태그는 착신 측이 응답에 붙이기 때문"
    - "첫 프록시가 요청을 전달하면서 To 태그를 지웠기 때문"
    - "INVITE 요청에는 어떤 경우에도 To 태그를 넣지 않기 때문"
    - "From 태그와 값이 같아서 중복을 피하려고 생략했기 때문"
  answer: 0
  explain: |
    다이얼로그 밖의 요청에는 To 태그를 넣으면 안 된다. To 태그는 착신 UAS가 응답에
    붙이고, 그 값이 다이얼로그 식별자의 일부가 된다. 다이얼로그가 생긴 뒤의 요청
    (re-INVITE·BYE 등)에는 상대 태그를 To에 넣으므로 "INVITE에는 항상 없다"는 틀리다.
    이 메시지는 아직 어떤 프록시도 거치지 않은 F1이다.
  ref: "RFC 3261 §8.1.1.2, §8.2.6.2, §12.2.1.1, §24.2"

# ---------------- 인증 챌린지 흐름 · re-INVITE ----------------

- id: sip-0065
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, header]
  question: "발신자의 INVITE를 첫 프록시가 인증 챌린지로 막은 뒤, 발신자가 자격증명을 넣어 다시 보내 통과하는 흐름을 순서대로 맞춰라."
  direction: false
  items:
    - {msg: "INVITE", from: "발신자", to: "프록시"}
    - {msg: "407 Proxy Authentication Required", from: "프록시", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "프록시"}
    - {msg: "INVITE (Proxy-Authorization 포함)", from: "발신자", to: "프록시"}
    - {msg: "100 Trying", from: "프록시", to: "발신자"}
  decoys:
    - {msg: "401 Unauthorized", from: "프록시", to: "발신자"}
    - {msg: "INVITE (Authorization 포함)", from: "발신자", to: "프록시"}
  explain: |
    프록시는 인증을 요구할 때 401이 아니라 407을 쓴다. 401은 UAS·등록 서버가 쓰는 코드다.
    407은 INVITE에 대한 실패 최종 응답이므로 발신자는 먼저 ACK를 보낸다.
    그다음 발신자는 Proxy-Authorization 헤더에 자격증명을 담아 INVITE를 다시 보낸다.
    Authorization 헤더는 401 챌린지에 답할 때 쓰는 헤더다.
    프록시가 자격증명을 받아들이면 100 Trying을 보내고 요청을 다음 홉으로 넘긴다.
  ref: "RFC 3665 §3.2 (F1~F6); RFC 3261 §22.1, §22.3"

- id: sip-0066
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, method]
  question: "통화 중에 착신자 단말의 IP 주소가 바뀌어, 착신자가 같은 다이얼로그 안에서 세션을 수정하는 흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "re-INVITE (새 SDP)", from: "착신자", to: "발신자"}
    - {msg: "200 OK", from: "발신자", to: "착신자"}
    - {msg: "ACK", from: "착신자", to: "발신자"}
  decoys:
    - {msg: "INVITE (새 Call-ID)", from: "착신자", to: "발신자"}
    - {msg: "BYE", from: "착신자", to: "발신자"}
  explain: |
    확립된 세션의 주소·포트·미디어를 바꿀 때는 같은 다이얼로그 안에서 INVITE를 다시 보낸다.
    이것을 re-INVITE라고 한다.
    re-INVITE는 발신자와 착신자 중 누구든 보낼 수 있다. 여기서는 IP가 바뀐 착신자가 보낸다.
    re-INVITE도 INVITE이므로 200 OK와 ACK의 3단계로 끝난다.
    새 Call-ID로 INVITE를 보내면 기존 세션의 수정이 아니라 별개의 새 통화가 된다.
    BYE는 세션을 끝내는 요청이라 수정에 쓰지 않는다.
  ref: "RFC 3665 §3.7 (F9~F11); RFC 3261 §14, §14.1"

- id: sip-0067
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method, concept]
  question: "RFC 3261에서 이미 확립된 세션의 미디어(주소·포트·코덱 등)를 바꿀 때 보내는 요청은?"
  choices:
    - "같은 다이얼로그 안에서 다시 보내는 INVITE"
    - "새 Call-ID로 시작하는 별도의 INVITE"
    - "같은 다이얼로그 안에서 보내는 OPTIONS"
    - "새 Contact를 담아 보내는 REGISTER"
  answer: 0
  explain: |
    RFC 3261은 다이얼로그 안에서 보내는 INVITE를 re-INVITE라고 부른다.
    re-INVITE에는 바뀐 부분만이 아니라 세션 설명(SDP) 전체를 다시 담는다.
    새 Call-ID로 INVITE를 보내면 새 다이얼로그가 생겨 별개의 통화가 된다.
    OPTIONS는 상대 능력 조회용이고, REGISTER는 등록 서버의 위치 바인딩을 바꾼다.
    둘 다 진행 중인 세션의 미디어를 바꾸지 않는다.
  ref: "RFC 3261 §14, §14.1"

- id: sip-0068
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "re-INVITE는 처음 INVITE를 보낸 발신자만 보낼 수 있다."
  answer: false
  explain: |
    아니다. RFC 3261은 발신자와 착신자 모두 기존 세션을 수정할 수 있다고 정한다.
    예를 들어 RFC 3665 §3.7에서는 IP 주소가 바뀐 착신자(Bob)가 re-INVITE를 보낸다.
  ref: "RFC 3261 §14; RFC 3665 §3.7"

- id: sip-0069
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [method, response-code]
  question: "re-INVITE로 코덱 변경을 제안했는데 상대가 488 Not Acceptable Here로 거절했다. 세션은 어떻게 되는가?"
  choices:
    - "re-INVITE 전의 세션 설정을 그대로 유지한다"
    - "세션이 끊기므로 양쪽이 BYE를 주고받는다"
    - "다이얼로그가 끝나 처음부터 새 INVITE로 다시 건다"
    - "488에 실린 상대 SDP로 세션이 바뀐다"
  answer: 0
  explain: |
    re-INVITE가 2xx가 아닌 최종 응답을 받으면 세션 파라미터는 re-INVITE가 없었던 것처럼
    그대로 남아야 한다(MUST). 그래서 통화는 원래 코덱으로 계속된다.
    488은 이 요청의 세션 설명을 받아들일 수 없다는 뜻이다.
    예외로 481이나 408을 받거나 응답이 아예 없으면 UAC는 다이얼로그를 종료한다.
  ref: "RFC 3261 §14.1, §14.2, §21.4.26"

- id: sip-0070
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code, message-flow]
  question: "같은 다이얼로그에서 양쪽 UA가 거의 동시에 re-INVITE를 보내 서로 엇갈렸다. 자기 INVITE가 진행 중인데 상대 INVITE를 받은 UA가 돌려주는 응답은?"
  choices: ["491 Request Pending", "500 Server Internal Error", "486 Busy Here", "482 Loop Detected"]
  answer: 0
  explain: |
    자기 INVITE가 진행 중인 다이얼로그에서 INVITE를 받으면 UAS는 491을 돌려줘야 한다(MUST).
    이런 엇갈림을 glare라고 한다.
    491을 받은 쪽은 무작위 시간을 기다린 뒤 다시 시도한다.
    Call-ID를 만든 쪽은 2.1~4초, 아닌 쪽은 0~2초 범위에서 고른다.
    500은 다른 경우다. 앞선 INVITE에 최종 응답을 보내기 전에 CSeq가 더 큰 두 번째
    INVITE를 받으면 500과 Retry-After를 보낸다.
  ref: "RFC 3261 §14.1, §14.2, §21.4.27"

- id: sip-0071
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method, concept]
  question: "re-INVITE는 프록시에서 포킹되지 않으므로 최종 응답을 하나만 받는다."
  answer: true
  explain: |
    맞다. 처음 INVITE의 Request-URI는 사용자의 AOR이라 여러 단말로 포킹될 수 있다.
    re-INVITE의 Request-URI는 다이얼로그를 맺은 상대 UA 인스턴스(remote target)를 가리킨다.
    그래서 re-INVITE는 포킹되지 않고 최종 응답도 하나만 생긴다.
  ref: "RFC 3261 §14.1"

# ---------------- 인증 (Digest) ----------------

- id: sip-0072
  type: match
  topic: SIP
  difficulty: basic
  tags: [header]
  question: "SIP 인증에 쓰는 헤더와 그 역할을 짝지어라."
  pairs:
    - {left: "WWW-Authenticate", right: "UAS·등록 서버가 401에 담아 보내는 챌린지"}
    - {left: "Proxy-Authenticate", right: "프록시가 407에 담아 보내는 챌린지"}
    - {left: "Authorization", right: "UAS·등록 서버에게 내미는 단말의 자격증명"}
    - {left: "Proxy-Authorization", right: "프록시에게 내미는 단말의 자격증명"}
  explain: |
    챌린지 헤더와 자격증명 헤더가 짝을 이룬다.
    401에는 WWW-Authenticate가 들어가고, 단말은 Authorization으로 답한다.
    407에는 Proxy-Authenticate가 들어가고, 단말은 Proxy-Authorization으로 답한다.
    이름에 Proxy가 붙으면 프록시 인증이라고 기억하면 된다.
  ref: "RFC 3261 §20.7, §20.27, §20.28, §20.44, §22.2, §22.3"

- id: sip-0073
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header, message-flow]
  question: "첫 INVITE의 CSeq가 '1 INVITE'였고 407을 받았다. 자격증명을 넣어 다시 보내는 INVITE의 CSeq는?"
  choices: ["2 INVITE", "1 INVITE", "1 ACK", "2 ACK"]
  answer: 0
  explain: |
    401이나 407을 받고 자격증명을 넣어 다시 보내는 요청은 새 요청이다.
    그래서 CSeq 번호를 평소처럼 1 올려야 한다(MUST).
    RFC 3665 §3.2 예시도 F1은 CSeq 1 INVITE, F4는 CSeq 2 INVITE다.
    1 ACK는 407을 확인하는 ACK(F3)의 CSeq다. ACK는 확인하는 INVITE와 번호가 같고 메서드만 ACK다.
  ref: "RFC 3261 §22.2; RFC 3665 §3.2"

- id: sip-0074
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method, concept]
  question: "서버는 CANCEL 요청에 401이나 407로 인증 챌린지를 보낼 수 있다."
  answer: false
  explain: |
    아니다. 서버는 CANCEL에 챌린지를 보내면 안 된다(MUST NOT).
    CANCEL은 홉 단위로 처리되어 자격증명을 넣어 다시 보낼 수 없기 때문이다.
    ACK도 응답이 없는 요청이라 챌린지할 수 없다.
    대신 UAC는 INVITE에 넣었던 자격증명을 ACK에 그대로 복사한다.
  ref: "RFC 3261 §22.1"

- id: sip-0075
  type: ox
  topic: SIP
  difficulty: basic
  tags: [header, concept]
  question: "SIP Digest 인증에서 단말은 비밀번호를 그대로 보내지 않고, 비밀번호와 서버가 준 nonce 등으로 계산한 값(response)을 보낸다."
  answer: true
  explain: |
    맞다. 서버는 챌린지마다 새 nonce를 만들어 보낸다.
    단말은 사용자 이름, realm, 비밀번호, nonce, 메서드, URI로 해시를 계산해 response 파라미터에 담는다.
    response는 32자리 16진수이고, 사용자가 비밀번호를 안다는 것을 증명한다.
    SIP는 HTTP Digest(RFC 2617)를 거의 그대로 쓰며, Basic 인증은 금지한다.
  ref: "RFC 3261 §22, §22.4; RFC 2617 §3.2.1, §3.2.2"

- id: sip-0076
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header, concept]
  question: "Digest 챌린지에 stale=true가 들어 있다. 단말은 어떻게 하면 되는가?"
  choices:
    - "비밀번호를 다시 묻지 않고 새 nonce로 계산해 재시도"
    - "비밀번호가 틀렸으니 사용자에게 다시 입력받아 재시도"
    - "realm이 바뀌었으니 다른 계정의 자격증명으로 재시도"
    - "인증이 영구 거부됐으니 같은 요청을 다시 보내지 않음"
  answer: 0
  explain: |
    stale=true는 자격증명은 맞았지만 nonce가 만료됐다는 뜻이다.
    서버는 nonce만 무효이고 그 nonce로 계산한 값은 올바를 때만 stale=true를 붙인다.
    그래서 단말은 사용자에게 다시 묻지 않고 새 nonce로 response를 다시 계산해 보내면 된다.
    stale이 없거나 false면 사용자 이름이나 비밀번호가 틀린 것이다.
  ref: "RFC 2617 §3.2.1; RFC 3261 §22.1"

- id: sip-0077
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [concept]
  question: "RFC 3261 기준으로 SIP Digest 인증이 제공하지 않는 것은?"
  choices:
    - "요청자가 자격증명을 가졌는지 확인"
    - "nonce를 이용한 재전송(replay) 공격 방지"
    - "메시지 내용 암호화(기밀성)"
    - "realm별로 보호 영역을 구분"
  answer: 2
  explain: |
    RFC 3261은 Digest가 메시지 인증과 재전송 방지만 제공한다고 적고 있다.
    메시지 무결성과 기밀성(암호화)은 제공하지 않는다.
    따라서 메시지 변조를 막으려면 TLS 같은 별도 보호 수단이 필요하다.
    SIP에서는 realm 문자열 하나가 보호 영역을 정한다.
  ref: "RFC 3261 §22, §22.1"

# ---------------- 전송 ----------------

- id: sip-0078
  type: short
  topic: SIP
  difficulty: basic
  tags: [transport]
  question: "포트를 적지 않았을 때 SIP over UDP·TCP가 쓰는 기본 포트 번호는?"
  answer: ["5060"]
  explain: |
    UDP, TCP, SCTP의 기본 포트는 5060이다. TLS는 5061을 쓴다.
    Via의 sent-by에 포트가 없으면 전송 프로토콜에 따라 이 기본값을 쓴다.
  ref: "RFC 3261 §18.1.1, §18.2.1"

- id: sip-0079
  type: ox
  topic: SIP
  difficulty: basic
  tags: [transport]
  question: "SIP over TLS도 UDP·TCP와 같은 기본 포트 5060을 쓴다."
  answer: false
  explain: |
    아니다. TLS의 기본 포트는 5061이다.
    5060은 UDP, TCP, SCTP의 기본 포트다.
  ref: "RFC 3261 §18.1.1, §18.2.1"

- id: sip-0080
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [transport]
  question: "경로 MTU를 모르는 상태에서 1300바이트가 넘는 요청을 보내야 한다. UDP로 설정된 UAC는 어떻게 해야 하는가?"
  choices:
    - "TCP처럼 혼잡 제어가 있는 전송으로 바꿔 보낸다"
    - "UDP 그대로 보내고 IP 단편화에 맡긴다"
    - "본문을 잘라 1300바이트 이하로 맞춰 보낸다"
    - "UDP로 보내되 Content-Length를 생략한다"
  answer: 0
  explain: |
    경로 MTU를 모르고 요청이 1300바이트를 넘으면 TCP 같은 혼잡 제어 전송으로 보내야 한다(MUST).
    경로 MTU를 알 때는 요청이 MTU의 200바이트 안쪽까지 커지면 같은 규칙을 적용한다.
    1300은 이더넷 MTU 1500바이트를 가정한 값이다.
    200바이트 여유는 응답에 Record-Route 등이 붙어 요청보다 커질 수 있어서 둔다.
    전송을 바꾸면 맨 위 Via의 전송 값도 바꿔야 한다.
  ref: "RFC 3261 §18.1.1"

- id: sip-0081
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [transport, header]
  question: "서버가 받은 요청의 맨 위 Via sent-by 주소가 실제 패킷 출발지 IP와 다르다. 서버가 그 Via에 추가하는 파라미터는?"
  choices: ["received", "branch", "maddr", "ttl"]
  answer: 0
  explain: |
    sent-by가 도메인 이름이거나 패킷 출발지 IP와 다르면 서버는 Via에 received를 넣어야 한다(MUST).
    received에는 패킷이 실제로 온 출발지 주소가 들어간다.
    UDP 응답은 received 주소로 보낸다. 출발지 IP로 돌려보내야 응답이 요청자에게 닿기 때문이다.
    branch는 트랜잭션 식별자이고, maddr와 ttl은 멀티캐스트 응답용이다.
  ref: "RFC 3261 §18.2.1, §18.2.2"

- id: sip-0082
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [transport, header]
  question: "TCP 같은 스트림 전송에서는 Content-Length 헤더를 반드시 넣어야 한다."
  answer: true
  explain: |
    맞다. TCP는 메시지 경계가 없어서 본문이 어디서 끝나는지 Content-Length로만 알 수 있다.
    그래서 스트림 전송에서는 Content-Length가 필수다(MUST).
    UDP는 패킷 하나가 메시지 하나라서 Content-Length가 없으면 패킷 끝을 본문 끝으로 본다.
  ref: "RFC 3261 §18.3, §20.14"

# ---------------- 트랜잭션 · 다이얼로그 ----------------

- id: sip-0083
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [method, concept]
  question: "INVITE의 2xx에 대한 ACK가 486 같은 비-2xx 응답에 대한 ACK와 다른 점은?"
  choices:
    - "2xx의 ACK는 UAC 코어가 새 트랜잭션으로 상대 UA에게 보낸다"
    - "2xx의 ACK는 INVITE와 다른 새 CSeq 번호를 쓴다"
    - "2xx의 ACK는 프록시가 UAC를 대신해 홉마다 만들어 보낸다"
    - "2xx의 ACK는 UAS가 보낸 2xx 하나에만 한 번 보낸다"
  answer: 0
  explain: |
    비-2xx의 ACK는 INVITE 클라이언트 트랜잭션이 만들고, 같은 트랜잭션의 일부로 홉마다 오간다.
    2xx의 ACK는 UAC 코어가 다이얼로그 안의 요청처럼 만들어 상대 UA까지 종단 간에 보낸다.
    그래서 2xx의 ACK는 INVITE와 다른 새 트랜잭션(새 branch)이 된다.
    두 경우 모두 CSeq 번호는 INVITE와 같고 메서드만 ACK다.
    2xx가 재전송되어 올 때마다 UAC는 ACK도 다시 보낸다.
  ref: "RFC 3261 §13.2.2.4, §17.1.1.3"

- id: sip-0084
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [message-flow, transport]
  question: "INVITE에 대한 2xx 응답은 UAS가 ACK를 받을 때까지 재전송하며, TCP로 보냈더라도 마찬가지다."
  answer: true
  explain: |
    맞다. 2xx를 보내면 INVITE 서버 트랜잭션이 바로 사라진다.
    그래서 UAS 코어가 직접 T1부터 두 배씩, 최대 T2 간격으로 2xx를 재전송한다.
    2xx는 종단 간에 전달되고 중간 홉 어딘가가 UDP일 수 있다. 그래서 UAS의 전송이 TCP여도 재전송한다.
    64×T1 동안 ACK가 오지 않으면 UAS는 BYE로 세션을 끝내야 한다(SHOULD).
  ref: "RFC 3261 §13.3.1.4"

- id: sip-0085
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [concept, response-code]
  question: "INVITE에 대해 To 태그가 붙은 180 Ringing이 왔다. 이 응답으로 생긴 다이얼로그는 어떤 상태인가?"
  choices:
    - "early(초기) 상태"
    - "confirmed(확정) 상태"
    - "다이얼로그가 생기지 않음"
    - "terminated(종료) 상태"
  answer: 0
  explain: |
    INVITE에 대한 2xx와 To 태그가 있는 101~199 응답이 다이얼로그를 만든다.
    잠정 응답으로 만들어진 다이얼로그는 early 상태다.
    이후 2xx가 오면 confirmed 상태로 바뀐다.
    2xx가 아닌 최종 응답이 오거나 응답이 없으면 early 다이얼로그는 끝난다.
  ref: "RFC 3261 §12, §12.1"

- id: sip-0086
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [message-flow, concept]
  question: "프록시가 INVITE를 포킹해 두 단말이 모두 200 OK를 보냈다. UAC는 어떻게 처리하는가?"
  choices:
    - "To 태그가 다른 두 다이얼로그로 보고 각각 ACK를 보낸다"
    - "먼저 온 200 OK에만 ACK를 보내고 나머지는 무시한다"
    - "두 200 OK를 같은 다이얼로그로 보고 ACK를 한 번 보낸다"
    - "나중에 온 200 OK에는 ACK 대신 CANCEL을 보낸다"
  answer: 0
  explain: |
    포킹 때문에 INVITE 하나에 2xx가 여러 개 올 수 있다.
    각 2xx는 To 태그로 구분되고, 각각 별개의 다이얼로그가 된다.
    UAC 코어는 받은 2xx마다 ACK를 만들어 보내야 한다(MUST).
    CANCEL은 최종 응답이 오기 전의 요청을 취소할 때만 의미가 있다.
  ref: "RFC 3261 §13.2.2.4"

- id: sip-0087
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [message-flow, concept]
  question: "SDP 없이 INVITE를 보냈더니 착신자가 200 OK에 SDP(offer)를 담아 보냈다. 발신자의 answer는 어디에 담는가?"
  choices: ["ACK", "새 INVITE", "BYE", "PRACK"]
  answer: 0
  explain: |
    RFC 3261만 따르는 UA는 offer/answer를 두 방식으로 주고받는다.
    INVITE에 offer를 넣고 2xx에 answer를 넣거나, 2xx에 offer를 넣고 ACK에 answer를 넣는다.
    INVITE에 SDP가 없으면 UAS는 2xx에 offer를 넣어야 하고, UAC는 ACK에 answer를 넣어야 한다(MUST).
    PRACK은 RFC 3262의 확장이라 RFC 3261 기본 흐름에 없다.
  ref: "RFC 3261 §13.2.1, §13.2.2.4, §13.3.1.4"

- id: sip-0088
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [message-flow, response-code]
  question: "INVITE를 보냈지만 Timer B가 만료될 때까지 아무 응답이 없다. UAC는 어떤 응답을 받은 것처럼 처리하는가?"
  choices: ["408 Request Timeout", "503 Service Unavailable", "480 Temporarily Unavailable", "504 Server Time-out"]
  answer: 0
  explain: |
    트랜잭션 계층이 타임아웃을 알리면 UAC는 408을 받은 것처럼 처리해야 한다(MUST).
    Timer B는 INVITE 트랜잭션 타임아웃이고 기본값은 64×T1(32초)이다.
    UDP의 ICMP 오류나 TCP 연결 실패 같은 전송 오류는 503으로 처리한다는 점과 구분한다.
    504는 서버가 하류 서버의 응답을 제때 받지 못했을 때 실제로 보내는 응답이다.
  ref: "RFC 3261 §8.1.3.1, §17.1.1.2"

- id: sip-0089
  type: short
  topic: SIP
  difficulty: advanced
  tags: [transport, concept]
  question: "SIP 타이머의 기준값 T1(RTT 추정값)의 기본값은 몇 ms인가? (숫자만)"
  answer: ["500"]
  explain: |
    T1의 기본값은 500ms다. 다른 타이머 상당수가 T1을 기준으로 정해진다.
    Timer A(UDP INVITE 재전송 간격)는 T1에서 시작해 두 배씩 늘어난다.
    Timer B(INVITE 트랜잭션 타임아웃)는 64×T1, 즉 32초다.
    T2(비-INVITE 재전송 최대 간격)는 4초다.
  ref: "RFC 3261 §17.1.1.1, Appendix A (Table 4)"

- id: sip-0090
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code, method]
  question: "UAS가 받은 BYE가 자신이 가진 어떤 다이얼로그와도 맞지 않는다. UAS가 보내는 응답은?"
  choices: ["481 Call/Transaction Does Not Exist", "480 Temporarily Unavailable", "487 Request Terminated", "408 Request Timeout"]
  answer: 0
  explain: |
    BYE가 기존 다이얼로그와 맞지 않으면 UAS는 481을 보내야 한다(SHOULD).
    그래서 태그 없이 보낸 BYE는 거절된다. RFC 2543과 달라진 점이다.
    480은 사용자가 지금 응대할 수 없을 때, 487은 원래 요청이 취소됐을 때 쓴다.
  ref: "RFC 3261 §15.1.2, §21.4.19"

- id: sip-0091
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method, concept]
  question: "stateful 프록시는 CANCEL을 받으면 하류의 응답을 기다리지 않고 직접 200 OK로 응답한다."
  answer: true
  explain: |
    맞다. stateful 프록시는 하류 응답을 전달하지 않고 CANCEL에 직접 응답한다.
    그래서 CANCEL을 홉 단위(hop-by-hop) 요청이라고 부른다.
    프록시는 이어서 자신이 하류로 보낸 INVITE에 대해 새 CANCEL을 만들어 보낸다.
  ref: "RFC 3261 §9, §16.10"

- id: sip-0092
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method, concept]
  question: "착신자는 200 OK를 보내기 전 early 다이얼로그 상태에서도 BYE를 보내 통화를 끊을 수 있다."
  answer: false
  explain: |
    아니다. 착신자의 UA는 early 다이얼로그에서 BYE를 보내면 안 된다(MUST NOT).
    발신자의 UA는 early 다이얼로그와 confirmed 다이얼로그 모두에서 BYE를 보낼 수 있다.
    착신자는 confirmed 다이얼로그에서도 자기 2xx에 대한 ACK를 받거나 서버 트랜잭션이 타임아웃된 뒤에 BYE를 보낸다.
    받기 전에 통화를 거절하려는 착신자는 BYE 대신 486·603 같은 최종 응답을 보낸다.
  ref: "RFC 3261 §15, §21.4.24, §21.6.2"

# ---------------- 원문 메시지 (RFC 3261 §24.2 예시) ----------------

- id: sip-0093
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [header, concept]
  question: |
    다음 180 Ringing에서 처음 나타나, Call-ID·From 태그와 함께 다이얼로그를 식별하게 되는 값은?

    SIP/2.0 180 Ringing
    Via: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8
     ;received=192.0.2.1
    To: Bob <sip:bob@biloxi.com>;tag=a6c85cf
    From: Alice <sip:alice@atlanta.com>;tag=1928301774
    Call-ID: a84b4c76e66710
    Contact: <sip:bob@192.0.2.4>
    CSeq: 314159 INVITE
    Content-Length: 0
  choices: ["a6c85cf", "1928301774", "z9hG4bKnashds8", "192.0.2.1"]
  answer: 0
  explain: |
    a6c85cf는 Bob의 UAS가 응답에 붙인 To 태그다. INVITE에는 To 태그가 없었다.
    다이얼로그는 Call-ID, From 태그, To 태그의 조합으로 식별된다.
    1928301774는 Alice가 INVITE에 이미 넣은 From 태그다.
    z9hG4bKnashds8은 트랜잭션을 식별하는 branch이고, 192.0.2.1은 첫 프록시가 기록한 received 주소다.
    이 메시지는 RFC 3261 예시의 F8(첫 프록시 → Alice)이다.
  ref: "RFC 3261 §12, §12.1, §24.2"

- id: sip-0094
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header, method]
  question: |
    Alice가 200 OK를 받고 보낸 ACK다. 처음 INVITE의 branch는 z9hG4bKnashds8이었다. 이 ACK의 branch가 다른 이유는?

    ACK sip:bob@192.0.2.4 SIP/2.0
    Via: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds9
    Max-Forwards: 70
    To: Bob <sip:bob@biloxi.com>;tag=a6c85cf
    From: Alice <sip:alice@atlanta.com>;tag=1928301774
    Call-ID: a84b4c76e66710
    CSeq: 314159 ACK
    Content-Length: 0
  choices:
    - "2xx에 대한 ACK는 INVITE와 별개인 새 트랜잭션이기 때문"
    - "프록시가 전달하면서 branch 값을 새로 바꿨기 때문"
    - "ACK의 CSeq 메서드가 INVITE에서 ACK로 바뀌었기 때문"
    - "200 OK가 재전송되어 두 번째로 보낸 ACK이기 때문"
  answer: 0
  explain: |
    2xx에 대한 ACK는 UAC 코어가 다이얼로그 안의 요청처럼 새로 만든다. 그래서 새 트랜잭션이 되고 branch도 새 값이다.
    반대로 486 같은 비-2xx에 대한 ACK는 INVITE와 같은 트랜잭션이라 맨 위 Via(branch 포함)가 INVITE와 같다.
    CSeq 번호는 두 경우 모두 INVITE와 같은 314159이고 메서드만 ACK다.
    Request-URI가 Bob의 Contact(192.0.2.4)로 바뀐 것도 이 ACK가 다이얼로그 안의 요청이기 때문이다.
  ref: "RFC 3261 §13.2.2.4, §17.1.1.3, §24.2"

- id: sip-0095
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [header, concept]
  question: |
    통화를 마치고 Bob이 보낸 BYE다. Alice의 INVITE는 'CSeq: 314159 INVITE'였다. 이 BYE의 CSeq가 231인 이유는?

    BYE sip:alice@pc33.atlanta.com SIP/2.0
    Via: SIP/2.0/UDP 192.0.2.4;branch=z9hG4bKnashds10
    Max-Forwards: 70
    From: Bob <sip:bob@biloxi.com>;tag=a6c85cf
    To: Alice <sip:alice@atlanta.com>;tag=1928301774
    Call-ID: a84b4c76e66710
    CSeq: 231 BYE
    Content-Length: 0
  choices:
    - "CSeq 번호는 방향마다 따로 있고 Bob은 자기 번호를 쓰기 때문"
    - "BYE는 새 트랜잭션이라 CSeq 번호를 무작위로 새로 고르기 때문"
    - "중간 프록시가 BYE를 전달하면서 CSeq 번호를 다시 매겼기 때문"
    - "ACK가 번호를 쓰고 난 뒤 Bob이 번호를 처음부터 시작하기 때문"
  answer: 0
  explain: |
    다이얼로그의 CSeq 번호는 방향마다 따로 관리된다. 각 UA는 자기 요청에 자기 번호를 1씩 올려 쓴다.
    Bob은 이 다이얼로그에서 처음 요청을 보내므로 자기 초기값 231을 썼다.
    Bob이 보내는 요청이라 From은 Bob, To는 Alice로 바뀌었다. 태그도 함께 바뀐다.
    Call-ID는 다이얼로그 내내 같다.
  ref: "RFC 3261 §12.2.1.1, §24.2"
