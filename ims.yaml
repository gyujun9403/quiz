# IMS end-to-end 절차 서사 (SIP + Diameter 통합). 실제 이벤트별 "전체 흐름" 암기용.
# steps 타입: 각 단계는 {from, to, act} 화살표. 워크스루에서 매 단계 대상(from→to)과
# 동작(act)을 각각 후보에서 고르면 시퀀스 다이어그램에 화살표가 그려지며 쌓인다.
# actors: lifeline(레인) 좌→우 순서 고정. decoy는 다른 시나리오의 {from,to,act}(주로
# 커맨드)로 오답 보기 풀을 채운다(그려지진 않음).
# 흐름/역할은 3GPP TS 24.229(IMS SIP 절차)·TS 29.228(Cx)에 대조. 커맨드 쌍(예: UAR/UAA)은
# 화살표 하나로 압축 표기하고, 내부 처리(iFC 등)·릴레이 세부는 explain에 둔다.

- id: ims-0001
  type: steps
  topic: IMS
  difficulty: basic
  tags: [message-flow, concept]
  question: "단말이 IMS에 처음 등록될 때(핸드폰이 IMS에 올라올 때)의 전체 절차를, 각 단계의
    대상(누가→누구)과 동작을 골라 순서대로 완성하라."
  actors: ["UE", "P-CSCF", "I-CSCF", "S-CSCF", "HSS"]
  steps:
    - {from: "UE", to: "P-CSCF", act: "REGISTER"}
    - {from: "P-CSCF", to: "I-CSCF", act: "REGISTER"}
    - {from: "I-CSCF", to: "HSS", act: "UAR/UAA", rt: true}
    - {from: "I-CSCF", to: "S-CSCF", act: "REGISTER"}
    - {from: "S-CSCF", to: "HSS", act: "MAR/MAA", rt: true}
    - {from: "S-CSCF", to: "UE", act: "401 챌린지"}
    - {from: "UE", to: "S-CSCF", act: "재-REGISTER"}
    - {from: "S-CSCF", to: "HSS", act: "SAR/SAA", rt: true}
    - {from: "S-CSCF", to: "UE", act: "200 OK"}
  decoys:
    - {from: "I-CSCF", to: "HSS", act: "LIR/LIA"}
    - {from: "P-CSCF", to: "PCRF", act: "AAR/AAA"}
  glossary:
    "REGISTER": "SIP REGISTER · 단말이 자신의 현재 위치(Contact)를 등록"
    "UAR/UAA": "User-Authorization-Request/Answer · Cx · I-CSCF가 등록 인가받고 배정할 S-CSCF를 HSS에서 확인"
    "MAR/MAA": "Multimedia-Auth-Request/Answer · Cx · S-CSCF가 HSS에서 인증 벡터(AV)를 받아 401 챌린지"
    "401 챌린지": "SIP 401 Unauthorized · S-CSCF가 인증 챌린지(RAND/AUTN 등)를 발행"
    "재-REGISTER": "SIP REGISTER 재전송 · 401에 자격증명(RES) 담아 재등록"
    "SAR/SAA": "Server-Assignment-Request/Answer · Cx · S-CSCF가 자신을 사용자에 할당하고 프로필 다운로드"
    "200 OK": "SIP 200 OK · 등록 성공 확인"
    "LIR/LIA": "Location-Info-Request/Answer · Cx · 착신 시 I-CSCF가 서빙 S-CSCF를 HSS에 조회(등록 아님)"
    "AAR/AAA": "AA-Request/Answer · Rx · P-CSCF가 PCRF에 미디어 자원 인가 요청(세션용, 등록 아님)"
  explain: |
    등록은 SIP REGISTER 릴레이(UE→P-CSCF→I-CSCF→S-CSCF)에 Cx가 세 번 맞물린다:
    I-CSCF의 UAR/UAA(S-CSCF 선택) → S-CSCF의 MAR/MAA(인증 벡터→401 챌린지) → 재등록 후
    S-CSCF의 SAR/SAA(서버 할당·프로필). 대상 축에서 UAR는 I-CSCF↔HSS, MAR·SAR는
    S-CSCF↔HSS라는 점이 핵심. LIR/LIA(착신)·AAR/AAA(Rx 미디어)는 등록에 없어 decoy다.
    (401/200은 실제로는 I-CSCF·P-CSCF를 거쳐 UE로 가지만 여기선 S-CSCF↔UE로 압축.)
  ref: "3GPP TS 24.229; TS 29.228 (등록 흐름)"

- id: ims-0002
  type: steps
  topic: IMS
  difficulty: basic
  tags: [message-flow, concept]
  question: "다른 사람이 이 IMS 가입자에게 전화를 걸었을 때(착신, terminating)의 전체 절차를,
    각 단계의 대상과 동작을 골라 순서대로 완성하라."
  actors: ["발신자", "I-CSCF", "HSS", "S-CSCF", "UE"]
  steps:
    - {from: "발신자", to: "I-CSCF", act: "INVITE"}
    - {from: "I-CSCF", to: "HSS", act: "LIR/LIA", rt: true}
    - {from: "I-CSCF", to: "S-CSCF", act: "INVITE"}
    - {from: "S-CSCF", to: "UE", act: "INVITE"}
    - {from: "UE", to: "발신자", act: "180/200/ACK"}
  decoys:
    - {from: "I-CSCF", to: "HSS", act: "UAR/UAA"}
    - {from: "S-CSCF", to: "HSS", act: "SAR/SAA"}
  glossary:
    "INVITE": "SIP INVITE · 세션(통화) 설정 요청"
    "LIR/LIA": "Location-Info-Request/Answer · Cx · I-CSCF가 서빙 S-CSCF 이름을 HSS에 조회"
    "180/200/ACK": "SIP 180 Ringing→200 OK→ACK · 호 설정 완료(벨→응답→확인)"
    "UAR/UAA": "User-Authorization-Request/Answer · Cx · 등록 인가·S-CSCF 선택(착신 아님)"
    "SAR/SAA": "Server-Assignment-Request/Answer · Cx · 서버 할당·프로필(등록 마무리, 착신 아님)"
  explain: |
    착신망의 진입점 I-CSCF가 INVITE를 받으면 서빙 S-CSCF를 모르므로 LIR/LIA로 HSS에
    조회해 라우팅한다. S-CSCF가 착신 서비스(iFC)를 적용해 UE로 전달하고 호가 설정된다.
    UAR·SAR는 "등록" 커맨드라 착신엔 없어 decoy. 착신 조회 LIR와 등록 인가 UAR가 둘 다
    I-CSCF↔HSS라 대상만으론 못 가리고 동작으로 구분해야 한다. (P-CSCF 릴레이·미디어
    인가(Rx AAR)는 이 다이어그램에선 생략 — S-CSCF↔UE로 압축.)
  ref: "3GPP TS 24.229; TS 29.228 (착신 흐름)"

- id: ims-0003
  type: steps
  topic: IMS
  difficulty: advanced
  tags: [message-flow, concept]
  question: "등록을 마친 IMS 가입자가 전화를 걸 때(발신, originating)의 전체 절차를, 각 단계의
    대상과 동작을 골라 순서대로 완성하라."
  actors: ["UE", "P-CSCF", "PCRF", "S-CSCF", "상대망"]
  steps:
    - {from: "UE", to: "P-CSCF", act: "INVITE"}
    - {from: "P-CSCF", to: "S-CSCF", act: "INVITE"}
    - {from: "S-CSCF", to: "상대망", act: "INVITE"}
    - {from: "P-CSCF", to: "PCRF", act: "AAR/AAA", rt: true}
    - {from: "상대망", to: "UE", act: "180/200/ACK"}
  decoys:
    - {from: "I-CSCF", to: "HSS", act: "LIR/LIA"}
    - {from: "S-CSCF", to: "HSS", act: "MAR/MAA"}
  glossary:
    "INVITE": "SIP INVITE · 세션(통화) 설정 요청"
    "AAR/AAA": "AA-Request/Answer · Rx · P-CSCF(AF)가 PCRF에 미디어 정보 전달·자원 인가 요청"
    "180/200/ACK": "SIP 180 Ringing→200 OK→ACK · 호 설정 완료(벨→응답→확인)"
    "LIR/LIA": "Location-Info-Request/Answer · Cx · 착신 시 서빙 S-CSCF 조회(발신 아님)"
    "MAR/MAA": "Multimedia-Auth-Request/Answer · Cx · 등록 시 인증 벡터(발신 아님)"
  explain: |
    발신은 P-CSCF가 등록 때 받은 Service-Route를 따라 사용자의 S-CSCF로 INVITE를 보내는
    것이 출발점이다. S-CSCF가 발신 서비스(iFC)를 적용해 상대망으로 라우팅하고, 미디어는
    Rx의 AAR/AAA로 P-CSCF↔PCRF에서 인가된다(프리컨디션이면 알림 전 자원 확보). LIR(착신
    라우팅)·MAR(등록 인증)는 발신엔 없어 decoy. 2번째 INVITE는 등록 때 받은 Service-Route
    경로라는 점이 발신의 출발 포인트다.
  ref: "3GPP TS 24.229 (발신 흐름); TS 29.214 (Rx)"

- id: ims-0004
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "단말의 첫 SIP 접점(Gm 인터페이스)이며, 로밍 시 방문망에 위치하고 미디어 정책을
    위해 PCRF와 Rx로 연동하는 IMS 노드는?"
  choices: ["P-CSCF", "I-CSCF", "S-CSCF", "HSS"]
  answer: 0
  explain: |
    P-CSCF(Proxy-CSCF)는 UE의 첫 접점으로 Gm 구간을 담당한다. 로밍이면 방문망에 있고,
    미디어 자원 인가를 위해 PCRF와 Rx(AAR 등)로 연동한다.
  ref: "3GPP TS 23.228 (CSCF 기능)"

- id: ims-0005
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "홈망의 진입점(entry point)으로, HSS에 Cx로 조회해 사용자를 담당할 S-CSCF를 찾아
    라우팅하고 토폴로지 은닉을 할 수 있는 노드는?"
  choices: ["I-CSCF", "P-CSCF", "S-CSCF", "AS"]
  answer: 0
  explain: |
    I-CSCF(Interrogating-CSCF)는 외부에서 들어오는 요청의 홈망 진입점이다. Cx로 HSS에
    물어(UAR/LIR) S-CSCF를 정하고, 필요시 토폴로지 은닉(THIG)도 한다.
  ref: "3GPP TS 23.228 (CSCF 기능)"

- id: ims-0006
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "등록 시 레지스트라 역할을 하고, 세션 제어와 iFC 기반 서비스 트리거·사용자 프로필
    보유를 담당하며 항상 홈망에 상주하는 노드는?"
  choices: ["S-CSCF", "P-CSCF", "I-CSCF", "HSS"]
  answer: 0
  explain: |
    S-CSCF(Serving-CSCF)는 IMS의 핵심 세션 제어 노드다. 등록을 처리(레지스트라)하고 HSS에서
    프로필을 받아(SAR/SAA) iFC로 AS를 트리거한다. 항상 홈망에 있다.
  ref: "3GPP TS 23.228 (CSCF 기능)"

- id: ims-0007
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "가입자 마스터 DB로서 가입 정보·인증 데이터(인증 벡터)·서비스 프로필·S-CSCF 할당
    정보를 보관하는 노드는?"
  choices: ["HSS", "S-CSCF", "P-CSCF", "PCRF"]
  answer: 0
  explain: |
    HSS(Home Subscriber Server)는 사용자별 마스터 DB다. 인증 벡터·서비스 프로필·어느
    S-CSCF가 담당하는지 등을 갖고 Cx/Sh로 CSCF·AS에 제공한다.
  ref: "3GPP TS 23.228 (HSS)"

- id: ims-0008
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "S-CSCF가 iFC 판정에 따라 세션을 넘겨 실제 서비스 로직(착신전환·통화녹음 등)을
    실행하는 노드와, 그 사이 인터페이스가 옳게 짝지어진 것은?"
  choices:
    - "AS — ISC"
    - "P-CSCF — Gm"
    - "HSS — Cx"
    - "PCRF — Rx"
  answer: 0
  explain: |
    서비스 로직은 AS(Application Server)가 실행하고, S-CSCF↔AS 구간은 ISC 레퍼런스
    포인트다. AS는 가입자 데이터가 필요하면 Sh로 HSS와 통신한다.
  ref: "3GPP TS 23.228 (ISC/AS)"

- id: ims-0009
  type: ox
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "S-CSCF는 항상 사용자의 홈망에 위치하며, I-CSCF는 주로 등록과 착신 라우팅 시 HSS
    조회를 위해 관여한다."
  answer: true
  explain: |
    맞다. S-CSCF는 홈망 상주 세션 제어 노드이고, I-CSCF는 홈망 진입점으로 등록(UAR)·착신
    (LIR) 때 HSS에 물어 S-CSCF를 찾는 역할이 주다.
  ref: "3GPP TS 23.228 (CSCF 기능)"

- id: ims-0010
  type: ox
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "P-CSCF가 그 사용자를 담당할 S-CSCF를 직접 선택한다."
  answer: false
  explain: |
    아니다. S-CSCF 선택은 I-CSCF가 HSS 조회(UAR/UAA)로 정한다. P-CSCF는 단말의 첫 접점
    이자 SIP 프록시일 뿐, S-CSCF를 고르지 않는다.
  ref: "3GPP TS 23.228 (등록 절차)"

- id: ims-0011
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "IMS 등록·인증에 쓰이고 ISIM에 저장되며 통화 상대에게 노출되지 않는, NAI
    (user@realm) 형식의 사설 식별자는?"
  choices: ["IMPI (사설 식별자)", "IMPU (공개 식별자)", "IMSI", "GRUU"]
  answer: 0
  explain: |
    IMPI(IMS Private Identity)는 홈 사업자가 부여하는 인증/등록용 사설 식별자로 NAI
    형식이며 ISIM에 저장된다. 통화 상대에게 노출되는 것은 IMPU다.
  ref: "3GPP TS 23.228 (사용자 식별자)"

- id: ims-0012
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "다른 사용자가 이 사용자에게 도달할 때 쓰는 sip:/tel: URI 형식의 공개 식별자
    (한 가입에 여러 개 가능)는?"
  choices: ["IMPU (공개 식별자)", "IMPI (사설 식별자)", "IMEI", "Call-ID"]
  answer: 0
  explain: |
    IMPU(IMS Public Identity)는 남들이 나에게 연결할 때 쓰는 공개 주소(sip:/tel:)로, 한
    가입에 여러 개를 둘 수 있다(업무용/개인용 등). 인증용 사설 식별자는 IMPI다.
  ref: "3GPP TS 23.228 (사용자 식별자)"

- id: ims-0013
  type: ox
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "IMPU(공개 식별자)는 한 가입자당 정확히 하나만 존재한다."
  answer: false
  explain: |
    아니다. IMPU는 한 가입에 여러 개를 둘 수 있다(예: 업무용/개인용 번호). 인증에 쓰이는
    IMPI와 도달에 쓰이는 IMPU를 구분하는 게 핵심이다.
  ref: "3GPP TS 23.228 (사용자 식별자)"

- id: ims-0014
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "UE와 P-CSCF 사이의 SIP 레퍼런스 포인트(단말-망 접점) 이름은?"
  choices: ["Gm", "Mw", "Cx", "ISC"]
  answer: 0
  explain: |
    Gm은 UE↔P-CSCF 구간이다. CSCF들 사이는 Mw, CSCF↔HSS는 Cx, S-CSCF↔AS는 ISC로
    구간마다 이름이 정해져 있다.
  ref: "3GPP TS 23.228 (레퍼런스 포인트)"

- id: ims-0015
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "S-CSCF와 Application Server(AS) 사이의 레퍼런스 포인트는?"
  choices: ["ISC", "Cx", "Sh", "Rx"]
  answer: 0
  explain: |
    ISC(IMS Service Control)는 S-CSCF↔AS 구간으로, iFC에 걸리면 이 경로로 세션을 AS에
    넘긴다. Cx(CSCF↔HSS)·Sh(AS↔HSS)·Rx(P-CSCF↔PCRF)와 구분한다.
  ref: "3GPP TS 23.228 (레퍼런스 포인트)"

- id: ims-0016
  type: mcq
  topic: IMS
  difficulty: basic
  tags: [concept, command-code]
  question: "UAR/MAR/SAR/LIR(등록·인증·서버할당·착신조회)가 오가는, CSCF와 HSS 사이의
    레퍼런스 포인트는?"
  choices: ["Cx", "Gm", "Mw", "ISC"]
  answer: 0
  explain: |
    Cx는 I/S-CSCF↔HSS 구간으로 등록 인가(UAR)·인증(MAR)·서버 할당(SAR)·착신 조회(LIR)를
    나른다(diam-0001~). 같은 HSS라도 AS와의 구간은 Sh다.
  ref: "3GPP TS 23.228 (레퍼런스 포인트); TS 29.228"

- id: ims-0017
  type: ox
  topic: IMS
  difficulty: basic
  tags: [concept]
  question: "P-CSCF·I-CSCF·S-CSCF 등 CSCF들 사이의 SIP 구간은 Mw 레퍼런스 포인트다."
  answer: true
  explain: |
    맞다. CSCF 간 SIP 구간은 Mw다. UE↔P-CSCF는 Gm, CSCF↔HSS는 Cx로, 같은 SIP라도
    구간마다 레퍼런스 포인트 이름이 다르다.
  ref: "3GPP TS 23.228 (레퍼런스 포인트)"
