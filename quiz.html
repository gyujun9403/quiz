<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIP/Diameter 퀴즈</title>
<style>
  /* 색은 모두 토큰. 라이트가 기본, 다크는 OS 설정(prefers-color-scheme)이나 claude.ai 뷰어의
     테마 선택(data-theme)을 따른다. 뷰어에서 라이트를 고르면 OS가 다크여도 라이트로 보인다. */
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --fg: #1c1c1e;
    --card: #ffffff;
    --border: #d8d8dc;
    --muted: #6e6e73;
    --accent: #0a66c2;
    --accent-bg: #e6f0fa;
    --good-bg: #e4f7e9;
    --good-fg: #157a3d;
    --bad-bg: #fdeaea;
    --bad-fg: #b3221a;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214;
      --fg: #f2f2f4;
      --card: #1e1e21;
      --border: #3a3a3d;
      --muted: #9a9a9e;
      --accent: #4da3ff;
      --accent-bg: #142943;
      --good-bg: #123a20;
      --good-fg: #6fdb92;
      --bad-bg: #3a1414;
      --bad-fg: #ff8f87;
      --on-accent: #0b1a2b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214;
    --fg: #f2f2f4;
    --card: #1e1e21;
    --border: #3a3a3d;
    --muted: #9a9a9e;
    --accent: #4da3ff;
    --accent-bg: #142943;
    --good-bg: #123a20;
    --good-fg: #6fdb92;
    --bad-bg: #3a1414;
    --bad-fg: #ff8f87;
    --on-accent: #0b1a2b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* hidden 속성은 클래스의 display 지정보다 우선한다(claude.ai 게시 뼈대와 같은 규칙) */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    padding: 10px;
    padding-bottom: 36px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
  }
  .badges { margin-bottom: 10px; }
  .badge.id { font-family: ui-monospace, "SF Mono", Menlo, monospace; border-style: dashed; }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    margin-right: 6px;
  }
  .question {
    font-size: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-family: inherit;
    margin: 0 0 16px;
  }
  .question.raw {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    background: var(--bg);
    padding: 10px;
    border-radius: 8px;
  }
  #answer-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .step-note {
    font-size: 12px;
    line-height: 1.45;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .step-note .full { color: var(--muted); margin-top: 2px; }
  .step-note .miss { color: var(--bad-fg); margin-top: 3px; }
  .step-note .ok { color: var(--good-fg); font-weight: 700; }
  .order-label {
    font-size: 12px;
    color: var(--muted);
  }
  .order-pool {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    padding: 1px;
  }
  .order-answer {
    min-height: 44px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 10px 4px;
    background: var(--bg);
  }
  .order-placeholder {
    color: var(--muted);
    font-size: 14px;
    padding: 8px 2px 2px;
  }
  .order-tools { display: flex; justify-content: flex-end; gap: 14px; }
  .order-tools[hidden] { display: none; }
  .order-reset {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    text-align: right;
    padding: 4px;
    cursor: pointer;
  }
  button.opt {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 16px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.opt:active { opacity: 0.7; }
  button.opt.chip {
    display: inline-block;
    width: auto;
    padding: 9px 12px;
    font-size: 14px;
  }
  button.opt.chip.sel { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.opt.correct { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-fg); }
  button.opt.wrong { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-fg); }
  button.opt:disabled { cursor: default; opacity: 1; }
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  button.opt.match-item { font-size: 14px; padding: 10px; }
  button.opt.match-item.linked { background: var(--accent-bg); }
  button.opt.match-item.sel { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .ox-row { display: flex; gap: 10px; }
  .ox-row button.opt { text-align: center; font-size: 22px; font-weight: 600; padding: 20px; }
  input[type=text] {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 10px;
  }
  .primary {
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
  }
  .primary:disabled { opacity: 0.4; }
  .secondary {
    width: 100%;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .feedback {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .feedback .verdict { font-weight: 700; margin-bottom: 8px; }
  .feedback .verdict.correct { color: var(--good-fg); }
  .feedback .verdict.wrong { color: var(--bad-fg); }
  .feedback .verdict.pass { color: var(--muted); }
  .feedback .verdict.partial { color: var(--accent); }
  /* 주관식(Claude 채점) */
  .open-input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--fg);
    resize: vertical;
    margin-bottom: 8px;
  }
  .open-status { font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  .open-cancel { display: block; margin: 10px auto 0; }
  .open-claude { margin-top: 8px; color: var(--accent); border-color: var(--accent); }
  .my-answer {
    white-space: pre-wrap;
    line-height: 1.55;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .model-answer { line-height: 1.65; margin-bottom: 12px; }
  .model-answer p { margin: 0 0 6px; }
  .point-list { margin: 0 0 8px; padding-left: 20px; line-height: 1.6; }
  .point-check { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .point-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    line-height: 1.5;
    cursor: pointer;
  }
  .point-row input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
  .point-row:has(input:checked) { background: var(--good-bg); border-color: var(--good-fg); }
  .grade-box { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; line-height: 1.55; }
  .grade-box.correct { background: var(--good-bg); }
  .grade-box.partial { background: var(--accent-bg); }
  .grade-box.wrong { background: var(--bad-bg); }
  .grade-head { font-weight: 700; margin-bottom: 4px; }
  .term-link { border-bottom: 1px dotted var(--accent); cursor: pointer; }
  .term-pop {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.55;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    z-index: 12;
  }
  .term-pop-head { font-weight: 700; margin-bottom: 4px; }
  .term-pop .term-full { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .term-pop .term-ref { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .feedback .explain { white-space: pre-wrap; line-height: 1.5; margin: 0 0 10px; }
  .feedback .ref { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .diagram-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
  .diagram { position: relative; margin: 2px 0 8px; font-size: 13px; }
  .diagram-header { position: relative; height: 28px; }
  .diagram-actor {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--fg);
  }
  .diagram-body { position: relative; margin-top: 6px; padding-bottom: 8px; }
  .diagram-lifeline {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px dashed var(--muted);
  }
  /* 행은 위에서부터 쌓인다(라벨 → 화살표). position: relative라서 점선 lifeline 위에 그려진다 */
  .diagram-row { position: relative; padding: 8px 0 10px; }
  .diagram-msg {
    position: relative;
    box-sizing: border-box;
    line-height: 1.3;
    text-align: center;
    color: var(--muted);
    background: var(--card);
    padding: 0 4px;
    margin-bottom: 5px;
  }
  .diagram-line {
    position: relative;
    height: 1px;
    background: var(--fg);
  }
  .diagram-line::after {
    content: "▶";
    position: absolute;
    top: -6px;
    right: -2px;
    font-size: 12px;
    line-height: 1;
  }
  .diagram-line.rev::after {
    content: "◀";
    right: auto;
    left: -2px;
  }
  .diagram-row.tappable { cursor: pointer; }
  .diagram-row.tappable .diagram-msg { color: var(--accent); }
  .diagram-row.tappable .diagram-line { background: var(--accent); }
  .diagram-row.tappable .diagram-line::after { color: var(--accent); }
  .diagram-row.tappable:active .diagram-msg,
  .diagram-row.tappable:active .diagram-line { opacity: 0.5; }
  .diagram-row.hl .diagram-msg { color: var(--good-fg); font-weight: 700; }
  .diagram-row.hl .diagram-line { background: var(--good-fg); height: 2px; }
  .diagram-row.hl .diagram-line::after { color: var(--good-fg); }
  .diagram-row.bad .diagram-msg { color: var(--bad-fg); font-weight: 700; }
  .diagram-row.bad .diagram-line { background: var(--bad-fg); height: 2px; }
  .diagram-row.bad .diagram-line::after { color: var(--bad-fg); }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
  .start-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .picker-group { margin-bottom: 18px; }
  .picker-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .picker-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick-btn {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .pick-btn.sel {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .pick-count { font-size: 13px; color: var(--muted); margin: 4px 0 16px; }
  .concept-btn { margin-bottom: 10px; color: var(--accent); border-color: var(--accent); }
  /* 문제 목록(중요도순) */
  .qgroup-head { font-weight: 700; font-size: 15px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  .qitem { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .qitem-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .qitem-stars { color: var(--accent); letter-spacing: 1px; }
  .qitem-q { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  .qitem-q.raw { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; overflow-x: auto; }
  .qitem-more { font-size: 13px; color: var(--accent); margin-top: 4px; }
  .qitem-detail { margin-top: 8px; padding: 10px 2px; border-top: 1px dashed var(--border); } /* 그림 폭을 줄이지 않게 좌우 여백 최소 */
  .qitem-detail .explain { white-space: pre-wrap; line-height: 1.55; font-size: 14px; margin: 8px 0; }
  .qitem-detail .ref { font-size: 12px; color: var(--muted); margin: 0; }
  #qlist .primary { margin-top: 16px; }
  .concept-tabs { margin: 12px 0 4px; }
  .concept-tabs .pick-btn { font-size: 13px; padding: 6px 10px; }
  .concept-title { font-size: 18px; margin: 14px 0 10px; }
  .concept-card { min-height: 200px; }
  .card-kicker { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .card-heading { font-size: 17px; font-weight: 700; line-height: 1.4; margin: 0 0 10px; }
  /* 이 절차가 일어나는 상황 예시 */
  .when-box { background: var(--accent-bg); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
  .when-head { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .when-box ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
  .when-box li { margin: 2px 0; }
  .term-when { font-size: 13px; line-height: 1.55; color: var(--muted); margin-top: 4px; }
  .concept-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: -4px; }
  .concept-nav { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; }
  .concept-nav .secondary { flex: 1; color: var(--accent); border-color: var(--accent); }
  .concept-nav .secondary:disabled { opacity: 0.35; }
  .concept-pos { font-size: 13px; color: var(--muted); min-width: 52px; text-align: center; }
  /* 단계 설명·용어집을 여는 바: 화면 맨 아래 고정, 본문을 가리지 않게 본문 아래에 바 높이만큼 여백 */
  body.dock-open { padding-bottom: 64px; }
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--border);
    z-index: 8;
  }
  .dock[hidden] { display: none; }
  .dock-btn {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    border-radius: 10px;
    cursor: pointer;
  }
  /* 패널이 열리면 본문 아래에 패널 높이만큼 여백을 줘서 그림 끝까지 패널 위로 올려 볼 수 있게 한다 */
  body.panel-open { padding-bottom: 36vh; }
  .panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34vh;
    min-height: 210px;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--card);
    color: var(--fg);
    border-top: 2px solid var(--accent);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.2);
    z-index: 10;
  }
  .panel[hidden] { display: none; }
  .step-head { font-weight: 700; color: var(--good-fg); margin: 4px 0 6px; }
  .step-text { font-size: 16px; line-height: 1.7; margin: 0 0 12px; }
  .step-text p { margin: 0 0 6px; }
  .step-nav { display: flex; gap: 8px; }
  .sheet-foot { padding: 0 12px calc(10px + env(safe-area-inset-bottom)); }
  .sheet-foot:empty { display: none; }
  .step-nav .secondary { flex: 1; color: var(--accent); border-color: var(--accent); }
  .step-nav .secondary:disabled { opacity: 0.35; }
  .sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; border-bottom: 1px solid var(--border); }
  .sheet-tabs { flex: 1; display: flex; gap: 6px; }
  .sheet-tab { font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--muted); }
  .sheet-tab.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 12px 16px; }
  .sheet-term { border-bottom: 1px solid var(--border); padding: 4px 0 8px; }
  .sheet-term-head { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--fg); font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer; }
  .sheet-term-head .term-full { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .sheet-term-desc { font-size: 14px; line-height: 1.65; }
  .sheet-term-desc p { margin: 0 0 4px; }
  .sheet-term .term-ref { font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* 개념 페이지 글: 문장마다 문단, 용어는 굵게(탭하면 뜻) */
  .concept-summary { font-size: 16px; line-height: 1.75; margin: 0 0 14px; }
  .prose-lead {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 12px;
    padding: 10px 12px;
    background: var(--bg);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .prose-list { margin: 0; padding-left: 20px; }
  .prose-list li { margin: 0 0 10px; }
  .prose-list li::marker { color: var(--accent); }
  .kw { font-weight: 700; border-bottom: 1px dotted var(--accent); cursor: pointer; }
  .linkbtn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    padding: 0;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <button id="deck-change" class="linkbtn"></button>
    <span id="deck-label"></span>
  </header>
  <div id="start" class="card" hidden>
    <div class="start-title">덱 선택</div>
    <div id="set-group" class="picker-group">
      <div class="picker-label">세트</div>
      <div id="pick-set" class="picker-row"></div>
    </div>
    <div id="topic-group" class="picker-group">
      <div class="picker-label">주제</div>
      <div id="pick-topic" class="picker-row"></div>
    </div>
    <div class="picker-group">
      <div class="picker-label">난이도</div>
      <div id="pick-diff" class="picker-row"></div>
    </div>
    <div class="picker-group">
      <div class="picker-label">중요도</div>
      <div id="pick-imp" class="picker-row"></div>
    </div>
    <div id="mode-group" class="picker-group">
      <div class="picker-label">유형</div>
      <div id="pick-mode" class="picker-row"></div>
    </div>
    <div id="open-group" class="picker-group">
      <div class="picker-label">주관식</div>

<script id="quiz-data" type="application/json">[{"id": "diam-0001", "type": "order", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "command-code"], "question": "IMS 초기 등록 시 Cx 인터페이스에서 오가는 Diameter 커맨드를 순서·방향까지 맞춰라 (I-CSCF·S-CSCF·HSS).", "items": [{"msg": "UAR", "from": "I-CSCF", "to": "HSS"}, {"msg": "UAA", "from": "HSS", "to": "I-CSCF"}, {"msg": "MAR", "from": "S-CSCF", "to": "HSS"}, {"msg": "MAA", "from": "HSS", "to": "S-CSCF"}, {"msg": "SAR", "from": "S-CSCF", "to": "HSS"}, {"msg": "SAA", "from": "HSS", "to": "S-CSCF"}], "decoys": [{"msg": "LIR", "from": "I-CSCF", "to": "HSS"}, {"msg": "LIA", "from": "HSS", "to": "I-CSCF"}], "explain": "등록 시 Cx는 세 단계다. (1) I-CSCF가 UAR로 사용자 등록을 인가받고 UAA로 S-CSCF\n이름/능력을 받아 S-CSCF를 고른다. (2) 선택된 S-CSCF가 MAR로 인증 벡터를 요청하고\nMAA로 받는다(→ UE에 401 챌린지). (3) UE가 자격증명으로 재등록하면 S-CSCF가 SAR로\n자신을 사용자에 할당하고 SAA로 사용자 프로필을 내려받는다. 즉 UAR→MAR→SAR 순.\n", "ref": "3GPP TS 29.228; TS 29.229 §6.1"}, {"id": "diam-0002", "type": "order", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "command-code"], "question": "착신 호 처리 중 I-CSCF가 사용자를 서빙하는 S-CSCF를 찾기 위한 Cx 교환을 순서·방향까지 맞춰라.", "items": [{"msg": "LIR", "from": "I-CSCF", "to": "HSS"}, {"msg": "LIA", "from": "HSS", "to": "I-CSCF"}], "decoys": [{"msg": "UAR", "from": "I-CSCF", "to": "HSS"}, {"msg": "UAA", "from": "HSS", "to": "I-CSCF"}], "explain": "착신 INVITE를 받은 I-CSCF는 그 사용자를 현재 담당하는 S-CSCF 이름을 모른다. LIR\n(Location-Info-Request)로 HSS에 물으면 HSS가 LIA로 서빙 S-CSCF 이름을 돌려주고,\nI-CSCF는 그 S-CSCF로 INVITE를 라우팅한다. 등록(UAR)과 달리 착신 경로 탐색용이다.\n", "ref": "3GPP TS 29.228; TS 29.229 §6.1.3"}, {"id": "diam-0003", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code", "concept"], "question": "Cx에서 I-CSCF가 사용자의 등록을 인가받고 배정할 S-CSCF 정보를 얻기 위해 HSS로 보내는 커맨드는?", "choices": ["UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "UAR는 등록 인가 요청이다. HSS는 UAA로 로밍 허용 여부와 S-CSCF 능력/이름을 돌려줘\nI-CSCF가 S-CSCF를 고르게 한다. 인증 벡터(MAR)나 서버 할당(SAR)은 이후 S-CSCF가\n수행한다.\n", "ref": "3GPP TS 29.229 §6.1.1"}, {"id": "diam-0004", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code", "concept"], "question": "S-CSCF가 사용자를 인증하기 위한 인증 벡터(authentication vector)를 HSS에서 받아오는 Cx 커맨드는?", "choices": ["MAR (Multimedia-Auth-Request)", "UAR (User-Authorization-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "MAR는 인증 벡터 요청이다. HSS는 MAA로 인증 벡터를 내려주고, S-CSCF는 이를 근거로\nUE에 401 인증 챌린지를 보낸다. UAR(인가)·SAR(할당)와 목적이 다르다.\n", "ref": "3GPP TS 29.229 §6.3"}, {"id": "diam-0005", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code", "concept"], "question": "인증에 성공한 뒤 S-CSCF가 자신을 사용자에 할당하고 사용자 프로필을 내려받기 위해 HSS로 보내는 Cx 커맨드는?", "choices": ["SAR (Server-Assignment-Request)", "UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "SAR는 서버 할당 요청으로, HSS에 \"이 사용자는 내가 담당한다\"고 등록하고 SAA로\n사용자 프로필(서비스 프로파일)을 받는다. 등록 흐름의 마지막 Cx 단계다.\n", "ref": "3GPP TS 29.229 §6.2"}, {"id": "diam-0006", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code", "concept"], "question": "LIR (Location-Info-Request)의 주 용도는?", "choices": ["착신 시 사용자를 현재 서빙하는 S-CSCF의 이름을 HSS에서 조회", "등록 시 사용자를 인증할 인증 벡터를 HSS에서 조회", "인증 후 S-CSCF를 사용자에 할당하고 프로필을 내려받음", "AS가 Sh 인터페이스로 HSS의 가입자 데이터를 조회"], "answer": 0, "explain": "LIR는 착신(terminating) 처리에서 I-CSCF가 서빙 S-CSCF 이름을 얻는 데 쓴다. 인증\n벡터는 MAR, 서버 할당은 SAR, 가입자 데이터 조회는 Sh의 UDR로 서로 인터페이스·목적이\n다르다.\n", "ref": "3GPP TS 29.229 §6.1.3"}, {"id": "diam-0007", "type": "short", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code"], "question": "S-CSCF가 HSS에서 인증 벡터를 받기 위해 보내는 Cx 커맨드의 약어는? (3글자)", "answer": ["MAR"], "explain": "MAR = Multimedia-Auth-Request. 인증 벡터 요청 커맨드다(응답은 MAA). Cx 커맨드\n코드는 303.\n", "ref": "3GPP TS 29.229 §6.3; TS 29.230 §5.1"}, {"id": "diam-0008", "type": "short", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code"], "question": "착신 호에서 I-CSCF가 서빙 S-CSCF를 찾기 위해 HSS로 보내는 Cx 커맨드의 약어는? (3글자)", "answer": ["LIR"], "explain": "LIR = Location-Info-Request(응답 LIA). 착신 경로에서 서빙 S-CSCF 이름을 조회한다.\nCx 커맨드 코드는 302.\n", "ref": "3GPP TS 29.229 §6.1.3; TS 29.230 §5.1"}, {"id": "diam-0009", "type": "ox", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code", "message-flow"], "question": "MAR(Multimedia-Auth-Request)는 I-CSCF가 HSS로 보내는 커맨드다.", "answer": false, "explain": "아니다. MAR를 보내는 것은 S-CSCF다(인증 벡터 요청). I-CSCF가 HSS로 보내는 Cx\n커맨드는 UAR(인가)와 LIR(착신 시 서빙 S-CSCF 조회)다. 인터페이스는 같아도 노드\n역할이 다르다.\n", "ref": "3GPP TS 29.229 §6.3"}, {"id": "diam-0011", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["result-code"], "question": "HSS가 요청된 사용자 식별자가 존재하지 않을 때 반환하는 Experimental-Result-Code는?", "choices": ["5001 DIAMETER_ERROR_USER_UNKNOWN", "5003 DIAMETER_ERROR_IDENTITY_NOT_REGISTERED", "5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED", "5002 DIAMETER_ERROR_IDENTITIES_DONT_MATCH"], "answer": 0, "explain": "5001은 \"그 사용자 자체가 HSS에 없음\"이다. 5003은 사용자는 있으나 등록 상태가\n아님, 5005는 이미 등록됨, 5002는 공개/개인 식별자 불일치 — 모두 5xxx(영구 실패)\n대역이지만 원인이 다르다.\n", "ref": "3GPP TS 29.229 §6.2; TS 29.230 §8.1.4"}, {"id": "diam-0012", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["result-code"], "question": "이미 등록된 식별자로 등록이 들어와 충돌할 때 HSS가 쓸 수 있는 Experimental-Result-Code는?", "choices": ["5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED", "5001 DIAMETER_ERROR_USER_UNKNOWN", "5004 DIAMETER_ERROR_ROAMING_NOT_ALLOWED", "2001 DIAMETER_FIRST_REGISTRATION"], "answer": 0, "explain": "5005는 \"이미 등록된 식별자\"다. 5001(사용자 없음)·5004(로밍 불가)와 원인이 다르고,\n2001은 성공(첫 등록) 계열이라 애초에 실패가 아니다. 5xxx=영구 실패, 2xxx=성공.\n", "ref": "3GPP TS 29.229; TS 29.230 §8.1"}, {"id": "diam-0013", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["result-code", "concept"], "question": "Cx의 5xxx 대역 Experimental-Result-Code는 영구 실패(permanent failure)를 나타낸다.", "answer": true, "explain": "맞다. 3GPP Experimental-Result-Code도 Diameter 대역 규칙을 따른다: 2xxx=성공,\n5xxx=영구 실패. 예: 5001 USER_UNKNOWN. 이 대역 구조를 알면 개별 코드도 앵커링해\n외우기 쉽다.\n", "ref": "3GPP TS 29.230 §8.1"}, {"id": "diam-0014", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["result-code", "concept"], "question": "DIAMETER_FIRST_REGISTRATION(2001)은 등록 실패를 나타내는 코드다.", "answer": false, "explain": "아니다. 2001은 2xxx(성공) 대역으로 \"첫 등록 성공\"을 뜻한다. 실패는 5xxx 대역이다\n(예: 5001 USER_UNKNOWN). 2xxx=성공/5xxx=영구실패 대역 구분이 핵심.\n", "ref": "3GPP TS 29.230 §8.1.2"}, {"id": "diam-0015", "type": "short", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code"], "question": "Cx의 User-Authorization 커맨드(UAR/UAA)에 할당된 Diameter 커맨드 코드 번호는?", "answer": ["300"], "explain": "3GPP TS 29.230은 Cx/Dx 커맨드 코드를 300부터 부여한다: 300 UAR/UAA, 301 SAR/SAA,\n302 LIR/LIA, 303 MAR/MAA. 요청/응답은 같은 코드를 쓰고 R-bit로 구분한다.\n", "ref": "3GPP TS 29.230 §5.1"}, {"id": "diam-0016", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code"], "question": "Diameter 커맨드 코드 303에 해당하는 Cx 커맨드 쌍은?", "choices": ["MAR/MAA (Multimedia-Auth)", "UAR/UAA (User-Authorization)", "SAR/SAA (Server-Assignment)", "LIR/LIA (Location-Info)"], "answer": 0, "explain": "300 UAR/UAA, 301 SAR/SAA, 302 LIR/LIA, 303 MAR/MAA 순으로 부여됐다. 303은\nMultimedia-Auth 쌍이다. 코드가 연속 부여됐다는 구조로 외우면 헷갈리지 않는다.\n", "ref": "3GPP TS 29.230 §5.1"}, {"id": "diam-0017", "type": "order", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "command-code"], "question": "애플리케이션 서버(AS)가 Sh 인터페이스로 HSS의 가입자 데이터를 조회하는 교환을 순서·방향까지 맞춰라.", "items": [{"msg": "UDR", "from": "AS", "to": "HSS"}, {"msg": "UDA", "from": "HSS", "to": "AS"}], "decoys": [{"msg": "SNR", "from": "AS", "to": "HSS"}, {"msg": "SNA", "from": "HSS", "to": "AS"}], "explain": "Sh에서 AS는 UDR(User-Data-Request)로 HSS의 가입자 데이터를 조회하고 HSS는 UDA로\n데이터를 돌려준다. Sh는 AS↔HSS 간 데이터 접근/구독 인터페이스로, Cx(등록/인증)와는\n쓰임이 다르다.\n", "ref": "3GPP TS 29.328; TS 29.329"}, {"id": "diam-0018", "type": "order", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["message-flow", "command-code"], "question": "AS가 Sh로 가입자 데이터 변경 통지를 구독하고, 이후 데이터가 바뀌어 HSS가 통지하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "SNR", "from": "AS", "to": "HSS"}, {"msg": "SNA", "from": "HSS", "to": "AS"}, {"msg": "PNR", "from": "HSS", "to": "AS"}, {"msg": "PNA", "from": "AS", "to": "HSS"}], "decoys": [{"msg": "UDR", "from": "AS", "to": "HSS"}, {"msg": "UDA", "from": "HSS", "to": "AS"}], "explain": "AS가 SNR(Subscribe-Notifications-Request)로 특정 데이터 변경 통지를 구독하면 HSS가\nSNA로 확인한다. 이후 데이터가 바뀌면 HSS가 먼저 PNR(Push-Notification-Request)로\n통지하고 AS가 PNA로 응답한다. PNR만 HSS가 발신한다는 점이 방향 포인트다.\n", "ref": "3GPP TS 29.328; TS 29.329; TS 29.230 §5.1"}, {"id": "diam-0019", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code", "concept"], "question": "Sh 인터페이스에서 AS가 HSS의 가입자 데이터를 읽어오기 위해 쓰는 커맨드는?", "choices": ["UDR (User-Data-Request)", "SAR (Server-Assignment-Request)", "MAR (Multimedia-Auth-Request)", "AAR (AA-Request)"], "answer": 0, "explain": "UDR는 Sh의 데이터 조회 커맨드다(응답 UDA). SAR·MAR는 Cx(S-CSCF↔HSS), AAR는\nRx(P-CSCF↔PCRF)로 인터페이스가 다르다. 커맨드를 인터페이스에 묶어 외우는 게 요령.\n", "ref": "3GPP TS 29.328"}, {"id": "diam-0020", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code", "message-flow"], "question": "PNR(Push-Notification-Request)는 AS가 HSS로 데이터를 요청할 때 보내는 커맨드다.", "answer": false, "explain": "아니다. PNR는 HSS가 AS로 데이터 변경을 \"밀어주는\"(push) 통지 커맨드라 방향이\nHSS→AS다. AS가 데이터를 요청할 때는 UDR(조회)나 SNR(구독)를 쓴다.\n", "ref": "3GPP TS 29.328; TS 29.329"}, {"id": "diam-0021", "type": "order", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "command-code"], "question": "P-CSCF(AF)가 SIP 세션의 미디어를 Rx로 인가받고, 세션 종료 시 정책을 해제하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "AAR", "from": "P-CSCF", "to": "PCRF"}, {"msg": "AAA", "from": "PCRF", "to": "P-CSCF"}, {"msg": "STR", "from": "P-CSCF", "to": "PCRF"}, {"msg": "STA", "from": "PCRF", "to": "P-CSCF"}], "decoys": [{"msg": "RAR", "from": "PCRF", "to": "P-CSCF"}, {"msg": "RAA", "from": "P-CSCF", "to": "PCRF"}], "explain": "세션 설정 시 P-CSCF(AF)는 AAR(AA-Request)로 미디어 정보를 PCRF에 주고 인가/QoS를\n요청하며 AAA로 응답을 받는다. 통화가 끝나면 STR(Session-Termination-Request)로\n세션을 종료하고 STA로 확인한다. Rx는 IMS 세션과 베어러 정책을 잇는 인터페이스다.\n", "ref": "3GPP TS 29.214"}, {"id": "diam-0022", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code", "concept"], "question": "Rx에서 P-CSCF(AF)가 세션의 미디어 정보를 PCRF에 전달하며 자원 인가를 요청하는 커맨드는?", "choices": ["AAR (AA-Request)", "SAR (Server-Assignment-Request)", "UDR (User-Data-Request)", "LIR (Location-Info-Request)"], "answer": 0, "explain": "AAR는 Rx의 세션/미디어 인가 요청 커맨드다(응답 AAA). SAR/LIR는 Cx, UDR는 Sh로\n각각 인터페이스가 다르다. Rx는 SIP 세션 정보를 정책(PCRF)에 연결한다.\n", "ref": "3GPP TS 29.214"}, {"id": "diam-0023", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code", "message-flow"], "question": "Rx에서 PCRF가 AF(P-CSCF)로 세션 중단을 지시할 때 쓰는 커맨드와 방향이 옳은 것은?", "choices": ["ASR — PCRF → AF", "STR — AF → PCRF", "AAR — AF → PCRF", "RAR — AF → PCRF"], "answer": 0, "explain": "ASR(Abort-Session-Request)는 PCRF가 AF로 세션 중단을 지시한다(PCRF→AF). STR는\n반대로 AF가 종료를 알리는 것(AF→PCRF)이고, RAR도 PCRF→AF지만 재인가 요청이다.\nASR/STR/RAR는 Diameter 기본 커맨드(274/275/258)를 재사용한다.\n", "ref": "3GPP TS 29.214; RFC 6733 §3.1"}, {"id": "diam-0024", "type": "ox", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code", "message-flow"], "question": "Rx에서 STR(Session-Termination-Request)는 AF(P-CSCF)가 PCRF로 세션 종료를 알릴 때 보낸다.", "answer": true, "explain": "맞다. 세션이 끝나면 AF(P-CSCF)가 STR로 PCRF에 종료를 알리고 STA로 확인받는다.\n반대로 PCRF가 세션을 강제로 끊는 것은 ASR(PCRF→AF)다 — 방향이 반대다.\n", "ref": "3GPP TS 29.214; RFC 6733 §8.4"}, {"id": "diam-0025", "type": "order", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["message-flow", "command-code"], "question": "운영자가 HSS에서 가입자의 IMS 등록을 강제로 해제할 때 Cx에서 오가는 커맨드를 순서·방향까지 맞춰라.", "items": [{"msg": "RTR", "from": "HSS", "to": "S-CSCF"}, {"msg": "RTA", "from": "S-CSCF", "to": "HSS"}], "decoys": [{"msg": "SAR", "from": "S-CSCF", "to": "HSS"}, {"msg": "SAA", "from": "HSS", "to": "S-CSCF"}], "explain": "HSS가 시작하는 관리 목적의 등록 해제는 RTR(Registration-Termination-Request)로 한다.\nHSS가 공개 식별자를 미등록 상태로 바꾸고 RTR로 S-CSCF에 알린다.\nS-CSCF는 해당 식별자의 정보를 지우고 RTA로 답한다.\nSAR은 반대로 S-CSCF가 시작하는 커맨드라 이 흐름에 맞지 않는다.\nCx 커맨드 대부분은 CSCF가 요청하지만, RTR과 PPR은 HSS가 요청한다.\n", "ref": "3GPP TS 29.228 §6.1.3; TS 29.229 §6.1.9, §6.1.10"}, {"id": "diam-0026", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code"], "question": "HSS가 관리 목적으로 가입자의 IMS 등록을 해제하며 S-CSCF에 보내는 Cx 커맨드는?", "choices": ["RTR (Registration-Termination-Request)", "PPR (Push-Profile-Request)", "SAR (Server-Assignment-Request)", "CLR (Cancel-Location-Request)"], "answer": 0, "explain": "RTR은 HSS가 S-CSCF에 등록 해제를 알리는 Cx 커맨드다(커맨드 코드 304).\nPPR도 HSS가 S-CSCF로 보내지만, 등록은 그대로 두고 프로필만 갱신한다.\nSAR은 S-CSCF가 HSS로 보내는 커맨드다.\nCLR도 HSS가 보내지만 S6a 커맨드라 받는 쪽이 MME다.\n", "ref": "3GPP TS 29.228 §6.1.3; TS 29.229 §6.1.9; TS 29.230 §5.1"}, {"id": "diam-0027", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code"], "question": "HSS에서 가입자의 서비스 프로필이 바뀌어, 등록 중인 S-CSCF에 새 프로필을 내려보낼 때 쓰는 Cx 커맨드는?", "choices": ["PPR (Push-Profile-Request)", "PNR (Push-Notification-Request)", "RTR (Registration-Termination-Request)", "SAR (Server-Assignment-Request)"], "answer": 0, "explain": "PPR은 HSS가 S-CSCF의 사용자 프로필·과금 정보 등을 갱신하는 Cx 커맨드다(커맨드 코드 305).\nPNR도 HSS가 데이터 변경을 밀어주지만, Sh 커맨드라 받는 쪽이 AS다.\nRTR은 프로필 갱신이 아니라 등록 해제다.\nSAR은 S-CSCF가 HSS에 요청해 프로필을 받아오는 방향이다.\n", "ref": "3GPP TS 29.228 §6.2.2; TS 29.229 §6.1.11; TS 29.230 §5.1"}, {"id": "diam-0028", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["command-code", "avp"], "question": "단말이 REGISTER(Expires: 0)로 IMS 등록을 직접 해제했다. 이를 처리한 S-CSCF가 HSS로 보내는 Cx 요청은?", "choices": ["SAR (Server-Assignment-Type: USER_DEREGISTRATION)", "SAR (Server-Assignment-Type: TIMEOUT_DEREGISTRATION)", "RTR (Deregistration-Reason 포함)", "UAR (User-Authorization-Type: DE_REGISTRATION)"], "answer": 0, "explain": "S-CSCF는 등록과 등록 해제를 모두 SAR로 HSS에 알린다. 차이는 Server-Assignment-Type AVP 값이다.\n단말이 직접 해제하면 USER_DEREGISTRATION(5)이다.\n등록 타이머가 만료되어 해제하면 TIMEOUT_DEREGISTRATION(4)이다.\nRTR은 HSS가 시작하는 해제라 방향이 반대다.\nUAR(DE_REGISTRATION)도 이 해제 흐름에 나오지만, S-CSCF가 아니라 I-CSCF가 보낸다.\nI-CSCF는 REGISTER의 Expires가 0인 것을 보고 이 값을 넣는다.\n", "ref": "3GPP TS 29.228 §6.1.2; TS 29.229 §6.1.3, §6.3.15, §6.3.24"}, {"id": "diam-0029", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["avp"], "question": "단말이 재등록하지 않아 등록 타이머가 만료되면, S-CSCF는 Server-Assignment-Type을 TIMEOUT_DEREGISTRATION으로 한 SAR을 HSS로 보낸다.", "answer": true, "explain": "맞다. TIMEOUT_DEREGISTRATION(4)은 식별자의 SIP 등록 타이머가 만료됐다는 뜻이다.\n단말이 직접 해제한 경우는 USER_DEREGISTRATION(5)이다.\n첫 등록은 REGISTRATION(1), 재등록은 RE_REGISTRATION(2)이다.\n", "ref": "3GPP TS 29.229 §6.1.3, §6.3.15"}, {"id": "diam-0030", "type": "order", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["message-flow", "command-code"], "question": "P-CSCF가 AAR로 베어러 이벤트 통지를 구독했다. 이후 통화 미디어 흐름 일부가 끊겨 PCRF가 알리는 Rx 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "AAR", "from": "P-CSCF", "to": "PCRF"}, {"msg": "AAA", "from": "PCRF", "to": "P-CSCF"}, {"msg": "RAR", "from": "PCRF", "to": "P-CSCF"}, {"msg": "RAA", "from": "P-CSCF", "to": "PCRF"}], "decoys": [{"msg": "ASR", "from": "PCRF", "to": "P-CSCF"}, {"msg": "ASA", "from": "P-CSCF", "to": "PCRF"}], "explain": "P-CSCF(AF)는 AAR의 Specific-Action AVP로 받고 싶은 베어러 이벤트를 구독한다.\n나중에 일부 미디어 흐름이 비활성화되면 PCRF가 RAR(Re-Auth-Request)로 알린다.\nRAR에는 영향받은 흐름(Flows AVP)과 원인(Specific-Action AVP)이 들어간다. P-CSCF는 RAA로 답한다.\n세션의 미디어 흐름이 전부 영향받으면 RAR 대신 ASR을 보낸다. 이 문제는 일부만 끊긴 경우라 ASR은 decoy다.\n", "ref": "3GPP TS 29.214 §4.4.1, §4.4.6.2"}, {"id": "diam-0031", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code", "message-flow"], "question": "Rx에서 AF 세션의 미디어 흐름 중 일부만 비활성화됐다(베어러 손실 등). PCRF가 AF(P-CSCF)에 알릴 때 쓰는 커맨드는?", "choices": ["RAR (Re-Auth-Request)", "ASR (Abort-Session-Request)", "STR (Session-Termination-Request)", "AAR (AA-Request)"], "answer": 0, "explain": "PCRF는 흐름 일부만 영향받으면 RAR로, 전부 영향받으면 ASR로 알린다.\nRAR에는 영향받은 흐름과 원인이 들어간다.\nASR을 받은 AF는 ASA로 답한 뒤 STR로 세션을 끝낸다.\nSTR과 AAR은 AF가 PCRF로 보내는 커맨드라 방향이 반대다.\n", "ref": "3GPP TS 29.214 §4.4.6.1, §4.4.6.2"}, {"id": "diam-0032", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 1, "tags": ["command-code"], "question": "AS가 HSS에 저장된 자기 서비스용 데이터(Repository Data)를 갱신할 때 쓰는 Sh 커맨드는?", "choices": ["PUR (Profile-Update-Request)", "UDR (User-Data-Request)", "SNR (Subscribe-Notifications-Request)", "PPR (Push-Profile-Request)"], "answer": 0, "explain": "Sh 커맨드는 AS 관점에서 읽기 UDR, 쓰기 PUR, 구독 SNR, 통지 PNR로 나뉜다.\nAS가 HSS 데이터를 갱신하는 Sh-Update 절차는 PUR/PUA로 수행한다(커맨드 코드 307).\nUDR은 조회, SNR은 변경 통지 구독이다.\nPPR은 Cx 커맨드로, HSS가 S-CSCF에 프로필을 내려보낸다.\n", "ref": "3GPP TS 29.328 §6.1.2; TS 29.329 §6.1.3; TS 29.230 §5.1"}, {"id": "diam-0033", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 1, "tags": ["command-code"], "question": "약어 PUR은 인터페이스마다 다른 커맨드를 가리킨다. S6a(MME↔HSS)에서 PUR은?", "choices": ["Purge-UE-Request (MME → HSS)", "Profile-Update-Request (AS → HSS)", "Push-Profile-Request (HSS → S-CSCF)", "Push-Notification-Request (HSS → AS)"], "answer": 0, "explain": "S6a의 PUR은 Purge-UE-Request(커맨드 코드 321)다.\nMME가 가입자 정보를 지웠다는 사실을 HSS에 알린다. 예를 들어 단말이 며칠 동안 비활성이면 지운다.\nSh의 PUR은 Profile-Update-Request(307)로, AS가 HSS 데이터를 갱신한다.\n약어는 같아도 커맨드 코드가 달라서 로그에서는 코드로 구분된다.\nPush-Profile은 PPR, Push-Notification은 PNR이다.\n", "ref": "3GPP TS 29.230 §5.1; TS 29.272 §5.2.1.3; TS 29.329 §6.1.3"}, {"id": "diam-0034", "type": "order", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "command-code"], "question": "단말이 LTE 망에 처음 접속(Attach)할 때 MME와 HSS 사이 S6a에서 오가는 커맨드를 순서·방향까지 맞춰라.", "items": [{"msg": "AIR", "from": "MME", "to": "HSS"}, {"msg": "AIA", "from": "HSS", "to": "MME"}, {"msg": "ULR", "from": "MME", "to": "HSS"}, {"msg": "ULA", "from": "HSS", "to": "MME"}], "decoys": [{"msg": "PUR", "from": "MME", "to": "HSS"}, {"msg": "PUA", "from": "HSS", "to": "MME"}], "explain": "MME는 먼저 AIR(Authentication-Information-Request)로 HSS에서 인증 벡터를 받는다.\n받은 인증 벡터로 단말과 EPS AKA 인증을 한다.\n인증이 끝나면 ULR(Update-Location-Request)로 자신이 이 가입자를 서빙한다고 HSS에 등록한다.\nHSS는 ULA에 가입자 데이터(APN별 PDN 가입 정보 등)를 담아 돌려준다.\nPUR(Purge-UE)은 MME가 가입자 정보를 지웠을 때 보내는 커맨드라 Attach에 없다.\nIMS 등록의 MAR(인증)→SAR(서버 할당)과 같은 구조다.\n", "ref": "3GPP TS 23.401 §5.3.2.1 (5a, 8, 11단계); TS 29.272 §5.2.1.1, §5.2.3.1"}, {"id": "diam-0035", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code"], "question": "LTE Attach 중 MME가 단말 인증에 쓸 인증 벡터를 HSS에서 받아오는 S6a 커맨드는?", "choices": ["AIR (Authentication-Information-Request)", "ULR (Update-Location-Request)", "MAR (Multimedia-Auth-Request)", "ECR (ME-Identity-Check-Request)"], "answer": 0, "explain": "AIR은 MME(또는 SGSN)가 HSS에 인증 정보를 요청하는 S6a 커맨드다(커맨드 코드 318).\nMAR도 인증 벡터를 받지만 Cx 커맨드라 S-CSCF가 IMS 등록 때 쓴다.\nULR은 위치 등록이고, ECR은 EIR에 단말 상태를 묻는 S13 커맨드다.\n", "ref": "3GPP TS 29.272 §5.2.3.1; TS 29.230 §5.1"}, {"id": "diam-0036", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code"], "question": "MME가 HSS에 자신이 이 가입자를 서빙한다고 알리고, 가입자 데이터를 받아오는 S6a 커맨드는?", "choices": ["ULR (Update-Location-Request)", "AIR (Authentication-Information-Request)", "SAR (Server-Assignment-Request)", "IDR (Insert-Subscriber-Data-Request)"], "answer": 0, "explain": "ULR은 서빙 MME의 정보를 HSS에 등록하고, ULA로 가입자 데이터를 받는 S6a 커맨드다(커맨드 코드 316).\nCx의 SAR과 역할이 비슷하다. SAR은 S-CSCF가 HSS에 등록하고 IMS 프로필을 받는다.\nIDR도 가입자 데이터를 전달하지만, HSS가 MME로 밀어주는 방향이다.\n", "ref": "3GPP TS 29.272 §5.2.1.1, §5.2.2.1; TS 29.230 §5.1"}, {"id": "diam-0037", "type": "mcq", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["command-code"], "question": "MME가 EIR에 단말 식별 번호(IMEI)를 보내 도난·불량 단말인지 확인하는 S13 커맨드는?", "choices": ["ECR (ME-Identity-Check-Request)", "AIR (Authentication-Information-Request)", "ULR (Update-Location-Request)", "NOR (Notify-Request)"], "answer": 0, "explain": "ECR은 S13 인터페이스(MME↔EIR)의 단말 식별 확인 커맨드다(커맨드 코드 324).\nEIR이 ECA로 결과를 주면 MME가 Attach를 계속할지 거절할지 정한다.\nAIR·ULR·NOR은 MME와 HSS 사이의 S6a 커맨드다.\nS6a는 가입자(USIM)를, S13은 단말 기기를 확인한다.\n", "ref": "3GPP TS 29.272 §6.2.1; TS 23.401 §5.3.2.1 (5b단계)"}, {"id": "diam-0038", "type": "ox", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["command-code", "message-flow"], "question": "단말이 다른 MME 지역에서 Attach해 새 MME가 ULR을 보내도, HSS는 이전 MME에 아무것도 알리지 않는다.", "answer": false, "explain": "아니다. 새 MME의 ULR을 받은 HSS는 이전 MME에 CLR(Cancel-Location-Request)을 보낸다.\n이전 MME는 CLA로 답하고 그 가입자의 이동성·베어러 정보를 지운다.\nCLR은 HSS가 시작하는 S6a 커맨드다. 가입 해지 때도 쓰인다.\n", "ref": "3GPP TS 23.401 §5.3.2.1 (9단계); TS 29.272 §5.2.1.2"}, {"id": "diam-0039", "type": "mcq", "topic": "Diameter", "difficulty": "advanced", "importance": 2, "tags": ["avp", "concept"], "question": "MME가 S6a AIA로 받은 E-UTRAN 인증 벡터 중, 단말이 보낸 인증 응답 RES와 비교하는 값은?", "choices": ["XRES", "AUTN", "RAND", "KASME"], "answer": 0, "explain": "인증 벡터(E-UTRAN-Vector AVP)에는 RAND, XRES, AUTN, KASME가 들어 있다.\nMME는 RAND와 AUTN을 단말에 보낸다. USIM은 AUTN으로 망을 검증한 뒤 RES를 계산해 돌려준다.\nMME는 RES가 XRES와 같으면 인증 성공으로 본다.\nKASME는 이후 NAS·무선 구간 키를 만드는 중간 키다.\n", "ref": "3GPP TS 29.272 §7.3.18; TS 33.401 §6.1.1"}, {"id": "diam-0040", "type": "open", "topic": "Diameter", "difficulty": "basic", "importance": 3, "tags": ["command-code", "message-flow"], "question": "IMS 첫 등록에서 I-CSCF와 S-CSCF가 HSS와 주고받는 Cx 커맨드 세 쌍을 순서대로 들고, 각각의 목적을 설명하라.", "answer": "먼저 I-CSCF가 UAR/UAA로 사용자의 등록을 인가받고, S-CSCF를 정하는 데 필요한 정보를 받는다.\n다음으로 S-CSCF가 MAR/MAA로 인증 벡터를 받아 단말에 401 챌린지를 보낸다.\n단말이 자격증명으로 다시 등록하면 S-CSCF가 SAR/SAA로 자신을 그 사용자에 할당하고 사용자 프로필을 받는다.\n", "points": ["UAR/UAA: I-CSCF, 등록 인가·S-CSCF 선택", "MAR/MAA: S-CSCF, 인증 벡터 → 401 챌린지", "SAR/SAA: S-CSCF, 서버 할당·프로필 다운로드", "순서는 UAR → MAR → SAR"], "explain": "LIR/LIA는 등록이 아니라 착신 때 서빙 S-CSCF를 찾는 커맨드다.\n", "ref": "3GPP TS 29.228; TS 29.229 §6.1"}, {"id": "diam-0041", "type": "open", "topic": "Diameter", "difficulty": "basic", "importance": 2, "tags": ["result-code", "concept"], "question": "Diameter Result-Code의 천 단위 대역(1xxx~5xxx)이 각각 무엇을 뜻하는지 설명하라.", "answer": "1xxx는 정보(Informational), 2xxx는 성공(Success)이다.\n3xxx는 프로토콜 오류(Protocol Errors)로, 홉 단위로 처리하며 E 비트를 세운 응답에만 쓴다.\n4xxx는 일시적 실패(Transient Failures)로, 지금은 처리하지 못했지만 나중에는 될 수 있다는 뜻이다.\n5xxx는 영구적 실패(Permanent Failure)로, 다시 시도하지 말아야 한다.\n", "points": ["1xxx 정보, 2xxx 성공", "3xxx 프로토콜 오류(홉 단위, E 비트)", "4xxx 일시적 실패(나중에 될 수 있음)", "5xxx 영구적 실패(다시 시도하지 않음)"], "explain": "정의되지 않은 대역의 코드는 영구적 실패로 처리해야 한다(MUST).\n3GPP의 Experimental-Result-Code도 같은 대역 규칙을 따른다(예: 2001 첫 등록 성공, 5001 사용자 없음).\n", "ref": "RFC 6733 §7.1, §7.1.3, §7.1.4, §7.1.5; 3GPP TS 29.230 §8.1"}, {"id": "epc-0001", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "C-SGN(CIoT Serving Gateway Node)이 한 장비 안에 합쳐 구현하는 EPC 기능은?", "choices": ["MME, S-GW (필요하면 P-GW까지)", "eNodeB, MME (무선과 제어)", "HSS, MME (가입자 DB와 제어)", "P-CSCF, S-CSCF (IMS 제어)"], "answer": 0, "explain": "C-SGN은 CIoT 배포용 결합 노드 구현 방식이다.\n제어 평면과 사용자 평면 경로의 EPS 엔티티(MME, S-GW, P-GW)를 한 장비에 모아 물리 장비 수를 줄인다.\n외부 인터페이스는 각 기능의 인터페이스 그대로다. 예를 들어 HSS와는 MME처럼 S6a로 연결된다.\nC-SGN은 Control Plane CIoT 최적화 같은 CIoT 소량 데이터 전송 기능을 지원한다.\n", "ref": "3GPP TS 23.401 Annex L.4"}, {"id": "epc-0002", "type": "ox", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "EMM-REGISTERED 상태의 UE는 예외 없이 항상 PDN 연결을 하나 이상 가진다.", "answer": false, "explain": "아니다. 보통 EMM-REGISTERED UE는 PDN 연결이 하나 이상 있다. Attach 때 기본 베어러를 만들어 항상 연결 상태를 유지하기 때문이다.\n예외가 \"Attach without PDN connectivity\"를 지원하는 UE다. 이 UE는 PDN 연결 없이 등록만 할 수 있다.\nPDN 연결 없는 Attach는 C-SGN이 지원하는 CIoT 기능 중 하나다.\n", "ref": "3GPP TS 23.401 §4.6.2.2, Annex L.4"}, {"id": "epc-0003", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "UE가 Attach Request에 임시 식별자(GUTI) 대신 IMSI를 넣어 보내는 경우는?", "choices": ["유효한 GUTI나 P-TMSI가 없을 때", "같은 MME로 다시 Attach할 때", "이전 Attach가 정상 해제됐을 때", "eNodeB가 IMSI를 요구했을 때"], "answer": 0, "explain": "UE는 유효한 GUTI가 있으면 이전 GUTI로 자신을 알린다. IMSI는 유효한 GUTI나 P-TMSI가 없을 때 넣는다.\n또 \"PLMN 변경 시 IMSI로 Attach\" 설정이 있는 UE가 새 PLMN에 접속할 때도 IMSI를 넣는다.\nMME가 GUTI로 UE를 찾지 못하면 Identity Request로 IMSI를 따로 요청한다.\n", "ref": "3GPP TS 23.401 §5.3.2.1 (1, 4단계)"}, {"id": "epc-0004", "type": "ox", "topic": "EPC", "difficulty": "advanced", "importance": 1, "tags": ["concept", "message-flow"], "question": "Attach Request가 무결성 보호되어 있고 MME의 무결성 검사도 통과하면, MME는 Attach 중 인증(AKA)을 생략할 수 있다.", "answer": true, "explain": "맞다. 다음 경우에는 인증과 NAS 보안 설정이 필수다.\n- 망 어디에도 UE 컨텍스트가 없을 때\n- Attach Request가 무결성 보호되지 않았을 때\n- 무결성 검사에 실패했을 때\n그 밖의 경우에는 인증이 선택 사항이다.\n인증을 하면 MME는 S6a AIR로 받은 인증 벡터를 쓴다(diam-0035).\n", "ref": "3GPP TS 23.401 §5.3.2.1 (5a단계)"}, {"id": "epc-0005", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "임시 식별자 M-TMSI와 실제 가입자 식별자 IMSI의 대응 관계를 아는 곳은?", "choices": ["UE와 MME", "UE와 HSS", "eNodeB와 MME", "MME와 S-GW"], "answer": 0, "explain": "M-TMSI는 UE와 MME 사이에서 사용자를 식별한다. M-TMSI와 IMSI의 대응은 UE와 MME만 안다.\n무선 구간에 IMSI를 드러내지 않으려는 사용자 식별자 기밀성 기능이다.\nMME 코드와 M-TMSI를 합친 것이 S-TMSI다. UE는 Service Request를 보낼 때 S-TMSI로 자신을 알린다.\n", "ref": "3GPP TS 23.401 §5.3.10.3, §5.3.4.1 (1단계)"}, {"id": "epc-0006", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "Attach 중 MME가 S-GW에 기본 베어러(default bearer) 생성을 요청하는 메시지는?", "choices": ["Create Session Request", "Modify Bearer Request", "Update Location Request", "Initial Context Setup Request"], "answer": 0, "explain": "MME는 HSS에서 가입자 데이터(ULA)를 받은 뒤 Create Session Request를 S-GW로 보낸다.\nS-GW는 이를 P-GW로 넘겨 기본 베어러와 PDN 연결을 만든다.\nModify Bearer Request는 나중에 eNodeB 쪽 주소를 S-GW에 알려 하향 경로를 완성할 때 쓴다.\nUpdate Location Request는 HSS로, Initial Context Setup Request는 eNodeB로 보낸다.\n", "ref": "3GPP TS 23.401 §5.3.2.1 (12~16, 23단계)"}, {"id": "epc-0007", "type": "match", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "EPS의 이동성 관리(EMM)·연결 관리(ECM) 상태와 그 뜻을 짝지어라.", "pairs": [{"left": "EMM-DEREGISTERED", "right": "MME가 UE 위치를 몰라 페이징할 수 없음"}, {"left": "EMM-REGISTERED", "right": "Attach 성공, MME가 TA 목록 단위로 위치를 앎"}, {"left": "ECM-IDLE", "right": "NAS 신호 연결이 없고 S1-MME·S1-U도 없음"}, {"left": "ECM-CONNECTED", "right": "RRC와 S1-MME로 이루어진 신호 연결이 있음"}], "explain": "EMM은 등록 여부, ECM은 신호 연결 여부를 나타낸다. 두 축은 따로 움직인다.\n그래서 \"EMM-REGISTERED이면서 ECM-IDLE\"이 휴지 상태의 일반적인 모습이다.\nECM-CONNECTED에서는 MME가 UE 위치를 서빙 eNodeB 단위로 안다.\nS1 release가 ECM-CONNECTED를 ECM-IDLE로 바꾼다.\n", "ref": "3GPP TS 23.401 §4.6.2, §4.6.3"}, {"id": "epc-0008", "type": "order", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "ECM-IDLE 상태인 UE 앞으로 하향 데이터가 도착해, 망이 UE를 깨우는 흐름(Network Triggered Service Request)을 순서·방향까지 맞춰라.", "items": [{"msg": "Downlink Data Notification", "from": "S-GW", "to": "MME"}, {"msg": "DDN Ack", "from": "MME", "to": "S-GW"}, {"msg": "Paging (S1-AP)", "from": "MME", "to": "eNodeB"}, {"msg": "Paging (RRC)", "from": "eNodeB", "to": "UE"}, {"msg": "Service Request", "from": "UE", "to": "MME"}], "decoys": [{"msg": "Release Access Bearers Req", "from": "MME", "to": "S-GW"}, {"msg": "UE Context Release Cmd", "from": "MME", "to": "eNodeB"}], "explain": "S-GW는 하향 사용자 평면 TEID가 없는 UE 앞으로 패킷이 오면 패킷을 버퍼링한다.\n그리고 Downlink Data Notification(DDN)을 MME로 보낸다. MME는 DDN Ack로 답한다.\nMME는 UE가 등록된 Tracking Area의 eNodeB들에 S1-AP Paging을 보내고, eNodeB가 무선으로 UE를 부른다.\n페이징을 받은 UE는 Service Request로 응답한다. 이후 과정은 UE가 시작하는 Service Request와 같다.\nRelease Access Bearers와 S1 UE Context Release는 반대로 UE를 휴지 상태로 보내는 S1 release 메시지다.\n다이어그램에서 Service Request는 eNodeB를 거쳐 MME로 가는 NAS 메시지다.\n조각 이름은 Req(Request)·Cmd(Command)로 줄여 적었다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (1~5단계)"}, {"id": "epc-0009", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "ECM-IDLE인 UE 앞으로 하향 패킷이 S-GW에 도착했다. S-GW가 하는 일은?", "choices": ["패킷을 버퍼링하고 MME에 DDN을 보낸다", "마지막 eNodeB로 패킷을 그대로 보낸다", "패킷을 버리고 P-GW에 오류를 알린다", "eNodeB들에 직접 Paging을 보낸다"], "answer": 0, "explain": "S-GW 컨텍스트에 하향 사용자 평면 TEID가 없으면 UE가 사용자 평면으로 연결되지 않은 상태다.\nS-GW는 패킷을 버퍼링하고 서빙 MME에 Downlink Data Notification(DDN)을 보낸다.\n페이징은 MME가 한다. S-GW는 eNodeB와 신호를 주고받지 않는다.\n마지막 eNodeB 정보는 S1 release 때 S-GW에서 지워졌기 때문에 바로 보낼 수도 없다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (1, 2단계), §5.3.5 (3단계)"}, {"id": "epc-0010", "type": "short", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "S-GW가 ECM-IDLE UE 앞으로 하향 데이터가 왔다고 MME에 알리는 GTP 메시지의 약어는? (3글자)", "answer": ["DDN"], "explain": "DDN = Downlink Data Notification. MME는 DDN Ack로 답하고 UE를 페이징한다.\nDDN에는 데이터가 도착한 베어러의 EPS Bearer ID와 ARP(우선순위)가 항상 들어간다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (2단계)"}, {"id": "epc-0011", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "MME는 ECM-IDLE UE를 찾기 위해 어느 eNodeB들에 Paging을 보내는가?", "choices": ["UE가 등록된 Tracking Area에 속한 eNodeB들", "UE가 마지막으로 접속했던 eNodeB 하나", "MME에 연결된 모든 eNodeB", "S-GW가 DDN에 적어 보낸 eNodeB"], "answer": 0, "explain": "ECM-IDLE에서 MME는 UE 위치를 Tracking Area 목록 단위로만 안다.\n그래서 UE가 등록된 Tracking Area에 속한 각 eNodeB에 Paging을 보낸다.\n마지막 셀 정보(권장 셀 정보)가 있으면 페이징 범위를 줄이는 데 쓸 수 있다.\nUE는 목록에 없는 TA로 옮기면 TAU를 해서 MME가 계속 페이징할 수 있게 한다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (3a단계), §4.6.3.1"}, {"id": "epc-0012", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "ECM-IDLE 상태에서 Paging을 받은 UE가 MME에 보내는 NAS 메시지는?", "choices": ["Service Request", "Attach Request", "Tracking Area Update Request", "Paging Response"], "answer": 0, "explain": "페이징을 받은 ECM-IDLE UE는 UE가 시작하는 Service Request 절차를 그대로 수행한다.\n올릴 데이터가 생긴 UE가 보내는 메시지와 같다.\nPaging Response는 2G/3G 회선 교환에서 쓰는 이름이다. LTE NAS의 페이징 응답은 Service Request다.\nUser Plane CIoT 최적화로 RRC 연결을 일시 중단(suspend)해 둔 UE는 대신 Connection Resume 절차를 쓴다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (5단계)"}, {"id": "epc-0013", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "ECM-IDLE 상태인 UE의 위치를 MME는 어느 정도까지 아는가?", "choices": ["UE에 할당한 Tracking Area 목록 단위", "UE가 머무는 서빙 eNodeB 단위", "UE가 머무는 서빙 셀 단위", "UE가 등록된 PLMN 단위"], "answer": 0, "explain": "EMM-REGISTERED UE의 위치는 적어도 UE에 할당한 TA 목록 단위로 MME가 안다.\nECM-CONNECTED가 되면 서빙 eNodeB 단위로 알게 된다.\n그래서 휴지 UE를 찾으려면 TA 목록 안의 eNodeB들에 페이징해야 한다.\n", "ref": "3GPP TS 23.401 §4.6.2.2, §4.6.3.2"}, {"id": "epc-0014", "type": "ox", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "UE가 PSM이나 eDRX 상태라 지금 페이징할 수 없으면, MME는 DDN Ack로 S-GW에 하향 데이터를 더 오래 버퍼링하라고 요청할 수 있다.", "answer": true, "explain": "맞다. 이것을 extended buffering이라고 한다.\nMME는 DDN Ack에 DL Buffering Requested와 버퍼링 시간(DL Buffering Duration)을 넣는다.\n그 시간 동안 S-GW는 패킷을 모아 두고 DDN을 다시 보내지 않는다.\nUE가 깨어나 신호를 보내면 MME가 사용자 평면을 설정해 버퍼링된 데이터를 내려보낸다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (2단계)"}, {"id": "epc-0015", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "eDRX(확장 휴지 모드 DRX)가 적용된 UE 앞으로 DDN이 왔다. MME는 언제 Paging을 보내는가?", "choices": ["UE의 다음 페이징 시점(PO) 직전에", "DDN을 받은 즉시 바로", "UE의 다음 주기적 TAU 때", "UE의 Active Time이 끝난 직후"], "answer": 0, "explain": "eDRX UE는 긴 주기마다 잠깐씩만 페이징을 들으므로, MME는 UE의 다음 페이징 시점 직전에 페이징한다.\nUE는 Attach나 TAU 때 eDRX 파라미터를 요청하고, MME가 받아들일지 정한다.\nActive Time은 PSM의 타이머다. PSM에 들어간 UE는 페이징 자체를 받지 않는다.\n", "ref": "3GPP TS 23.401 §5.3.4.3 (3a단계), §5.13a, §4.3.22"}, {"id": "epc-0016", "type": "order", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "ECM-IDLE UE가 보낼 데이터가 생겨 사용자 평면을 다시 세우는 흐름(UE triggered Service Request)을 순서·방향까지 맞춰라.", "items": [{"msg": "Service Request", "from": "UE", "to": "MME"}, {"msg": "Initial Context Setup Req", "from": "MME", "to": "eNodeB"}, {"msg": "무선 베어러 설정", "from": "eNodeB", "to": "UE"}, {"msg": "Initial Context Setup Cmpl", "from": "eNodeB", "to": "MME"}, {"msg": "Modify Bearer Request", "from": "MME", "to": "S-GW"}, {"msg": "Modify Bearer Response", "from": "S-GW", "to": "MME"}], "decoys": [{"msg": "Downlink Data Notification", "from": "S-GW", "to": "MME"}, {"msg": "Create Session Request", "from": "MME", "to": "S-GW"}], "explain": "UE는 S-TMSI와 함께 NAS Service Request를 보낸다. eNodeB는 이를 S1-AP Initial UE Message로 MME에 넘긴다.\nMME는 Initial Context Setup Request로 S-GW 주소와 상향 TEID, 보안 컨텍스트를 eNodeB에 준다.\neNodeB는 무선 베어러를 세운다. 이때부터 업링크 데이터를 S-GW로 보낼 수 있다.\neNodeB는 Initial Context Setup Complete로 자기 주소와 하향 TEID를 MME에 알린다.\nMME가 Modify Bearer Request로 이 정보를 S-GW에 넘기면 다운링크도 흐를 수 있다.\nDDN은 망이 시작하는 경우의 메시지이고, Create Session은 새 PDN 연결을 만들 때 쓴다.\n조각 이름은 Req(Request)·Cmpl(Complete)로 줄여 적었다.\n", "ref": "3GPP TS 23.401 §5.3.4.1 (1~12단계)"}, {"id": "epc-0017", "type": "order", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "일정 시간 데이터가 없어 eNodeB가 UE를 휴지(ECM-IDLE) 상태로 보내는 S1 release 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "UE Context Release Req", "from": "eNodeB", "to": "MME"}, {"msg": "Release Access Bearers Req", "from": "MME", "to": "S-GW"}, {"msg": "Release Access Bearers Resp", "from": "S-GW", "to": "MME"}, {"msg": "UE Context Release Cmd", "from": "MME", "to": "eNodeB"}, {"msg": "RRC Connection Release", "from": "eNodeB", "to": "UE"}, {"msg": "UE Context Release Cmpl", "from": "eNodeB", "to": "MME"}], "decoys": [{"msg": "Delete Session Request", "from": "MME", "to": "S-GW"}, {"msg": "Detach Request", "from": "MME", "to": "UE"}], "explain": "eNodeB가 사용자 무활동(User Inactivity) 등을 원인으로 S1 UE Context Release Request를 보낸다.\nMME는 Release Access Bearers로 S-GW의 S1-U 베어러(eNodeB 쪽 정보)를 해제한다.\n그다음 S1 UE Context Release Command를 eNodeB에 보낸다.\neNodeB는 RRC Connection Release로 UE의 무선 연결을 끊고 UE 컨텍스트를 지운 뒤, Release Complete로 확인한다.\n휴지는 PDN 연결과 베어러를 유지한다. 그래서 세션을 지우는 Delete Session이나 등록을 끊는 Detach는 쓰지 않는다.\nMME가 시작하는 S1 release는 첫 단계 없이 Release Access Bearers부터 시작한다.\n조각 이름은 S1-AP의 S1 접두어를 빼고 Req·Resp·Cmd·Cmpl로 줄여 적었다.\n", "ref": "3GPP TS 23.401 §5.3.5 (Figure 5.3.5-1, 1b~6단계)"}, {"id": "epc-0018", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "eNodeB가 S1 UE Context Release Request에 넣는 원인 값 중, 일정 시간 주고받은 데이터가 없을 때 쓰는 것은?", "choices": ["User Inactivity", "O&M Intervention", "Unspecified Failure", "Radio Connection With UE Lost"], "answer": 0, "explain": "User Inactivity(사용자 무활동)가 가장 흔한 휴지 진입 원인이다.\nO&M Intervention은 운용자 조작, Unspecified Failure는 분류되지 않은 오류다.\nRadio Connection With UE Lost는 무선 연결이 끊긴 비정상 해제다.\n원인에 따라 GBR 베어러 처리가 다르다. User Inactivity면 MME가 GBR 베어러를 유지한다.\n무선 연결이 끊긴 경우에는 S1 release 뒤 GBR 베어러를 비활성화한다.\n", "ref": "3GPP TS 23.401 §5.3.5 (1b, 6단계)"}, {"id": "epc-0019", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "S1 release 중 Release Access Bearers Request를 받은 S-GW가 지우는 정보는?", "choices": ["eNodeB 주소와 eNodeB 쪽 TEID", "UE의 모든 베어러와 PDN 연결", "P-GW와 맺은 S5 터널 정보", "자신이 할당한 S1-U 상향 TEID"], "answer": 0, "explain": "S-GW는 그 UE의 eNodeB 관련 정보(주소와 TEID)만 지운다. 나머지 S-GW 컨텍스트는 그대로다.\n자신이 할당한 S1-U 설정(상향 주소·TEID)도 유지한다. 그래서 다음 Service Request 때 MME가 이 값을 eNodeB에 다시 준다.\n이후 하향 패킷이 오면 보낼 eNodeB가 없으므로 버퍼링하고 DDN을 보낸다.\n", "ref": "3GPP TS 23.401 §5.3.5 (3단계)"}, {"id": "epc-0020", "type": "ox", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "S1 release로 UE가 ECM-IDLE이 되어도, non-GBR EPS 베어러는 MME와 S-GW에 그대로 남는다.", "answer": true, "explain": "맞다. S1 release 뒤 MME는 eNodeB 관련 정보만 지우고, S-GW의 S1-U 설정을 포함한 나머지 컨텍스트를 유지한다.\nnon-GBR 베어러는 MME와 S-GW에 모두 보존된다.\n그래서 다시 통신할 때 PDN 연결을 새로 만들지 않고 Service Request만으로 사용자 평면을 되살린다.\n", "ref": "3GPP TS 23.401 §5.3.5 (6단계)"}, {"id": "epc-0021", "type": "ox", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "ECM-IDLE 상태가 되어도 eNodeB에는 그 UE의 컨텍스트가 남아 있다.", "answer": false, "explain": "아니다. S1 release가 끝나면 eNodeB는 그 UE의 컨텍스트를 모두 지운다. ECM-IDLE UE에는 S1-MME도 S1-U도 없다.\n예외가 User Plane CIoT 최적화로 RRC 연결을 일시 중단(suspend)한 UE다. 이 경우 eNodeB가 컨텍스트를 보관한다.\n그래서 UE는 Service Request 대신 Connection Resume으로 빠르게 돌아온다.\n", "ref": "3GPP TS 23.401 §4.6.3.1, §5.3.5"}, {"id": "epc-0022", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "PSM(Power Saving Mode)을 쓰는 UE가 실제로 PSM에 들어가는 시점은?", "choices": ["ECM-IDLE이 된 뒤 Active 타이머가 만료될 때", "주기적 TAU 타이머가 만료될 때", "S1 release가 끝나는 바로 그때", "eDRX 주기 하나가 끝날 때"], "answer": 0, "explain": "UE는 Attach나 TAU 때 Active Time 값을 요청하고, 망이 값을 정해 준다.\nUE와 MME는 ECM-CONNECTED에서 ECM-IDLE로 바뀔 때 이 값으로 Active 타이머를 시작한다.\n타이머가 만료되면 UE는 무선(Access Stratum) 기능을 끄고 PSM에 들어간다.\n그 전까지는 일반 휴지 상태라 페이징을 받을 수 있다.\n주기적 TAU 타이머는 PSM에서 다시 깨어나는 시점을 정한다.\n", "ref": "3GPP TS 23.401 §4.3.22"}, {"id": "epc-0023", "type": "ox", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "UE가 PSM에 들어가면 MME는 그 UE를 EMM-DEREGISTERED 상태로 바꾼다.", "answer": false, "explain": "아니다. MME는 PSM 중인 UE를 EMM-REGISTERED로 보되, 페이징으로는 도달할 수 없다고 본다.\n등록은 유지되므로 UE는 깨어난 뒤 Attach를 다시 할 필요가 없다.\nPSM 중 하향 데이터는 extended buffering 같은 고지연 통신 기능으로 처리한다.\n", "ref": "3GPP TS 23.401 §4.3.22, §5.3.4.3 (2단계)"}, {"id": "epc-0024", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "PSM에 들어간 UE가 다시 무선 기능을 켜고 망과 통신하는 경우는?", "choices": ["주기적 TAU 시점이 되거나 보낼 데이터가 생길 때", "MME가 Paging을 보내 UE를 깨울 때", "S-GW가 MME에 DDN을 보낼 때", "Active 타이머가 다시 시작될 때"], "answer": 0, "explain": "PSM 중에도 UE는 주기적 TAU 타이머 같은 NAS 타이머를 계속 돌린다.\nUE는 주기적 TAU 전에 무선 기능을 다시 켜고 TAU를 한다.\n보낼 데이터가 생기면 언제든 깨어날 수 있다.\nPSM 중에는 무선 기능이 꺼져 있어 페이징을 받지 못한다. DDN이 와도 MME가 깨울 수 없다.\n", "ref": "3GPP TS 23.401 §4.3.22"}, {"id": "epc-0025", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 3, "tags": ["message-flow"], "question": "UE triggered Service Request에서 S-GW가 UE 쪽으로 하향 데이터를 보낼 수 있게 되는 시점은?", "choices": ["MME의 Modify Bearer Request로 eNodeB 주소·하향 TEID를 받은 뒤", "UE가 NAS Service Request를 eNodeB로 보낸 직후", "eNodeB가 Initial Context Setup Request를 받은 직후", "UE의 첫 업링크 패킷이 S-GW에 도착한 직후"], "answer": 0, "explain": "하향 데이터를 보내려면 S-GW가 eNodeB 주소와 eNodeB 쪽 S1 TEID를 알아야 한다.\n이 정보는 eNodeB → MME(Initial Context Setup Complete) → S-GW(Modify Bearer Request) 순서로 전달된다.\n반대로 eNodeB는 Initial Context Setup Request에서 S-GW 주소와 상향 TEID를 받는다. 그래서 업링크가 먼저 열린다.\n", "ref": "3GPP TS 23.401 §5.3.4.1 (4, 6~8단계)"}, {"id": "epc-0026", "type": "ox", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["message-flow"], "question": "Service Request 뒤 UE의 업링크 데이터는 MME가 S-GW에 Modify Bearer Request를 보내기 전에 이미 S-GW에 도착할 수 있다.", "answer": true, "explain": "맞다. 무선 베어러가 세워지면 eNodeB는 상향 데이터를 S-GW로 바로 보낼 수 있다.\nS-GW 주소와 상향 TEID는 Initial Context Setup Request로 이미 받았기 때문이다.\nModify Bearer Request는 그 뒤에 가며, 하향 방향(eNodeB 주소·하향 TEID)을 S-GW에 알려 준다.\n", "ref": "3GPP TS 23.401 §5.3.4.1 (6~8단계)"}, {"id": "epc-0027", "type": "match", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["concept", "transport"], "question": "EPC 레퍼런스 포인트와 그 구간·역할을 짝지어라.", "pairs": [{"left": "S1-MME", "right": "eNodeB ↔ MME 제어 평면"}, {"left": "S1-U", "right": "eNodeB ↔ S-GW 베어러별 사용자 평면 터널"}, {"left": "S11", "right": "MME ↔ S-GW 제어 평면"}, {"left": "S5", "right": "S-GW ↔ P-GW 사용자 평면 터널과 터널 관리"}, {"left": "SGi", "right": "P-GW ↔ 외부 패킷 데이터망"}], "explain": "업링크는 UE → eNodeB → (S1-U) → S-GW → (S5) → P-GW → (SGi) → 외부망으로 흐른다. 다운링크는 그 반대다.\nS1-MME와 S11은 제어 신호용이다. S1-U와 S5는 GTP 기반 사용자 평면 터널이다.\nC-SGN처럼 S-GW와 P-GW를 한 장비에 넣으면 S5는 장비 내부 구간이 된다.\n", "ref": "3GPP TS 23.401 §4.2.3, Annex L.4"}, {"id": "epc-0028", "type": "mcq", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["transport"], "question": "S1-U(eNodeB ↔ S-GW) 구간에서 사용자 패킷을 터널로 실어 나르는 프로토콜은?", "choices": ["GTP-U", "GTP-C", "S1-AP", "Diameter"], "answer": 0, "explain": "S1-U는 GTP-U로 사용자 패킷을 베어러별 터널에 담아 나른다. 터널은 TEID로 구분한다.\nGTP-C는 S11·S5의 제어 메시지(Create Session, Modify Bearer 등)에 쓴다.\nS1-AP는 S1-MME의 제어 프로토콜이고, Diameter는 S6a 같은 가입자 정보 인터페이스에 쓴다.\n", "ref": "3GPP TS 23.401 §4.2.3"}, {"id": "epc-0029", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 3, "tags": ["concept"], "question": "Control Plane CIoT 최적화를 쓰는 UE의 소량 업링크 데이터는 어떻게 망에 전달되는가?", "choices": ["NAS 메시지에 담겨 eNodeB를 거쳐 MME로 간다", "S1-U GTP-U 터널로 S-GW에 바로 간다", "SMS로 바뀌어 MSC를 거쳐 전달된다", "RRC 메시지에만 실려 eNodeB에서 끝난다"], "answer": 0, "explain": "Control Plane CIoT 최적화에서는 사용자 데이터를 NAS PDU에 EPS Bearer ID와 함께 담는다.\neNodeB는 NAS PDU를 S1-AP로 MME에 넘기고, MME가 무결성을 확인하고 복호한다.\n그다음 MME가 S11-U로 S-GW에 넘긴다.\n무선 베어러와 S1-U를 세우지 않아 신호가 줄어든다. 그래서 C-SGN의 소량 데이터 전송에 쓴다.\nS1-U 베어러가 세워져 있으면 UE는 S1-U로 데이터를 보내야 한다.\n", "ref": "3GPP TS 23.401 §5.3.4B.1, §5.3.4B.2"}, {"id": "epc-0030", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept", "transport"], "question": "Control Plane CIoT 최적화에서 MME와 S-GW 사이에 사용자 데이터를 나르는 레퍼런스 포인트는?", "choices": ["S11-U", "S1-U", "S11", "S5"], "answer": 0, "explain": "S11은 MME와 S-GW 사이의 제어 평면이다. Control Plane CIoT 최적화를 위해 같은 구간에 사용자 평면 S11-U를 둔다.\nS1-U는 eNodeB와 S-GW 사이 구간이라 Control Plane CIoT 최적화에는 쓰지 않는다.\nS5는 S-GW와 P-GW 사이 구간이다.\n", "ref": "3GPP TS 23.401 §4.2.3, §5.3.4B.1"}, {"id": "epc-0031", "type": "ox", "topic": "EPC", "difficulty": "advanced", "importance": 1, "tags": ["concept"], "question": "Control Plane CIoT 최적화에서 업링크 IP 헤더 압축(ROHC)은 eNodeB가 해제한다.", "answer": false, "explain": "아니다. 헤더 압축은 UE와 MME 사이에서 한다.\n업링크는 UE가 압축하고 MME가 해제한다. 다운링크는 MME가 압축하고 UE가 해제한다.\n데이터가 NAS PDU에 담겨 eNodeB를 그대로 지나가기 때문이다.\n압축 설정은 PDN 연결을 만들 때 정한다.\n", "ref": "3GPP TS 23.401 §5.3.4B.1"}, {"id": "epc-0032", "type": "mcq", "topic": "EPC", "difficulty": "advanced", "importance": 1, "tags": ["concept"], "question": "Control Plane CIoT 최적화로 업링크 데이터를 보내는 UE가, 이후 주고받을 데이터가 없다고 NAS PDU에 함께 알리는 정보는?", "choices": ["Release Assistance Information", "Paging Restriction Information", "DL Buffering Requested", "Active Time"], "answer": 0, "explain": "UE는 NAS Release Assistance Information으로 이후 데이터가 없다고 알린다. 응답 하향 데이터가 한 번만 올 예정이라고도 알릴 수 있다.\nMME는 이 정보를 보고 연결을 일찍 해제(S1 release)해 신호와 전력을 아낀다.\nDL Buffering Requested는 MME가 S-GW에 보내는 확장 버퍼링 요청이다.\nActive Time은 PSM 진입 전 대기 시간이다.\n", "ref": "3GPP TS 23.401 §5.3.4B.2 (1단계), §5.3.5"}, {"id": "epc-0033", "type": "open", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "LTE Attach 절차의 큰 흐름을 인증 → 위치 등록 → 베어러 생성 → 수락 순으로, 각 단계에서 MME가 누구와 무엇을 주고받는지 설명하라.", "answer": "단말이 Attach Request를 보낸다.\nMME는 HSS에서 AIR/AIA로 인증 벡터를 받아 단말과 EPS AKA 인증을 한다.\n인증이 끝나면 ULR/ULA로 HSS에 서빙 MME로 등록하고 가입자 데이터를 받는다.\n그다음 S-GW(→ P-GW)에 Create Session으로 기본 베어러를 만든다. 이때 P-GW가 단말 주소를 할당한다.\n단말에 Attach Accept를 보내고, Attach Complete를 받으면 Modify Bearer로 하향 경로를 완성한다.\n", "points": ["AIR/AIA로 인증 벡터, EPS AKA 인증", "ULR/ULA로 위치 등록·가입자 데이터", "Create Session으로 기본 베어러(P-GW가 단말 주소 할당)", "Attach Accept → Attach Complete → Modify Bearer"], "explain": "IMS 등록의 MAR(인증) → SAR(등록)과 같은 \"인증 → 등록\" 구조다.\n", "ref": "3GPP TS 23.401 §5.3.2.1; TS 29.272 §5.2.1.1, §5.2.3.1"}, {"id": "epc-0034", "type": "open", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "ECM-IDLE 상태 단말 앞으로 하향 데이터가 왔을 때, 데이터가 단말에 전달되기까지의 과정을 설명하라.", "answer": "S-GW는 그 단말의 하향 TEID가 없으므로 패킷을 버퍼링하고 MME에 Downlink Data Notification(DDN)을 보낸다.\nMME는 DDN Ack로 답하고, 단말이 등록된 TA 목록의 eNodeB들에 Paging을 보낸다.\n페이징을 받은 단말이 Service Request를 보낸다.\nInitial Context Setup과 Modify Bearer로 무선 구간과 S1-U가 다시 열리면, S-GW가 버퍼링한 데이터를 내려보낸다.\n", "points": ["S-GW가 버퍼링하고 MME에 DDN", "MME가 TA 목록의 eNodeB들에 Paging", "단말이 Service Request로 응답", "Modify Bearer로 하향 TEID를 받은 S-GW가 데이터 전달"], "explain": "PSM·eDRX 때문에 지금 깨울 수 없으면 MME가 DDN Ack로 S-GW에 버퍼링을 더 오래 하게 한다(extended buffering).\n", "ref": "3GPP TS 23.401 §5.3.4.1, §5.3.4.3"}, {"id": "epc-0035", "type": "open", "topic": "EPC", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "S1 release로 단말이 ECM-IDLE이 될 때, eNodeB·MME·S-GW에서 각각 무엇이 지워지고 무엇이 남는지 설명하라.", "answer": "eNodeB는 그 단말의 컨텍스트를 모두 지운다.\nS-GW는 eNodeB 주소와 eNodeB 쪽 TEID만 지운다. 자신이 할당한 S1-U 설정과 베어러는 유지하고, 이후 오는 하향 패킷은 버퍼링한다.\nMME는 eNodeB 관련 정보(S1-AP ID 등)만 지우고, 나머지 단말 컨텍스트와 S-GW의 S1-U 정보를 유지한다.\n등록(EMM-REGISTERED)과 non-GBR 베어러가 남으므로, 다시 통신할 때는 Service Request만 하면 된다.\n", "points": ["eNodeB: 단말 컨텍스트 삭제", "S-GW: eNodeB 주소·TEID만 삭제, 자기 S1-U 설정과 베어러 유지, 하향 버퍼링", "MME: eNodeB 관련 정보만 삭제, 나머지 유지", "등록과 non-GBR 베어러 유지 → Service Request로 복귀"], "explain": "User Plane CIoT 최적화로 RRC 연결을 일시 중단(suspend)한 경우에는 eNodeB가 컨텍스트를 보관한다.\n", "ref": "3GPP TS 23.401 §4.6.3.1, §5.3.5"}, {"id": "epc-0036", "type": "open", "topic": "EPC", "difficulty": "advanced", "importance": 3, "tags": ["message-flow", "transport"], "question": "UE triggered Service Request에서 업링크가 다운링크보다 먼저 열리는 이유를 TEID로 설명하라.", "answer": "TEID는 받는 쪽이 정해서 보내는 쪽에 알려 준다.\nMME는 Initial Context Setup Request로 S-GW 주소와 S-GW가 정한 상향 TEID를 eNodeB에 바로 준다. 그래서 무선 베어러가 서면 eNodeB가 업링크를 보낼 수 있다.\n하향 TEID는 eNodeB가 정해 Initial Context Setup Complete로 MME에 알린다.\nMME가 Modify Bearer Request로 이것을 S-GW에 넘긴 뒤에야 S-GW가 다운링크를 보낼 수 있다.\n", "points": ["TEID는 받는 쪽이 정한다", "상향 TEID(S-GW 것)는 Initial Context Setup Request로 eNodeB에 바로 전달 → 업링크 먼저", "하향 TEID(eNodeB 것)는 Complete → Modify Bearer Request로 S-GW에 전달된 뒤 다운링크"], "explain": "S-GW는 S1 release 때 eNodeB 쪽 TEID를 지웠기 때문에 Modify Bearer Request 전에는 하향으로 보낼 곳이 없다.\n", "ref": "3GPP TS 23.401 §5.3.4.1, §5.3.5; TS 29.281 §3.1"}, {"id": "epc-0037", "type": "open", "topic": "EPC", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "EMM 상태와 ECM 상태가 각각 무엇을 나타내는지, 그리고 휴지 단말은 보통 어떤 조합인지 설명하라.", "answer": "EMM은 등록 여부를 나타낸다. EMM-REGISTERED면 MME가 단말 위치를 TA 목록 단위로 알고, EMM-DEREGISTERED면 위치를 몰라 페이징할 수 없다.\nECM은 신호 연결 여부를 나타낸다. ECM-CONNECTED면 RRC와 S1-MME로 된 신호 연결이 있고 위치를 eNodeB 단위로 안다. ECM-IDLE이면 신호 연결이 없다.\n휴지 단말은 보통 EMM-REGISTERED이면서 ECM-IDLE이다.\n", "points": ["EMM = 등록 여부(REGISTERED면 위치를 TA 목록 단위로 앎)", "ECM = 신호 연결 여부(CONNECTED면 RRC + S1-MME, eNodeB 단위로 앎)", "휴지 단말 = EMM-REGISTERED + ECM-IDLE"], "explain": "두 상태는 따로 움직인다. S1 release는 ECM만 바꾸고 EMM 등록은 그대로 둔다.\n", "ref": "3GPP TS 23.401 §4.6.2, §4.6.3"}, {"id": "epc-0038", "type": "open", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept"], "question": "PSM과 eDRX가 각각 휴지 단말의 전력을 어떻게 아끼는지, 하향 데이터가 올 때 어떻게 다른지 설명하라.", "answer": "PSM은 휴지가 된 뒤 Active 타이머가 끝나면 단말이 무선 기능을 끄는 방식이다.\nPSM 중에는 페이징을 받지 않고, 주기적 TAU 때나 보낼 데이터가 생기면 깨어난다. MME는 단말을 등록 상태로 두되 도달할 수 없다고 본다.\neDRX는 페이징을 듣는 주기를 길게 늘리는 방식이라, 페이징은 받되 늦게 받는다.\n하향 데이터가 오면 eDRX 단말은 MME가 다음 페이징 시점 직전에 페이징하고, PSM 단말은 깨어날 때까지 S-GW가 버퍼링을 더 오래 한다(extended buffering).\n", "points": ["PSM: Active 타이머 후 무선 기능을 꺼서 페이징을 못 받음", "PSM 해제: 주기적 TAU나 보낼 데이터가 생길 때", "eDRX: 페이징 주기를 늘림, MME가 다음 페이징 시점 직전에 페이징", "PSM 단말 앞 하향 데이터는 extended buffering"], "explain": "두 기능 모두 단말이 Attach·TAU 때 요청하고 망이 값을 정한다.\n", "ref": "3GPP TS 23.401 §4.3.22, §5.13a, §5.3.4.3"}, {"id": "epc-0039", "type": "open", "topic": "EPC", "difficulty": "advanced", "importance": 2, "tags": ["concept", "transport"], "question": "Control Plane CIoT 최적화에서 단말의 소량 업링크 데이터가 S-GW까지 가는 경로를, 일반 사용자 평면 경로와 비교해 설명하라.", "answer": "일반 사용자 평면에서는 단말 → eNodeB → S1-U(GTP-U 터널) → S-GW로 데이터가 간다.\nControl Plane CIoT 최적화에서는 무선 베어러와 S1-U를 세우지 않는다.\n데이터를 NAS 메시지에 EPS Bearer ID와 함께 담아 eNodeB를 거쳐(S1-AP) MME로 보낸다.\nMME가 무결성을 확인하고 복호한 뒤 S11-U로 S-GW에 넘긴다.\nIP 헤더 압축(ROHC)은 단말과 MME 사이에서 한다.\n", "points": ["일반: eNodeB → S1-U → S-GW", "CP CIoT: NAS 메시지(EPS Bearer ID 포함)로 MME에 전달", "MME → S11-U → S-GW", "ROHC는 단말과 MME 사이"], "explain": "무선 베어러와 S1-U를 세우는 신호가 없어 소량 데이터에 유리하다. 그래서 C-SGN이 지원하는 CIoT 기능이다.\n", "ref": "3GPP TS 23.401 §4.2.3, §5.3.4B.1, §5.3.4B.2"}, {"id": "ims-0001", "type": "steps", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "concept"], "question": "단말이 IMS에 처음 등록될 때(핸드폰이 IMS에 올라올 때)의 전체 절차를, 각 단계의 대상(누가→누구)과 동작을 골라 순서대로 완성하라.", "actors": ["UE", "P-CSCF", "I-CSCF", "S-CSCF", "HSS"], "steps": [{"from": "UE", "to": "P-CSCF", "act": "REGISTER"}, {"from": "P-CSCF", "to": "I-CSCF", "act": "REGISTER"}, {"from": "I-CSCF", "to": "HSS", "act": "UAR/UAA", "rt": true}, {"from": "I-CSCF", "to": "S-CSCF", "act": "REGISTER"}, {"from": "S-CSCF", "to": "HSS", "act": "MAR/MAA", "rt": true}, {"from": "S-CSCF", "to": "UE", "act": "401 챌린지"}, {"from": "UE", "to": "S-CSCF", "act": "재-REGISTER"}, {"from": "S-CSCF", "to": "HSS", "act": "SAR/SAA", "rt": true}, {"from": "S-CSCF", "to": "UE", "act": "200 OK"}], "decoys": [{"from": "I-CSCF", "to": "HSS", "act": "LIR/LIA"}, {"from": "P-CSCF", "to": "PCRF", "act": "AAR/AAA"}], "glossary": {"REGISTER": "SIP REGISTER · 단말이 자신의 현재 위치(Contact)를 등록", "UAR/UAA": "User-Authorization-Request/Answer · Cx · I-CSCF가 등록 인가받고 배정할 S-CSCF를 HSS에서 확인", "MAR/MAA": "Multimedia-Auth-Request/Answer · Cx · S-CSCF가 HSS에서 인증 벡터(AV)를 받아 401 챌린지", "401 챌린지": "SIP 401 Unauthorized · S-CSCF가 인증 챌린지(RAND/AUTN 등)를 발행", "재-REGISTER": "SIP REGISTER 재전송 · 401에 자격증명(RES) 담아 재등록", "SAR/SAA": "Server-Assignment-Request/Answer · Cx · S-CSCF가 자신을 사용자에 할당하고 프로필 다운로드", "200 OK": "SIP 200 OK · 등록 성공 확인", "LIR/LIA": "Location-Info-Request/Answer · Cx · 착신 시 I-CSCF가 서빙 S-CSCF를 HSS에 조회(등록 아님)", "AAR/AAA": "AA-Request/Answer · Rx · P-CSCF가 PCRF에 미디어 자원 인가 요청(세션용, 등록 아님)"}, "explain": "등록은 SIP REGISTER 릴레이(UE→P-CSCF→I-CSCF→S-CSCF)에 Cx가 세 번 맞물린다:\nI-CSCF의 UAR/UAA(S-CSCF 선택) → S-CSCF의 MAR/MAA(인증 벡터→401 챌린지) → 재등록 후\nS-CSCF의 SAR/SAA(서버 할당·프로필). 대상 축에서 UAR는 I-CSCF↔HSS, MAR·SAR는\nS-CSCF↔HSS라는 점이 핵심. LIR/LIA(착신)·AAR/AAA(Rx 미디어)는 등록에 없어 decoy다.\n(401/200은 실제로는 I-CSCF·P-CSCF를 거쳐 UE로 가지만 여기선 S-CSCF↔UE로 압축.)\n", "ref": "3GPP TS 24.229; TS 29.228 (등록 흐름)"}, {"id": "ims-0002", "type": "steps", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "concept"], "question": "다른 사람이 이 IMS 가입자에게 전화를 걸었을 때(착신, terminating)의 전체 절차를, 각 단계의 대상과 동작을 골라 순서대로 완성하라.", "actors": ["UE", "I-CSCF", "S-CSCF", "HSS", "발신자"], "steps": [{"from": "발신자", "to": "I-CSCF", "act": "INVITE"}, {"from": "I-CSCF", "to": "HSS", "act": "LIR/LIA", "rt": true}, {"from": "I-CSCF", "to": "S-CSCF", "act": "INVITE"}, {"from": "S-CSCF", "to": "UE", "act": "INVITE"}, {"from": "UE", "to": "발신자", "act": "180/200/ACK"}], "decoys": [{"from": "I-CSCF", "to": "HSS", "act": "UAR/UAA"}, {"from": "S-CSCF", "to": "HSS", "act": "SAR/SAA"}], "glossary": {"INVITE": "SIP INVITE · 세션(통화) 설정 요청", "LIR/LIA": "Location-Info-Request/Answer · Cx · I-CSCF가 서빙 S-CSCF 이름을 HSS에 조회", "180/200/ACK": "SIP 180 Ringing→200 OK→ACK · 호 설정 완료(벨→응답→확인)", "UAR/UAA": "User-Authorization-Request/Answer · Cx · 등록 인가·S-CSCF 선택(착신 아님)", "SAR/SAA": "Server-Assignment-Request/Answer · Cx · 서버 할당·프로필(등록 마무리, 착신 아님)"}, "explain": "착신망의 진입점 I-CSCF가 INVITE를 받으면 서빙 S-CSCF를 모르므로 LIR/LIA로 HSS에\n조회해 라우팅한다. S-CSCF가 착신 서비스(iFC)를 적용해 UE로 전달하고 호가 설정된다.\nUAR·SAR는 \"등록\" 커맨드라 착신엔 없어 decoy. 착신 조회 LIR와 등록 인가 UAR가 둘 다\nI-CSCF↔HSS라 대상만으론 못 가리고 동작으로 구분해야 한다. (P-CSCF 릴레이·미디어\n인가(Rx AAR)는 이 다이어그램에선 생략 — S-CSCF↔UE로 압축.)\n", "ref": "3GPP TS 24.229; TS 29.228 (착신 흐름)"}, {"id": "ims-0003", "type": "steps", "topic": "IMS", "difficulty": "advanced", "importance": 2, "tags": ["message-flow", "concept"], "question": "등록을 마친 IMS 가입자가 전화를 걸 때(발신, originating)의 전체 절차를, 각 단계의 대상과 동작을 골라 순서대로 완성하라.", "actors": ["UE", "P-CSCF", "S-CSCF", "PCRF", "상대망"], "steps": [{"from": "UE", "to": "P-CSCF", "act": "INVITE"}, {"from": "P-CSCF", "to": "S-CSCF", "act": "INVITE"}, {"from": "S-CSCF", "to": "상대망", "act": "INVITE"}, {"from": "P-CSCF", "to": "PCRF", "act": "AAR/AAA", "rt": true}, {"from": "상대망", "to": "UE", "act": "180/200/ACK"}], "decoys": [{"from": "I-CSCF", "to": "HSS", "act": "LIR/LIA"}, {"from": "S-CSCF", "to": "HSS", "act": "MAR/MAA"}], "glossary": {"INVITE": "SIP INVITE · 세션(통화) 설정 요청", "AAR/AAA": "AA-Request/Answer · Rx · P-CSCF(AF)가 PCRF에 미디어 정보 전달·자원 인가 요청", "180/200/ACK": "SIP 180 Ringing→200 OK→ACK · 호 설정 완료(벨→응답→확인)", "LIR/LIA": "Location-Info-Request/Answer · Cx · 착신 시 서빙 S-CSCF 조회(발신 아님)", "MAR/MAA": "Multimedia-Auth-Request/Answer · Cx · 등록 시 인증 벡터(발신 아님)"}, "explain": "발신은 P-CSCF가 등록 때 받은 Service-Route를 따라 사용자의 S-CSCF로 INVITE를 보내는\n것이 출발점이다. S-CSCF가 발신 서비스(iFC)를 적용해 상대망으로 라우팅하고, 미디어는\nRx의 AAR/AAA로 P-CSCF↔PCRF에서 인가된다(프리컨디션이면 알림 전 자원 확보). LIR(착신\n라우팅)·MAR(등록 인증)는 발신엔 없어 decoy. 2번째 INVITE는 등록 때 받은 Service-Route\n경로라는 점이 발신의 출발 포인트다.\n", "ref": "3GPP TS 24.229 (발신 흐름); TS 29.214 (Rx)"}, {"id": "ims-0004", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "단말의 첫 SIP 접점(Gm 인터페이스)이며, 로밍 시 방문망에 위치하고 미디어 정책을 위해 PCRF와 Rx로 연동하는 IMS 노드는?", "choices": ["P-CSCF", "I-CSCF", "S-CSCF", "HSS"], "answer": 0, "explain": "P-CSCF(Proxy-CSCF)는 UE의 첫 접점으로 Gm 구간을 담당한다. 로밍이면 방문망에 있고,\n미디어 자원 인가를 위해 PCRF와 Rx(AAR 등)로 연동한다.\n", "ref": "3GPP TS 23.228 (CSCF 기능)"}, {"id": "ims-0005", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "홈망의 진입점(entry point)으로, HSS에 Cx로 조회해 사용자를 담당할 S-CSCF를 찾아 라우팅하고 토폴로지 은닉을 할 수 있는 노드는?", "choices": ["I-CSCF", "P-CSCF", "S-CSCF", "AS"], "answer": 0, "explain": "I-CSCF(Interrogating-CSCF)는 외부에서 들어오는 요청의 홈망 진입점이다. Cx로 HSS에\n물어(UAR/LIR) S-CSCF를 정하고, 필요시 토폴로지 은닉(THIG)도 한다.\n", "ref": "3GPP TS 23.228 (CSCF 기능)"}, {"id": "ims-0006", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "등록 시 레지스트라 역할을 하고, 세션 제어와 iFC 기반 서비스 트리거·사용자 프로필 보유를 담당하며 항상 홈망에 상주하는 노드는?", "choices": ["S-CSCF", "P-CSCF", "I-CSCF", "HSS"], "answer": 0, "explain": "S-CSCF(Serving-CSCF)는 IMS의 핵심 세션 제어 노드다. 등록을 처리(레지스트라)하고 HSS에서\n프로필을 받아(SAR/SAA) iFC로 AS를 트리거한다. 항상 홈망에 있다.\n", "ref": "3GPP TS 23.228 (CSCF 기능)"}, {"id": "ims-0007", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "가입자 마스터 DB로서 가입 정보·인증 데이터(인증 벡터)·서비스 프로필·S-CSCF 할당 정보를 보관하는 노드는?", "choices": ["HSS", "S-CSCF", "P-CSCF", "PCRF"], "answer": 0, "explain": "HSS(Home Subscriber Server)는 사용자별 마스터 DB다. 인증 벡터·서비스 프로필·어느\nS-CSCF가 담당하는지 등을 갖고 Cx/Sh로 CSCF·AS에 제공한다.\n", "ref": "3GPP TS 23.228 (HSS)"}, {"id": "ims-0008", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "S-CSCF가 iFC 판정에 따라 세션을 넘겨 실제 서비스 로직(착신전환·통화녹음 등)을 실행하는 노드와, 그 사이 인터페이스가 옳게 짝지어진 것은?", "choices": ["AS — ISC", "P-CSCF — Gm", "HSS — Cx", "PCRF — Rx"], "answer": 0, "explain": "서비스 로직은 AS(Application Server)가 실행하고, S-CSCF↔AS 구간은 ISC 레퍼런스\n포인트다. AS는 가입자 데이터가 필요하면 Sh로 HSS와 통신한다.\n", "ref": "3GPP TS 23.228 (ISC/AS)"}, {"id": "ims-0009", "type": "ox", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "S-CSCF는 항상 사용자의 홈망에 위치하며, I-CSCF는 주로 등록과 착신 라우팅 시 HSS 조회를 위해 관여한다.", "answer": true, "explain": "맞다. S-CSCF는 홈망 상주 세션 제어 노드이고, I-CSCF는 홈망 진입점으로 등록(UAR)·착신\n(LIR) 때 HSS에 물어 S-CSCF를 찾는 역할이 주다.\n", "ref": "3GPP TS 23.228 (CSCF 기능)"}, {"id": "ims-0010", "type": "ox", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "P-CSCF가 그 사용자를 담당할 S-CSCF를 직접 선택한다.", "answer": false, "explain": "아니다. S-CSCF 선택은 I-CSCF가 HSS 조회(UAR/UAA)로 정한다. P-CSCF는 단말의 첫 접점\n이자 SIP 프록시일 뿐, S-CSCF를 고르지 않는다.\n", "ref": "3GPP TS 23.228 (등록 절차)"}, {"id": "ims-0011", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "IMS 등록·인증에 쓰이고 ISIM에 저장되며 통화 상대에게 노출되지 않는, NAI (user@realm) 형식의 사설 식별자는?", "choices": ["IMPI (사설 식별자)", "IMPU (공개 식별자)", "IMSI", "GRUU"], "answer": 0, "explain": "IMPI(IMS Private Identity)는 홈 사업자가 부여하는 인증/등록용 사설 식별자로 NAI\n형식이며 ISIM에 저장된다. 통화 상대에게 노출되는 것은 IMPU다.\n", "ref": "3GPP TS 23.228 (사용자 식별자)"}, {"id": "ims-0012", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "다른 사용자가 이 사용자에게 도달할 때 쓰는 sip:/tel: URI 형식의 공개 식별자 (한 가입에 여러 개 가능)는?", "choices": ["IMPU (공개 식별자)", "IMPI (사설 식별자)", "IMEI", "Call-ID"], "answer": 0, "explain": "IMPU(IMS Public Identity)는 남들이 나에게 연결할 때 쓰는 공개 주소(sip:/tel:)로, 한\n가입에 여러 개를 둘 수 있다(업무용/개인용 등). 인증용 사설 식별자는 IMPI다.\n", "ref": "3GPP TS 23.228 (사용자 식별자)"}, {"id": "ims-0013", "type": "ox", "topic": "IMS", "difficulty": "basic", "importance": 1, "tags": ["concept"], "question": "IMPU(공개 식별자)는 한 가입자당 정확히 하나만 존재한다.", "answer": false, "explain": "아니다. IMPU는 한 가입에 여러 개를 둘 수 있다(예: 업무용/개인용 번호). 인증에 쓰이는\nIMPI와 도달에 쓰이는 IMPU를 구분하는 게 핵심이다.\n", "ref": "3GPP TS 23.228 (사용자 식별자)"}, {"id": "ims-0014", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "UE와 P-CSCF 사이의 SIP 레퍼런스 포인트(단말-망 접점) 이름은?", "choices": ["Gm", "Mw", "Cx", "ISC"], "answer": 0, "explain": "Gm은 UE↔P-CSCF 구간이다. CSCF들 사이는 Mw, CSCF↔HSS는 Cx, S-CSCF↔AS는 ISC로\n구간마다 이름이 정해져 있다.\n", "ref": "3GPP TS 23.228 (레퍼런스 포인트)"}, {"id": "ims-0015", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept"], "question": "S-CSCF와 Application Server(AS) 사이의 레퍼런스 포인트는?", "choices": ["ISC", "Cx", "Sh", "Rx"], "answer": 0, "explain": "ISC(IMS Service Control)는 S-CSCF↔AS 구간으로, iFC에 걸리면 이 경로로 세션을 AS에\n넘긴다. Cx(CSCF↔HSS)·Sh(AS↔HSS)·Rx(P-CSCF↔PCRF)와 구분한다.\n", "ref": "3GPP TS 23.228 (레퍼런스 포인트)"}, {"id": "ims-0016", "type": "mcq", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["concept", "command-code"], "question": "UAR/MAR/SAR/LIR(등록·인증·서버할당·착신조회)가 오가는, CSCF와 HSS 사이의 레퍼런스 포인트는?", "choices": ["Cx", "Gm", "Mw", "ISC"], "answer": 0, "explain": "Cx는 I/S-CSCF↔HSS 구간으로 등록 인가(UAR)·인증(MAR)·서버 할당(SAR)·착신 조회(LIR)를\n나른다(diam-0001~). 같은 HSS라도 AS와의 구간은 Sh다.\n", "ref": "3GPP TS 23.228 (레퍼런스 포인트); TS 29.228"}, {"id": "ims-0017", "type": "ox", "topic": "IMS", "difficulty": "basic", "importance": 1, "tags": ["concept"], "question": "P-CSCF·I-CSCF·S-CSCF 등 CSCF들 사이의 SIP 구간은 Mw 레퍼런스 포인트다.", "answer": true, "explain": "맞다. CSCF 간 SIP 구간은 Mw다. UE↔P-CSCF는 Gm, CSCF↔HSS는 Cx로, 같은 SIP라도\n구간마다 레퍼런스 포인트 이름이 다르다.\n", "ref": "3GPP TS 23.228 (레퍼런스 포인트)"}, {"id": "ims-0018", "type": "steps", "topic": "IMS", "difficulty": "advanced", "importance": 3, "tags": ["message-flow", "concept"], "question": "핸드폰을 켜서 LTE 망에 처음 접속(EPC Attach)할 때의 전체 절차를, 각 단계의 대상(누가→누구)과 동작을 골라 순서대로 완성하라.", "actors": ["UE", "MME", "S-GW", "HSS"], "steps": [{"from": "UE", "to": "MME", "act": "Attach Request"}, {"from": "MME", "to": "HSS", "act": "AIR/AIA", "rt": true}, {"from": "MME", "to": "UE", "act": "인증요청/인증응답", "rt": true}, {"from": "MME", "to": "HSS", "act": "ULR/ULA", "rt": true}, {"from": "MME", "to": "S-GW", "act": "Create Session Req/Resp", "rt": true}, {"from": "MME", "to": "UE", "act": "Attach Accept"}, {"from": "UE", "to": "MME", "act": "Attach Complete"}, {"from": "MME", "to": "S-GW", "act": "Modify Bearer Req/Resp", "rt": true}], "decoys": [{"from": "MME", "to": "HSS", "act": "PUR/PUA"}, {"from": "S-CSCF", "to": "HSS", "act": "SAR/SAA"}, {"from": "UE", "to": "MME", "act": "Detach Request"}], "glossary": {"Attach Request": "NAS Attach Request · UE가 망 접속을 요청(IMSI 또는 이전 GUTI 포함)", "AIR/AIA": "Authentication-Information-Request/Answer · S6a · MME가 HSS에서 인증 벡터를 받음", "인증요청/인증응답": "EPS AKA · MME가 RAND·AUTN을 보내고, UE가 RES로 응답(MME가 XRES와 비교)", "ULR/ULA": "Update-Location-Request/Answer · S6a · MME가 서빙 MME로 등록하고 가입자 데이터를 받음", "Create Session Req/Resp": "GTP Create Session · MME가 S-GW(→P-GW)에 기본 베어러 생성을 요청", "Attach Accept": "NAS Attach Accept · MME가 접속 수락(eNodeB에 보내는 Initial Context Setup에 실림)", "Attach Complete": "NAS Attach Complete · UE가 접속 완료를 알림", "Modify Bearer Req/Resp": "GTP Modify Bearer · MME가 S-GW에 eNodeB 주소를 알려 하향 경로를 완성", "PUR/PUA": "Purge-UE-Request/Answer · S6a · MME가 가입자 정보 삭제를 HSS에 알림(접속 아님)", "SAR/SAA": "Server-Assignment-Request/Answer · Cx · IMS 등록 단계(EPC 접속 아님)", "Detach Request": "NAS
