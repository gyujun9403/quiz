# IMS 코어 Diameter 인터페이스 (Cx/Sh/Rx). SIP 서버 개발자 관점의 절차 암기용.
# 흐름(order)은 인터페이스 단위로 2~3 actor만 사용(폰 렌더링 고려).
# 커맨드코드/Result코드는 3GPP TS 29.230, 커맨드 정의는 TS 29.229(Cx)/29.328·329(Sh)/29.214(Rx),
# 기본 커맨드코드는 RFC 6733에 대조 검증함.

# ---------------- Cx: S-CSCF/I-CSCF <-> HSS ----------------

- id: diam-0001
  type: order
  topic: Diameter
  difficulty: basic
  tags: [message-flow, command-code]
  question: "IMS 초기 등록 시 Cx 인터페이스에서 오가는 Diameter 커맨드를 순서·방향까지 맞춰라
    (I-CSCF·S-CSCF·HSS)."
  items:
    - {msg: "UAR", from: "I-CSCF", to: "HSS"}
    - {msg: "UAA", from: "HSS", to: "I-CSCF"}
    - {msg: "MAR", from: "S-CSCF", to: "HSS"}
    - {msg: "MAA", from: "HSS", to: "S-CSCF"}
    - {msg: "SAR", from: "S-CSCF", to: "HSS"}
    - {msg: "SAA", from: "HSS", to: "S-CSCF"}
  decoys:
    - {msg: "LIR", from: "I-CSCF", to: "HSS"}
    - {msg: "LIA", from: "HSS", to: "I-CSCF"}
  explain: |
    등록 시 Cx는 세 단계다. (1) I-CSCF가 UAR로 사용자 등록을 인가받고 UAA로 S-CSCF
    이름/능력을 받아 S-CSCF를 고른다. (2) 선택된 S-CSCF가 MAR로 인증 벡터를 요청하고
    MAA로 받는다(→ UE에 401 챌린지). (3) UE가 자격증명으로 재등록하면 S-CSCF가 SAR로
    자신을 사용자에 할당하고 SAA로 사용자 프로필을 내려받는다. 즉 UAR→MAR→SAR 순.
  ref: "3GPP TS 29.228; TS 29.229 §6.1"

- id: diam-0002
  type: order
  topic: Diameter
  difficulty: basic
  tags: [message-flow, command-code]
  question: "착신 호 처리 중 I-CSCF가 사용자를 서빙하는 S-CSCF를 찾기 위한 Cx 교환을
    순서·방향까지 맞춰라."
  items:
    - {msg: "LIR", from: "I-CSCF", to: "HSS"}
    - {msg: "LIA", from: "HSS", to: "I-CSCF"}
  decoys:
    - {msg: "UAR", from: "I-CSCF", to: "HSS"}
    - {msg: "UAA", from: "HSS", to: "I-CSCF"}
  explain: |
    착신 INVITE를 받은 I-CSCF는 그 사용자를 현재 담당하는 S-CSCF 이름을 모른다. LIR
    (Location-Info-Request)로 HSS에 물으면 HSS가 LIA로 서빙 S-CSCF 이름을 돌려주고,
    I-CSCF는 그 S-CSCF로 INVITE를 라우팅한다. 등록(UAR)과 달리 착신 경로 탐색용이다.
  ref: "3GPP TS 29.228; TS 29.229 §6.1.3"

- id: diam-0003
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "Cx에서 I-CSCF가 사용자의 등록을 인가받고 배정할 S-CSCF 정보를 얻기 위해 HSS로
    보내는 커맨드는?"
  choices: ["UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"]
  answer: 0
  explain: |
    UAR는 등록 인가 요청이다. HSS는 UAA로 로밍 허용 여부와 S-CSCF 능력/이름을 돌려줘
    I-CSCF가 S-CSCF를 고르게 한다. 인증 벡터(MAR)나 서버 할당(SAR)은 이후 S-CSCF가
    수행한다.
  ref: "3GPP TS 29.229 §6.1.1"

- id: diam-0004
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "S-CSCF가 사용자를 인증하기 위한 인증 벡터(authentication vector)를 HSS에서
    받아오는 Cx 커맨드는?"
  choices: ["MAR (Multimedia-Auth-Request)", "UAR (User-Authorization-Request)", "SAR (Server-Assignment-Request)", "LIR (Location-Info-Request)"]
  answer: 0
  explain: |
    MAR는 인증 벡터 요청이다. HSS는 MAA로 인증 벡터를 내려주고, S-CSCF는 이를 근거로
    UE에 401 인증 챌린지를 보낸다. UAR(인가)·SAR(할당)와 목적이 다르다.
  ref: "3GPP TS 29.229 §6.3"

- id: diam-0005
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "인증에 성공한 뒤 S-CSCF가 자신을 사용자에 할당하고 사용자 프로필을 내려받기
    위해 HSS로 보내는 Cx 커맨드는?"
  choices: ["SAR (Server-Assignment-Request)", "UAR (User-Authorization-Request)", "MAR (Multimedia-Auth-Request)", "LIR (Location-Info-Request)"]
  answer: 0
  explain: |
    SAR는 서버 할당 요청으로, HSS에 "이 사용자는 내가 담당한다"고 등록하고 SAA로
    사용자 프로필(서비스 프로파일)을 받는다. 등록 흐름의 마지막 Cx 단계다.
  ref: "3GPP TS 29.229 §6.2"

- id: diam-0006
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "LIR (Location-Info-Request)의 주 용도는?"
  choices:
    - "착신 시 사용자를 현재 서빙하는 S-CSCF의 이름을 HSS에서 조회"
    - "등록 시 사용자를 인증할 인증 벡터를 HSS에서 조회"
    - "인증 후 S-CSCF를 사용자에 할당하고 프로필을 내려받음"
    - "AS가 Sh 인터페이스로 HSS의 가입자 데이터를 조회"
  answer: 0
  explain: |
    LIR는 착신(terminating) 처리에서 I-CSCF가 서빙 S-CSCF 이름을 얻는 데 쓴다. 인증
    벡터는 MAR, 서버 할당은 SAR, 가입자 데이터 조회는 Sh의 UDR로 서로 인터페이스·목적이
    다르다.
  ref: "3GPP TS 29.229 §6.1.3"

- id: diam-0007
  type: short
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "S-CSCF가 HSS에서 인증 벡터를 받기 위해 보내는 Cx 커맨드의 약어는? (3글자)"
  answer: ["MAR"]
  explain: |
    MAR = Multimedia-Auth-Request. 인증 벡터 요청 커맨드다(응답은 MAA). Cx 커맨드
    코드는 303.
  ref: "3GPP TS 29.229 §6.3; TS 29.230 §5.1"

- id: diam-0008
  type: short
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "착신 호에서 I-CSCF가 서빙 S-CSCF를 찾기 위해 HSS로 보내는 Cx 커맨드의 약어는?
    (3글자)"
  answer: ["LIR"]
  explain: |
    LIR = Location-Info-Request(응답 LIA). 착신 경로에서 서빙 S-CSCF 이름을 조회한다.
    Cx 커맨드 코드는 302.
  ref: "3GPP TS 29.229 §6.1.3; TS 29.230 §5.1"

- id: diam-0009
  type: ox
  topic: Diameter
  difficulty: basic
  tags: [command-code, message-flow]
  question: "MAR(Multimedia-Auth-Request)는 I-CSCF가 HSS로 보내는 커맨드다."
  answer: false
  explain: |
    아니다. MAR를 보내는 것은 S-CSCF다(인증 벡터 요청). I-CSCF가 HSS로 보내는 Cx
    커맨드는 UAR(인가)와 LIR(착신 시 서빙 S-CSCF 조회)다. 인터페이스는 같아도 노드
    역할이 다르다.
  ref: "3GPP TS 29.229 §6.3"

- id: diam-0011
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [result-code]
  question: "HSS가 요청된 사용자 식별자가 존재하지 않을 때 반환하는 Experimental-Result-Code는?"
  choices:
    - "5001 DIAMETER_ERROR_USER_UNKNOWN"
    - "5003 DIAMETER_ERROR_IDENTITY_NOT_REGISTERED"
    - "5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED"
    - "5002 DIAMETER_ERROR_IDENTITIES_DONT_MATCH"
  answer: 0
  explain: |
    5001은 "그 사용자 자체가 HSS에 없음"이다. 5003은 사용자는 있으나 등록 상태가
    아님, 5005는 이미 등록됨, 5002는 공개/개인 식별자 불일치 — 모두 5xxx(영구 실패)
    대역이지만 원인이 다르다.
  ref: "3GPP TS 29.229 §6.2; TS 29.230 §8.1.4"

- id: diam-0012
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [result-code]
  question: "이미 등록된 식별자로 등록이 들어와 충돌할 때 HSS가 쓸 수 있는 Experimental-Result-Code는?"
  choices:
    - "5005 DIAMETER_ERROR_IDENTITY_ALREADY_REGISTERED"
    - "5001 DIAMETER_ERROR_USER_UNKNOWN"
    - "5004 DIAMETER_ERROR_ROAMING_NOT_ALLOWED"
    - "2001 DIAMETER_FIRST_REGISTRATION"
  answer: 0
  explain: |
    5005는 "이미 등록된 식별자"다. 5001(사용자 없음)·5004(로밍 불가)와 원인이 다르고,
    2001은 성공(첫 등록) 계열이라 애초에 실패가 아니다. 5xxx=영구 실패, 2xxx=성공.
  ref: "3GPP TS 29.229; TS 29.230 §8.1"

- id: diam-0013
  type: ox
  topic: Diameter
  difficulty: advanced
  tags: [result-code, concept]
  question: "Cx의 5xxx 대역 Experimental-Result-Code는 영구 실패(permanent failure)를
    나타낸다."
  answer: true
  explain: |
    맞다. 3GPP Experimental-Result-Code도 Diameter 대역 규칙을 따른다: 2xxx=성공,
    5xxx=영구 실패. 예: 5001 USER_UNKNOWN. 이 대역 구조를 알면 개별 코드도 앵커링해
    외우기 쉽다.
  ref: "3GPP TS 29.230 §8.1"

- id: diam-0014
  type: ox
  topic: Diameter
  difficulty: advanced
  tags: [result-code, concept]
  question: "DIAMETER_FIRST_REGISTRATION(2001)은 등록 실패를 나타내는 코드다."
  answer: false
  explain: |
    아니다. 2001은 2xxx(성공) 대역으로 "첫 등록 성공"을 뜻한다. 실패는 5xxx 대역이다
    (예: 5001 USER_UNKNOWN). 2xxx=성공/5xxx=영구실패 대역 구분이 핵심.
  ref: "3GPP TS 29.230 §8.1.2"

- id: diam-0015
  type: short
  topic: Diameter
  difficulty: advanced
  tags: [command-code]
  question: "Cx의 User-Authorization 커맨드(UAR/UAA)에 할당된 Diameter 커맨드 코드 번호는?"
  answer: ["300"]
  explain: |
    3GPP TS 29.230은 Cx/Dx 커맨드 코드를 300부터 부여한다: 300 UAR/UAA, 301 SAR/SAA,
    302 LIR/LIA, 303 MAR/MAA. 요청/응답은 같은 코드를 쓰고 R-bit로 구분한다.
  ref: "3GPP TS 29.230 §5.1"

- id: diam-0016
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code]
  question: "Diameter 커맨드 코드 303에 해당하는 Cx 커맨드 쌍은?"
  choices:
    - "MAR/MAA (Multimedia-Auth)"
    - "UAR/UAA (User-Authorization)"
    - "SAR/SAA (Server-Assignment)"
    - "LIR/LIA (Location-Info)"
  answer: 0
  explain: |
    300 UAR/UAA, 301 SAR/SAA, 302 LIR/LIA, 303 MAR/MAA 순으로 부여됐다. 303은
    Multimedia-Auth 쌍이다. 코드가 연속 부여됐다는 구조로 외우면 헷갈리지 않는다.
  ref: "3GPP TS 29.230 §5.1"

# ---------------- Sh: AS <-> HSS ----------------

- id: diam-0017
  type: order
  topic: Diameter
  difficulty: basic
  tags: [message-flow, command-code]
  question: "애플리케이션 서버(AS)가 Sh 인터페이스로 HSS의 가입자 데이터를 조회하는 교환을
    순서·방향까지 맞춰라."
  items:
    - {msg: "UDR", from: "AS", to: "HSS"}
    - {msg: "UDA", from: "HSS", to: "AS"}
  decoys:
    - {msg: "SNR", from: "AS", to: "HSS"}
    - {msg: "SNA", from: "HSS", to: "AS"}
  explain: |
    Sh에서 AS는 UDR(User-Data-Request)로 HSS의 가입자 데이터를 조회하고 HSS는 UDA로
    데이터를 돌려준다. Sh는 AS↔HSS 간 데이터 접근/구독 인터페이스로, Cx(등록/인증)와는
    쓰임이 다르다.
  ref: "3GPP TS 29.328; TS 29.329"

- id: diam-0018
  type: order
  topic: Diameter
  difficulty: advanced
  tags: [message-flow, command-code]
  question: "AS가 Sh로 가입자 데이터 변경 통지를 구독하고, 이후 데이터가 바뀌어 HSS가
    통지하는 흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "SNR", from: "AS", to: "HSS"}
    - {msg: "SNA", from: "HSS", to: "AS"}
    - {msg: "PNR", from: "HSS", to: "AS"}
    - {msg: "PNA", from: "AS", to: "HSS"}
  decoys:
    - {msg: "UDR", from: "AS", to: "HSS"}
    - {msg: "UDA", from: "HSS", to: "AS"}
  explain: |
    AS가 SNR(Subscribe-Notifications-Request)로 특정 데이터 변경 통지를 구독하면 HSS가
    SNA로 확인한다. 이후 데이터가 바뀌면 HSS가 먼저 PNR(Push-Notification-Request)로
    통지하고 AS가 PNA로 응답한다. PNR만 HSS가 발신한다는 점이 방향 포인트다.
  ref: "3GPP TS 29.328; TS 29.329; TS 29.230 §5.1"

- id: diam-0019
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "Sh 인터페이스에서 AS가 HSS의 가입자 데이터를 읽어오기 위해 쓰는 커맨드는?"
  choices:
    - "UDR (User-Data-Request)"
    - "SAR (Server-Assignment-Request)"
    - "MAR (Multimedia-Auth-Request)"
    - "AAR (AA-Request)"
  answer: 0
  explain: |
    UDR는 Sh의 데이터 조회 커맨드다(응답 UDA). SAR·MAR는 Cx(S-CSCF↔HSS), AAR는
    Rx(P-CSCF↔PCRF)로 인터페이스가 다르다. 커맨드를 인터페이스에 묶어 외우는 게 요령.
  ref: "3GPP TS 29.328"

- id: diam-0020
  type: ox
  topic: Diameter
  difficulty: advanced
  tags: [command-code, message-flow]
  question: "PNR(Push-Notification-Request)는 AS가 HSS로 데이터를 요청할 때 보내는 커맨드다."
  answer: false
  explain: |
    아니다. PNR는 HSS가 AS로 데이터 변경을 "밀어주는"(push) 통지 커맨드라 방향이
    HSS→AS다. AS가 데이터를 요청할 때는 UDR(조회)나 SNR(구독)를 쓴다.
  ref: "3GPP TS 29.328; TS 29.329"

# ---------------- Rx: P-CSCF(AF) <-> PCRF ----------------

- id: diam-0021
  type: order
  topic: Diameter
  difficulty: basic
  tags: [message-flow, command-code]
  question: "P-CSCF(AF)가 SIP 세션의 미디어를 Rx로 인가받고, 세션 종료 시 정책을 해제하는
    흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "AAR", from: "P-CSCF", to: "PCRF"}
    - {msg: "AAA", from: "PCRF", to: "P-CSCF"}
    - {msg: "STR", from: "P-CSCF", to: "PCRF"}
    - {msg: "STA", from: "PCRF", to: "P-CSCF"}
  decoys:
    - {msg: "RAR", from: "PCRF", to: "P-CSCF"}
    - {msg: "RAA", from: "P-CSCF", to: "PCRF"}
  explain: |
    세션 설정 시 P-CSCF(AF)는 AAR(AA-Request)로 미디어 정보를 PCRF에 주고 인가/QoS를
    요청하며 AAA로 응답을 받는다. 통화가 끝나면 STR(Session-Termination-Request)로
    세션을 종료하고 STA로 확인한다. Rx는 IMS 세션과 베어러 정책을 잇는 인터페이스다.
  ref: "3GPP TS 29.214"

- id: diam-0022
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code, concept]
  question: "Rx에서 P-CSCF(AF)가 세션의 미디어 정보를 PCRF에 전달하며 자원 인가를 요청하는
    커맨드는?"
  choices:
    - "AAR (AA-Request)"
    - "SAR (Server-Assignment-Request)"
    - "UDR (User-Data-Request)"
    - "LIR (Location-Info-Request)"
  answer: 0
  explain: |
    AAR는 Rx의 세션/미디어 인가 요청 커맨드다(응답 AAA). SAR/LIR는 Cx, UDR는 Sh로
    각각 인터페이스가 다르다. Rx는 SIP 세션 정보를 정책(PCRF)에 연결한다.
  ref: "3GPP TS 29.214"

- id: diam-0023
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code, message-flow]
  question: "Rx에서 PCRF가 AF(P-CSCF)로 세션 중단을 지시할 때 쓰는 커맨드와 방향이 옳은 것은?"
  choices:
    - "ASR — PCRF → AF"
    - "STR — AF → PCRF"
    - "AAR — AF → PCRF"
    - "RAR — AF → PCRF"
  answer: 0
  explain: |
    ASR(Abort-Session-Request)는 PCRF가 AF로 세션 중단을 지시한다(PCRF→AF). STR는
    반대로 AF가 종료를 알리는 것(AF→PCRF)이고, RAR도 PCRF→AF지만 재인가 요청이다.
    ASR/STR/RAR는 Diameter 기본 커맨드(274/275/258)를 재사용한다.
  ref: "3GPP TS 29.214; RFC 6733 §3.1"

- id: diam-0024
  type: ox
  topic: Diameter
  difficulty: basic
  tags: [command-code, message-flow]
  question: "Rx에서 STR(Session-Termination-Request)는 AF(P-CSCF)가 PCRF로 세션 종료를
    알릴 때 보낸다."
  answer: true
  explain: |
    맞다. 세션이 끝나면 AF(P-CSCF)가 STR로 PCRF에 종료를 알리고 STA로 확인받는다.
    반대로 PCRF가 세션을 강제로 끊는 것은 ASR(PCRF→AF)다 — 방향이 반대다.
  ref: "3GPP TS 29.214; RFC 6733 §8.4"

# ---------------- Cx 심화: 등록 해제 · HSS 발신 ----------------

- id: diam-0025
  type: order
  topic: Diameter
  difficulty: advanced
  tags: [message-flow, command-code]
  question: "운영자가 HSS에서 가입자의 IMS 등록을 강제로 해제할 때 Cx에서 오가는 커맨드를 순서·방향까지 맞춰라."
  items:
    - {msg: "RTR", from: "HSS", to: "S-CSCF"}
    - {msg: "RTA", from: "S-CSCF", to: "HSS"}
  decoys:
    - {msg: "SAR", from: "S-CSCF", to: "HSS"}
    - {msg: "SAA", from: "HSS", to: "S-CSCF"}
  explain: |
    HSS가 시작하는 관리 목적의 등록 해제는 RTR(Registration-Termination-Request)로 한다.
    HSS가 공개 식별자를 미등록 상태로 바꾸고 RTR로 S-CSCF에 알린다.
    S-CSCF는 해당 식별자의 정보를 지우고 RTA로 답한다.
    SAR은 반대로 S-CSCF가 시작하는 커맨드라 이 흐름에 맞지 않는다.
    Cx 커맨드 대부분은 CSCF가 요청하지만, RTR과 PPR은 HSS가 요청한다.
  ref: "3GPP TS 29.228 §6.1.3; TS 29.229 §6.1.9, §6.1.10"

- id: diam-0026
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code]
  question: "HSS가 관리 목적으로 가입자의 IMS 등록을 해제하며 S-CSCF에 보내는 Cx 커맨드는?"
  choices:
    - "RTR (Registration-Termination-Request)"
    - "PPR (Push-Profile-Request)"
    - "SAR (Server-Assignment-Request)"
    - "CLR (Cancel-Location-Request)"
  answer: 0
  explain: |
    RTR은 HSS가 S-CSCF에 등록 해제를 알리는 Cx 커맨드다(커맨드 코드 304).
    PPR도 HSS가 S-CSCF로 보내지만, 등록은 그대로 두고 프로필만 갱신한다.
    SAR은 S-CSCF가 HSS로 보내는 커맨드다.
    CLR도 HSS가 보내지만 S6a 커맨드라 받는 쪽이 MME다.
  ref: "3GPP TS 29.228 §6.1.3; TS 29.229 §6.1.9; TS 29.230 §5.1"

- id: diam-0027
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code]
  question: "HSS에서 가입자의 서비스 프로필이 바뀌어, 등록 중인 S-CSCF에 새 프로필을 내려보낼 때 쓰는 Cx 커맨드는?"
  choices:
    - "PPR (Push-Profile-Request)"
    - "PNR (Push-Notification-Request)"
    - "RTR (Registration-Termination-Request)"
    - "SAR (Server-Assignment-Request)"
  answer: 0
  explain: |
    PPR은 HSS가 S-CSCF의 사용자 프로필·과금 정보 등을 갱신하는 Cx 커맨드다(커맨드 코드 305).
    PNR도 HSS가 데이터 변경을 밀어주지만, Sh 커맨드라 받는 쪽이 AS다.
    RTR은 프로필 갱신이 아니라 등록 해제다.
    SAR은 S-CSCF가 HSS에 요청해 프로필을 받아오는 방향이다.
  ref: "3GPP TS 29.228 §6.2.2; TS 29.229 §6.1.11; TS 29.230 §5.1"

- id: diam-0028
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code, avp]
  question: "단말이 REGISTER(Expires: 0)로 IMS 등록을 직접 해제했다. 이를 처리한 S-CSCF가 HSS로 보내는 Cx 요청은?"
  choices:
    - "SAR (Server-Assignment-Type: USER_DEREGISTRATION)"
    - "SAR (Server-Assignment-Type: TIMEOUT_DEREGISTRATION)"
    - "RTR (Deregistration-Reason 포함)"
    - "UAR (User-Authorization-Type: DE_REGISTRATION)"
  answer: 0
  explain: |
    S-CSCF는 등록과 등록 해제를 모두 SAR로 HSS에 알린다. 차이는 Server-Assignment-Type AVP 값이다.
    단말이 직접 해제하면 USER_DEREGISTRATION(5)이다.
    등록 타이머가 만료되어 해제하면 TIMEOUT_DEREGISTRATION(4)이다.
    RTR은 HSS가 시작하는 해제라 방향이 반대다.
    UAR(DE_REGISTRATION)도 이 해제 흐름에 나오지만, S-CSCF가 아니라 I-CSCF가 보낸다.
    I-CSCF는 REGISTER의 Expires가 0인 것을 보고 이 값을 넣는다.
  ref: "3GPP TS 29.228 §6.1.2; TS 29.229 §6.1.3, §6.3.15, §6.3.24"

- id: diam-0029
  type: ox
  topic: Diameter
  difficulty: advanced
  tags: [avp]
  question: "단말이 재등록하지 않아 등록 타이머가 만료되면, S-CSCF는 Server-Assignment-Type을 TIMEOUT_DEREGISTRATION으로 한 SAR을 HSS로 보낸다."
  answer: true
  explain: |
    맞다. TIMEOUT_DEREGISTRATION(4)은 식별자의 SIP 등록 타이머가 만료됐다는 뜻이다.
    단말이 직접 해제한 경우는 USER_DEREGISTRATION(5)이다.
    첫 등록은 REGISTRATION(1), 재등록은 RE_REGISTRATION(2)이다.
  ref: "3GPP TS 29.229 §6.1.3, §6.3.15"

# ---------------- Rx 심화: PCRF 발신 ----------------

- id: diam-0030
  type: order
  topic: Diameter
  difficulty: advanced
  tags: [message-flow, command-code]
  question: "P-CSCF가 AAR로 베어러 이벤트 통지를 구독했다. 이후 통화 미디어 흐름 일부가 끊겨 PCRF가 알리는 Rx 흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "AAR", from: "P-CSCF", to: "PCRF"}
    - {msg: "AAA", from: "PCRF", to: "P-CSCF"}
    - {msg: "RAR", from: "PCRF", to: "P-CSCF"}
    - {msg: "RAA", from: "P-CSCF", to: "PCRF"}
  decoys:
    - {msg: "ASR", from: "PCRF", to: "P-CSCF"}
    - {msg: "ASA", from: "P-CSCF", to: "PCRF"}
  explain: |
    P-CSCF(AF)는 AAR의 Specific-Action AVP로 받고 싶은 베어러 이벤트를 구독한다.
    나중에 일부 미디어 흐름이 비활성화되면 PCRF가 RAR(Re-Auth-Request)로 알린다.
    RAR에는 영향받은 흐름(Flows AVP)과 원인(Specific-Action AVP)이 들어간다. P-CSCF는 RAA로 답한다.
    세션의 미디어 흐름이 전부 영향받으면 RAR 대신 ASR을 보낸다. 이 문제는 일부만 끊긴 경우라 ASR은 decoy다.
  ref: "3GPP TS 29.214 §4.4.1, §4.4.6.2"

- id: diam-0031
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code, message-flow]
  question: "Rx에서 AF 세션의 미디어 흐름 중 일부만 비활성화됐다(베어러 손실 등). PCRF가 AF(P-CSCF)에 알릴 때 쓰는 커맨드는?"
  choices:
    - "RAR (Re-Auth-Request)"
    - "ASR (Abort-Session-Request)"
    - "STR (Session-Termination-Request)"
    - "AAR (AA-Request)"
  answer: 0
  explain: |
    PCRF는 흐름 일부만 영향받으면 RAR로, 전부 영향받으면 ASR로 알린다.
    RAR에는 영향받은 흐름과 원인이 들어간다.
    ASR을 받은 AF는 ASA로 답한 뒤 STR로 세션을 끝낸다.
    STR과 AAR은 AF가 PCRF로 보내는 커맨드라 방향이 반대다.
  ref: "3GPP TS 29.214 §4.4.6.1, §4.4.6.2"

# ---------------- Sh 심화 · 약어 충돌 ----------------

- id: diam-0032
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "AS가 HSS에 저장된 자기 서비스용 데이터(Repository Data)를 갱신할 때 쓰는 Sh 커맨드는?"
  choices:
    - "PUR (Profile-Update-Request)"
    - "UDR (User-Data-Request)"
    - "SNR (Subscribe-Notifications-Request)"
    - "PPR (Push-Profile-Request)"
  answer: 0
  explain: |
    Sh 커맨드는 AS 관점에서 읽기 UDR, 쓰기 PUR, 구독 SNR, 통지 PNR로 나뉜다.
    AS가 HSS 데이터를 갱신하는 Sh-Update 절차는 PUR/PUA로 수행한다(커맨드 코드 307).
    UDR은 조회, SNR은 변경 통지 구독이다.
    PPR은 Cx 커맨드로, HSS가 S-CSCF에 프로필을 내려보낸다.
  ref: "3GPP TS 29.328 §6.1.2; TS 29.329 §6.1.3; TS 29.230 §5.1"

- id: diam-0033
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [command-code]
  question: "약어 PUR은 인터페이스마다 다른 커맨드를 가리킨다. S6a(MME↔HSS)에서 PUR은?"
  choices:
    - "Purge-UE-Request (MME → HSS)"
    - "Profile-Update-Request (AS → HSS)"
    - "Push-Profile-Request (HSS → S-CSCF)"
    - "Push-Notification-Request (HSS → AS)"
  answer: 0
  explain: |
    S6a의 PUR은 Purge-UE-Request(커맨드 코드 321)다.
    MME가 가입자 정보를 지웠다는 사실을 HSS에 알린다. 예를 들어 단말이 며칠 동안 비활성이면 지운다.
    Sh의 PUR은 Profile-Update-Request(307)로, AS가 HSS 데이터를 갱신한다.
    약어는 같아도 커맨드 코드가 달라서 로그에서는 코드로 구분된다.
    Push-Profile은 PPR, Push-Notification은 PNR이다.
  ref: "3GPP TS 29.230 §5.1; TS 29.272 §5.2.1.3; TS 29.329 §6.1.3"

# ---------------- S6a / S13: LTE 망 접속(Attach) ----------------

- id: diam-0034
  type: order
  topic: Diameter
  difficulty: basic
  tags: [message-flow, command-code]
  question: "단말이 LTE 망에 처음 접속(Attach)할 때 MME와 HSS 사이 S6a에서 오가는 커맨드를 순서·방향까지 맞춰라."
  items:
    - {msg: "AIR", from: "MME", to: "HSS"}
    - {msg: "AIA", from: "HSS", to: "MME"}
    - {msg: "ULR", from: "MME", to: "HSS"}
    - {msg: "ULA", from: "HSS", to: "MME"}
  decoys:
    - {msg: "PUR", from: "MME", to: "HSS"}
    - {msg: "PUA", from: "HSS", to: "MME"}
  explain: |
    MME는 먼저 AIR(Authentication-Information-Request)로 HSS에서 인증 벡터를 받는다.
    받은 인증 벡터로 단말과 EPS AKA 인증을 한다.
    인증이 끝나면 ULR(Update-Location-Request)로 자신이 이 가입자를 서빙한다고 HSS에 등록한다.
    HSS는 ULA에 가입자 데이터(APN별 PDN 가입 정보 등)를 담아 돌려준다.
    PUR(Purge-UE)은 MME가 가입자 정보를 지웠을 때 보내는 커맨드라 Attach에 없다.
    IMS 등록의 MAR(인증)→SAR(서버 할당)과 같은 구조다.
  ref: "3GPP TS 23.401 §5.3.2.1 (5a, 8, 11단계); TS 29.272 §5.2.1.1, §5.2.3.1"

- id: diam-0035
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "LTE Attach 중 MME가 단말 인증에 쓸 인증 벡터를 HSS에서 받아오는 S6a 커맨드는?"
  choices:
    - "AIR (Authentication-Information-Request)"
    - "ULR (Update-Location-Request)"
    - "MAR (Multimedia-Auth-Request)"
    - "ECR (ME-Identity-Check-Request)"
  answer: 0
  explain: |
    AIR은 MME(또는 SGSN)가 HSS에 인증 정보를 요청하는 S6a 커맨드다(커맨드 코드 318).
    MAR도 인증 벡터를 받지만 Cx 커맨드라 S-CSCF가 IMS 등록 때 쓴다.
    ULR은 위치 등록이고, ECR은 EIR에 단말 상태를 묻는 S13 커맨드다.
  ref: "3GPP TS 29.272 §5.2.3.1; TS 29.230 §5.1"

- id: diam-0036
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "MME가 HSS에 자신이 이 가입자를 서빙한다고 알리고, 가입자 데이터를 받아오는 S6a 커맨드는?"
  choices:
    - "ULR (Update-Location-Request)"
    - "AIR (Authentication-Information-Request)"
    - "SAR (Server-Assignment-Request)"
    - "IDR (Insert-Subscriber-Data-Request)"
  answer: 0
  explain: |
    ULR은 서빙 MME의 정보를 HSS에 등록하고, ULA로 가입자 데이터를 받는 S6a 커맨드다(커맨드 코드 316).
    Cx의 SAR과 역할이 비슷하다. SAR은 S-CSCF가 HSS에 등록하고 IMS 프로필을 받는다.
    IDR도 가입자 데이터를 전달하지만, HSS가 MME로 밀어주는 방향이다.
  ref: "3GPP TS 29.272 §5.2.1.1, §5.2.2.1; TS 29.230 §5.1"

- id: diam-0037
  type: mcq
  topic: Diameter
  difficulty: basic
  tags: [command-code]
  question: "MME가 EIR에 단말 식별 번호(IMEI)를 보내 도난·불량 단말인지 확인하는 S13 커맨드는?"
  choices:
    - "ECR (ME-Identity-Check-Request)"
    - "AIR (Authentication-Information-Request)"
    - "ULR (Update-Location-Request)"
    - "NOR (Notify-Request)"
  answer: 0
  explain: |
    ECR은 S13 인터페이스(MME↔EIR)의 단말 식별 확인 커맨드다(커맨드 코드 324).
    EIR이 ECA로 결과를 주면 MME가 Attach를 계속할지 거절할지 정한다.
    AIR·ULR·NOR은 MME와 HSS 사이의 S6a 커맨드다.
    S6a는 가입자(USIM)를, S13은 단말 기기를 확인한다.
  ref: "3GPP TS 29.272 §6.2.1; TS 23.401 §5.3.2.1 (5b단계)"

- id: diam-0038
  type: ox
  topic: Diameter
  difficulty: advanced
  tags: [command-code, message-flow]
  question: "단말이 다른 MME 지역에서 Attach해 새 MME가 ULR을 보내도, HSS는 이전 MME에 아무것도 알리지 않는다."
  answer: false
  explain: |
    아니다. 새 MME의 ULR을 받은 HSS는 이전 MME에 CLR(Cancel-Location-Request)을 보낸다.
    이전 MME는 CLA로 답하고 그 가입자의 이동성·베어러 정보를 지운다.
    CLR은 HSS가 시작하는 S6a 커맨드다. 가입 해지 때도 쓰인다.
  ref: "3GPP TS 23.401 §5.3.2.1 (9단계); TS 29.272 §5.2.1.2"

- id: diam-0039
  type: mcq
  topic: Diameter
  difficulty: advanced
  tags: [avp, concept]
  question: "MME가 S6a AIA로 받은 E-UTRAN 인증 벡터 중, 단말이 보낸 인증 응답 RES와 비교하는 값은?"
  choices: ["XRES", "AUTN", "RAND", "KASME"]
  answer: 0
  explain: |
    인증 벡터(E-UTRAN-Vector AVP)에는 RAND, XRES, AUTN, KASME가 들어 있다.
    MME는 RAND와 AUTN을 단말에 보낸다. USIM은 AUTN으로 망을 검증한 뒤 RES를 계산해 돌려준다.
    MME는 RES가 XRES와 같으면 인증 성공으로 본다.
    KASME는 이후 NAS·무선 구간 키를 만드는 중간 키다.
  ref: "3GPP TS 29.272 §7.3.18; TS 33.401 §6.1.1"
