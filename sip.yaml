- id: sip-0001
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "RFC 3261이 정의하는 6개 기본 메서드에 포함되지 않는 것은?"
  choices: ["REGISTER", "SUBSCRIBE", "CANCEL", "OPTIONS"]
  answer: 1
  explain: |
    RFC 3261은 REGISTER, INVITE, ACK, CANCEL, BYE, OPTIONS 6개를 기본 메서드로
    정의한다. SUBSCRIBE는 이벤트 구독을 위한 확장 메서드로 RFC 3265에서 별도로
    정의되었고, RFC 3261 기본 6종에는 포함되지 않는다.
  ref: "RFC 3261 §7.1"

- id: sip-0002
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow]
  question: "성공적인 SIP 세션 설정 흐름을 순서대로, 발신/착신 방향까지 맞춰라."
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "180 Ringing", from: "착신자", to: "발신자"}
    - {msg: "200 OK", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
  explain: |
    발신자가 INVITE를 보내면 잠정 응답 100 Trying이 먼저 오고, 착신 단말이
    울리면 180 Ringing이 온다. 착신자가 응답하면 200 OK가 오며, 발신자는
    이를 확인하는 ACK를 보내 세션이 시작된다.
  ref: "RFC 3261 §4 (Figure 1)"

- id: sip-0003
  type: order
  topic: SIP
  difficulty: advanced
  tags: [message-flow, method]
  question: "발신자가 응답 대기 중 통화를 취소(CANCEL)하는 흐름을 순서대로, 발신/착신
    방향까지 맞춰라."
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "CANCEL", from: "발신자", to: "착신자"}
    - {msg: "200 OK (CANCEL 응답)", from: "착신자", to: "발신자"}
    - {msg: "487 Request Terminated", from: "착신자", to: "발신자"}
  explain: |
    잠정 응답(100 Trying)을 받은 뒤에만 CANCEL을 보낼 수 있다. UAS는 CANCEL
    요청 자체에는 200 OK로 응답하고, 별도로 원래의 INVITE 트랜잭션은 487
    Request Terminated로 종료시킨다. 두 응답은 서로 다른 트랜잭션에 대한
    응답이라는 점이 헷갈리기 쉽다.
  ref: "RFC 3261 §9.2"

- id: sip-0004
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "CANCEL은 INVITE 요청에 대해서만 사용해야 한다."
  answer: true
  explain: |
    INVITE 이외의 요청은 즉시 응답되므로 CANCEL을 보내면 경쟁 상태(race
    condition)가 발생한다. RFC 3261은 CANCEL을 INVITE가 아닌 요청에는
    보내지 말아야 한다(SHOULD NOT)고 규정한다.
  ref: "RFC 3261 §9.1"

- id: sip-0005
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [method]
  question: "이미 최종 응답을 받은 요청에 CANCEL을 보내면 그 요청의 처리에 영향을 준다."
  answer: false
  explain: |
    원래 요청에 대해 이미 최종 응답(2xx~6xx)이 발생했다면, CANCEL은 그
    요청의 처리·세션 상태·응답 생성 어느 것에도 영향을 주지 않는다.
    사실상 아무 효과 없는 요청(no-op)이 된다.
  ref: "RFC 3261 §9.2"

- id: sip-0006
  type: short
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "SIP에서 진행 중인 세션(통화)을 종료할 때 사용하는 메서드는?"
  answer: ["BYE"]
  explain: |
    RFC 3261은 BYE를 "세션을 종료하기 위한" 메서드로 정의한다. INVITE로
    세션을 시작했다면, 종료는 CANCEL이 아니라 BYE로 한다 — CANCEL은 아직
    최종 응답을 받기 전의 진행 중인 요청을 취소할 때만 쓴다(sip-0004/0005).
  ref: "RFC 3261 §7.1"

- id: sip-0007
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "1xx(잠정 응답) 클래스의 성격을 가장 정확히 설명한 것은?"
  choices:
    - "요청이 성공적으로 완료됐음을 뜻한다"
    - "서버가 아직 확정 응답을 갖지 못한 채 처리 중임을 뜻한다"
    - "요청 문법에 오류가 있음을 뜻한다"
    - "사용자가 다른 위치로 옮겨갔음을 뜻한다"
  answer: 1
  explain: |
    1xx는 확정 응답이 아직 없다는 뜻으로, 서버가 200ms 넘게 걸릴 것 같을 때
    보낸다. 신뢰성 있게 전달되지 않으며(재전송 없음) ACK도 유발하지 않는다.
  ref: "RFC 3261 §21.1"

- id: sip-0008
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "1xx 응답은 클라이언트의 ACK 전송을 유발하지 않는다."
  answer: true
  explain: |
    1xx는 잠정 응답이라 신뢰성 있게 전달되지 않고, ACK도 유발하지 않는다.
    ACK는 INVITE에 대한 응답을 확인할 때만 쓰인다.
  ref: "RFC 3261 §21.1"

- id: sip-0009
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "486 Busy Here 대신 600 Busy Everywhere를 써야 하는 경우는?"
  choices:
    - "서버가 이 사용자와 관련된 다른 어떤 단말도 응답하지 않을 것임을 알고 있을 때"
    - "더 정중한 표현이 필요할 때"
    - "여러 단말이 동시에 울리는 포킹 상황일 때"
    - "응답을 더 빨리 보내고 싶을 때"
  answer: 0
  explain: |
    486은 "이 단말"만 통화 중이라는 뜻이라 음성사서함 등 다른 경로로 연결될
    여지가 있다. 600은 서버가 어떤 단말로도 연결 안 될 걸 알 때만 쓴다.
  ref: "RFC 3261 §21.6.1"

- id: sip-0010
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "Request-URI에 다이얼 문자열이 아직 다 입력되지 않아 불완전할 때 쓰는 응답은?"
  choices: ["404 Not Found", "484 Address Incomplete", "485 Ambiguous", "400 Bad Request"]
  answer: 1
  explain: |
    484는 오버랩 다이얼링(자릿수를 늘려가며 재전송)을 지원하기 위한 코드다.
    클라이언트는 484를 받는 동안 계속 더 긴 문자열로 재전송한다.
  ref: "RFC 3261 §21.4.22"

- id: sip-0011
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "485 Ambiguous와 300 Multiple Choices는 의미(semantics)가 달라서 별도의
    코드로 분리되어 있다."
  answer: true
  explain: |
    300은 같은 사용자/서비스에 도달하는 여러 경로가 있다는 뜻으로 자동 선택도
    가능하지만, 485는 Request-URI 자체가 여러 사람 중 누구인지 애매하다는
    뜻이라 사람이 개입해 골라야 한다.
  ref: "RFC 3261 §21.4.23"

- id: sip-0012
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "프록시 서버가(사용자가 아니라) 클라이언트 인증을 요구할 때 쓰는 응답 코드는?"
  answer: ["407"]
  explain: |
    401은 UAS/registrar가, 407은 프록시가 쓴다는 게 핵심 구분이다. 통신사업자
    게이트웨이처럼 "채널 접근" 자체에 인증이 필요한 경우 407을 쓴다.
  ref: "RFC 3261 §21.4.8"

- id: sip-0013
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "483 Too Many Hops가 발생하는 조건은?"
  choices:
    - "Max-Forwards 헤더 값이 0인 요청을 받음"
    - "서버가 루프를 감지함"
    - "요청 URI가 존재하지 않는 도메인을 가리킴"
    - "메시지 크기가 서버 한도를 초과함"
  answer: 0
  explain: |
    483은 Max-Forwards=0으로 명확히 정의된다. 반면 482 Loop Detected는
    (Max-Forwards와 별개로) 서버가 실제 루프를 감지했을 때 쓰는, 조건이
    다른 코드다.
  ref: "RFC 3261 §21.4.21"

- id: sip-0014
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "482 Loop Detected와 483 Too Many Hops는 둘 다 Max-Forwards 값이 0이 되는
    같은 조건에서 발생한다."
  answer: false
  explain: |
    483만 Max-Forwards=0으로 명시적으로 정의된다. 482는 서버가 루프를
    감지했을 때 쓰는 별개의 메커니즘이다.
  ref: "RFC 3261 §21.4.20, §21.4.21"

- id: sip-0015
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "상대방이 이미 다른 통화를 처리 중이라 이 통화에 응답할 수 없을 때 가장
    적합한 코드는?"
  choices: ["480 Temporarily Unavailable", "486 Busy Here", "487 Request Terminated", "600 Busy Everywhere"]
  answer: 1
  explain: |
    480은 로그아웃·방해금지 등 응대 불가 상태 전반을 포괄하는 코드고, 486은
    그중 "다른 통화 처리 중"이라는 이유를 더 정확히 알려주고 싶을 때 쓴다.
  ref: "RFC 3261 §21.4.24"

- id: sip-0016
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "SIP 응답 코드 486의 영문 명칭은?"
  answer: ["Busy Here"]
  explain: |
    486 Busy Here — 상대방 단말은 연결됐지만 지금 이 단말에서는 추가 통화를
    받을 수 없다는 뜻이다.
  ref: "RFC 3261 §21.4.24"

- id: sip-0017
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "487 Request Terminated이 발생하는 원인은?"
  choices:
    - "BYE 또는 CANCEL에 의해 원래 요청이 종료됨"
    - "요청이 제 시간 안에 처리되지 못함"
    - "서버 내부 오류가 발생함"
    - "요청 문법이 잘못됨"
  answer: 0
  explain: |
    487은 진행 중이던 요청(주로 INVITE)이 BYE나 CANCEL로 인해 중단됐을 때
    그 원래 요청에 대한 최종 응답으로 온다.
  ref: "RFC 3261 §21.4.25"

- id: sip-0018
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "CANCEL 요청 자체에 대한 응답으로 487 Request Terminated이 올 수 있다."
  answer: false
  explain: |
    487은 CANCEL로 인해 종료되는 "원래 요청"(예: INVITE)에 대한 응답이다.
    CANCEL 요청 자체는 항상 200 OK로 응답되며, CANCEL에 대한 응답으로
    487이 오는 일은 없다.
  ref: "RFC 3261 §21.4.25"

- id: sip-0019
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "301 Moved Permanently를 받으면 클라이언트는 로컬 주소록을 새 주소로
    갱신하는 것이 권장된다."
  answer: true
  explain: |
    301은 영구 이동이므로, 요청자는 주소록·캐시 등을 새 주소로 갱신하고
    이후 요청도 그 주소로 보내는 게 권장된다. 302(일시 이동)는 이렇게까지
    하지 않는다.
  ref: "RFC 3261 §21.3.2"

- id: sip-0020
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "302 Moved Temporarily 응답에 만료 시간이 없으면, 그 Contact 주소는
    이후에도 계속 캐시해서 재사용해도 된다."
  answer: false
  explain: |
    명시적 만료 시간이 없으면 그 주소는 딱 한 번의 재시도(recursing)에만
    유효하며, 향후 트랜잭션을 위해 캐시하면 안 된다(MUST NOT).
  ref: "RFC 3261 §21.3.3"

- id: sip-0021
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "503 Service Unavailable을 Retry-After 헤더 없이 받았을 때 클라이언트는
    어떻게 동작해야 하는가?"
  choices:
    - "500 Server Internal Error를 받은 것처럼 동작한다"
    - "1분 뒤 같은 요청을 그대로 재전송한다"
    - "요청을 완전히 포기한다"
    - "즉시 같은 서버로 요청을 다시 보낸다"
  answer: 0
  explain: |
    Retry-After가 없으면 클라이언트는 500을 받은 것처럼(MUST) 동작해야
    한다. Retry-After가 있다면 그 시간 동안은 해당 서버로 다른 요청도
    보내지 않는 게 권장된다.
  ref: "RFC 3261 §21.5.4"

- id: sip-0022
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "서버가 요청 메서드 자체를 전혀 지원하지 않아(어떤 사용자에 대해서도)
    처리할 수 없을 때 쓰는 코드는?"
  choices: ["405 Method Not Allowed", "501 Not Implemented", "400 Bad Request", "503 Service Unavailable"]
  answer: 1
  explain: |
    501은 서버가 그 메서드 자체를 지원하지 않을 때(UAS가 메서드를 인식조차
    못 함) 쓴다. 메서드는 인식하지만 그 주소에서만 허용 안 되는 경우는
    405다.
  ref: "RFC 3261 §21.5.2"

- id: sip-0023
  type: mcq
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "서버가 요청 메서드를 인식은 하지만, 그 Request-URI가 가리키는 주소에서는
    허용하지 않을 때 쓰는 코드는?"
  choices: ["405 Method Not Allowed", "501 Not Implemented", "406 Not Acceptable", "403 Forbidden"]
  answer: 0
  explain: |
    405는 메서드 자체는 알지만 그 주소에서 허용 안 될 때, 501은 메서드
    자체를 서버가 아예 지원 안 할 때 쓴다. 405 응답에는 허용되는 메서드
    목록을 Allow 헤더로 반드시 포함해야 한다.
  ref: "RFC 3261 §21.4.6, §21.5.2"

- id: sip-0024
  type: ox
  topic: SIP
  difficulty: advanced
  tags: [response-code]
  question: "504 Server Time-out은 서버가 접근한 외부(다운스트림) 서버로부터 제때
    응답을 받지 못했을 때 쓰고, 408 Request Timeout은 서버 자신이 제 시간에
    응답을 만들어내지 못했을 때 쓴다."
  answer: true
  explain: |
    408은 서버 자체가 시간 내 응답을 못 만든 경우(예: 사용자 위치 파악
    지연)를 포괄하고, 504는 그 원인이 서버가 접근한 외부 서버의 응답
    지연일 때 쓰는 더 구체적인 코드다.
  ref: "RFC 3261 §21.4.9, §21.5.5"

- id: sip-0025
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "SIP이 HTTP/1.1 응답 코드 체계를 확장하면서 새로 정의한 클래스는?"
  choices: ["1xx", "3xx", "5xx", "6xx"]
  answer: 3
  explain: |
    SIP 응답 코드는 HTTP/1.1을 기반으로 하되 그중 적절한 것만 가져다
    쓰고, 6xx(Global Failures)는 SIP이 새로 정의한 클래스다.
  ref: "RFC 3261 §21"

- id: sip-0026
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code, concept]
  question: "3xx 응답은 4xx/5xx/6xx와 마찬가지로 확정적 실패(definite failure)로
    분류된다."
  answer: false
  explain: |
    4xx는 "특정 서버로부터의 확정적 실패 응답"으로 명시되지만, 3xx는
    실패가 아니라 사용자의 새 위치나 대체 서비스 정보를 알려주는
    응답이다.
  ref: "RFC 3261 §21.3, §21.4"

- id: sip-0027
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow, method]
  question: "단말이 등록 서버에 처음 등록할 때, 인증 챌린지를 포함한 흐름을 순서·방향까지 맞춰라."
  items:
    - {msg: "REGISTER", from: "단말", to: "등록서버"}
    - {msg: "401 Unauthorized", from: "등록서버", to: "단말"}
    - {msg: "REGISTER (인증정보 포함)", from: "단말", to: "등록서버"}
    - {msg: "200 OK", from: "등록서버", to: "단말"}
  explain: |
    단말이 처음 REGISTER를 보내면 등록 서버(registrar)는 인증을 요구하며
    401 Unauthorized로 챌린지한다. 단말은 자격증명(Digest)을 담아 REGISTER를
    다시 보내고, 서버가 이를 확인하면 200 OK로 등록이 완료된다. 401은
    등록 서버/UAS가 보내는 인증 요구이며, 프록시는 407을 쓴다(sip-0012).
  ref: "RFC 3665 §2.1; RFC 3261 §10, §21.4.2"

- id: sip-0028
  type: short
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "단말이 자신의 현재 접속 위치를 등록 서버에 등록(위치 바인딩)할 때 쓰는 메서드는?"
  answer: ["REGISTER"]
  explain: |
    REGISTER는 사용자의 공개 주소(AOR, Address-of-Record)를 단말의 현재
    Contact 주소에 바인딩해, 이후 그 사용자에게 오는 요청이 현재 단말로
    라우팅되게 한다. 위치 등록이 SIP 이동성의 출발점이다.
  ref: "RFC 3261 §10.1"

- id: sip-0029
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "REGISTER는 사용자의 공개 주소(AOR)를 현재 접속 위치(Contact)에 바인딩해 등록
    서버가 그 사용자의 위치를 알게 하는 메서드다."
  answer: true
  explain: |
    맞다. REGISTER의 목적은 AOR↔Contact 바인딩이다. 이 바인딩 덕분에 누군가
    그 AOR로 INVITE를 보내면 등록 서버/프록시가 현재 단말 위치로 요청을
    넘길 수 있다.
  ref: "RFC 3261 §10.1"

- id: sip-0030
  type: order
  topic: SIP
  difficulty: basic
  tags: [message-flow]
  question: "착신자가 통화를 끊는 경우까지 포함한 기본 호의 전체 흐름(설정→종료)을 순서·방향까지 맞춰라."
  items:
    - {msg: "INVITE", from: "발신자", to: "착신자"}
    - {msg: "100 Trying", from: "착신자", to: "발신자"}
    - {msg: "180 Ringing", from: "착신자", to: "발신자"}
    - {msg: "200 OK", from: "착신자", to: "발신자"}
    - {msg: "ACK", from: "발신자", to: "착신자"}
    - {msg: "BYE", from: "착신자", to: "발신자"}
    - {msg: "200 OK (BYE 응답)", from: "발신자", to: "착신자"}
  explain: |
    설정 절반은 sip-0002와 같다(INVITE→100→180→200→ACK). 통화가 끝나면
    확립된 세션을 종료하려고 한쪽이 BYE를 보내고, 상대는 200 OK로 응답한다.
    여기서는 착신자가 먼저 끊었으므로 BYE는 착신자→발신자, 그 200 OK는
    발신자→착신자다. 세션 종료는 CANCEL이 아니라 BYE로 한다.
  ref: "RFC 3261 §4 (Figure 1), §15.1"

- id: sip-0031
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [method, message-flow]
  question: "INVITE에 대한 200 OK(2xx 최종 응답)를 받은 발신자가 3-way 핸드셰이크를 완성하려고
    마지막으로 보내는 메시지는?"
  choices: ["ACK", "BYE", "200 OK", "CANCEL"]
  answer: 0
  explain: |
    INVITE의 3-way 핸드셰이크는 INVITE → 200 OK → ACK로 완성된다. 발신자는
    2xx를 받을 때마다 이를 확인하는 ACK를 보내야 세션이 확립된다. BYE는 이미
    확립된 세션의 종료, CANCEL은 최종 응답 전 취소용이라 여기선 아니다.
  ref: "RFC 3261 §13.2.2.4"

- id: sip-0032
  type: ox
  topic: SIP
  difficulty: basic
  tags: [method]
  question: "아직 응답이 오지 않아 확립되지 않은(진행 중인 INVITE) 통화를 중단할 때는 BYE를 보낸다."
  answer: false
  explain: |
    아니다. BYE는 이미 확립된 세션(다이얼로그)을 종료하는 메서드다. 아직
    최종 응답을 받기 전 진행 중인 INVITE를 멈추려면 CANCEL을 쓴다. 확립
    전=CANCEL, 확립 후=BYE로 구분한다.
  ref: "RFC 3261 §15.1, §9.1"

- id: sip-0033
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "착신 단말이 INVITE를 받아 사용자에게 착신을 알리는(전화가 울리는) 중임을 나타내는 응답은?"
  choices: ["180 Ringing", "100 Trying", "183 Session Progress", "200 OK"]
  answer: 0
  explain: |
    180 Ringing은 착신 UA가 사용자에게 알림(벨)을 울리는 중이라는 잠정
    응답이다. 100 Trying은 요청을 받아 처리 중이라는 뜻일 뿐 아직 벨은
    울리지 않았고, 200 OK는 착신자가 실제로 응답(수락)했을 때다.
  ref: "RFC 3261 §21.1.2"

- id: sip-0034
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "180 Ringing 응답을 받았다면 착신자가 전화를 받아 통화가 연결된 것이다."
  answer: false
  explain: |
    아니다. 180은 상대 단말이 "울리는 중"이라는 잠정 응답일 뿐, 아직 받지
    않았다. 착신자가 실제로 받아 통화가 연결되면 200 OK가 온다. 이 구분이
    콜 상태 파악의 기본이다.
  ref: "RFC 3261 §21.1.2, §21.2.1"

- id: sip-0035
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "100 Trying 응답의 의미로 가장 정확한 것은?"
  choices:
    - "요청을 받아 처리 중이다(아직 최종 응답 아님)"
    - "착신 단말이 사용자에게 착신을 알리는 중이다"
    - "착신자가 통화를 수락했다"
    - "요청한 사용자를 찾을 수 없다"
  answer: 0
  explain: |
    100 Trying은 다음 홉이 요청을 받아 처리 중이라는 잠정 응답이다. 벨이
    울리는 것은 180, 수락은 200 OK, 사용자 없음은 404다 — 100은 그 어느
    것도 아니고 "받아서 처리 시작"만 뜻한다.
  ref: "RFC 3261 §21.1.1"

- id: sip-0036
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "100 Trying은 요청을 받아 처리 중임을 알리는 잠정(1xx) 응답이며, 최종 응답이 아니다."
  answer: true
  explain: |
    맞다. 100 Trying은 잠정 응답으로 "요청을 받아 처리 중"이라는 뜻이다.
    최종 응답(2xx~6xx)이 아니므로 이것만으로 통화가 성사·실패한 것은 아니다.
    최종 결과는 180 뒤의 200 OK나 4xx~6xx로 온다.
  ref: "RFC 3261 §21.1.1"

- id: sip-0037
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "183 Session Progress가 쓰이는 대표적 상황은?"
  choices:
    - "최종 응답 전에 통화 진행 정보(예: 초기 미디어/네트워크 링백)를 전달할 때"
    - "요청 문법 오류를 알릴 때"
    - "착신자가 통화를 수락했을 때"
    - "서버가 사용자를 찾지 못했을 때"
  answer: 0
  explain: |
    183은 최종 응답 전에 "통화 진행 상황"을 전달하는 잠정 응답으로, 흔히
    초기 미디어(통신사 안내음·네트워크 링백)를 흘려보낼 때 쓴다. 달리
    분류되지 않는 진행 정보를 전달하는 용도라는 점이 180과의 차이다.
  ref: "RFC 3261 §21.1.5"

- id: sip-0038
  type: short
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "요청이 성공했음을 나타내는 SIP 2xx 최종 응답 코드의 번호(3자리)는?"
  answer: ["200"]
  explain: |
    200 OK는 요청이 성공했음을 뜻하는 대표 최종 응답이다. INVITE에 대한
    200 OK는 착신자가 통화를 수락했다는 의미이며, 발신자는 이를 ACK로
    확인해 세션을 확립한다.
  ref: "RFC 3261 §21.2.1"

- id: sip-0039
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "서버가 Request-URI의 도메인에 해당 사용자가 존재하지 않는다는 확정 정보를 가졌을 때 보내는 응답은?"
  choices: ["404 Not Found", "403 Forbidden", "480 Temporarily Unavailable", "400 Bad Request"]
  answer: 0
  explain: |
    404 Not Found는 "그 도메인에 그 사용자가 없다"는 확정적 정보를 뜻한다.
    480은 사용자는 있으나 지금 응대 불가, 403은 이해했지만 거부, 400은 요청
    문법 오류다 — 원인이 서로 달라 혼동하면 안 된다.
  ref: "RFC 3261 §21.4.5"

- id: sip-0040
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "404 Not Found는 요청 메시지의 문법 자체가 잘못됐다는 뜻이다."
  answer: false
  explain: |
    아니다. 문법 오류는 400 Bad Request다. 404는 문법은 정상이지만 그
    도메인에 해당 사용자가 존재하지 않는다는 뜻이다. 둘은 원인이 완전히
    다르다.
  ref: "RFC 3261 §21.4.5"

- id: sip-0041
  type: mcq
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "서버가 요청을 이해했지만 수행을 거부하며, 인증을 다시 시도해도 소용없어 재시도하면 안 되는 응답은?"
  choices: ["403 Forbidden", "401 Unauthorized", "407 Proxy Authentication Required", "404 Not Found"]
  answer: 0
  explain: |
    403 Forbidden은 서버가 요청을 이해했으나 거부하며, 인증(자격증명)으로도
    해결되지 않으니 재시도하지 말라는 뜻이다. 반면 401/407은 자격증명을
    갖춰 다시 보내면 통과할 수 있는 "인증 요구"라는 점이 결정적 차이다.
  ref: "RFC 3261 §21.4.4"

- id: sip-0042
  type: ox
  topic: SIP
  difficulty: basic
  tags: [response-code]
  question: "401 Unauthorized는 자격증명을 갖춰 다시 시도하면 통과할 수 있지만, 403 Forbidden은
    인증을 다시 시도해도 거부된다."
  answer: true
  explain: |
    맞다. 401은 "인증이 필요하다"는 요구라 올바른 자격증명으로 재시도하면
    성공할 수 있다. 403은 "이해했지만 거부"이며 인증으로 해결되지 않으니
    같은 요청을 반복하면 안 된다.
  ref: "RFC 3261 §21.4.2, §21.4.4"
