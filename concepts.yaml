# 세트별 개념 페이지. 시작 화면에서 세트를 고르면 [개념 먼저 보기]로 연다.
# - set: sets.yaml의 세트 id(include로 묶은 세트에는 달지 않는다. 묶인 세트들의 페이지가 이어서 나온다).
# - summary: 절차 요약. 한 줄에 한 문장.
# - flows: 흐름 그림. order/steps 문제 id를 가리키면 그 문제의 정답 흐름을 그린다.
#   notes: 화살표마다 하나씩 단계 설명(필수). 개수가 그림의 화살표 개수와 같아야 한다(rt 단계는 2개).
# - terms: 용어 목록. term(용어), full(풀네임, 선택), desc(한두 문장 뜻), ref(근거 조항, 필수).
#   match(선택): 문제 문장에서 밑줄을 그을 문자열. 없으면 term을 '/'·'·'로 나눈 조각과 full을 쓴다.
# 문제와 같은 규율을 따른다. 규격 원문으로 확인한 내용만 적는다.

- set: csgn-reg
  summary: |
    단말(UE)이 LTE 망을 쓰려면 먼저 Attach로 망에 등록해야 한다.
    Attach는 "인증 → 위치 등록 → 데이터 통로 생성" 순서로 진행되고, MME가 전체를 지휘한다.
    MME는 HSS에서 인증 벡터를 받아(AIR/AIA) 단말과 EPS AKA 인증을 한다.
    인증이 끝나면 MME는 HSS에 자신을 이 단말의 서빙 MME로 등록하고 가입자 데이터를 받는다(ULR/ULA).
    그다음 MME는 S-GW·P-GW에 기본 베어러를 만들고(Create Session) 단말에 Attach Accept를 보낸다.
    등록이 끝난 단말은 EMM-REGISTERED 상태가 되고, MME가 할당한 임시 식별자 GUTI를 받는다.
    C-SGN은 MME·S-GW(필요하면 P-GW까지)를 한 장비에 합친 노드라서, 이 역할들이 한 장비 안에서 이루어진다.
  flows:
    - id: ims-0018
      title: "LTE 첫 접속(Attach) 전체"
      notes:
        - "단말이 망 접속을 요청한다. 유효한 GUTI가 있으면 GUTI로, 없으면 IMSI로 자신을 알린다. 실제로는 eNodeB를 거쳐 MME로 간다."
        - "MME가 HSS에 인증 벡터를 요청한다(S6a)."
        - "HSS가 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다."
        - "MME가 RAND와 AUTN을 단말에 보낸다(EPS AKA)."
        - "단말(USIM)이 AUTN으로 망을 확인하고 RES를 계산해 돌려준다. MME는 RES가 XRES와 같으면 인증 성공으로 본다."
        - "MME가 HSS에 자신을 이 단말의 서빙 MME로 등록한다. 첫 접속이라는 표시(Initial-Attach-Indicator)를 넣는다."
        - "HSS가 가입자 데이터(APN별 PDN 가입 정보, QoS)를 돌려준다. 단말이 이전 MME에 등록돼 있었다면 HSS는 그 전에 이전 MME에 CLR을 보낸다."
        - "MME가 S-GW에 기본 베어러 생성을 요청한다. S-GW는 이 요청을 P-GW로 넘긴다."
        - "P-GW가 단말 주소(PDN Address)를 할당하고 기본 베어러를 만든다. 응답은 S-GW를 거쳐 MME로 온다."
        - "MME가 접속을 수락한다. GUTI와 TA 목록이 들어 있다. eNodeB에는 Initial Context Setup Request에 실려 간다."
        - "단말이 무선 베어러를 세운 뒤 접속 완료를 알린다."
        - "MME가 S-GW에 eNodeB 주소와 하향 TEID를 알려 준다."
        - "S-GW가 응답한다. 이제 S-GW가 단말 쪽으로 하향 데이터를 보낼 수 있고, Attach가 끝난다."
    - id: diam-0034
      title: "Attach 중 MME ↔ HSS (S6a)"
      notes:
        - "AIR: MME가 HSS에 인증 정보를 요청한다. 단말 인증 전에 보낸다."
        - "AIA: HSS가 E-UTRAN 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다. MME는 이것으로 EPS AKA를 한다."
        - "ULR: 인증이 끝나면 MME가 자신을 서빙 MME로 HSS에 등록한다."
        - "ULA: HSS가 가입자 데이터를 돌려준다. MME는 이 데이터로 단말 컨텍스트를 만들고 기본 베어러 생성으로 넘어간다."
  terms:
    - {term: "C-SGN", full: "CIoT Serving Gateway Node", desc: "MME·S-GW·P-GW 같은 EPS 기능을 한 장비에 모은 결합 노드 구현 방식이다. 물리 장비 수를 줄이려는 CIoT 배포용이며, 소량 데이터 전송용 CIoT 최적화를 지원한다.", ref: "TS 23.401 Annex L.4"}
    - {term: "CIoT", full: "Cellular IoT", desc: "저복잡도·저속 IoT 단말을 위한 셀룰러 망 기능 전체를 부르는 말이다. NB-IoT가 여기에 속한다.", ref: "TS 23.401 §3.1"}
    - {term: "NB-IoT", full: "Narrowband-IoT", desc: "CIoT용 무선 접속 기술이다. 180 kHz(PRB 1개) 대역폭으로 E-UTRA에 접속한다.", ref: "TS 23.401 §3.1"}
    - {term: "MME", full: "Mobility Management Entity", desc: "단말과 NAS 신호를 주고받는 제어 노드다. NAS 보안, 휴지 단말 페이징, TA 목록 관리, S-GW·P-GW 선택을 맡는다.", ref: "TS 23.401 §4.4.2"}
    - {term: "S-GW", full: "Serving Gateway", desc: "무선망(eNodeB) 쪽 사용자 평면을 끝맺는 게이트웨이다. 한 단말에는 한 시점에 S-GW가 하나다.", ref: "TS 23.401 §4.4.3.2"}
    - {term: "P-GW", full: "PDN Gateway", desc: "외부 패킷 데이터망(PDN) 쪽 SGi 인터페이스를 끝맺는 게이트웨이다. 단말 IP 주소를 할당한다.", ref: "TS 23.401 §4.4.3.3"}
    - {term: "HSS", full: "Home Subscriber Server", desc: "가입자 데이터와 인증 데이터를 가진 서버다. MME와 S6a 인터페이스로 연결된다.", ref: "TS 23.401 §4.2.3 (S6a)"}
    - {term: "EIR", full: "Equipment Identity Register", desc: "단말 기기(IMEI)가 도난·불량 기기인지 확인해 주는 서버다. MME와 S13 인터페이스로 연결된다.", ref: "TS 23.401 §4.2.3 (S13); TS 29.272 §6.2.1"}
    - {term: "NAS", full: "Non-Access Stratum", desc: "단말과 MME가 직접 주고받는 신호 계층이다. Attach, Service Request, TAU가 NAS 메시지다. eNodeB는 NAS 메시지를 열어 보지 않고 전달만 한다.", ref: "TS 23.401 §4.4.2, §5.3.10.4"}
    - {term: "IMSI", full: "International Mobile Subscriber Identity", desc: "가입자(USIM)를 영구적으로 식별하는 번호다. 무선 구간에 드러나지 않도록 평소에는 임시 식별자를 쓰고, 유효한 GUTI가 없을 때만 Attach에 넣는다.", ref: "TS 23.401 §5.3.2.1 (1단계)"}
    - {term: "GUTI", full: "Globally Unique Temporary Identity", desc: "MME가 단말에 할당하는 임시 식별자다. Attach Accept에 담아 내려 준다.", ref: "TS 23.401 §5.2.2, §5.3.2.1 (17단계)"}
    - {term: "M-TMSI / S-TMSI", desc: "M-TMSI는 단말과 MME 사이에서 사용자를 식별하는 임시 번호로, IMSI와의 대응은 단말과 MME만 안다. S-TMSI는 MME 코드(MMEC)와 M-TMSI를 담은 짧은 임시 식별자로, Service Request 때 단말을 가리킨다.", ref: "TS 23.401 §5.3.10.3, §5.3.4.1, §5.3.4B.2"}
    - {term: "IMEISV", desc: "단말 기기 식별 번호(ME Identity)다. Attach 중 MME가 받아 EIR 확인에 쓰고 HSS·P-GW에도 전달한다.", ref: "TS 23.401 §5.3.2.1 (5b단계)"}
    - {term: "EPS AKA", full: "Authentication and Key Agreement", desc: "MME가 RAND·AUTN을 보내고 단말이 RES로 답하는 인증 절차다. AUTN으로 단말도 망을 검증하고, 인증이 끝나면 양쪽이 같은 키(KASME)를 갖는다.", ref: "TS 33.401 §6.1.1"}
    - {term: "RAND · AUTN · RES · XRES", desc: "RAND는 무작위 챌린지, AUTN은 망 인증 토큰이다. RES는 단말(USIM)이 계산한 응답이고, XRES는 HSS가 미리 계산해 준 기대 응답이다. MME는 RES와 XRES가 같으면 인증 성공으로 본다.", ref: "TS 33.401 §6.1.1; TS 29.272 §7.3.18"}
    - {term: "AIR / AIA", full: "Authentication-Information-Request/Answer", desc: "MME가 HSS에서 인증 벡터(RAND·XRES·AUTN·KASME)를 받는 S6a 커맨드다.", ref: "TS 29.272 §5.2.3.1"}
    - {term: "ULR / ULA", full: "Update-Location-Request/Answer", desc: "MME가 HSS에 자신을 서빙 MME로 등록하고, 가입자 데이터를 받는 S6a 커맨드다.", ref: "TS 29.272 §5.2.1.1"}
    - {term: "CLR / CLA", full: "Cancel-Location-Request/Answer", desc: "HSS가 MME에 가입자 정보를 지우라고 하는 S6a 커맨드다. 단말이 새 MME로 옮겨 오면 HSS가 이전 MME에 보낸다.", ref: "TS 29.272 §5.2.1.2; TS 23.401 §5.3.2.1 (9단계)"}
    - {term: "ECR / ECA", full: "ME-Identity-Check-Request/Answer", desc: "MME가 EIR에 단말 기기 상태를 묻는 S13 커맨드다.", ref: "TS 29.272 §6.2.1"}
    - {term: "PDN 연결", match: ["PDN 연결", "PDN Connection", "PDN connectivity"], full: "PDN Connection", desc: "단말과 외부 패킷망(APN으로 가리킴) 사이의 연결이다. IP 방식이면 단말 IP 주소 하나로 대표된다.", ref: "TS 23.401 §3.1"}
    - {term: "APN", full: "Access Point Name", desc: "단말이 연결할 외부 패킷망을 가리키는 이름이다. 단말이 APN을 주지 않으면 가입자 데이터의 기본(Default) APN을 쓴다.", ref: "TS 23.401 §3.1"}
    - {term: "기본 베어러", match: ["기본 베어러", "Default Bearer"], full: "Default Bearer", desc: "PDN 연결을 만들 때 처음 생기는 EPS 베어러다. PDN 연결이 끝날 때까지 유지되어 항상 연결(always-on) 상태를 만든다.", ref: "TS 23.401 §3.1, §4.7.2.1"}
    - {term: "EMM-REGISTERED / EMM-DEREGISTERED", desc: "EMM은 등록 여부를 나타낸다. REGISTERED면 MME가 단말 위치를 TA 목록 단위로 알고, DEREGISTERED면 위치를 몰라 페이징할 수 없다.", ref: "TS 23.401 §4.6.2"}
    - {term: "TA · TAI · TA 목록", full: "Tracking Area", desc: "TA는 휴지 단말의 위치를 관리하는 구역이다. TAI는 MCC·MNC·TAC로 TA를 식별한다. MME는 등록할 때 TA 여러 개를 묶은 TA 목록을 단말에 준다.", ref: "TS 23.401 §4.3.5.3, §5.2.3"}
    - {term: "TAU", full: "Tracking Area Update", desc: "단말이 TA 목록 밖으로 옮겼거나 주기 타이머가 끝났을 때 MME에 위치를 다시 알리는 절차다.", ref: "TS 23.401 §4.6.3.1"}

- set: csgn-paging
  summary: |
    휴지(ECM-IDLE) 상태 단말은 망과 신호 연결이 없다.
    그래서 다시 통신하려면 누가 먼저 연락하느냐에 따라 두 절차 중 하나를 쓴다.
    단말에 보낼 데이터가 생기면 단말이 Service Request를 보낸다(UE triggered).
    망에서 단말 앞으로 데이터가 오면 S-GW가 데이터를 버퍼링하고 DDN으로 MME에 알린다.
    MME는 단말이 등록된 TA 목록 안의 eNodeB들에 페이징을 보내고, 페이징을 받은 단말이 Service Request로 응답한다(Network triggered).
    두 경우 모두 끝에는 Initial Context Setup과 Modify Bearer로 무선 구간과 S1-U 통로가 다시 열린다.
    절전 기능을 쓰는 CIoT 단말은 페이징을 바로 받지 못할 수 있다.
    eDRX 단말은 MME가 다음 페이징 시점 직전에 페이징하고, PSM 단말은 깨어날 때까지 S-GW가 데이터를 더 오래 버퍼링한다.
  flows:
    - id: epc-0008
      title: "망이 시작하는 Service Request (DDN → Paging)"
      notes:
        - "S-GW에 하향 데이터가 왔지만 단말 쪽 하향 TEID가 없다(휴지 상태). S-GW는 패킷을 버퍼링하고 MME에 알린다. 데이터가 온 베어러의 EPS Bearer ID와 ARP가 들어간다."
        - "MME가 받았다고 답한다. 단말이 PSM·eDRX라 지금 깨울 수 없으면, 여기에 버퍼링을 더 오래 하라는 요청(extended buffering)을 넣는다."
        - "MME가 단말이 등록된 TA 목록에 속한 각 eNodeB에 S1-AP Paging을 보낸다."
        - "eNodeB가 무선으로 단말을 부른다."
        - "단말이 Service Request로 응답한다. 이후 과정은 단말이 시작하는 Service Request와 같다."
    - id: epc-0016
      title: "단말이 시작하는 Service Request"
      notes:
        - "단말이 S-TMSI와 함께 NAS Service Request를 보낸다. eNodeB는 이것을 S1-AP Initial UE Message에 담아 MME로 넘긴다."
        - "MME가 eNodeB에 S-GW 주소·상향 TEID·QoS·보안 정보를 준다. 필요하면 그 전에 인증·보안 절차를 한다."
        - "eNodeB가 단말과 무선 베어러를 세운다. 이때부터 업링크 데이터가 S-GW로 갈 수 있다."
        - "eNodeB가 자기 주소와 하향 TEID를 MME에 알린다."
        - "MME가 그 정보를 S-GW에 넘긴다."
        - "S-GW가 응답한다. 이제 다운링크도 흐른다."
  terms:
    - {term: "ECM-IDLE / ECM-CONNECTED", desc: "ECM은 신호 연결 여부를 나타낸다. IDLE이면 NAS 신호 연결이 없고 S1-MME·S1-U도 없다. CONNECTED면 RRC 연결과 S1-MME 연결로 된 신호 연결이 있고, MME가 단말 위치를 eNodeB 단위로 안다.", ref: "TS 23.401 §4.6.3"}
    - {term: "RRC", full: "Radio Resource Control", desc: "단말과 eNodeB 사이의 무선 제어 신호다. ECM-CONNECTED의 신호 연결은 RRC 연결과 S1-MME 연결 두 부분으로 이루어진다.", ref: "TS 23.401 §4.6.3.2"}
    - {term: "S1-AP", desc: "eNodeB와 MME 사이(S1-MME)의 제어 프로토콜이다. Initial UE Message, Initial Context Setup, Paging, UE Context Release가 S1-AP 메시지다.", ref: "TS 23.401 §4.2.3, §5.3.4.1"}
    - {term: "Service Request", desc: "휴지 단말이 사용자 평면(무선 베어러·S1-U)을 다시 세워 달라고 MME에 보내는 NAS 메시지다. 페이징에 응답할 때도 이 메시지를 보낸다.", ref: "TS 23.401 §5.3.4.1, §5.3.4.3 (5단계)"}
    - {term: "Initial UE Message", desc: "eNodeB가 단말의 첫 NAS 메시지(Service Request 등)를 MME로 넘길 때 쓰는 S1-AP 메시지다. TAI·셀 정보와 S-TMSI가 함께 들어간다.", ref: "TS 23.401 §5.3.4.1 (2단계)"}
    - {term: "Initial Context Setup", desc: "MME가 eNodeB에 단말 컨텍스트(S-GW 주소·상향 TEID·QoS·보안 정보)를 주는 S1-AP 절차다. eNodeB는 무선 베어러를 세운 뒤 Complete로 자기 주소와 하향 TEID를 알린다.", ref: "TS 23.401 §5.3.4.1 (4, 7단계)"}
    - {term: "DDN", full: "Downlink Data Notification", desc: "S-GW가 하향 사용자 평면 TEID가 없는 단말 앞으로 데이터가 왔다고 MME에 알리는 메시지다. 데이터가 온 베어러의 EPS Bearer ID와 ARP가 들어간다. MME는 DDN Ack로 답한다.", ref: "TS 23.401 §5.3.4.3 (1, 2단계)"}
    - {term: "ARP", full: "Allocation and Retention Priority", desc: "베어러의 우선순위 값이다. S-GW는 더 높은 우선순위 베어러로 데이터가 오면 DDN을 다시 보낸다.", ref: "TS 23.401 §5.3.4.3"}
    - {term: "Paging", desc: "MME가 휴지 단말을 부르는 절차다. MME는 단말이 등록된 TA 목록의 각 eNodeB에 S1-AP Paging을 보내고, eNodeB가 무선으로 단말을 부른다.", ref: "TS 23.401 §5.3.4.3 (3a, 4a단계)"}
    - {term: "eDRX", full: "extended idle mode DRX", desc: "휴지 단말이 페이징을 듣는 주기를 길게 늘려 전력을 아끼는 기능이다. 단말이 Attach·TAU 때 요청하고 MME가 허용 여부를 정한다. MME는 단말의 다음 페이징 시점 직전에 페이징한다.", ref: "TS 23.401 §5.13a, §5.3.4.3 (3a단계)"}
    - {term: "Extended buffering", desc: "단말이 PSM·eDRX 때문에 지금 페이징을 받을 수 없을 때, MME가 DDN Ack로 S-GW에 하향 데이터를 더 오래 버퍼링하게 하는 기능이다. DL Buffering Requested와 버퍼링 시간을 넣는다.", ref: "TS 23.401 §5.3.4.3 (2단계)"}

- set: csgn-idle
  summary: |
    데이터를 한동안 주고받지 않은 단말은 휴지(ECM-IDLE) 상태로 내려간다.
    이 전환을 S1 release라고 한다.
    보통 eNodeB가 User Inactivity(사용자 무활동)를 원인으로 S1 UE Context Release Request를 보내며 시작한다.
    MME는 S-GW에 Release Access Bearers를 보내 S1-U의 eNodeB 쪽 정보(주소·TEID)를 지우게 한다.
    MME가 eNodeB에 UE Context Release Command를 보내면, eNodeB는 RRC Connection Release로 단말 무선 연결을 끊고 단말 컨텍스트를 지운다.
    등록(EMM-REGISTERED), PDN 연결, non-GBR 베어러는 MME와 S-GW에 그대로 남는다.
    그래서 다시 통신할 때는 Attach 없이 Service Request만 하면 된다.
    CIoT 단말은 휴지 중 전력을 더 아끼려고 PSM이나 eDRX를 쓴다.
    PSM 단말은 휴지가 된 뒤 Active 타이머가 끝나면 무선 기능을 끄고, 그동안 페이징을 받지 않는다.
  flows:
    - id: epc-0017
      title: "eNodeB가 시작하는 S1 release"
      notes:
        - "eNodeB가 단말을 휴지 상태로 보내자고 요청한다. 흔한 원인은 일정 시간 데이터가 없는 User Inactivity다."
        - "MME가 S-GW에 그 단말의 S1-U 베어러 해제를 요청한다."
        - "S-GW가 eNodeB 주소와 TEID를 지우고 답한다. 자기 상향 TEID와 베어러는 유지하고, 이후 오는 하향 패킷은 버퍼링한다."
        - "MME가 eNodeB에 단말 컨텍스트 해제를 지시한다."
        - "eNodeB가 단말 무선 연결을 끊는다. 단말이 확인하면 eNodeB는 단말 컨텍스트를 지운다."
        - "eNodeB가 해제를 확인한다. MME는 eNodeB 관련 정보만 지우고 나머지 단말 정보는 유지한다. 단말과 MME 모두 ECM-IDLE이 된다."
  terms:
    - {term: "S1 release", desc: "단말의 S1-AP 신호 연결과 모든 S1-U 베어러를 해제해 단말을 ECM-CONNECTED에서 ECM-IDLE로 보내는 절차다. eNodeB나 MME가 시작한다.", ref: "TS 23.401 §5.3.5"}
    - {term: "UE Context Release Request / Command / Complete", match: ["S1 UE Context Release Request", "S1 UE Context Release Command", "S1 UE Context Release Complete", "UE Context Release Request", "UE Context Release Command", "UE Context Release Complete", "UE Context Release"], desc: "S1 release의 S1-AP 메시지다. Request는 eNodeB가 해제를 요청할 때, Command는 MME가 해제를 지시할 때, Complete는 eNodeB가 해제를 확인할 때 보낸다. 퀴즈 조각에서는 S1 접두어를 빼고 Req·Cmd·Cmpl로 줄여 쓴다.", ref: "TS 23.401 §5.3.5 (1b, 4, 6단계)"}
    - {term: "Release Access Bearers Request / Response", match: ["Release Access Bearers Request", "Release Access Bearers Response", "Release Access Bearers"], desc: "MME가 S-GW에 그 단말의 S1-U 베어러 해제를 요청하는 메시지다. S-GW는 eNodeB 주소와 TEID만 지우고, 자신이 할당한 S1-U 설정은 유지한다.", ref: "TS 23.401 §5.3.5 (2, 3단계)"}
    - {term: "RRC Connection Release", desc: "eNodeB가 단말의 무선 연결을 끊는 메시지다. 단말이 확인하면 eNodeB는 단말 컨텍스트를 지운다.", ref: "TS 23.401 §5.3.5 (5단계)"}
    - {term: "User Inactivity", desc: "일정 시간 데이터가 없어 eNodeB가 S1 release를 요청할 때 쓰는 원인 값이다. 이 원인이면 MME는 GBR 베어러도 유지한다.", ref: "TS 23.401 §5.3.5 (1b, 6단계)"}
    - {term: "GBR / non-GBR 베어러", match: ["GBR 베어러", "non-GBR 베어러", "GBR", "non-GBR"], full: "Guaranteed Bit Rate", desc: "GBR 베어러는 보장 비트율용 망 자원을 고정으로 잡아 두는 베어러다. 그렇지 않은 베어러는 non-GBR이다. S1 release 뒤에도 non-GBR 베어러는 항상 보존된다.", ref: "TS 23.401 §4.7.2.1, §5.3.5 (6단계)"}
    - {term: "PSM", full: "Power Saving Mode", desc: "휴지 단말이 무선 기능을 꺼서 전력을 아끼는 모드다. PSM 중 단말은 페이징을 받지 않는다. MME는 단말을 EMM-REGISTERED로 보되 도달 불가로 처리한다.", ref: "TS 23.401 §4.3.22"}
    - {term: "Active Time · Active 타이머", desc: "PSM에 들어가기 전 휴지 상태로 페이징을 받는 시간이다. 단말이 Attach·TAU 때 요청하고, ECM-IDLE이 될 때 단말과 MME가 타이머를 시작한다. 타이머가 끝나면 단말은 PSM에 들어간다.", ref: "TS 23.401 §4.3.22"}
    - {term: "주기적 TAU", desc: "단말이 망에 살아 있음을 알리려고 정해진 주기마다 하는 TAU다. PSM 단말은 이 시점에 깨어난다. 보낼 데이터가 생기면 그 전에도 깨어날 수 있다.", ref: "TS 23.401 §4.6.3.1, §4.3.22"}
    - {term: "Connection Suspend / Resume", match: ["Connection Suspend", "Connection Resume"], desc: "User Plane CIoT 최적화에서 S1 release 대신 쓰는 방식이다. eNodeB가 단말 컨텍스트를 지우지 않고 보관해 두었다가, 단말이 돌아오면 Service Request 대신 Resume으로 빠르게 복귀한다.", ref: "TS 23.401 §4.6.3.1, §4.6.3.2, §5.3.4.3 (5단계)"}

- set: csgn-data
  summary: |
    사용자 데이터가 지나는 길(사용자 평면)과 절차를 지휘하는 신호의 길(제어 평면)은 따로 있다.
    업링크 데이터는 UE → eNodeB → S-GW → P-GW → 외부망 순서로 흐르고, 다운링크는 그 반대다.
    eNodeB–S-GW 구간(S1-U)과 S-GW–P-GW 구간(S5)에서는 사용자 패킷을 GTP-U 터널에 담아 보낸다.
    터널 안의 패킷이 어느 베어러 것인지는 TEID로 구분한다.
    TEID는 받는 쪽이 정해서 보내는 쪽에 알려 준다.
    그래서 eNodeB는 S-GW가 정한 상향 TEID를, S-GW는 eNodeB가 정한 하향 TEID를 알아야 한다.
    Service Request에서 업링크가 먼저 열리는 이유가 여기에 있다.
    eNodeB는 Initial Context Setup Request로 상향 TEID를 바로 받지만, S-GW는 Modify Bearer Request를 받아야 하향 TEID를 안다.
    C-SGN이 쓰는 Control Plane CIoT 최적화는 이 사용자 평면을 쓰지 않는다.
    소량 데이터를 NAS 메시지에 담아 MME로 보내고, MME가 S11-U로 S-GW에 넘긴다.
  flows:
    - id: epc-0016
      title: "Service Request에서 TEID가 오가는 순서"
      notes:
        - "아직 사용자 평면이 없다. S-GW는 S1 release 때 eNodeB 쪽 TEID를 지웠고, 자기 상향 TEID만 갖고 있다."
        - "MME가 보관하던 S-GW 주소와 상향 TEID를 eNodeB에 준다. TEID는 받는 쪽이 정하므로 상향 TEID는 S-GW가 정한 값이다."
        - "무선 베어러가 서면 eNodeB가 상향 TEID를 붙여 업링크 패킷을 S-GW로 보낼 수 있다. 업링크가 먼저 열린다."
        - "eNodeB가 하향 TEID를 정해 자기 주소와 함께 MME에 알린다."
        - "MME가 eNodeB 주소와 하향 TEID를 S-GW에 넘긴다."
        - "S-GW가 하향 TEID를 알게 되어 다운링크가 열린다."
  terms:
    - {term: "EPS 베어러", match: ["EPS 베어러", "EPS bearer"], desc: "단말과 P-GW 사이에서 같은 QoS로 다루는 트래픽 흐름의 단위다. QoS를 다르게 주려면 베어러를 따로 만든다. PDN 연결마다 기본 베어러가 하나 있고, 추가 베어러는 전용(dedicated) 베어러라고 한다.", ref: "TS 23.401 §4.7.2.1"}
    - {term: "EPS Bearer ID", desc: "단말의 EPS 베어러를 구분하는 번호다. DDN과 Control Plane CIoT의 NAS 데이터에 들어간다.", ref: "TS 23.401 §5.3.4.3, §5.3.4B.1"}
    - {term: "TFT", full: "Traffic Flow Template", desc: "베어러에 붙는 패킷 필터 묶음이다. 단말은 상향 TFT로, P-GW는 하향 TFT로 패킷을 어느 베어러에 실을지 정한다.", ref: "TS 23.401 §4.7.2.1"}
    - {term: "GTP-U / GTP-C", full: "GPRS Tunnelling Protocol", desc: "GTP-U는 S1-U·S5에서 사용자 패킷을 터널로 나르는 프로토콜이다. S11·S5의 제어 메시지(Create Session, Modify Bearer, DDN 등)는 GTP 제어 프로토콜(GTP-C)로 주고받는다.", ref: "TS 23.401 §4.2.3; TS 29.281 §3.2"}
    - {term: "TEID", full: "Tunnel Endpoint Identifier", desc: "GTP 터널의 받는 쪽 끝점을 가리키는 식별자다. 받는 쪽이 값을 정하고, 보내는 쪽은 그 값을 붙여 보낸다. 값은 제어 메시지로 교환한다.", ref: "TS 29.281 §3.1"}
    - {term: "S1-MME", desc: "eNodeB와 MME 사이의 제어 평면 레퍼런스 포인트다(S1-AP).", ref: "TS 23.401 §4.2.3"}
    - {term: "S1-U", desc: "eNodeB와 S-GW 사이의 베어러별 사용자 평면 터널이다. Control Plane CIoT 최적화에는 쓰지 않는다.", ref: "TS 23.401 §4.2.3"}
    - {term: "S11 / S11-U", desc: "S11은 MME와 S-GW 사이의 제어 평면이다. S11-U는 Control Plane CIoT 최적화를 위해 같은 구간에 둔 사용자 평면이다.", ref: "TS 23.401 §4.2.3"}
    - {term: "S5 / S8", desc: "S-GW와 P-GW 사이의 사용자 평면 터널과 터널 관리 구간이다. 같은 사업자 안이면 S5, 로밍처럼 방문망 S-GW와 홈망 P-GW 사이면 S8이다.", ref: "TS 23.401 §4.2.3"}
    - {term: "SGi", desc: "P-GW와 외부 패킷 데이터망(인터넷, IMS 등) 사이의 레퍼런스 포인트다.", ref: "TS 23.401 §4.2.3"}
    - {term: "Modify Bearer Request", match: ["Modify Bearer Request", "Modify Bearer"], desc: "MME가 S-GW에 eNodeB 주소와 하향 TEID를 알려 주는 GTP-C 메시지다. 이 메시지 뒤에야 S-GW가 단말 쪽으로 하향 데이터를 보낼 수 있다.", ref: "TS 23.401 §5.3.4.1 (8단계)"}
    - {term: "Control Plane CIoT 최적화", match: ["Control Plane CIoT 최적화", "Control Plane CIoT EPS Optimisation", "Control Plane CIoT"], full: "Control Plane CIoT EPS Optimisation", desc: "사용자 데이터를 NAS 메시지에 EPS Bearer ID와 함께 담아 보내는 방식이다. 무선 베어러와 S1-U를 세우지 않아 신호가 줄어든다. 데이터는 eNodeB → MME(S1-AP) → S-GW(S11-U)로 간다.", ref: "TS 23.401 §5.3.4B.1, §5.3.4B.2"}
    - {term: "ROHC", desc: "IP 헤더 압축 방식이다. Control Plane CIoT에서는 단말과 MME 사이에서 압축한다. 업링크는 단말이 압축하고 MME가 풀고, 다운링크는 그 반대다.", ref: "TS 23.401 §5.3.4B.1"}
    - {term: "Release Assistance Information", desc: "단말이 NAS 데이터에 함께 넣어 '이후 데이터 없음' 또는 '응답 하향 데이터 한 번만 옴'을 알리는 정보다. MME는 이를 보고 연결을 일찍 해제할 수 있다.", ref: "TS 23.401 §5.3.4B.2 (1단계), §5.3.5"}
