<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIP/Diameter 퀴즈</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --fg: #1c1c1e;
    --card: #ffffff;
    --border: #d8d8dc;
    --muted: #6e6e73;
    --accent: #0a66c2;
    --accent-bg: #e6f0fa;
    --good-bg: #e4f7e9;
    --good-fg: #157a3d;
    --bad-bg: #fdeaea;
    --bad-fg: #b3221a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #f2f2f4;
      --card: #1e1e21;
      --border: #3a3a3d;
      --muted: #9a9a9e;
      --accent: #4da3ff;
      --accent-bg: #142943;
      --good-bg: #123a20;
      --good-fg: #6fdb92;
      --bad-bg: #3a1414;
      --bad-fg: #ff8f87;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    padding-bottom: 48px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .badges { margin-bottom: 10px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    margin-right: 6px;
  }
  .question {
    font-size: 17px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-family: inherit;
    margin: 0 0 16px;
  }
  .question.raw {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    background: var(--bg);
    padding: 10px;
    border-radius: 8px;
  }
  #answer-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .order-label {
    font-size: 12px;
    color: var(--muted);
  }
  .order-pool {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px;
  }
  .order-answer {
    min-height: 44px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 10px 4px;
    background: var(--bg);
  }
  .order-placeholder {
    color: var(--muted);
    font-size: 14px;
    padding: 8px 2px 2px;
  }
  .order-reset {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    text-align: right;
    padding: 4px;
    cursor: pointer;
  }
  button.opt {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 16px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.opt:active { opacity: 0.7; }
  button.opt.chip {
    display: inline-block;
    width: auto;
  }
  button.opt.correct { background: var(--good-bg); color: var(--good-fg); border-color: var(--good-fg); }
  button.opt.wrong { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-fg); }
  button.opt:disabled { cursor: default; opacity: 1; }
  .ox-row { display: flex; gap: 10px; }
  .ox-row button.opt { text-align: center; font-size: 22px; font-weight: 600; padding: 20px; }
  input[type=text] {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 10px;
  }
  .primary {
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .primary:disabled { opacity: 0.4; }
  .secondary {
    width: 100%;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .feedback {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .feedback .verdict { font-weight: 700; margin-bottom: 8px; }
  .feedback .verdict.correct { color: var(--good-fg); }
  .feedback .verdict.wrong { color: var(--bad-fg); }
  .feedback .explain { white-space: pre-wrap; line-height: 1.5; margin: 0 0 10px; }
  .feedback .ref { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .diagram { position: relative; margin: 4px 0 18px; font-size: 12px; }
  .diagram-header { position: relative; height: 30px; }
  .diagram-actor {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 700;
    color: var(--fg);
  }
  .diagram-body { position: relative; }
  .diagram-lifeline {
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: 1px dashed var(--muted);
  }
  .diagram-row { position: absolute; left: 0; right: 0; height: 44px; }
  .diagram-msg {
    position: absolute;
    top: 2px;
    text-align: center;
    color: var(--muted);
    background: var(--card);
    padding: 0 4px;
  }
  .diagram-line {
    position: absolute;
    top: 22px;
    height: 1px;
    background: var(--fg);
  }
  .diagram-line::after {
    content: "▶";
    position: absolute;
    top: -7px;
    right: -2px;
    font-size: 11px;
    line-height: 1;
  }
  .diagram-line.rev::after {
    content: "◀";
    right: auto;
    left: -2px;
  }
  .diagram-row.tappable { cursor: pointer; }
  .diagram-row.tappable .diagram-msg { color: var(--accent); }
  .diagram-row.tappable .diagram-line { background: var(--accent); }
  .diagram-row.tappable .diagram-line::after { color: var(--accent); }
  .diagram-row.tappable:active .diagram-msg,
  .diagram-row.tappable:active .diagram-line { opacity: 0.5; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="topic-label"></span>
    <span id="deck-label"></span>
  </header>
  <div class="card">
    <div id="badges" class="badges"></div>
    <div id="question" class="question"></div>
    <div id="answer-area"></div>
    <button id="pass-btn" class="secondary">모르겠음 (PASS)</button>
    <div id="feedback" class="feedback" hidden>
      <div id="verdict" class="verdict"></div>
      <div id="diagram"></div>
      <p id="explain" class="explain"></p>
      <p id="ref" class="ref"></p>
      <button id="next-btn" class="primary">다음 문제</button>
    </div>
  </div>
  <footer>상태 저장 없음 · 새로고침하면 처음부터</footer>
</div>

<script id="quiz-data" type="application/json">[{"id": "sip-0001", "type": "mcq", "topic": "SIP", "tags": ["method"], "question": "RFC 3261이 정의하는 6개 기본 메서드에 포함되지 않는 것은?", "choices": ["REGISTER", "SUBSCRIBE", "CANCEL", "OPTIONS"], "answer": 1, "explain": "RFC 3261은 REGISTER, INVITE, ACK, CANCEL, BYE, OPTIONS 6개를 기본 메서드로\n정의한다. SUBSCRIBE는 이벤트 구독을 위한 확장 메서드로 RFC 3265에서 별도로\n정의되었고, RFC 3261 기본 6종에는 포함되지 않는다.\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0002", "type": "order", "topic": "SIP", "tags": ["message-flow"], "question": "성공적인 SIP 세션 설정 흐름을 순서대로, 발신/착신 방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "180 Ringing", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "explain": "발신자가 INVITE를 보내면 잠정 응답 100 Trying이 먼저 오고, 착신 단말이\n울리면 180 Ringing이 온다. 착신자가 응답하면 200 OK가 오며, 발신자는\n이를 확인하는 ACK를 보내 세션이 시작된다.\n", "ref": "RFC 3261 §4 (Figure 1)"}, {"id": "sip-0003", "type": "order", "topic": "SIP", "tags": ["message-flow", "method"], "question": "발신자가 응답 대기 중 통화를 취소(CANCEL)하는 흐름을 순서대로, 발신/착신 방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "200 OK (CANCEL 응답)", "from": "착신자", "to": "발신자"}, {"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}], "explain": "잠정 응답(100 Trying)을 받은 뒤에만 CANCEL을 보낼 수 있다. UAS는 CANCEL\n요청 자체에는 200 OK로 응답하고, 별도로 원래의 INVITE 트랜잭션은 487\nRequest Terminated로 종료시킨다. 두 응답은 서로 다른 트랜잭션에 대한\n응답이라는 점이 헷갈리기 쉽다.\n", "ref": "RFC 3261 §9.2"}, {"id": "sip-0004", "type": "ox", "topic": "SIP", "tags": ["method"], "question": "CANCEL은 INVITE 요청에 대해서만 사용해야 한다.", "answer": true, "explain": "INVITE 이외의 요청은 즉시 응답되므로 CANCEL을 보내면 경쟁 상태(race\ncondition)가 발생한다. RFC 3261은 CANCEL을 INVITE가 아닌 요청에는\n보내지 말아야 한다(SHOULD NOT)고 규정한다.\n", "ref": "RFC 3261 §9.1"}, {"id": "sip-0005", "type": "ox", "topic": "SIP", "tags": ["method"], "question": "이미 최종 응답을 받은 요청에 CANCEL을 보내면 그 요청의 처리에 영향을 준다.", "answer": false, "explain": "원래 요청에 대해 이미 최종 응답(2xx~6xx)이 발생했다면, CANCEL은 그\n요청의 처리·세션 상태·응답 생성 어느 것에도 영향을 주지 않는다.\n사실상 아무 효과 없는 요청(no-op)이 된다.\n", "ref": "RFC 3261 §9.2"}, {"id": "sip-0006", "type": "short", "topic": "SIP", "tags": ["method"], "question": "SIP에서 진행 중인 세션(통화)을 종료할 때 사용하는 메서드는?", "answer": ["BYE"], "explain": "RFC 3261은 BYE를 \"세션을 종료하기 위한\" 메서드로 정의한다. INVITE로\n세션을 시작했다면, 종료는 CANCEL이 아니라 BYE로 한다 — CANCEL은 아직\n최종 응답을 받기 전의 진행 중인 요청을 취소할 때만 쓴다(sip-0004/0005).\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0007", "type": "mcq", "topic": "SIP", "tags": ["response-code", "concept"], "question": "1xx(잠정 응답) 클래스의 성격을 가장 정확히 설명한 것은?", "choices": ["요청이 성공적으로 완료됐음을 뜻한다", "서버가 아직 확정 응답을 갖지 못한 채 처리 중임을 뜻한다", "요청 문법에 오류가 있음을 뜻한다", "사용자가 다른 위치로 옮겨갔음을 뜻한다"], "answer": 1, "explain": "1xx는 확정 응답이 아직 없다는 뜻으로, 서버가 200ms 넘게 걸릴 것 같을 때\n보낸다. 신뢰성 있게 전달되지 않으며(재전송 없음) ACK도 유발하지 않는다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0008", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "1xx 응답은 클라이언트의 ACK 전송을 유발하지 않는다.", "answer": true, "explain": "1xx는 잠정 응답이라 신뢰성 있게 전달되지 않고, ACK도 유발하지 않는다.\nACK는 INVITE에 대한 응답을 확인할 때만 쓰인다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0009", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "486 Busy Here 대신 600 Busy Everywhere를 써야 하는 경우는?", "choices": ["서버가 이 사용자와 관련된 다른 어떤 단말도 응답하지 않을 것임을 알고 있을 때", "더 정중한 표현이 필요할 때", "여러 단말이 동시에 울리는 포킹 상황일 때", "응답을 더 빨리 보내고 싶을 때"], "answer": 0, "explain": "486은 \"이 단말\"만 통화 중이라는 뜻이라 음성사서함 등 다른 경로로 연결될\n여지가 있다. 600은 서버가 어떤 단말로도 연결 안 될 걸 알 때만 쓴다.\n", "ref": "RFC 3261 §21.6.1"}, {"id": "sip-0010", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "Request-URI에 다이얼 문자열이 아직 다 입력되지 않아 불완전할 때 쓰는 응답은?", "choices": ["404 Not Found", "484 Address Incomplete", "485 Ambiguous", "400 Bad Request"], "answer": 1, "explain": "484는 오버랩 다이얼링(자릿수를 늘려가며 재전송)을 지원하기 위한 코드다.\n클라이언트는 484를 받는 동안 계속 더 긴 문자열로 재전송한다.\n", "ref": "RFC 3261 §21.4.22"}, {"id": "sip-0011", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "485 Ambiguous와 300 Multiple Choices는 의미(semantics)가 달라서 별도의 코드로 분리되어 있다.", "answer": true, "explain": "300은 같은 사용자/서비스에 도달하는 여러 경로가 있다는 뜻으로 자동 선택도\n가능하지만, 485는 Request-URI 자체가 여러 사람 중 누구인지 애매하다는\n뜻이라 사람이 개입해 골라야 한다.\n", "ref": "RFC 3261 §21.4.23"}, {"id": "sip-0012", "type": "short", "topic": "SIP", "tags": ["response-code"], "question": "프록시 서버가(사용자가 아니라) 클라이언트 인증을 요구할 때 쓰는 응답 코드는?", "answer": ["407"], "explain": "401은 UAS/registrar가, 407은 프록시가 쓴다는 게 핵심 구분이다. 통신사업자\n게이트웨이처럼 \"채널 접근\" 자체에 인증이 필요한 경우 407을 쓴다.\n", "ref": "RFC 3261 §21.4.8"}, {"id": "sip-0013", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "483 Too Many Hops가 발생하는 조건은?", "choices": ["Max-Forwards 헤더 값이 0인 요청을 받음", "서버가 루프를 감지함", "요청 URI가 존재하지 않는 도메인을 가리킴", "메시지 크기가 서버 한도를 초과함"], "answer": 0, "explain": "483은 Max-Forwards=0으로 명확히 정의된다. 반면 482 Loop Detected는\n(Max-Forwards와 별개로) 서버가 실제 루프를 감지했을 때 쓰는, 조건이\n다른 코드다.\n", "ref": "RFC 3261 §21.4.21"}, {"id": "sip-0014", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "482 Loop Detected와 483 Too Many Hops는 둘 다 Max-Forwards 값이 0이 되는 같은 조건에서 발생한다.", "answer": false, "explain": "483만 Max-Forwards=0으로 명시적으로 정의된다. 482는 서버가 루프를\n감지했을 때 쓰는 별개의 메커니즘이다.\n", "ref": "RFC 3261 §21.4.20, §21.4.21"}, {"id": "sip-0015", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "상대방이 이미 다른 통화를 처리 중이라 이 통화에 응답할 수 없을 때 가장 적합한 코드는?", "choices": ["480 Temporarily Unavailable", "486 Busy Here", "487 Request Terminated", "600 Busy Everywhere"], "answer": 1, "explain": "480은 로그아웃·방해금지 등 응대 불가 상태 전반을 포괄하는 코드고, 486은\n그중 \"다른 통화 처리 중\"이라는 이유를 더 정확히 알려주고 싶을 때 쓴다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0016", "type": "short", "topic": "SIP", "tags": ["response-code"], "question": "SIP 응답 코드 486의 영문 명칭은?", "answer": ["Busy Here"], "explain": "486 Busy Here — 상대방 단말은 연결됐지만 지금 이 단말에서는 추가 통화를\n받을 수 없다는 뜻이다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0017", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "487 Request Terminated이 발생하는 원인은?", "choices": ["BYE 또는 CANCEL에 의해 원래 요청이 종료됨", "요청이 제 시간 안에 처리되지 못함", "서버 내부 오류가 발생함", "요청 문법이 잘못됨"], "answer": 0, "explain": "487은 진행 중이던 요청(주로 INVITE)이 BYE나 CANCEL로 인해 중단됐을 때\n그 원래 요청에 대한 최종 응답으로 온다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0018", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "CANCEL 요청 자체에 대한 응답으로 487 Request Terminated이 올 수 있다.", "answer": false, "explain": "487은 CANCEL로 인해 종료되는 \"원래 요청\"(예: INVITE)에 대한 응답이다.\nCANCEL 요청 자체는 항상 200 OK로 응답되며, CANCEL에 대한 응답으로\n487이 오는 일은 없다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0019", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "301 Moved Permanently를 받으면 클라이언트는 로컬 주소록을 새 주소로 갱신하는 것이 권장된다.", "answer": true, "explain": "301은 영구 이동이므로, 요청자는 주소록·캐시 등을 새 주소로 갱신하고\n이후 요청도 그 주소로 보내는 게 권장된다. 302(일시 이동)는 이렇게까지\n하지 않는다.\n", "ref": "RFC 3261 §21.3.2"}, {"id": "sip-0020", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "302 Moved Temporarily 응답에 만료 시간이 없으면, 그 Contact 주소는 이후에도 계속 캐시해서 재사용해도 된다.", "answer": false, "explain": "명시적 만료 시간이 없으면 그 주소는 딱 한 번의 재시도(recursing)에만\n유효하며, 향후 트랜잭션을 위해 캐시하면 안 된다(MUST NOT).\n", "ref": "RFC 3261 §21.3.3"}, {"id": "sip-0021", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "503 Service Unavailable을 Retry-After 헤더 없이 받았을 때 클라이언트는 어떻게 동작해야 하는가?", "choices": ["500 Server Internal Error를 받은 것처럼 동작한다", "1분 뒤 같은 요청을 그대로 재전송한다", "요청을 완전히 포기한다", "즉시 같은 서버로 요청을 다시 보낸다"], "answer": 0, "explain": "Retry-After가 없으면 클라이언트는 500을 받은 것처럼(MUST) 동작해야\n한다. Retry-After가 있다면 그 시간 동안은 해당 서버로 다른 요청도\n보내지 않는 게 권장된다.\n", "ref": "RFC 3261 §21.5.4"}, {"id": "sip-0022", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "서버가 요청 메서드 자체를 전혀 지원하지 않아(어떤 사용자에 대해서도) 처리할 수 없을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "400 Bad Request", "503 Service Unavailable"], "answer": 1, "explain": "501은 서버가 그 메서드 자체를 지원하지 않을 때(UAS가 메서드를 인식조차\n못 함) 쓴다. 메서드는 인식하지만 그 주소에서만 허용 안 되는 경우는\n405다.\n", "ref": "RFC 3261 §21.5.2"}, {"id": "sip-0023", "type": "mcq", "topic": "SIP", "tags": ["response-code"], "question": "서버가 요청 메서드를 인식은 하지만, 그 Request-URI가 가리키는 주소에서는 허용하지 않을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "406 Not Acceptable", "403 Forbidden"], "answer": 0, "explain": "405는 메서드 자체는 알지만 그 주소에서 허용 안 될 때, 501은 메서드\n자체를 서버가 아예 지원 안 할 때 쓴다. 405 응답에는 허용되는 메서드\n목록을 Allow 헤더로 반드시 포함해야 한다.\n", "ref": "RFC 3261 §21.4.6, §21.5.2"}, {"id": "sip-0024", "type": "ox", "topic": "SIP", "tags": ["response-code"], "question": "504 Server Time-out은 서버가 접근한 외부(다운스트림) 서버로부터 제때 응답을 받지 못했을 때 쓰고, 408 Request Timeout은 서버 자신이 제 시간에 응답을 만들어내지 못했을 때 쓴다.", "answer": true, "explain": "408은 서버 자체가 시간 내 응답을 못 만든 경우(예: 사용자 위치 파악\n지연)를 포괄하고, 504는 그 원인이 서버가 접근한 외부 서버의 응답\n지연일 때 쓰는 더 구체적인 코드다.\n", "ref": "RFC 3261 §21.4.9, §21.5.5"}, {"id": "sip-0025", "type": "mcq", "topic": "SIP", "tags": ["response-code", "concept"], "question": "SIP이 HTTP/1.1 응답 코드 체계를 확장하면서 새로 정의한 클래스는?", "choices": ["1xx", "3xx", "5xx", "6xx"], "answer": 3, "explain": "SIP 응답 코드는 HTTP/1.1을 기반으로 하되 그중 적절한 것만 가져다\n쓰고, 6xx(Global Failures)는 SIP이 새로 정의한 클래스다.\n", "ref": "RFC 3261 §21"}, {"id": "sip-0026", "type": "ox", "topic": "SIP", "tags": ["response-code", "concept"], "question": "3xx 응답은 4xx/5xx/6xx와 마찬가지로 확정적 실패(definite failure)로 분류된다.", "answer": false, "explain": "4xx는 \"특정 서버로부터의 확정적 실패 응답\"으로 명시되지만, 3xx는\n실패가 아니라 사용자의 새 위치나 대체 서비스 정보를 알려주는\n응답이다.\n", "ref": "RFC 3261 §21.3, §21.4"}]</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  if (!DATA.length) {
    document.getElementById("app").textContent = "문제가 없습니다.";
    return;
  }

  var deck = [];
  var current = null;
  var answered = false;

  var elTopic = document.getElementById("topic-label");
  var elDeckCount = document.getElementById("deck-label");
  var elBadges = document.getElementById("badges");
  var elQuestion = document.getElementById("question");
  var elAnswerArea = document.getElementById("answer-area");
  var elFeedback = document.getElementById("feedback");
  var elVerdict = document.getElementById("verdict");
  var elDiagram = document.getElementById("diagram");
  var elExplain = document.getElementById("explain");
  var elRef = document.getElementById("ref");
  var elNextBtn = document.getElementById("next-btn");
  var elPassBtn = document.getElementById("pass-btn");

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function nextQuestion() {
    if (deck.length === 0) deck = shuffle(DATA);
    return deck.pop();
  }

  function el(tag, opts) {
    var e = document.createElement(tag);
    opts = opts || {};
    if (opts.text !== undefined) e.textContent = opts.text;
    if (opts.cls) e.className = opts.cls;
    return e;
  }

  function looksRaw(text) {
    return text.indexOf("\n") !== -1;
  }

  function showFeedback(isCorrect, explain, ref, diagramNode) {
    answered = true;
    elPassBtn.hidden = true;
    elVerdict.textContent = isCorrect ? "정답" : "오답";
    elVerdict.className = "verdict " + (isCorrect ? "correct" : "wrong");
    elDiagram.innerHTML = "";
    if (diagramNode) elDiagram.appendChild(diagramNode);
    elExplain.textContent = explain;
    elRef.textContent = "ref: " + ref;
    elFeedback.hidden = false;
  }

  // 참가자 목록: q.items를 순서대로 훑으며 처음 등장하는 순서로 레인을 고정한다.
  function collectActors(items) {
    var actors = [];
    items.forEach(function (it) {
      if (actors.indexOf(it.from) === -1) actors.push(it.from);
      if (actors.indexOf(it.to) === -1) actors.push(it.to);
    });
    return actors;
  }

  // 이 문제의 정답에 실제로 등장하는 (from, to) 조합만. 방향 토글은 이 목록만 순환한다 —
  // actor를 전부 조합(N*(N-1))하면 참가자가 늘수록(HSS/EIR/OFCS 등) 실제로 안 쓰이는
  // 조합까지 순환에 끼어들어 탭 수만 늘어난다.
  function collectPairs(items) {
    var pairs = [];
    items.forEach(function (it) {
      var exists = pairs.some(function (p) { return p[0] === it.from && p[1] === it.to; });
      if (!exists) pairs.push([it.from, it.to]);
    });
    return pairs;
  }

  // 좌표(퍼센트)를 직접 계산해서 화살표가 항상 정확히 두 lifeline 사이에 걸치게 한다
  // (그리드 칸 경계에 맞추면 lifeline이 칸 "중앙"에 있어서 살짝 어긋난다).
  // actors: 참가자 목록(레인 순서 고정). rows: [{msg, from, to}, ...] 위에서부터 순서대로.
  // onRowClick(rowIndex)를 주면 각 줄이 탭 가능해진다(방향 전환용) — 안 주면 읽기 전용.
  var DIAGRAM_ROW_H = 44;

  function renderDiagram(actors, rows, onRowClick) {
    var n = actors.length;
    var xOf = function (i) { return (i + 0.5) / n * 100; };

    var wrap = el("div", { cls: "diagram" });

    var header = el("div", { cls: "diagram-header" });
    actors.forEach(function (a, i) {
      var box = el("div", { cls: "diagram-actor", text: a });
      box.style.left = xOf(i) + "%";
      header.appendChild(box);
    });
    wrap.appendChild(header);

    var body = el("div", { cls: "diagram-body" });
    body.style.height = (Math.max(rows.length, 1) * DIAGRAM_ROW_H + 10) + "px";

    actors.forEach(function (a, i) {
      var line = el("div", { cls: "diagram-lifeline" });
      line.style.left = xOf(i) + "%";
      body.appendChild(line);
    });

    rows.forEach(function (r, idx) {
      var fromIdx = actors.indexOf(r.from);
      var toIdx = actors.indexOf(r.to);
      var rev = toIdx < fromIdx;
      var x1 = xOf(Math.min(fromIdx, toIdx));
      var x2 = xOf(Math.max(fromIdx, toIdx));

      var row = el("div", { cls: "diagram-row" + (onRowClick ? " tappable" : "") });
      row.style.top = (idx * DIAGRAM_ROW_H) + "px";

      var msg = el("div", { cls: "diagram-msg", text: (idx + 1) + ". " + r.msg });
      msg.style.left = x1 + "%";
      msg.style.width = (x2 - x1) + "%";

      var line = el("div", { cls: "diagram-line" + (rev ? " rev" : "") });
      line.style.left = x1 + "%";
      line.style.width = (x2 - x1) + "%";

      row.appendChild(msg);
      row.appendChild(line);
      if (onRowClick) {
        row.addEventListener("click", function () { onRowClick(idx); });
      }
      body.appendChild(row);
    });

    wrap.appendChild(body);
    return wrap;
  }

  // 정답 순서/방향(q.items)을 읽기 전용 시퀀스 다이어그램으로 그린다. 채점 후 reveal에서만 쓴다.
  function buildDiagram(items) {
    return renderDiagram(collectActors(items), items, null);
  }

  function renderMcq(q) {
    var order = shuffle(q.choices.map(function (c, i) { return i; }));
    order.forEach(function (origIndex) {
      var btn = el("button", { cls: "opt", text: q.choices[origIndex] });
      btn.addEventListener("click", function () {
        if (answered) return;
        var isCorrect = origIndex === q.answer;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect) {
          Array.prototype.forEach.call(elAnswerArea.children, function (b, i) {
            if (order[i] === q.answer) b.classList.add("correct");
          });
        }
        Array.prototype.forEach.call(elAnswerArea.children, function (b) { b.disabled = true; });
        showFeedback(isCorrect, q.explain, q.ref);
      });
      elAnswerArea.appendChild(btn);
    });
  }

  function renderOx(q) {
    var row = el("div", { cls: "ox-row" });
    [true, false].forEach(function (val) {
      var btn = el("button", { cls: "opt", text: val ? "O" : "X" });
      btn.addEventListener("click", function () {
        if (answered) return;
        var isCorrect = val === q.answer;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if (!isCorrect) {
          Array.prototype.forEach.call(row.children, function (b, i) {
            if ([true, false][i] === q.answer) b.classList.add("correct");
          });
        }
        Array.prototype.forEach.call(row.children, function (b) { b.disabled = true; });
        showFeedback(isCorrect, q.explain, q.ref);
      });
      row.appendChild(btn);
    });
    elAnswerArea.appendChild(row);
  }

  function renderShort(q) {
    var input = el("input");
    input.type = "text";
    input.autocapitalize = "off";
    input.autocomplete = "off";
    var submit = el("button", { cls: "primary", text: "확인" });
    submit.addEventListener("click", function () {
      if (answered) return;
      var given = input.value.trim().toLowerCase();
      var isCorrect = q.answer.some(function (a) { return a.trim().toLowerCase() === given; });
      input.disabled = true;
      submit.disabled = true;
      showFeedback(isCorrect, q.explain + "\n정답: " + q.answer[0], q.ref);
    });
    elAnswerArea.appendChild(input);
    elAnswerArea.appendChild(submit);
  }

  function renderOrder(q) {
    // uid == 정답 순서상의 인덱스(q.items 기준). 중복 문구가 있어도 안전하게 구분된다.
    var actors = collectActors(q.items);
    var pairs = collectPairs(q.items);
    var pool = shuffle(q.items.map(function (item, uid) { return { item: item, uid: uid }; }));
    var poolEl = el("div", { cls: "order-pool" });
    var answerEl = el("div", { cls: "order-answer" });
    // chosen[i] = { uid, item, pairIndex } — 탭한 순서대로. pairIndex는 무작위 초기값이라
    // 방향을 안 건드리면 자동으로 맞는 일이 없다.
    var chosen = [];

    function renderPool() {
      poolEl.innerHTML = "";
      pool.forEach(function (p) {
        if (chosen.some(function (c) { return c.uid === p.uid; })) return;
        var btn = el("button", { cls: "opt chip", text: p.item.msg });
        btn.addEventListener("click", function () {
          if (answered) return;
          chosen.push({ uid: p.uid, item: p.item, pairIndex: Math.floor(Math.random() * pairs.length) });
          renderPool();
          renderAnswer();
        });
        poolEl.appendChild(btn);
      });
    }

    function renderAnswer() {
      answerEl.innerHTML = "";
      var rows = chosen.map(function (entry) {
        var pair = pairs[entry.pairIndex];
        return { msg: entry.item.msg, from: pair[0], to: pair[1] };
      });
      answerEl.appendChild(renderDiagram(actors, rows, function (idx) {
        if (answered) return;
        chosen[idx].pairIndex = (chosen[idx].pairIndex + 1) % pairs.length;
        renderAnswer();
      }));
      if (chosen.length === 0) {
        answerEl.appendChild(el("div", {
          cls: "order-placeholder",
          text: "위에서 순서대로 탭 → 담긴 항목을 다시 탭하면 방향 전환"
        }));
      }
    }

    var resetBtn = el("button", { cls: "order-reset", text: "↺ 처음부터" });
    resetBtn.addEventListener("click", function () {
      if (answered) return;
      chosen = [];
      renderPool();
      renderAnswer();
    });

    var submit = el("button", { cls: "primary", text: "확인" });
    submit.addEventListener("click", function () {
      if (answered) return;
      if (chosen.length !== q.items.length) return;
      var isCorrect = chosen.every(function (entry, i) {
        var pair = pairs[entry.pairIndex];
        return entry.uid === i && pair[0] === entry.item.from && pair[1] === entry.item.to;
      });
      submit.disabled = true;
      showFeedback(isCorrect, q.explain, q.ref, buildDiagram(q.items));
    });

    renderPool();
    renderAnswer();

    elAnswerArea.appendChild(el("div", { cls: "order-label", text: "탭해서 순서대로 선택" }));
    elAnswerArea.appendChild(poolEl);
    elAnswerArea.appendChild(el("div", { cls: "order-label", text: "내 답안 (탭하면 방향 전환)" }));
    elAnswerArea.appendChild(answerEl);
    elAnswerArea.appendChild(resetBtn);
    elAnswerArea.appendChild(submit);
  }

  function render(q) {
    current = q;
    answered = false;
    elBadges.innerHTML = "";
    q.tags.forEach(function (t) {
      elBadges.appendChild(el("span", { cls: "badge", text: t }));
    });
    elTopic.textContent = q.topic;
    elDeckCount.textContent = "남은 " + deck.length + "문제";
    elQuestion.textContent = q.question;
    elQuestion.className = "question" + (looksRaw(q.question) ? " raw" : "");
    elAnswerArea.innerHTML = "";
    elFeedback.hidden = true;
    elPassBtn.hidden = false;

    if (q.type === "mcq") renderMcq(q);
    else if (q.type === "ox") renderOx(q);
    else if (q.type === "short") renderShort(q);
    else if (q.type === "order") renderOrder(q);
  }

  elNextBtn.addEventListener("click", function () {
    render(nextQuestion());
  });

  elPassBtn.addEventListener("click", function () {
    if (answered) return;
    render(nextQuestion());
  });

  render(nextQuestion());
})();
</script>
</body>
</html>
