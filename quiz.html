Detach Request · 망 접속 해제(접속 아님)"}, "explain": "Attach는 인증 → 위치 등록 → 기본 베어러 생성 → 수락 순서다.\nMME는 AIR/AIA로 받은 인증 벡터로 UE와 EPS AKA를 한다. 인증이 끝나면 ULR/ULA로 HSS에 서빙 MME로 등록한다.\n가입자 데이터를 받은 MME는 Create Session으로 S-GW·P-GW에 기본 베어러를 만든다.\n그다음 Attach Accept를 보내고, UE의 Attach Complete를 받으면 Modify Bearer로 하향 경로를 완성한다.\nIMS의 MAR(인증)→SAR(등록)과 같은 인증→등록 구조다. 이 접속이 끝나야 IMS 등록(ims-0001)이 이어진다.\n다이어그램에서 생략한 부분이 있다. UE↔MME의 NAS 메시지는 실제로 eNodeB를 거친다.\nS-GW는 Create Session을 P-GW로 넘긴다.\nMME가 EIR에 ECR/ECA로 단말을 확인하는 단계(5b)는 선택 사항이라 넣지 않았다.\n", "ref": "3GPP TS 23.401 §5.3.2.1 (Figure 5.3.2.1-1); TS 29.272 §5.2.1.1, §5.2.3.1; TS 33.401 §6.1.1"}, {"id": "ims-0019", "type": "open", "topic": "IMS", "difficulty": "basic", "importance": 3, "tags": ["concept"], "question": "P-CSCF, I-CSCF, S-CSCF의 역할 차이를 설명하라.", "answer": "P-CSCF는 단말의 첫 SIP 접점(Gm)이고, 미디어 정책을 위해 PCRF와 Rx로 연동한다. 로밍이면 방문망에 있다.\nI-CSCF는 홈망의 진입점이다. HSS에 Cx로 물어(등록 때 UAR, 착신 때 LIR) 사용자를 담당할 S-CSCF를 찾는다.\nS-CSCF는 항상 홈망에 있는 세션 제어 노드다. 등록을 처리하는 레지스트라이고, 사용자 프로필을 받아 iFC로 AS를 트리거한다.\n", "points": ["P-CSCF: 단말의 첫 접점(Gm), PCRF와 Rx", "I-CSCF: 홈망 진입점, HSS 조회로 S-CSCF를 찾음", "S-CSCF: 홈망 세션 제어·레지스트라, 프로필과 iFC"], "explain": "S-CSCF를 고르는 것은 P-CSCF가 아니라 I-CSCF다.\n", "ref": "3GPP TS 23.228 (CSCF 기능)"}, {"id": "ims-0020", "type": "open", "topic": "IMS", "difficulty": "basic", "importance": 2, "tags": ["message-flow"], "question": "다른 망의 사용자가 IMS 가입자에게 전화를 걸 때, 착신망에서 INVITE가 단말까지 가는 과정을 설명하라.", "answer": "착신망의 진입점인 I-CSCF가 INVITE를 받는다.\nI-CSCF는 그 사용자를 담당하는 S-CSCF를 모르므로 LIR/LIA로 HSS에 서빙 S-CSCF 이름을 조회한다.\nI-CSCF는 그 S-CSCF로 INVITE를 넘기고, S-CSCF가 착신 서비스(iFC)를 적용한 뒤 단말 쪽으로 보낸다.\n", "points": ["착신망 진입점 I-CSCF가 INVITE를 받음", "LIR/LIA로 HSS에 서빙 S-CSCF를 조회", "S-CSCF로 넘기고, iFC 적용 후 단말로"], "explain": "실제로는 S-CSCF와 단말 사이에 P-CSCF가 있다.\nUAR은 등록용 커맨드라 착신 경로를 찾는 데는 쓰지 않는다.\n", "ref": "3GPP TS 24.229; TS 29.228; TS 29.229 §6.1.5"}, {"id": "sip-0001", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method"], "question": "RFC 3261이 정의하는 6개 기본 메서드에 포함되지 않는 것은?", "choices": ["REGISTER", "SUBSCRIBE", "CANCEL", "OPTIONS"], "answer": 1, "explain": "RFC 3261은 REGISTER, INVITE, ACK, CANCEL, BYE, OPTIONS 6개를 기본 메서드로\n정의한다. SUBSCRIBE는 이벤트 구독을 위한 확장 메서드로 RFC 3265에서 별도로\n정의되었고, RFC 3261 기본 6종에는 포함되지 않는다.\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0002", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "성공적인 SIP 세션 설정 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "180 Ringing", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "decoys": [{"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}], "explain": "발신자가 INVITE를 보내면 잠정 응답 100 Trying이 먼저 오고, 착신 단말이\n울리면 180 Ringing이 온다. 착신자가 응답하면 200 OK가 오며, 발신자는\n이를 확인하는 ACK를 보내 세션이 시작된다.\n", "ref": "RFC 3261 §4 (Figure 1)"}, {"id": "sip-0003", "type": "order", "topic": "SIP", "difficulty": "advanced", "importance": 3, "tags": ["message-flow", "method"], "question": "발신자가 응답 대기 중 통화를 취소(CANCEL)하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "200 OK (CANCEL 응답)", "from": "착신자", "to": "발신자"}, {"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "decoys": [{"msg": "BYE", "from": "발신자", "to": "착신자"}, {"msg": "486 Busy Here", "from": "착신자", "to": "발신자"}], "explain": "잠정 응답(100 Trying)을 받은 뒤에만 CANCEL을 보낼 수 있다. UAS는 CANCEL\n요청 자체에는 200 OK로 응답하고, 별도로 원래의 INVITE 트랜잭션은 487\nRequest Terminated로 종료시킨다. 두 응답은 서로 다른 트랜잭션에 대한\n응답이라는 점이 헷갈리기 쉽다.\n487은 INVITE에 대한 실패(비-2xx) 최종 응답이므로 발신자가 ACK로 확인한다.\n실패 최종 응답이 오면 다이얼로그가 남지 않으므로 BYE는 보내지 않는다. 486은\n착신자가 통화 중일 때의 거절이고, 발신자가 취소한 경우는 487이다.\n", "ref": "RFC 3261 §9.2, §15, §17.1.1.2; RFC 3665 §3.8"}, {"id": "sip-0004", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method"], "question": "CANCEL은 INVITE 요청에 대해서만 사용해야 한다.", "answer": true, "explain": "INVITE 이외의 요청은 즉시 응답되므로 CANCEL을 보내면 경쟁 상태(race\ncondition)가 발생한다. RFC 3261은 CANCEL을 INVITE가 아닌 요청에는\n보내지 말아야 한다(SHOULD NOT)고 규정한다.\n", "ref": "RFC 3261 §9.1"}, {"id": "sip-0005", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["method"], "question": "이미 최종 응답을 받은 요청에 CANCEL을 보내면 그 요청의 처리에 영향을 준다.", "answer": false, "explain": "원래 요청에 대해 이미 최종 응답(2xx~6xx)이 발생했다면, CANCEL은 그\n요청의 처리·세션 상태·응답 생성 어느 것에도 영향을 주지 않는다.\n사실상 아무 효과 없는 요청(no-op)이 된다.\n", "ref": "RFC 3261 §9.2"}, {"id": "sip-0006", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["method"], "question": "SIP에서 진행 중인 세션(통화)을 종료할 때 사용하는 메서드는?", "answer": ["BYE"], "explain": "RFC 3261은 BYE를 \"세션을 종료하기 위한\" 메서드로 정의한다. INVITE로\n세션을 시작했다면, 종료는 CANCEL이 아니라 BYE로 한다 — CANCEL은 아직\n최종 응답을 받기 전의 진행 중인 요청을 취소할 때만 쓴다(sip-0004/0005).\n", "ref": "RFC 3261 §7.1"}, {"id": "sip-0007", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code", "concept"], "question": "1xx(잠정 응답) 클래스의 성격을 가장 정확히 설명한 것은?", "choices": ["요청이 처리되어 성공적으로 완료됐음을 확정해서 알린다", "서버가 아직 확정 응답을 갖지 못한 채 처리 중임을 뜻한다", "요청 메시지의 문법에 오류가 있어 처리할 수 없음을 뜻한다", "사용자가 다른 위치로 옮겨가 새 주소로 다시 요청해야 함을 뜻한다"], "answer": 1, "explain": "1xx는 확정 응답이 아직 없다는 뜻으로, 서버가 200ms 넘게 걸릴 것 같을 때\n보낸다. 신뢰성 있게 전달되지 않으며(재전송 없음) ACK도 유발하지 않는다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0008", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "1xx 응답은 클라이언트의 ACK 전송을 유발하지 않는다.", "answer": true, "explain": "1xx는 잠정 응답이라 신뢰성 있게 전달되지 않고, ACK도 유발하지 않는다.\nACK는 INVITE에 대한 응답을 확인할 때만 쓰인다.\n", "ref": "RFC 3261 §21.1"}, {"id": "sip-0009", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "486 Busy Here 대신 600 Busy Everywhere를 써야 하는 경우는?", "choices": ["서버가 이 사용자와 관련된 다른 어떤 단말도 응답하지 않을 것임을 알고 있을 때", "통화 중이라는 사실을 486보다 정중한 표현으로 발신자에게 알리고 싶을 때", "포킹으로 여러 단말이 동시에 울리는 중 이 단말 하나만 통화 중일 때", "단말이 지금은 통화 중이지만 몇 분 뒤에는 받을 수 있다고 예상될 때"], "answer": 0, "explain": "486은 \"이 단말\"만 통화 중이라는 뜻이라 음성사서함 등 다른 경로로 연결될\n여지가 있다. 600은 서버가 어떤 단말로도 연결 안 될 걸 알 때만 쓴다.\n", "ref": "RFC 3261 §21.6.1"}, {"id": "sip-0010", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "Request-URI에 다이얼 문자열이 아직 다 입력되지 않아 불완전할 때 쓰는 응답은?", "choices": ["404 Not Found", "484 Address Incomplete", "485 Ambiguous", "400 Bad Request"], "answer": 1, "explain": "484는 오버랩 다이얼링(자릿수를 늘려가며 재전송)을 지원하기 위한 코드다.\n클라이언트는 484를 받는 동안 계속 더 긴 문자열로 재전송한다.\n", "ref": "RFC 3261 §21.4.22"}, {"id": "sip-0011", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "485 Ambiguous와 300 Multiple Choices는 의미(semantics)가 달라서 별도의 코드로 분리되어 있다.", "answer": true, "explain": "300은 같은 사용자/서비스에 도달하는 여러 경로가 있다는 뜻으로 자동 선택도\n가능하지만, 485는 Request-URI 자체가 여러 사람 중 누구인지 애매하다는\n뜻이라 사람이 개입해 골라야 한다.\n", "ref": "RFC 3261 §21.4.23"}, {"id": "sip-0012", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "프록시 서버가(사용자가 아니라) 클라이언트 인증을 요구할 때 쓰는 응답 코드는?", "answer": ["407"], "explain": "401은 UAS/registrar가, 407은 프록시가 쓴다는 게 핵심 구분이다. 통신사업자\n게이트웨이처럼 \"채널 접근\" 자체에 인증이 필요한 경우 407을 쓴다.\n", "ref": "RFC 3261 §21.4.8"}, {"id": "sip-0013", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "483 Too Many Hops가 발생하는 조건은?", "choices": ["Max-Forwards 헤더 값이 0인 요청을 받음", "서버가 루프를 감지함", "요청 URI가 존재하지 않는 도메인을 가리킴", "메시지 크기가 서버 한도를 초과함"], "answer": 0, "explain": "483은 Max-Forwards=0으로 명확히 정의된다. 반면 482 Loop Detected는\n(Max-Forwards와 별개로) 서버가 실제 루프를 감지했을 때 쓰는, 조건이\n다른 코드다.\n", "ref": "RFC 3261 §21.4.21"}, {"id": "sip-0014", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "482 Loop Detected와 483 Too Many Hops는 둘 다 Max-Forwards 값이 0이 되는 같은 조건에서 발생한다.", "answer": false, "explain": "483만 Max-Forwards=0으로 명시적으로 정의된다. 482는 서버가 루프를\n감지했을 때 쓰는 별개의 메커니즘이다.\n", "ref": "RFC 3261 §21.4.20, §21.4.21"}, {"id": "sip-0015", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "상대방이 이미 다른 통화를 처리 중이라 이 통화에 응답할 수 없을 때 가장 적합한 코드는?", "choices": ["480 Temporarily Unavailable", "486 Busy Here", "487 Request Terminated", "600 Busy Everywhere"], "answer": 1, "explain": "480은 로그아웃·방해금지 등 응대 불가 상태 전반을 포괄하는 코드고, 486은\n그중 \"다른 통화 처리 중\"이라는 이유를 더 정확히 알려주고 싶을 때 쓴다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0016", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "SIP 응답 코드 486의 영문 명칭은?", "answer": ["Busy Here"], "explain": "486 Busy Here — 상대방 단말은 연결됐지만 지금 이 단말에서는 추가 통화를\n받을 수 없다는 뜻이다.\n", "ref": "RFC 3261 §21.4.24"}, {"id": "sip-0017", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "487 Request Terminated이 발생하는 원인은?", "choices": ["BYE 또는 CANCEL에 의해 원래 요청이 종료됨", "요청이 제 시간 안에 처리되지 못함", "서버 내부 오류가 발생함", "요청 문법이 잘못됨"], "answer": 0, "explain": "487은 진행 중이던 요청(주로 INVITE)이 BYE나 CANCEL로 인해 중단됐을 때\n그 원래 요청에 대한 최종 응답으로 온다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0018", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "CANCEL 요청 자체에 대한 응답으로 487 Request Terminated이 올 수 있다.", "answer": false, "explain": "487은 CANCEL로 인해 종료되는 \"원래 요청\"(예: INVITE)에 대한 응답이다.\nCANCEL 요청 자체는 항상 200 OK로 응답되며, CANCEL에 대한 응답으로\n487이 오는 일은 없다.\n", "ref": "RFC 3261 §21.4.25"}, {"id": "sip-0019", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "301 Moved Permanently를 받으면 클라이언트는 로컬 주소록을 새 주소로 갱신하는 것이 권장된다.", "answer": true, "explain": "301은 영구 이동이므로, 요청자는 주소록·캐시 등을 새 주소로 갱신하고\n이후 요청도 그 주소로 보내는 게 권장된다. 302(일시 이동)는 이렇게까지\n하지 않는다.\n", "ref": "RFC 3261 §21.3.2"}, {"id": "sip-0020", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code"], "question": "302 Moved Temporarily 응답에 만료 시간이 없으면, 그 Contact 주소는 이후에도 계속 캐시해서 재사용해도 된다.", "answer": false, "explain": "명시적 만료 시간이 없으면 그 주소는 딱 한 번의 재시도(recursing)에만\n유효하며, 향후 트랜잭션을 위해 캐시하면 안 된다(MUST NOT).\n", "ref": "RFC 3261 §21.3.3"}, {"id": "sip-0021", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "503 Service Unavailable을 Retry-After 헤더 없이 받았을 때 클라이언트는 어떻게 동작해야 하는가?", "choices": ["500 Server Internal Error와 같이 취급한다", "1분 동안 기다렸다가 같은 요청을 그대로 재전송한다", "그 요청을 완전히 포기하고 다시 시도하지 않는다", "응답을 무시하고 즉시 같은 서버로 요청을 다시 보낸다"], "answer": 0, "explain": "Retry-After가 없으면 클라이언트는 500을 받은 것처럼(MUST) 동작해야\n한다. Retry-After가 있다면 그 시간 동안은 해당 서버로 다른 요청도\n보내지 않는 게 권장된다.\n", "ref": "RFC 3261 §21.5.4"}, {"id": "sip-0022", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "서버가 요청 메서드 자체를 전혀 지원하지 않아(어떤 사용자에 대해서도) 처리할 수 없을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "400 Bad Request", "503 Service Unavailable"], "answer": 1, "explain": "501은 서버가 그 메서드 자체를 지원하지 않을 때(UAS가 메서드를 인식조차\n못 함) 쓴다. 메서드는 인식하지만 그 주소에서만 허용 안 되는 경우는\n405다.\n", "ref": "RFC 3261 §21.5.2"}, {"id": "sip-0023", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "서버가 요청 메서드를 인식은 하지만, 그 Request-URI가 가리키는 주소에서는 허용하지 않을 때 쓰는 코드는?", "choices": ["405 Method Not Allowed", "501 Not Implemented", "406 Not Acceptable", "403 Forbidden"], "answer": 0, "explain": "405는 메서드 자체는 알지만 그 주소에서 허용 안 될 때, 501은 메서드\n자체를 서버가 아예 지원 안 할 때 쓴다. 405 응답에는 허용되는 메서드\n목록을 Allow 헤더로 반드시 포함해야 한다.\n", "ref": "RFC 3261 §21.4.6, §21.5.2"}, {"id": "sip-0024", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "504 Server Time-out은 서버가 접근한 외부(다운스트림) 서버로부터 제때 응답을 받지 못했을 때 쓰고, 408 Request Timeout은 서버 자신이 제 시간에 응답을 만들어내지 못했을 때 쓴다.", "answer": true, "explain": "408은 서버 자체가 시간 내 응답을 못 만든 경우(예: 사용자 위치 파악\n지연)를 포괄하고, 504는 그 원인이 서버가 접근한 외부 서버의 응답\n지연일 때 쓰는 더 구체적인 코드다.\n", "ref": "RFC 3261 §21.4.9, §21.5.5"}, {"id": "sip-0025", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 1, "tags": ["response-code", "concept"], "question": "SIP이 HTTP/1.1 응답 코드 체계를 확장하면서 새로 정의한 클래스는?", "choices": ["1xx", "3xx", "5xx", "6xx"], "answer": 3, "explain": "SIP 응답 코드는 HTTP/1.1을 기반으로 하되 그중 적절한 것만 가져다\n쓰고, 6xx(Global Failures)는 SIP이 새로 정의한 클래스다.\n", "ref": "RFC 3261 §21"}, {"id": "sip-0026", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code", "concept"], "question": "3xx 응답은 4xx/5xx/6xx와 마찬가지로 확정적 실패(definite failure)로 분류된다.", "answer": false, "explain": "4xx는 \"특정 서버로부터의 확정적 실패 응답\"으로 명시되지만, 3xx는\n실패가 아니라 사용자의 새 위치나 대체 서비스 정보를 알려주는\n응답이다.\n", "ref": "RFC 3261 §21.3, §21.4"}, {"id": "sip-0027", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "method"], "question": "단말이 등록 서버에 처음 등록할 때, 인증 챌린지를 포함한 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "REGISTER", "from": "단말", "to": "등록서버"}, {"msg": "401 Unauthorized", "from": "등록서버", "to": "단말"}, {"msg": "REGISTER (인증정보 포함)", "from": "단말", "to": "등록서버"}, {"msg": "200 OK", "from": "등록서버", "to": "단말"}], "decoys": [{"msg": "407 Proxy Authentication Required", "from": "등록서버", "to": "단말"}, {"msg": "ACK", "from": "단말", "to": "등록서버"}], "explain": "단말이 처음 REGISTER를 보내면 등록 서버(registrar)는 인증을 요구하며\n401 Unauthorized로 챌린지한다. 단말은 자격증명(Digest)을 담아 REGISTER를\n다시 보내고, 서버가 이를 확인하면 200 OK로 등록이 완료된다. 401은\n등록 서버/UAS가 보내는 인증 요구이며, 프록시는 407을 쓴다(sip-0012).\nREGISTER는 비-INVITE 요청이므로 401이나 200 OK를 받아도 ACK를 보내지 않는다.\n", "ref": "RFC 3665 §2.1; RFC 3261 §10, §17.1.2.1, §21.4.2, §22.1"}, {"id": "sip-0028", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["method"], "question": "단말이 자신의 현재 접속 위치를 등록 서버에 등록(위치 바인딩)할 때 쓰는 메서드는?", "answer": ["REGISTER"], "explain": "REGISTER는 사용자의 공개 주소(AOR, Address-of-Record)를 단말의 현재\nContact 주소에 바인딩해, 이후 그 사용자에게 오는 요청이 현재 단말로\n라우팅되게 한다. 위치 등록이 SIP 이동성의 출발점이다.\n", "ref": "RFC 3261 §10.1"}, {"id": "sip-0029", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method"], "question": "REGISTER는 사용자의 공개 주소(AOR)를 현재 접속 위치(Contact)에 바인딩해 등록 서버가 그 사용자의 위치를 알게 하는 메서드다.", "answer": true, "explain": "맞다. REGISTER의 목적은 AOR↔Contact 바인딩이다. 이 바인딩 덕분에 누군가\n그 AOR로 INVITE를 보내면 등록 서버/프록시가 현재 단말 위치로 요청을\n넘길 수 있다.\n", "ref": "RFC 3261 §10.1"}, {"id": "sip-0030", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "착신자가 통화를 끊는 경우까지 포함한 기본 호의 전체 흐름(설정→종료)을 순서·방향까지 맞춰라.", "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "100 Trying", "from": "착신자", "to": "발신자"}, {"msg": "180 Ringing", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}, {"msg": "BYE", "from": "착신자", "to": "발신자"}, {"msg": "200 OK (BYE 응답)", "from": "발신자", "to": "착신자"}], "decoys": [{"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}], "explain": "설정 절반은 sip-0002와 같다(INVITE→100→180→200→ACK). 통화가 끝나면\n확립된 세션을 종료하려고 한쪽이 BYE를 보내고, 상대는 200 OK로 응답한다.\n여기서는 착신자가 먼저 끊었으므로 BYE는 착신자→발신자, 그 200 OK는\n발신자→착신자다. 세션 종료는 CANCEL이 아니라 BYE로 한다.\n", "ref": "RFC 3261 §4 (Figure 1), §15.1"}, {"id": "sip-0031", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["method", "message-flow"], "question": "INVITE에 대한 200 OK(2xx 최종 응답)를 받은 발신자가 3-way 핸드셰이크를 완성하려고 마지막으로 보내는 메시지는?", "choices": ["ACK", "BYE", "200 OK", "CANCEL"], "answer": 0, "explain": "INVITE의 3-way 핸드셰이크는 INVITE → 200 OK → ACK로 완성된다. 발신자는\n2xx를 받을 때마다 이를 확인하는 ACK를 보내야 세션이 확립된다. BYE는 이미\n확립된 세션의 종료, CANCEL은 최종 응답 전 취소용이라 여기선 아니다.\n", "ref": "RFC 3261 §13.2.2.4"}, {"id": "sip-0032", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["method"], "question": "아직 응답이 오지 않아 확립되지 않은(진행 중인 INVITE) 통화를 중단할 때는 BYE를 보낸다.", "answer": false, "explain": "아니다. BYE는 이미 확립된 세션(다이얼로그)을 종료하는 메서드다. 아직\n최종 응답을 받기 전 진행 중인 INVITE를 멈추려면 CANCEL을 쓴다. 확립\n전=CANCEL, 확립 후=BYE로 구분한다.\n", "ref": "RFC 3261 §15.1, §9.1"}, {"id": "sip-0033", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "착신 단말이 INVITE를 받아 사용자에게 착신을 알리는(전화가 울리는) 중임을 나타내는 응답은?", "choices": ["180 Ringing", "100 Trying", "183 Session Progress", "200 OK"], "answer": 0, "explain": "180 Ringing은 착신 UA가 사용자에게 알림(벨)을 울리는 중이라는 잠정\n응답이다. 100 Trying은 요청을 받아 처리 중이라는 뜻일 뿐 아직 벨은\n울리지 않았고, 200 OK는 착신자가 실제로 응답(수락)했을 때다.\n", "ref": "RFC 3261 §21.1.2"}, {"id": "sip-0034", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "180 Ringing 응답을 받았다면 착신자가 전화를 받아 통화가 연결된 것이다.", "answer": false, "explain": "아니다. 180은 상대 단말이 \"울리는 중\"이라는 잠정 응답일 뿐, 아직 받지\n않았다. 착신자가 실제로 받아 통화가 연결되면 200 OK가 온다. 이 구분이\n콜 상태 파악의 기본이다.\n", "ref": "RFC 3261 §21.1.2, §21.2.1"}, {"id": "sip-0035", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "100 Trying 응답의 의미로 가장 정확한 것은?", "choices": ["요청을 받아 처리 중이다(아직 최종 응답 아님)", "착신 단말이 사용자에게 착신을 알리는 중이다", "착신자가 통화를 수락했다", "요청한 사용자를 찾을 수 없다"], "answer": 0, "explain": "100 Trying은 다음 홉이 요청을 받아 처리 중이라는 잠정 응답이다. 벨이\n울리는 것은 180, 수락은 200 OK, 사용자 없음은 404다 — 100은 그 어느\n것도 아니고 \"받아서 처리 시작\"만 뜻한다.\n", "ref": "RFC 3261 §21.1.1"}, {"id": "sip-0037", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "183 Session Progress가 쓰이는 대표적 상황은?", "choices": ["최종 응답 전에 진행 정보(초기 미디어·링백 등)를 전달할 때", "요청 메시지의 문법 오류를 발신자에게 알릴 때", "착신자가 전화를 받아 통화를 수락했을 때", "서버가 요청한 사용자를 찾지 못했을 때"], "answer": 0, "explain": "183은 최종 응답 전에 \"통화 진행 상황\"을 전달하는 잠정 응답으로, 흔히\n초기 미디어(통신사 안내음·네트워크 링백)를 흘려보낼 때 쓴다. 달리\n분류되지 않는 진행 정보를 전달하는 용도라는 점이 180과의 차이다.\n", "ref": "RFC 3261 §21.1.5"}, {"id": "sip-0038", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "요청이 성공했음을 나타내는 SIP 2xx 최종 응답 코드의 번호(3자리)는?", "answer": ["200"], "explain": "200 OK는 요청이 성공했음을 뜻하는 대표 최종 응답이다. INVITE에 대한\n200 OK는 착신자가 통화를 수락했다는 의미이며, 발신자는 이를 ACK로\n확인해 세션을 확립한다.\n", "ref": "RFC 3261 §21.2.1"}, {"id": "sip-0039", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "서버가 Request-URI의 도메인에 해당 사용자가 존재하지 않는다는 확정 정보를 가졌을 때 보내는 응답은?", "choices": ["404 Not Found", "403 Forbidden", "480 Temporarily Unavailable", "400 Bad Request"], "answer": 0, "explain": "404 Not Found는 \"그 도메인에 그 사용자가 없다\"는 확정적 정보를 뜻한다.\n480은 사용자는 있으나 지금 응대 불가, 403은 이해했지만 거부, 400은 요청\n문법 오류다 — 원인이 서로 달라 혼동하면 안 된다.\n", "ref": "RFC 3261 §21.4.5"}, {"id": "sip-0040", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "404 Not Found는 요청 메시지의 문법 자체가 잘못됐다는 뜻이다.", "answer": false, "explain": "아니다. 문법 오류는 400 Bad Request다. 404는 문법은 정상이지만 그\n도메인에 해당 사용자가 존재하지 않는다는 뜻이다. 둘은 원인이 완전히\n다르다.\n", "ref": "RFC 3261 §21.4.5"}, {"id": "sip-0041", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "서버가 요청을 이해했지만 수행을 거부하며, 인증을 다시 시도해도 소용없어 재시도하면 안 되는 응답은?", "choices": ["403 Forbidden", "401 Unauthorized", "407 Proxy Authentication Required", "404 Not Found"], "answer": 0, "explain": "403 Forbidden은 서버가 요청을 이해했으나 거부하며, 인증(자격증명)으로도\n해결되지 않으니 재시도하지 말라는 뜻이다. 반면 401/407은 자격증명을\n갖춰 다시 보내면 통과할 수 있는 \"인증 요구\"라는 점이 결정적 차이다.\n", "ref": "RFC 3261 §21.4.4"}, {"id": "sip-0042", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["response-code"], "question": "401 Unauthorized는 자격증명을 갖춰 다시 시도하면 통과할 수 있지만, 403 Forbidden은 인증을 다시 시도해도 거부된다.", "answer": true, "explain": "맞다. 401은 \"인증이 필요하다\"는 요구라 올바른 자격증명으로 재시도하면\n성공할 수 있다. 403은 \"이해했지만 거부\"이며 인증으로 해결되지 않으니\n같은 요청을 반복하면 안 된다.\n", "ref": "RFC 3261 §21.4.2, §21.4.4"}, {"id": "sip-0043", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "method"], "question": "이미 등록된 단말이 모든 위치 등록을 해제(로그아웃)하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "REGISTER (Expires: 0, Contact: *)", "from": "단말", "to": "등록서버"}, {"msg": "200 OK", "from": "등록서버", "to": "단말"}], "decoys": [{"msg": "CANCEL", "from": "단말", "to": "등록서버"}, {"msg": "BYE", "from": "단말", "to": "등록서버"}], "explain": "등록 해제는 새 REGISTER를 만료값 0으로 보내 기존 바인딩을 지우는 것이다.\nContact를 \"*\"로 주고 Expires를 0으로 하면 그 AOR의 모든 등록이 제거된다.\n서버는 200 OK로 확인한다. 등록(sip-0027)과 정반대 동작이다.\nCANCEL은 아직 최종 응답이 오지 않은 INVITE를 취소할 때 쓰고, BYE는 세션을\n끝낼 때 쓴다. 둘 다 등록 해제에는 쓰지 않는다.\n", "ref": "RFC 3665 §2.4; RFC 3261 §9.1, §10.2.2, §15"}, {"id": "sip-0044", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "method"], "question": "통화 중이던 발신자가 전화를 끊어 세션을 종료하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "BYE", "from": "발신자", "to": "착신자"}, {"msg": "200 OK", "from": "착신자", "to": "발신자"}], "decoys": [{"msg": "CANCEL", "from": "발신자", "to": "착신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "explain": "확립된 세션의 종료는 BYE로 한다. 끊는 쪽(여기선 발신자)이 BYE를 보내고\n상대가 200 OK로 확인하면 세션이 끝난다. 어느 쪽이든 먼저 BYE를 보낼 수\n있으며, 방향은 \"끊는 쪽 → 상대\"다.\nCANCEL은 아직 연결되지 않은 INVITE를 취소할 때 쓴다. ACK는 INVITE에 대한 최종\n응답만 확인하므로 BYE의 200 OK에는 보내지 않는다.\n", "ref": "RFC 3261 §9.1, §15.1, §17.1.2.1"}, {"id": "sip-0045", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow", "response-code"], "question": "발신자가 전화를 걸었으나 착신자가 통화 중이라 연결되지 못하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "486 Busy Here", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "decoys": [{"msg": "487 Request Terminated", "from": "착신자", "to": "발신자"}, {"msg": "BYE", "from": "발신자", "to": "착신자"}], "explain": "착신 단말이 통화 중이면 486 Busy Here로 거절한다. 발신자는 이 최종 응답을\n받고 ACK로 확인한다 — ACK는 2xx뿐 아니라 486 같은 실패(비-2xx) 최종\n응답도 확인한다는 점이 핵심이다.\n487은 발신자가 CANCEL로 취소했을 때의 응답이다. 실패 최종 응답 뒤에는\n다이얼로그가 남지 않으므로 BYE도 보내지 않는다.\n", "ref": "RFC 3261 §15, §17.1.1.3, §21.4.24, §21.4.25"}, {"id": "sip-0046", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "response-code"], "question": "발신자가 전화를 걸었으나 착신자가 지금 응대할 수 없어(부재/방해금지 등) 연결되지 못하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "INVITE", "from": "발신자", "to": "착신자"}, {"msg": "480 Temporarily Unavailable", "from": "착신자", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "착신자"}], "decoys": [{"msg": "486 Busy Here", "from": "착신자", "to": "발신자"}, {"msg": "BYE", "from": "발신자", "to": "착신자"}], "explain": "착신자가 로그아웃·방해금지 등으로 지금 응대할 수 없으면 480 Temporarily\nUnavailable로 응답한다. 발신자는 이 최종 응답도 ACK로 확인한다. 486(통화중,\nsip-0045)과 원인이 다르다 — 480은 \"응대 불가 상태 전반\"이다.\n실패 최종 응답 뒤에는 다이얼로그가 남지 않으므로 BYE는 보내지 않는다.\n", "ref": "RFC 3261 §15, §17.1.1.3, §21.4.18"}, {"id": "sip-0047", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header"], "question": "요청이 거쳐온 경로를 기록해 응답이 되돌아갈 길을 알려주고, branch 값으로 트랜잭션 식별과 루프 감지에 쓰이는 헤더는?", "choices": ["Via", "Route", "Contact", "CSeq"], "answer": 0, "explain": "Via는 요청이 지나온 각 홉을 쌓아 기록한다. 응답은 이 Via 스택을 역순으로 따라\n돌아가고, branch 파라미터는 트랜잭션을 유일하게 식별하며 루프 감지에도 쓰인다.\n", "ref": "RFC 3261 §8.1.1.7, §20.42"}, {"id": "sip-0048", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header"], "question": "RFC 3261에서 Via의 branch 값이 트랜잭션 식별자로 쓰이려면 반드시 이 문자열로 시작해야 한다. 그 매직 쿠키는?", "answer": ["z9hG4bK"], "explain": "branch는 z9hG4bK로 시작해야 RFC 3261을 따르는 새 방식임이 보장된다(구버전 값과 충돌\n방지). 이 접두어 뒤의 값이 트랜잭션을 유일하게 식별한다.\n", "ref": "RFC 3261 §8.1.1.7"}, {"id": "sip-0049", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header", "concept"], "question": "두 UA 사이의 지속적 관계인 '다이얼로그(dialog)'를 유일하게 식별하는 3요소는?", "choices": ["Call-ID + From 태그 + To 태그", "Via의 branch 값", "CSeq 번호 + 메서드", "Request-URI + Contact"], "answer": 0, "explain": "다이얼로그는 Call-ID와 양쪽 태그(From 태그·To 태그)의 조합으로 식별된다. branch는\n'트랜잭션'을 식별하는 것으로 레벨이 다르다(트랜잭션이 다이얼로그보다 작은 단위).\n", "ref": "RFC 3261 §12"}, {"id": "sip-0050", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header"], "question": "CSeq 헤더가 담는 두 가지 정보는?", "choices": ["순서 번호 + 메서드 이름", "출발지 IP + 포트", "Call-ID + 태그", "만료 시간 + 우선순위"], "answer": 0, "explain": "CSeq는 '순서 번호 + 메서드'다(예: \"314159 INVITE\"). 같은 다이얼로그 내 요청 순서를\n매기고 재전송과 새 요청을 구분한다. ACK/CANCEL은 짝이 되는 요청과 같은 번호를 쓴다.\n", "ref": "RFC 3261 §8.1.1.5, §20.16"}, {"id": "sip-0051", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header"], "question": "INVITE/200 OK에 담겨, 이후 후속 요청(re-INVITE·BYE 등)을 상대에게 직접 보낼 주소를 알려주는 헤더는?", "choices": ["Contact", "Via", "Route", "From"], "answer": 0, "explain": "Contact는 그 UA에 직접 도달할 URI다. REGISTER에서는 AOR에 바인딩할 주소, 다이얼로그\n설정(INVITE/200)에서는 후속 요청의 목적지로 쓰인다. Via(경로 기록)·Route(강제 경로)와\n역할이 다르다.\n", "ref": "RFC 3261 §20.10"}, {"id": "sip-0052", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 1, "tags": ["header"], "question": "SIP UAC가 요청을 만들 때 Max-Forwards의 권장 초기값(정수)은?", "answer": ["70"], "explain": "RFC 3261은 초기값으로 70을 권장한다. 각 프록시가 1씩 줄이고 0이 되면 483 Too Many\nHops로 응답한다 — 루프로 인한 무한 전달을 막는 안전장치다(sip-0013).\n", "ref": "RFC 3261 §8.1.1.6"}, {"id": "sip-0053", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["header"], "question": "프록시가 다이얼로그의 이후 요청들도 반드시 자신을 거치게 하려고 초기 요청/응답에 자신의 URI를 추가하는 헤더는?", "choices": ["Record-Route", "Route", "Via", "Contact"], "answer": 0, "explain": "프록시는 Record-Route에 자신의 URI를 넣어 경로에 남는다. 그러면 UA들은 이후 요청에\nRoute 헤더로 그 경로를 강제한다. Record-Route(경로에 남겠다는 선언) vs Route(그 경로로\n보내라는 지시)를 구분해야 한다.\n", "ref": "RFC 3261 §16.6, §20.30, §20.34"}, {"id": "sip-0054", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header", "concept"], "question": "Via의 branch는 트랜잭션을 식별하고, Call-ID와 양쪽 태그(From/To 태그)는 다이얼로그를 식별한다.", "answer": true, "explain": "맞다. 두 식별 레벨이 다르다: 트랜잭션(요청+그 응답들)은 branch로, 다이얼로그(UA 간 지속\n관계)는 Call-ID+From 태그+To 태그로 식별한다.\n", "ref": "RFC 3261 §12, §17"}, {"id": "sip-0055", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["concept", "method"], "question": "REGISTER 요청을 받아 사용자의 AOR↔현재 위치 바인딩을 위치 서비스(location service)에 저장하는 SIP 엔티티는?", "choices": ["Registrar", "Proxy 서버", "Redirect 서버", "UAC"], "answer": 0, "explain": "Registrar는 REGISTER를 처리해 위치 바인딩을 저장한다. 이후 프록시가 그 위치 정보를\n조회해 요청을 라우팅한다. 등록 접수(Registrar)와 라우팅(Proxy)은 역할이 나뉜다.\n", "ref": "RFC 3261 §10"}, {"id": "sip-0056", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["concept", "response-code"], "question": "요청을 대신 전달하지 않고, 클라이언트에게 '다른 주소로 다시 보내라'며 3xx로 새 위치를 알려주는 엔티티는?", "choices": ["Redirect 서버", "Proxy 서버", "Registrar", "UAS"], "answer": 0, "explain": "Redirect 서버는 3xx(예: 302)로 Contact에 새 주소를 담아 응답하고, 재요청은 클라이언트가\n한다. 반면 Proxy는 요청을 자신이 다음 홉으로 전달한다.\n", "ref": "RFC 3261 §8.1.3.4, §21.3"}, {"id": "sip-0057", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method"], "question": "OPTIONS 메서드의 주 용도는?", "choices": ["상대 UA/서버의 능력(지원 메서드·코덱 등)을 조회", "진행 중인 세션(통화)을 종료하고 자원을 해제", "단말의 현재 접속 위치를 등록 서버에 등록", "상대와 새로운 미디어 세션(통화)을 설정"], "answer": 0, "explain": "OPTIONS는 세션을 만들지 않고 상대의 능력을 묻는다. 응답의 Allow/Accept 등에 지원\n메서드·미디어가 담긴다. 도달성 확인(keep-alive) 용도로도 흔히 쓰인다.\n", "ref": "RFC 3261 §11"}, {"id": "sip-0058", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header", "concept"], "question": "요청을 실제로 어디로 보낼지는 To 헤더가 아니라 Request-URI가 결정한다.", "answer": true, "explain": "맞다. To는 '논리적 수신자 표시'일 뿐이고, 실제 라우팅 목적지는 Request-URI다. 프록시는\nRequest-URI를 보고 다음 홉을 정한다. 둘이 초기엔 같아 보여도 역할이 다르다.\n", "ref": "RFC 3261 §8.1.1.1"}, {"id": "sip-0059", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header"], "question": "CSeq 순서 번호는 한 다이얼로그 안에서 모든 요청에 걸쳐 동일한 값으로 유지된다.", "answer": false, "explain": "아니다. CSeq 순서 번호는 새 요청마다 증가한다(재전송은 예외로 같은 값 유지). 다이얼로그\n내내 고정되는 것은 Call-ID다. Call-ID(고정)와 CSeq(증가)를 혼동하면 안 된다.\n", "ref": "RFC 3261 §8.1.1.5"}, {"id": "sip-0060", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header"], "question": "Contact 헤더는 REGISTER에서만 쓰이고 INVITE나 200 OK에는 쓰이지 않는다.", "answer": false, "explain": "아니다. Contact는 다이얼로그를 만드는 INVITE와 그 200 OK에도 들어가, 이후 후속\n요청(re-INVITE·BYE)의 직접 목적지로 쓰인다. REGISTER 전용이 아니다.\n", "ref": "RFC 3261 §20.10"}, {"id": "sip-0061", "type": "match", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["response-code"], "question": "호가 연결되지 못하고 끝날 때 자주 보는 응답 코드와 그 의미를 짝지어라.", "pairs": [{"left": "404 Not Found", "right": "그 도메인에 해당 사용자가 아예 없음"}, {"left": "480 Temporarily Unavailable", "right": "사용자는 있으나 지금 응대 불가(로그아웃·방해금지 등)"}, {"left": "486 Busy Here", "right": "착신 단말이 다른 통화를 처리 중"}, {"left": "487 Request Terminated", "right": "진행 중이던 요청이 CANCEL·BYE로 중단됨"}], "explain": "네 코드 모두 4xx(요청 실패)지만 실패 이유가 다르다. 404는 사용자가 존재하지 않는다는\n확정 정보다. 480은 사용자는 존재하지만 지금 연결할 수 없는 상태 전반을 뜻한다. 486은\n그중 \"이 단말이 통화 중\"이라는 이유를 구체적으로 알린다. 487은 상대 상태와 무관하게\n발신 측이 CANCEL 등으로 원래 요청을 중단했을 때 그 원래 요청에 대한 최종 응답이다.\n", "ref": "RFC 3261 §21.4.5, §21.4.18, §21.4.24, §21.4.25"}, {"id": "sip-0062", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code"], "question": "100 Trying은 180 Ringing 같은 다른 잠정 응답과 달리, stateful 프록시가 상류(발신 쪽)로 전달하지 않는다.", "answer": true, "explain": "맞다. 100 Trying은 \"다음 홉이 요청을 받았다\"는 홉 단위 확인이다. 그래서 stateful\n프록시는 하류에서 받은 100을 상류로 넘기지 않는다. 180·183 같은 나머지 잠정 응답은\n즉시 전달한다. 발신자가 받은 100은 첫 홉이 보낸 것일 수 있으므로, 100을 받았다고\n착신 단말까지 도달했다는 뜻은 아니다.\n", "ref": "RFC 3261 §16.7, §21.1.1"}, {"id": "sip-0063", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header"], "question": "다음 INVITE에서 이 요청이 만든 트랜잭션을 식별하는 값은?\n\nINVITE sip:bob@biloxi.com SIP/2.0\nVia: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8\nMax-Forwards: 70\nTo: Bob <sip:bob@biloxi.com>\nFrom: Alice <sip:alice@atlanta.com>;tag=1928301774\nCall-ID: a84b4c76e66710\nCSeq: 314159 INVITE\nContact: <sip:alice@pc33.atlanta.com>\nContent-Type: application/sdp\nContent-Length: 142\n", "choices": ["z9hG4bKnashds8", "a84b4c76e66710", "1928301774", "314159"], "answer": 0, "explain": "Via의 branch 값(z9hG4bK로 시작)이 이 요청이 만든 트랜잭션을 식별한다. a84b4c76e66710은\nCall-ID로, 양쪽 태그와 함께 다이얼로그를 식별한다. 1928301774는 From 태그이고,\n314159는 CSeq 순서 번호다. 메시지는 RFC 3261 예시(Alice가 첫 프록시로 보내는 F1)다.\n", "ref": "RFC 3261 §8.1.1.7, §24.2"}, {"id": "sip-0064", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["header", "concept"], "question": "다음 INVITE의 To 헤더에 tag가 없는 이유는?\n\nINVITE sip:bob@biloxi.com SIP/2.0\nVia: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8\nMax-Forwards: 70\nTo: Bob <sip:bob@biloxi.com>\nFrom: Alice <sip:alice@atlanta.com>;tag=1928301774\nCall-ID: a84b4c76e66710\nCSeq: 314159 INVITE\nContact: <sip:alice@pc33.atlanta.com>\nContent-Type: application/sdp\nContent-Length: 142\n", "choices": ["다이얼로그가 아직 없는 첫 요청이라, To 태그는 착신 측이 응답에 붙이기 때문", "첫 프록시가 요청을 전달하면서 To 태그를 지웠기 때문", "INVITE 요청에는 어떤 경우에도 To 태그를 넣지 않기 때문", "From 태그와 값이 같아서 중복을 피하려고 생략했기 때문"], "answer": 0, "explain": "다이얼로그 밖의 요청에는 To 태그를 넣으면 안 된다. To 태그는 착신 UAS가 응답에\n붙이고, 그 값이 다이얼로그 식별자의 일부가 된다. 다이얼로그가 생긴 뒤의 요청\n(re-INVITE·BYE 등)에는 상대 태그를 To에 넣으므로 \"INVITE에는 항상 없다\"는 틀리다.\n이 메시지는 아직 어떤 프록시도 거치지 않은 F1이다.\n", "ref": "RFC 3261 §8.1.1.2, §8.2.6.2, §12.2.1.1, §24.2"}, {"id": "sip-0065", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "header"], "question": "발신자의 INVITE를 첫 프록시가 인증 챌린지로 막은 뒤, 발신자가 자격증명을 넣어 다시 보내 통과하는 흐름을 순서대로 맞춰라.", "direction": false, "items": [{"msg": "INVITE", "from": "발신자", "to": "프록시"}, {"msg": "407 Proxy Authentication Required", "from": "프록시", "to": "발신자"}, {"msg": "ACK", "from": "발신자", "to": "프록시"}, {"msg": "INVITE (Proxy-Authorization 포함)", "from": "발신자", "to": "프록시"}, {"msg": "100 Trying", "from": "프록시", "to": "발신자"}], "decoys": [{"msg": "401 Unauthorized", "from": "프록시", "to": "발신자"}, {"msg": "INVITE (Authorization 포함)", "from": "발신자", "to": "프록시"}], "explain": "프록시는 인증을 요구할 때 401이 아니라 407을 쓴다. 401은 UAS·등록 서버가 쓰는 코드다.\n407은 INVITE에 대한 실패 최종 응답이므로 발신자는 먼저 ACK를 보낸다.\n그다음 발신자는 Proxy-Authorization 헤더에 자격증명을 담아 INVITE를 다시 보낸다.\nAuthorization 헤더는 401 챌린지에 답할 때 쓰는 헤더다.\n프록시가 자격증명을 받아들이면 100 Trying을 보내고 요청을 다음 홉으로 넘긴다.\n", "ref": "RFC 3665 §3.2 (F1~F6); RFC 3261 §22.1, §22.3"}, {"id": "sip-0066", "type": "order", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["message-flow", "method"], "question": "통화 중에 착신자 단말의 IP 주소가 바뀌어, 착신자가 같은 다이얼로그 안에서 세션을 수정하는 흐름을 순서·방향까지 맞춰라.", "items": [{"msg": "re-INVITE (새 SDP)", "from": "착신자", "to": "발신자"}, {"msg": "200 OK", "from": "발신자", "to": "착신자"}, {"msg": "ACK", "from": "착신자", "to": "발신자"}], "decoys": [{"msg": "INVITE (새 Call-ID)", "from": "착신자", "to": "발신자"}, {"msg": "BYE", "from": "착신자", "to": "발신자"}], "explain": "확립된 세션의 주소·포트·미디어를 바꿀 때는 같은 다이얼로그 안에서 INVITE를 다시 보낸다.\n이것을 re-INVITE라고 한다.\nre-INVITE는 발신자와 착신자 중 누구든 보낼 수 있다. 여기서는 IP가 바뀐 착신자가 보낸다.\nre-INVITE도 INVITE이므로 200 OK와 ACK의 3단계로 끝난다.\n새 Call-ID로 INVITE를 보내면 기존 세션의 수정이 아니라 별개의 새 통화가 된다.\nBYE는 세션을 끝내는 요청이라 수정에 쓰지 않는다.\n", "ref": "RFC 3665 §3.7 (F9~F11); RFC 3261 §14, §14.1"}, {"id": "sip-0067", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method", "concept"], "question": "RFC 3261에서 이미 확립된 세션의 미디어(주소·포트·코덱 등)를 바꿀 때 보내는 요청은?", "choices": ["같은 다이얼로그 안에서 다시 보내는 INVITE", "새 Call-ID로 시작하는 별도의 INVITE", "같은 다이얼로그 안에서 보내는 OPTIONS", "새 Contact를 담아 보내는 REGISTER"], "answer": 0, "explain": "RFC 3261은 다이얼로그 안에서 보내는 INVITE를 re-INVITE라고 부른다.\nre-INVITE에는 바뀐 부분만이 아니라 세션 설명(SDP) 전체를 다시 담는다.\n새 Call-ID로 INVITE를 보내면 새 다이얼로그가 생겨 별개의 통화가 된다.\nOPTIONS는 상대 능력 조회용이고, REGISTER는 등록 서버의 위치 바인딩을 바꾼다.\n둘 다 진행 중인 세션의 미디어를 바꾸지 않는다.\n", "ref": "RFC 3261 §14, §14.1"}, {"id": "sip-0068", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["method"], "question": "re-INVITE는 처음 INVITE를 보낸 발신자만 보낼 수 있다.", "answer": false, "explain": "아니다. RFC 3261은 발신자와 착신자 모두 기존 세션을 수정할 수 있다고 정한다.\n예를 들어 RFC 3665 §3.7에서는 IP 주소가 바뀐 착신자(Bob)가 re-INVITE를 보낸다.\n", "ref": "RFC 3261 §14; RFC 3665 §3.7"}, {"id": "sip-0069", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["method", "response-code"], "question": "re-INVITE로 코덱 변경을 제안했는데 상대가 488 Not Acceptable Here로 거절했다. 세션은 어떻게 되는가?", "choices": ["re-INVITE 전의 세션 설정을 그대로 유지한다", "세션이 끊기므로 양쪽이 BYE를 주고받는다", "다이얼로그가 끝나 처음부터 새 INVITE로 다시 건다", "488에 실린 상대 SDP로 세션이 바뀐다"], "answer": 0, "explain": "re-INVITE가 2xx가 아닌 최종 응답을 받으면 세션 파라미터는 re-INVITE가 없었던 것처럼\n그대로 남아야 한다(MUST). 그래서 통화는 원래 코덱으로 계속된다.\n488은 이 요청의 세션 설명을 받아들일 수 없다는 뜻이다.\n예외로 481이나 408을 받거나 응답이 아예 없으면 UAC는 다이얼로그를 종료한다.\n", "ref": "RFC 3261 §14.1, §14.2, §21.4.26"}, {"id": "sip-0070", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["response-code", "message-flow"], "question": "같은 다이얼로그에서 양쪽 UA가 거의 동시에 re-INVITE를 보내 서로 엇갈렸다. 자기 INVITE가 진행 중인데 상대 INVITE를 받은 UA가 돌려주는 응답은?", "choices": ["491 Request Pending", "500 Server Internal Error", "486 Busy Here", "482 Loop Detected"], "answer": 0, "explain": "자기 INVITE가 진행 중인 다이얼로그에서 INVITE를 받으면 UAS는 491을 돌려줘야 한다(MUST).\n이런 엇갈림을 glare라고 한다.\n491을 받은 쪽은 무작위 시간을 기다린 뒤 다시 시도한다.\nCall-ID를 만든 쪽은 2.1~4초, 아닌 쪽은 0~2초 범위에서 고른다.\n500은 다른 경우다. 앞선 INVITE에 최종 응답을 보내기 전에 CSeq가 더 큰 두 번째\nINVITE를 받으면 500과 Retry-After를 보낸다.\n", "ref": "RFC 3261 §14.1, §14.2, §21.4.27"}, {"id": "sip-0071", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["method", "concept"], "question": "re-INVITE는 프록시에서 포킹되지 않으므로 최종 응답을 하나만 받는다.", "answer": true, "explain": "맞다. 처음 INVITE의 Request-URI는 사용자의 AOR이라 여러 단말로 포킹될 수 있다.\nre-INVITE의 Request-URI는 다이얼로그를 맺은 상대 UA 인스턴스(remote target)를 가리킨다.\n그래서 re-INVITE는 포킹되지 않고 최종 응답도 하나만 생긴다.\n", "ref": "RFC 3261 §14.1"}, {"id": "sip-0072", "type": "match", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header"], "question": "SIP 인증에 쓰는 헤더와 그 역할을 짝지어라.", "pairs": [{"left": "WWW-Authenticate", "right": "UAS·등록 서버가 401에 담아 보내는 챌린지"}, {"left": "Proxy-Authenticate", "right": "프록시가 407에 담아 보내는 챌린지"}, {"left": "Authorization", "right": "UAS·등록 서버에게 내미는 단말의 자격증명"}, {"left": "Proxy-Authorization", "right": "프록시에게 내미는 단말의 자격증명"}], "explain": "챌린지 헤더와 자격증명 헤더가 짝을 이룬다.\n401에는 WWW-Authenticate가 들어가고, 단말은 Authorization으로 답한다.\n407에는 Proxy-Authenticate가 들어가고, 단말은 Proxy-Authorization으로 답한다.\n이름에 Proxy가 붙으면 프록시 인증이라고 기억하면 된다.\n", "ref": "RFC 3261 §20.7, §20.27, §20.28, §20.44, §22.2, §22.3"}, {"id": "sip-0073", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["header", "message-flow"], "question": "첫 INVITE의 CSeq가 '1 INVITE'였고 407을 받았다. 자격증명을 넣어 다시 보내는 INVITE의 CSeq는?", "choices": ["2 INVITE", "1 INVITE", "1 ACK", "2 ACK"], "answer": 0, "explain": "401이나 407을 받고 자격증명을 넣어 다시 보내는 요청은 새 요청이다.\n그래서 CSeq 번호를 평소처럼 1 올려야 한다(MUST).\nRFC 3665 §3.2 예시도 F1은 CSeq 1 INVITE, F4는 CSeq 2 INVITE다.\n1 ACK는 407을 확인하는 ACK(F3)의 CSeq다. ACK는 확인하는 INVITE와 번호가 같고 메서드만 ACK다.\n", "ref": "RFC 3261 §22.2; RFC 3665 §3.2"}, {"id": "sip-0074", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["method", "concept"], "question": "서버는 CANCEL 요청에 401이나 407로 인증 챌린지를 보낼 수 있다.", "answer": false, "explain": "아니다. 서버는 CANCEL에 챌린지를 보내면 안 된다(MUST NOT).\nCANCEL은 홉 단위로 처리되어 자격증명을 넣어 다시 보낼 수 없기 때문이다.\nACK도 응답이 없는 요청이라 챌린지할 수 없다.\n대신 UAC는 INVITE에 넣었던 자격증명을 ACK에 그대로 복사한다.\n", "ref": "RFC 3261 §22.1"}, {"id": "sip-0075", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header", "concept"], "question": "SIP Digest 인증에서 단말은 비밀번호를 그대로 보내지 않고, 비밀번호와 서버가 준 nonce 등으로 계산한 값(response)을 보낸다.", "answer": true, "explain": "맞다. 서버는 챌린지마다 새 nonce를 만들어 보낸다.\n단말은 사용자 이름, realm, 비밀번호, nonce, 메서드, URI로 해시를 계산해 response 파라미터에 담는다.\nresponse는 32자리 16진수이고, 사용자가 비밀번호를 안다는 것을 증명한다.\nSIP는 HTTP Digest(RFC 2617)를 거의 그대로 쓰며, Basic 인증은 금지한다.\n", "ref": "RFC 3261 §22, §22.4; RFC 2617 §3.2.1, §3.2.2"}, {"id": "sip-0076", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["header", "concept"], "question": "Digest 챌린지에 stale=true가 들어 있다. 단말은 어떻게 하면 되는가?", "choices": ["비밀번호를 다시 묻지 않고 새 nonce로 계산해 재시도", "비밀번호가 틀렸으니 사용자에게 다시 입력받아 재시도", "realm이 바뀌었으니 다른 계정의 자격증명으로 재시도", "인증이 영구 거부됐으니 같은 요청을 다시 보내지 않음"], "answer": 0, "explain": "stale=true는 자격증명은 맞았지만 nonce가 만료됐다는 뜻이다.\n서버는 nonce만 무효이고 그 nonce로 계산한 값은 올바를 때만 stale=true를 붙인다.\n그래서 단말은 사용자에게 다시 묻지 않고 새 nonce로 response를 다시 계산해 보내면 된다.\nstale이 없거나 false면 사용자 이름이나 비밀번호가 틀린 것이다.\n", "ref": "RFC 2617 §3.2.1; RFC 3261 §22.1"}, {"id": "sip-0077", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["concept"], "question": "RFC 3261 기준으로 SIP Digest 인증이 제공하지 않는 것은?", "choices": ["요청자가 자격증명을 가졌는지 확인", "nonce를 이용한 재전송(replay) 공격 방지", "메시지 내용 암호화(기밀성)", "realm별로 보호 영역을 구분"], "answer": 2, "explain": "RFC 3261은 Digest가 메시지 인증과 재전송 방지만 제공한다고 적고 있다.\n메시지 무결성과 기밀성(암호화)은 제공하지 않는다.\n따라서 메시지 변조를 막으려면 TLS 같은 별도 보호 수단이 필요하다.\nSIP에서는 realm 문자열 하나가 보호 영역을 정한다.\n", "ref": "RFC 3261 §22, §22.1"}, {"id": "sip-0078", "type": "short", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["transport"], "question": "포트를 적지 않았을 때 SIP over UDP·TCP가 쓰는 기본 포트 번호는?", "answer": ["5060"], "explain": "UDP, TCP, SCTP의 기본 포트는 5060이다. TLS는 5061을 쓴다.\nVia의 sent-by에 포트가 없으면 전송 프로토콜에 따라 이 기본값을 쓴다.\n", "ref": "RFC 3261 §18.1.1, §18.2.1"}, {"id": "sip-0079", "type": "ox", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["transport"], "question": "SIP over TLS도 UDP·TCP와 같은 기본 포트 5060을 쓴다.", "answer": false, "explain": "아니다. TLS의 기본 포트는 5061이다.\n5060은 UDP, TCP, SCTP의 기본 포트다.\n", "ref": "RFC 3261 §18.1.1, §18.2.1"}, {"id": "sip-0080", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["transport"], "question": "경로 MTU를 모르는 상태에서 1300바이트가 넘는 요청을 보내야 한다. UDP로 설정된 UAC는 어떻게 해야 하는가?", "choices": ["TCP처럼 혼잡 제어가 있는 전송으로 바꿔 보낸다", "UDP 그대로 보내고 IP 단편화에 맡긴다", "본문을 잘라 1300바이트 이하로 맞춰 보낸다", "UDP로 보내되 Content-Length를 생략한다"], "answer": 0, "explain": "경로 MTU를 모르고 요청이 1300바이트를 넘으면 TCP 같은 혼잡 제어 전송으로 보내야 한다(MUST).\n경로 MTU를 알 때는 요청이 MTU의 200바이트 안쪽까지 커지면 같은 규칙을 적용한다.\n1300은 이더넷 MTU 1500바이트를 가정한 값이다.\n200바이트 여유는 응답에 Record-Route 등이 붙어 요청보다 커질 수 있어서 둔다.\n전송을 바꾸면 맨 위 Via의 전송 값도 바꿔야 한다.\n", "ref": "RFC 3261 §18.1.1"}, {"id": "sip-0081", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["transport", "header"], "question": "서버가 받은 요청의 맨 위 Via sent-by 주소가 실제 패킷 출발지 IP와 다르다. 서버가 그 Via에 추가하는 파라미터는?", "choices": ["received", "branch", "maddr", "ttl"], "answer": 0, "explain": "sent-by가 도메인 이름이거나 패킷 출발지 IP와 다르면 서버는 Via에 received를 넣어야 한다(MUST).\nreceived에는 패킷이 실제로 온 출발지 주소가 들어간다.\nUDP 응답은 received 주소로 보낸다. 출발지 IP로 돌려보내야 응답이 요청자에게 닿기 때문이다.\nbranch는 트랜잭션 식별자이고, maddr와 ttl은 멀티캐스트 응답용이다.\n", "ref": "RFC 3261 §18.2.1, §18.2.2"}, {"id": "sip-0082", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["transport", "header"], "question": "TCP 같은 스트림 전송에서는 Content-Length 헤더를 반드시 넣어야 한다.", "answer": true, "explain": "맞다. TCP는 메시지 경계가 없어서 본문이 어디서 끝나는지 Content-Length로만 알 수 있다.\n그래서 스트림 전송에서는 Content-Length가 필수다(MUST).\nUDP는 패킷 하나가 메시지 하나라서 Content-Length가 없으면 패킷 끝을 본문 끝으로 본다.\n", "ref": "RFC 3261 §18.3, §20.14"}, {"id": "sip-0083", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["method", "concept"], "question": "INVITE의 2xx에 대한 ACK가 486 같은 비-2xx 응답에 대한 ACK와 다른 점은?", "choices": ["2xx의 ACK는 UAC 코어가 새 트랜잭션으로 상대 UA에게 보낸다", "2xx의 ACK는 INVITE와 다른 새 CSeq 번호를 쓴다", "2xx의 ACK는 프록시가 UAC를 대신해 홉마다 만들어 보낸다", "2xx의 ACK는 UAS가 보낸 2xx 하나에만 한 번 보낸다"], "answer": 0, "explain": "비-2xx의 ACK는 INVITE 클라이언트 트랜잭션이 만들고, 같은 트랜잭션의 일부로 홉마다 오간다.\n2xx의 ACK는 UAC 코어가 다이얼로그 안의 요청처럼 만들어 상대 UA까지 종단 간에 보낸다.\n그래서 2xx의 ACK는 INVITE와 다른 새 트랜잭션(새 branch)이 된다.\n두 경우 모두 CSeq 번호는 INVITE와 같고 메서드만 ACK다.\n2xx가 재전송되어 올 때마다 UAC는 ACK도 다시 보낸다.\n", "ref": "RFC 3261 §13.2.2.4, §17.1.1.3"}, {"id": "sip-0084", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["message-flow", "transport"], "question": "INVITE에 대한 2xx 응답은 UAS가 ACK를 받을 때까지 재전송하며, TCP로 보냈더라도 마찬가지다.", "answer": true, "explain": "맞다. 2xx를 보내면 INVITE 서버 트랜잭션이 바로 사라진다.\n그래서 UAS 코어가 직접 T1부터 두 배씩, 최대 T2 간격으로 2xx를 재전송한다.\n2xx는 종단 간에 전달되고 중간 홉 어딘가가 UDP일 수 있다. 그래서 UAS의 전송이 TCP여도 재전송한다.\n64×T1 동안 ACK가 오지 않으면 UAS는 BYE로 세션을 끝내야 한다(SHOULD).\n", "ref": "RFC 3261 §13.3.1.4"}, {"id": "sip-0085", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["concept", "response-code"], "question": "INVITE에 대해 To 태그가 붙은 180 Ringing이 왔다. 이 응답으로 생긴 다이얼로그는 어떤 상태인가?", "choices": ["early(초기) 상태", "confirmed(확정) 상태", "다이얼로그가 생기지 않음", "terminated(종료) 상태"], "answer": 0, "explain": "INVITE에 대한 2xx와 To 태그가 있는 101~199 응답이 다이얼로그를 만든다.\n잠정 응답으로 만들어진 다이얼로그는 early 상태다.\n이후 2xx가 오면 confirmed 상태로 바뀐다.\n2xx가 아닌 최종 응답이 오거나 응답이 없으면 early 다이얼로그는 끝난다.\n", "ref": "RFC 3261 §12, §12.1"}, {"id": "sip-0086", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["message-flow", "concept"], "question": "프록시가 INVITE를 포킹해 두 단말이 모두 200 OK를 보냈다. UAC는 어떻게 처리하는가?", "choices": ["To 태그가 다른 두 다이얼로그로 보고 각각 ACK를 보낸다", "먼저 온 200 OK에만 ACK를 보내고 나머지는 무시한다", "두 200 OK를 같은 다이얼로그로 보고 ACK를 한 번 보낸다", "나중에 온 200 OK에는 ACK 대신 CANCEL을 보낸다"], "answer": 0, "explain": "포킹 때문에 INVITE 하나에 2xx가 여러 개 올 수 있다.\n각 2xx는 To 태그로 구분되고, 각각 별개의 다이얼로그가 된다.\nUAC 코어는 받은 2xx마다 ACK를 만들어 보내야 한다(MUST).\nCANCEL은 최종 응답이 오기 전의 요청을 취소할 때만 의미가 있다.\n", "ref": "RFC 3261 §13.2.2.4"}, {"id": "sip-0087", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["message-flow", "concept"], "question": "SDP 없이 INVITE를 보냈더니 착신자가 200 OK에 SDP(offer)를 담아 보냈다. 발신자의 answer는 어디에 담는가?", "choices": ["ACK", "새 INVITE", "BYE", "PRACK"], "answer": 0, "explain": "RFC 3261만 따르는 UA는 offer/answer를 두 방식으로 주고받는다.\nINVITE에 offer를 넣고 2xx에 answer를 넣거나, 2xx에 offer를 넣고 ACK에 answer를 넣는다.\nINVITE에 SDP가 없으면 UAS는 2xx에 offer를 넣어야 하고, UAC는 ACK에 answer를 넣어야 한다(MUST).\nPRACK은 RFC 3262의 확장이라 RFC 3261 기본 흐름에 없다.\n", "ref": "RFC 3261 §13.2.1, §13.2.2.4, §13.3.1.4"}, {"id": "sip-0088", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["message-flow", "response-code"], "question": "INVITE를 보냈지만 Timer B가 만료될 때까지 아무 응답이 없다. UAC는 어떤 응답을 받은 것처럼 처리하는가?", "choices": ["408 Request Timeout", "503 Service Unavailable", "480 Temporarily Unavailable", "504 Server Time-out"], "answer": 0, "explain": "트랜잭션 계층이 타임아웃을 알리면 UAC는 408을 받은 것처럼 처리해야 한다(MUST).\nTimer B는 INVITE 트랜잭션 타임아웃이고 기본값은 64×T1(32초)이다.\nUDP의 ICMP 오류나 TCP 연결 실패 같은 전송 오류는 503으로 처리한다는 점과 구분한다.\n504는 서버가 하류 서버의 응답을 제때 받지 못했을 때 실제로 보내는 응답이다.\n", "ref": "RFC 3261 §8.1.3.1, §17.1.1.2"}, {"id": "sip-0089", "type": "short", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["transport", "concept"], "question": "SIP 타이머의 기준값 T1(RTT 추정값)의 기본값은 몇 ms인가? (숫자만)", "answer": ["500"], "explain": "T1의 기본값은 500ms다. 다른 타이머 상당수가 T1을 기준으로 정해진다.\nTimer A(UDP INVITE 재전송 간격)는 T1에서 시작해 두 배씩 늘어난다.\nTimer B(INVITE 트랜잭션 타임아웃)는 64×T1, 즉 32초다.\nT2(비-INVITE 재전송 최대 간격)는 4초다.\n", "ref": "RFC 3261 §17.1.1.1, Appendix A (Table 4)"}, {"id": "sip-0090", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["response-code", "method"], "question": "UAS가 받은 BYE가 자신이 가진 어떤 다이얼로그와도 맞지 않는다. UAS가 보내는 응답은?", "choices": ["481 Call/Transaction Does Not Exist", "480 Temporarily Unavailable", "487 Request Terminated", "408 Request Timeout"], "answer": 0, "explain": "BYE가 기존 다이얼로그와 맞지 않으면 UAS는 481을 보내야 한다(SHOULD).\n그래서 태그 없이 보낸 BYE는 거절된다. RFC 2543과 달라진 점이다.\n480은 사용자가 지금 응대할 수 없을 때, 487은 원래 요청이 취소됐을 때 쓴다.\n", "ref": "RFC 3261 §15.1.2, §21.4.19"}, {"id": "sip-0091", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["method", "concept"], "question": "stateful 프록시는 CANCEL을 받으면 하류의 응답을 기다리지 않고 직접 200 OK로 응답한다.", "answer": true, "explain": "맞다. stateful 프록시는 하류 응답을 전달하지 않고 CANCEL에 직접 응답한다.\n그래서 CANCEL을 홉 단위(hop-by-hop) 요청이라고 부른다.\n프록시는 이어서 자신이 하류로 보낸 INVITE에 대해 새 CANCEL을 만들어 보낸다.\n", "ref": "RFC 3261 §9, §16.10"}, {"id": "sip-0092", "type": "ox", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["method", "concept"], "question": "착신자는 200 OK를 보내기 전 early 다이얼로그 상태에서도 BYE를 보내 통화를 끊을 수 있다.", "answer": false, "explain": "아니다. 착신자의 UA는 early 다이얼로그에서 BYE를 보내면 안 된다(MUST NOT).\n발신자의 UA는 early 다이얼로그와 confirmed 다이얼로그 모두에서 BYE를 보낼 수 있다.\n착신자는 confirmed 다이얼로그에서도 자기 2xx에 대한 ACK를 받거나 서버 트랜잭션이 타임아웃된 뒤에 BYE를 보낸다.\n받기 전에 통화를 거절하려는 착신자는 BYE 대신 486·603 같은 최종 응답을 보낸다.\n", "ref": "RFC 3261 §15, §21.4.24, §21.6.2"}, {"id": "sip-0093", "type": "mcq", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header", "concept"], "question": "다음 180 Ringing에서 처음 나타나, Call-ID·From 태그와 함께 다이얼로그를 식별하게 되는 값은?\n\nSIP/2.0 180 Ringing\nVia: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds8\n ;received=192.0.2.1\nTo: Bob <sip:bob@biloxi.com>;tag=a6c85cf\nFrom: Alice <sip:alice@atlanta.com>;tag=1928301774\nCall-ID: a84b4c76e66710\nContact: <sip:bob@192.0.2.4>\nCSeq: 314159 INVITE\nContent-Length: 0\n", "choices": ["a6c85cf", "1928301774", "z9hG4bKnashds8", "192.0.2.1"], "answer": 0, "explain": "a6c85cf는 Bob의 UAS가 응답에 붙인 To 태그다. INVITE에는 To 태그가 없었다.\n다이얼로그는 Call-ID, From 태그, To 태그의 조합으로 식별된다.\n1928301774는 Alice가 INVITE에 이미 넣은 From 태그다.\nz9hG4bKnashds8은 트랜잭션을 식별하는 branch이고, 192.0.2.1은 첫 프록시가 기록한 received 주소다.\n이 메시지는 RFC 3261 예시의 F8(첫 프록시 → Alice)이다.\n", "ref": "RFC 3261 §12, §12.1, §24.2"}, {"id": "sip-0094", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 1, "tags": ["header", "method"], "question": "Alice가 200 OK를 받고 보낸 ACK다. 처음 INVITE의 branch는 z9hG4bKnashds8이었다. 이 ACK의 branch가 다른 이유는?\n\nACK sip:bob@192.0.2.4 SIP/2.0\nVia: SIP/2.0/UDP pc33.atlanta.com;branch=z9hG4bKnashds9\nMax-Forwards: 70\nTo: Bob <sip:bob@biloxi.com>;tag=a6c85cf\nFrom: Alice <sip:alice@atlanta.com>;tag=1928301774\nCall-ID: a84b4c76e66710\nCSeq: 314159 ACK\nContent-Length: 0\n", "choices": ["2xx에 대한 ACK는 INVITE와 별개인 새 트랜잭션이기 때문", "프록시가 전달하면서 branch 값을 새로 바꿨기 때문", "ACK의 CSeq 메서드가 INVITE에서 ACK로 바뀌었기 때문", "200 OK가 재전송되어 두 번째로 보낸 ACK이기 때문"], "answer": 0, "explain": "2xx에 대한 ACK는 UAC 코어가 다이얼로그 안의 요청처럼 새로 만든다. 그래서 새 트랜잭션이 되고 branch도 새 값이다.\n반대로 486 같은 비-2xx에 대한 ACK는 INVITE와 같은 트랜잭션이라 맨 위 Via(branch 포함)가 INVITE와 같다.\nCSeq 번호는 두 경우 모두 INVITE와 같은 314159이고 메서드만 ACK다.\nRequest-URI가 Bob의 Contact(192.0.2.4)로 바뀐 것도 이 ACK가 다이얼로그 안의 요청이기 때문이다.\n", "ref": "RFC 3261 §13.2.2.4, §17.1.1.3, §24.2"}, {"id": "sip-0095", "type": "mcq", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["header", "concept"], "question": "통화를 마치고 Bob이 보낸 BYE다. Alice의 INVITE는 'CSeq: 314159 INVITE'였다. 이 BYE의 CSeq가 231인 이유는?\n\nBYE sip:alice@pc33.atlanta.com SIP/2.0\nVia: SIP/2.0/UDP 192.0.2.4;branch=z9hG4bKnashds10\nMax-Forwards: 70\nFrom: Bob <sip:bob@biloxi.com>;tag=a6c85cf\nTo: Alice <sip:alice@atlanta.com>;tag=1928301774\nCall-ID: a84b4c76e66710\nCSeq: 231 BYE\nContent-Length: 0\n", "choices": ["CSeq 번호는 방향마다 따로 있고 Bob은 자기 번호를 쓰기 때문", "BYE는 새 트랜잭션이라 CSeq 번호를 무작위로 새로 고르기 때문", "중간 프록시가 BYE를 전달하면서 CSeq 번호를 다시 매겼기 때문", "ACK가 번호를 쓰고 난 뒤 Bob이 번호를 처음부터 시작하기 때문"], "answer": 0, "explain": "다이얼로그의 CSeq 번호는 방향마다 따로 관리된다. 각 UA는 자기 요청에 자기 번호를 1씩 올려 쓴다.\nBob은 이 다이얼로그에서 처음 요청을 보내므로 자기 초기값 231을 썼다.\nBob이 보내는 요청이라 From은 Bob, To는 Alice로 바뀌었다. 태그도 함께 바뀐다.\nCall-ID는 다이얼로그 내내 같다.\n", "ref": "RFC 3261 §12.2.1.1, §24.2"}, {"id": "sip-0096", "type": "open", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["message-flow"], "question": "INVITE로 시작해 BYE로 끝나는 기본 호의 메시지 흐름을, 각 메시지를 누가 누구에게 보내는지와 함께 설명하라.", "answer": "발신자가 INVITE를 보낸다.\n착신자는 100 Trying(받아서 처리 중)과 180 Ringing(벨이 울리는 중)을 보내고, 전화를 받으면 200 OK를 보낸다.\n발신자는 200 OK에 ACK를 보내고, 이것으로 세션이 확립된다.\n통화를 끝낼 때는 끊는 쪽이 BYE를 보내고 상대가 200 OK로 답한다.\n", "points": ["INVITE(발신자 → 착신자)로 시작한다", "100 Trying·180 Ringing 잠정 응답", "착신자가 받으면 200 OK, 발신자가 ACK로 확립(3-way)", "끊는 쪽이 BYE, 상대가 200 OK"], "explain": "BYE는 발신자와 착신자 누구든 보낼 수 있다.\nACK는 INVITE의 최종 응답에만 보내므로 BYE의 200 OK에는 보내지 않는다.\n", "ref": "RFC 3261 §4 (Figure 1), §13.2.2.4, §15.1"}, {"id": "sip-0097", "type": "open", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["method", "message-flow"], "question": "CANCEL과 BYE는 각각 언제 쓰는지, 그리고 CANCEL을 보내면 어떤 응답들이 오는지 설명하라.", "answer": "CANCEL은 아직 최종 응답을 받지 않은(진행 중인) INVITE를 취소할 때 쓴다.\nBYE는 이미 확립된 세션을 끝낼 때 쓴다.\nCANCEL을 보내면 CANCEL 자체에는 200 OK가 오고, 원래 INVITE에는 487 Request Terminated가 온다.\n발신자는 487에 ACK를 보낸다.\n", "points": ["CANCEL: 최종 응답 전, 진행 중인 INVITE 취소", "BYE: 확립된 세션 종료", "CANCEL에는 200 OK", "원래 INVITE에는 487 Request Terminated, 발신자가 ACK"], "explain": "200 OK와 487은 서로 다른 트랜잭션(CANCEL, INVITE)에 대한 응답이다.\nCANCEL은 INVITE가 아닌 요청에는 보내지 않는다(SHOULD NOT).\n", "ref": "RFC 3261 §9.1, §9.2, §15, §17.1.1.2; RFC 3665 §3.8"}, {"id": "sip-0098", "type": "open", "topic": "SIP", "difficulty": "basic", "importance": 3, "tags": ["header", "concept"], "question": "SIP에서 트랜잭션과 다이얼로그는 각각 무엇으로 식별하는지 설명하라.", "answer": "트랜잭션(요청 하나와 그 응답들)은 Via 헤더의 branch 값으로 식별한다.\nRFC 3261 방식의 branch는 z9hG4bK로 시작한다.\n다이얼로그(두 UA 사이의 지속 관계)는 Call-ID, From 태그, To 태그 세 값의 조합으로 식별한다.\n", "points": ["트랜잭션 = Via의 branch", "branch는 z9hG4bK로 시작", "다이얼로그 = Call-ID + From 태그 + To 태그"], "explain": "To 태그는 착신 UAS가 응답에 붙이므로 첫 INVITE에는 없다.\n트랜잭션이 다이얼로그보다 작은 단위다.\n", "ref": "RFC 3261 §8.1.1.7, §12, §17"}, {"id": "sip-0099", "type": "open", "topic": "SIP", "difficulty": "basic", "importance": 2, "tags": ["header", "response-code"], "question": "401 Unauthorized와 407 Proxy Authentication Required의 차이를, 보내는 쪽과 주고받는 헤더 중심으로 설명하라.", "answer": "401은 UAS나 등록 서버가 보내고, 챌린지를 WWW-Authenticate 헤더에 담는다.\n단말은 Authorization 헤더에 자격증명을 넣어 다시 요청한다.\n407은 프록시가 보내고, 챌린지를 Proxy-Authenticate 헤더에 담는다.\n단말은 Proxy-Authorization 헤더로 답한다.\n자격증명을 넣어 다시 보내는 요청은 CSeq를 1 올린다.\n", "points": ["401: UAS·등록 서버, WWW-Authenticate → Authorization", "407: 프록시, Proxy-Authenticate → Proxy-Authorization", "다시 보내는 요청은 CSeq 증가"], "explain": "프록시는 401을 쓰면 안 된다(MUST NOT).\n403 Forbidden은 인증으로도 해결되지 않는 거절이라 401·407과 다르다.\n", "ref": "RFC 3261 §21.4.2, §21.4.8, §22.1, §22.2, §22.3"}, {"id": "sip-0100", "type": "open", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["method", "concept"], "question": "INVITE의 2xx 응답에 대한 ACK와, 486 같은 비-2xx 응답에 대한 ACK가 어떻게 다른지 설명하라.", "answer": "비-2xx에 대한 ACK는 INVITE 클라이언트 트랜잭션이 만들고, INVITE와 같은 트랜잭션에 속해 홉 단위로 오간다.\n그래서 맨 위 Via(branch 포함)가 INVITE와 같다.\n2xx에 대한 ACK는 UAC 코어가 다이얼로그 안의 요청처럼 만들어 상대 UA까지 종단 간에 보낸다.\n별도 트랜잭션이라 branch가 새 값이다.\n두 경우 모두 CSeq 번호는 INVITE와 같고 메서드만 ACK다.\n", "points": ["비-2xx ACK: INVITE와 같은 트랜잭션, 홉 단위", "2xx ACK: UAC 코어가 만드는 별도 트랜잭션, 종단 간, 새 branch", "CSeq 번호는 INVITE와 같고 메서드만 ACK"], "explain": "UAS는 2xx를 ACK를 받을 때까지 재전송하고, UAC는 재전송된 2xx마다 ACK를 다시 보낸다.\n", "ref": "RFC 3261 §13.2.2.4, §13.3.1.4, §17.1.1.3"}, {"id": "sip-0101", "type": "open", "topic": "SIP", "difficulty": "advanced", "importance": 2, "tags": ["method", "message-flow"], "question": "re-INVITE가 무엇인지, 누가 보낼 수 있는지, 상대가 거절하면 세션이 어떻게 되는지 설명하라.", "answer": "re-INVITE는 이미 확립된 다이얼로그 안에서 다시 보내는 INVITE다.\n주소·포트·미디어 같은 세션 정보를 바꿀 때 쓴다.\n발신자와 착신자 누구든 보낼 수 있다.\n상대가 488 같은 비-2xx 최종 응답으로 거절하면 세션은 re-INVITE 전의 설정 그대로 유지된다.\n", "points": ["같은 다이얼로그 안의 INVITE로 세션을 수정", "발신자·착신자 모두 보낼 수 있음", "거절(비-2xx)되면 기존 세션 그대로 유지"], "explain": "다만 481이나 408을 받거나 응답이 없으면 UAC는 다이얼로그를 끝낸다.\n양쪽이 동시에 보내 엇갈리면 받은 쪽이 491 Request Pending을 돌려준다.\n", "ref": "RFC 3261 §14, §14.1, §14.2"}]</script>

<script id="concepts-data" type="application/json">{"csgn": [{"set": "csgn-reg", "summary": "단말(UE)이 LTE 망을 쓰려면 먼저 Attach로 망에 등록해야 한다.\nAttach는 \"인증 → 위치 등록 → 데이터 통로 생성\" 순서로 진행되고, MME가 전체를 지휘한다.\nMME는 HSS에서 인증 벡터를 받아(AIR/AIA) 단말과 EPS AKA 인증을 한다.\n인증이 끝나면 MME는 HSS에 자신을 이 단말의 서빙 MME로 등록하고 가입자 데이터를 받는다(ULR/ULA).\n그다음 MME는 S-GW·P-GW에 기본 베어러를 만들고(Create Session) 단말에 Attach Accept를 보낸다.\n등록이 끝난 단말은 EMM-REGISTERED 상태가 되고, MME가 할당한 임시 식별자 GUTI를 받는다.\nC-SGN은 MME·S-GW(필요하면 P-GW까지)를 한 장비에 합친 노드라서, 이 역할들이 한 장비 안에서 이루어진다.\n", "flows": [{"id": "ims-0018", "title": "LTE 첫 접속(Attach) 전체", "when": ["휴대폰 전원을 켠 직후, 망에 처음 붙을 때", "원격 검침기 같은 IoT 단말을 설치하고 처음 전원을 넣을 때", "새 USIM을 꽂고 처음 켤 때처럼 유효한 GUTI가 없을 때. 이때는 IMSI로 자신을 알린다"], "notes": ["단말이 망 접속을 요청한다. 유효한 GUTI가 있으면 GUTI로, 없으면 IMSI로 자신을 알린다. 실제로는 eNodeB를 거쳐 MME로 간다.", "MME가 HSS에 인증 벡터를 요청한다(S6a).", "HSS가 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다.", "MME가 RAND와 AUTN을 단말에 보낸다(EPS AKA).", "단말(USIM)이 AUTN으로 망을 확인하고 RES를 계산해 돌려준다. MME는 RES가 XRES와 같으면 인증 성공으로 본다.", "MME가 HSS에 자신을 이 단말의 서빙 MME로 등록한다. 첫 접속이라는 표시(Initial-Attach-Indicator)를 넣는다.", "HSS가 가입자 데이터(APN별 PDN 가입 정보, QoS)를 돌려준다. 단말이 이전 MME에 등록돼 있었다면 HSS는 그 전에 이전 MME에 CLR을 보낸다.", "MME가 S-GW에 기본 베어러 생성을 요청한다. S-GW는 이 요청을 P-GW로 넘긴다.", "P-GW가 단말 주소(PDN Address)를 할당하고 기본 베어러를 만든다. 응답은 S-GW를 거쳐 MME로 온다.", "MME가 접속을 수락한다. GUTI와 TA 목록이 들어 있다. eNodeB에는 Initial Context Setup Request에 실려 간다.", "단말이 무선 베어러를 세운 뒤 접속 완료를 알린다.", "MME가 S-GW에 eNodeB 주소와 하향 TEID를 알려 준다.", "S-GW가 응답한다. 이제 S-GW가 단말 쪽으로 하향 데이터를 보낼 수 있고, Attach가 끝난다."]}, {"id": "diam-0034", "title": "Attach 중 MME ↔ HSS (S6a)", "when": ["MME에 이 단말의 가입자 정보가 없을 때. 처음 접속하거나, 마지막 Detach 뒤 담당 MME가 바뀐 경우다", "다른 MME가 담당하는 지역으로 옮긴 단말이 새 MME로 접속할 때. HSS는 ULA 전에 이전 MME에 CLR을 보낸다"], "notes": ["AIR: MME가 HSS에 인증 정보를 요청한다. 단말 인증 전에 보낸다.", "AIA: HSS가 E-UTRAN 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다. MME는 이것으로 EPS AKA를 한다.", "ULR: 인증이 끝나면 MME가 자신을 서빙 MME로 HSS에 등록한다.", "ULA: HSS가 가입자 데이터를 돌려준다. MME는 이 데이터로 단말 컨텍스트를 만들고 기본 베어러 생성으로 넘어간다."]}], "terms": [{"term": "C-SGN", "full": "CIoT Serving Gateway Node", "desc": "MME·S-GW·P-GW 같은 EPS 기능을 한 장비에 모은 결합 노드 구현 방식이다. 물리 장비 수를 줄이려는 CIoT 배포용이며, 소량 데이터 전송용 CIoT 최적화를 지원한다.", "ref": "TS 23.401 Annex L.4"}, {"term": "CIoT", "full": "Cellular IoT", "desc": "저복잡도·저속 IoT 단말을 위한 셀룰러 망 기능 전체를 부르는 말이다. NB-IoT가 여기에 속한다.", "ref": "TS 23.401 §3.1"}, {"term": "NB-IoT", "full": "Narrowband-IoT", "desc": "CIoT용 무선 접속 기술이다. 180 kHz(PRB 1개) 대역폭으로 E-UTRA에 접속한다.", "ref": "TS 23.401 §3.1"}, {"term": "MME", "full": "Mobility Management Entity", "desc": "단말과 NAS 신호를 주고받는 제어 노드다. NAS 보안, 휴지 단말 페이징, TA 목록 관리, S-GW·P-GW 선택을 맡는다.", "ref": "TS 23.401 §4.4.2"}, {"term": "S-GW", "full": "Serving Gateway", "desc": "무선망(eNodeB) 쪽 사용자 평면을 끝맺는 게이트웨이다. 한 단말에는 한 시점에 S-GW가 하나다.", "ref": "TS 23.401 §4.4.3.2"}, {"term": "P-GW", "full": "PDN Gateway", "desc": "외부 패킷 데이터망(PDN) 쪽 SGi 인터페이스를 끝맺는 게이트웨이다. 단말 IP 주소를 할당한다.", "ref": "TS 23.401 §4.4.3.3"}, {"term": "HSS", "full": "Home Subscriber Server", "desc": "가입자 데이터와 인증 데이터를 가진 서버다. MME와 S6a 인터페이스로 연결된다.", "ref": "TS 23.401 §4.2.3 (S6a)"}, {"term": "EIR", "full": "Equipment Identity Register", "desc": "단말 기기(IMEI)가 도난·불량 기기인지 확인해 주는 서버다. MME와 S13 인터페이스로 연결된다.", "ref": "TS 23.401 §4.2.3 (S13); TS 29.272 §6.2.1"}, {"term": "NAS", "full": "Non-Access Stratum", "desc": "단말과 MME가 직접 주고받는 신호 계층이다. Attach, Service Request, TAU가 NAS 메시지다. eNodeB는 NAS 메시지를 열어 보지 않고 전달만 한다.", "ref": "TS 23.401 §4.4.2, §5.3.10.4"}, {"term": "IMSI", "full": "International Mobile Subscriber Identity", "desc": "가입자(USIM)를 영구적으로 식별하는 번호다. 무선 구간에 드러나지 않도록 평소에는 임시 식별자를 쓰고, 유효한 GUTI가 없을 때만 Attach에 넣는다.", "ref": "TS 23.401 §5.3.2.1 (1단계)", "when": "새 USIM을 꽂고 처음 켤 때처럼 유효한 GUTI가 없으면 Attach Request에 IMSI가 실린다."}, {"term": "GUTI", "full": "Globally Unique Temporary Identity", "desc": "MME가 단말에 할당하는 임시 식별자다. Attach Accept에 담아 내려 준다.", "ref": "TS 23.401 §5.2.2, §5.3.2.1 (17단계)"}, {"term": "M-TMSI / S-TMSI", "desc": "M-TMSI는 단말과 MME 사이에서 사용자를 식별하는 임시 번호로, IMSI와의 대응은 단말과 MME만 안다. S-TMSI는 MME 코드(MMEC)와 M-TMSI를 담은 짧은 임시 식별자로, Service Request 때 단말을 가리킨다.", "ref": "TS 23.401 §5.3.10.3, §5.3.4.1, §5.3.4B.2"}, {"term": "IMEISV", "desc": "단말 기기 식별 번호(ME Identity)다. Attach 중 MME가 받아 EIR 확인에 쓰고 HSS·P-GW에도 전달한다.", "ref": "TS 23.401 §5.3.2.1 (5b단계)"}, {"term": "EPS AKA", "full": "Authentication and Key Agreement", "desc": "MME가 RAND·AUTN을 보내고 단말이 RES로 답하는 인증 절차다. AUTN으로 단말도 망을 검증하고, 인증이 끝나면 양쪽이 같은 키(KASME)를 갖는다.", "ref": "TS 33.401 §6.1.1"}, {"term": "RAND · AUTN · RES · XRES", "desc": "RAND는 무작위 챌린지, AUTN은 망 인증 토큰이다. RES는 단말(USIM)이 계산한 응답이고, XRES는 HSS가 미리 계산해 준 기대 응답이다. MME는 RES와 XRES가 같으면 인증 성공으로 본다.", "ref": "TS 33.401 §6.1.1; TS 29.272 §7.3.18"}, {"term": "AIR / AIA", "full": "Authentication-Information-Request/Answer", "desc": "MME가 HSS에서 인증 벡터(RAND·XRES·AUTN·KASME)를 받는 S6a 커맨드다.", "ref": "TS 29.272 §5.2.3.1"}, {"term": "ULR / ULA", "full": "Update-Location-Request/Answer", "desc": "MME가 HSS에 자신을 서빙 MME로 등록하고, 가입자 데이터를 받는 S6a 커맨드다.", "ref": "TS 29.272 §5.2.1.1"}, {"term": "CLR / CLA", "full": "Cancel-Location-Request/Answer", "desc": "HSS가 MME에 가입자 정보를 지우라고 하는 S6a 커맨드다. 단말이 새 MME로 옮겨 오면 HSS가 이전 MME에 보낸다.", "ref": "TS 29.272 §5.2.1.2; TS 23.401 §5.3.2.1 (9단계)", "when": "다른 MME가 담당하는 지역으로 옮긴 단말이 새 MME로 접속하면, HSS가 이전 MME에 CLR을 보낸다."}, {"term": "ECR / ECA", "full": "ME-Identity-Check-Request/Answer", "desc": "MME가 EIR에 단말 기기 상태를 묻는 S13 커맨드다.", "ref": "TS 29.272 §6.2.1", "when": "Attach 중에 이 단말기가 도난 신고된 기기인지 확인할 때 쓴다."}, {"term": "PDN 연결", "match": ["PDN 연결", "PDN Connection", "PDN connectivity"], "full": "PDN Connection", "desc": "단말과 외부 패킷망(APN으로 가리킴) 사이의 연결이다. IP 방식이면 단말 IP 주소 하나로 대표된다.", "ref": "TS 23.401 §3.1"}, {"term": "APN", "full": "Access Point Name", "desc": "단말이 연결할 외부 패킷망을 가리키는 이름이다. 단말이 APN을 주지 않으면 가입자 데이터의 기본(Default) APN을 쓴다.", "ref": "TS 23.401 §3.1"}, {"term": "기본 베어러", "match": ["기본 베어러", "Default Bearer"], "full": "Default Bearer", "desc": "PDN 연결을 만들 때 처음 생기는 EPS 베어러다. PDN 연결이 끝날 때까지 유지되어 항상 연결(always-on) 상태를 만든다.", "ref": "TS 23.401 §3.1, §4.7.2.1"}, {"term": "EMM-REGISTERED / EMM-DEREGISTERED", "desc": "EMM은 등록 여부를 나타낸다. REGISTERED면 MME가 단말 위치를 TA 목록 단위로 알고, DEREGISTERED면 위치를 몰라 페이징할 수 없다.", "ref": "TS 23.401 §4.6.2", "when": "전원을 켜고 Attach가 끝난 폰은 REGISTERED다. 전원을 꺼서 Detach한 폰은 DEREGISTERED다."}, {"term": "TA · TAI · TA 목록", "full": "Tracking Area", "desc": "TA는 휴지 단말의 위치를 관리하는 구역이다. TAI는 MCC·MNC·TAC로 TA를 식별한다. MME는 등록할 때 TA 여러 개를 묶은 TA 목록을 단말에 준다.", "ref": "TS 23.401 §4.3.5.3, §5.2.3"}, {"term": "TAU", "full": "Tracking Area Update", "desc": "단말이 TA 목록 밖으로 옮겼거나 주기 타이머가 끝났을 때 MME에 위치를 다시 알리는 절차다.", "ref": "TS 23.401 §4.6.3.1", "when": "버스를 타고 다른 동네로 가서 TA 목록에 없는 TA의 셀에 들어갔을 때, 또는 오래 휴지 상태로 있다가 주기 타이머가 끝났을 때 한다."}], "name": "C-SGN ① 등록·인증"}, {"set": "csgn-paging", "summary": "휴지(ECM-IDLE) 상태 단말은 망과 신호 연결이 없다.\n그래서 다시 통신하려면 누가 먼저 연락하느냐에 따라 두 절차 중 하나를 쓴다.\n단말에 보낼 데이터가 생기면 단말이 Service Request를 보낸다(UE triggered).\n망에서 단말 앞으로 데이터가 오면 S-GW가 데이터를 버퍼링하고 DDN으로 MME에 알린다.\nMME는 단말이 등록된 TA 목록 안의 eNodeB들에 페이징을 보내고, 페이징을 받은 단말이 Service Request로 응답한다(Network triggered).\n두 경우 모두 끝에는 Initial Context Setup과 Modify Bearer로 무선 구간과 S1-U 통로가 다시 열린다.\n절전 기능을 쓰는 CIoT 단말은 페이징을 바로 받지 못할 수 있다.\neDRX 단말은 MME가 다음 페이징 시점 직전에 페이징하고, PSM 단말은 깨어날 때까지 S-GW가 데이터를 더 오래 버퍼링한다.\n", "flows": [{"id": "epc-0008", "title": "망이 시작하는 Service Request (DDN → Paging)", "when": ["화면을 끈 채 주머니에 있는 폰(휴지 상태)에 메신저 메시지나 푸시 알림이 도착할 때", "서버가 휴지 상태의 IoT 단말에 원격 명령(밸브 잠금, 설정 변경 등)을 보낼 때"], "notes": ["S-GW에 하향 데이터가 왔지만 단말 쪽 하향 TEID가 없다(휴지 상태). S-GW는 패킷을 버퍼링하고 MME에 알린다. 데이터가 온 베어러의 EPS Bearer ID와 ARP가 들어간다.", "MME가 받았다고 답한다. 단말이 PSM·eDRX라 지금 깨울 수 없으면, 여기에 버퍼링을 더 오래 하라는 요청(extended buffering)을 넣는다.", "MME가 단말이 등록된 TA 목록에 속한 각 eNodeB에 S1-AP Paging을 보낸다.", "eNodeB가 무선으로 단말을 부른다.", "단말이 Service Request로 응답한다. 이후 과정은 단말이 시작하는 Service Request와 같다."]}, {"id": "epc-0016", "title": "단말이 시작하는 Service Request", "when": ["휴지 상태 폰의 화면을 켜고 앱을 열어 데이터를 주고받기 시작할 때", "휴지 상태의 센서가 측정값을 올려야 할 때(S1-U로 데이터를 보내는 단말)", "페이징을 받은 단말이 응답할 때. 망이 시작하는 Service Request의 뒷부분이다"], "notes": ["단말이 S-TMSI와 함께 NAS Service Request를 보낸다. eNodeB는 이것을 S1-AP Initial UE Message에 담아 MME로 넘긴다.", "MME가 eNodeB에 S-GW 주소·상향 TEID·QoS·보안 정보를 준다. 필요하면 그 전에 인증·보안 절차를 한다.", "eNodeB가 단말과 무선 베어러를 세운다. 이때부터 업링크 데이터가 S-GW로 갈 수 있다.", "eNodeB가 자기 주소와 하향 TEID를 MME에 알린다.", "MME가 그 정보를 S-GW에 넘긴다.", "S-GW가 응답한다. 이제 다운링크도 흐른다."]}], "terms": [{"term": "ECM-IDLE / ECM-CONNECTED", "desc": "ECM은 신호 연결 여부를 나타낸다. IDLE이면 NAS 신호 연결이 없고 S1-MME·S1-U도 없다. CONNECTED면 RRC 연결과 S1-MME 연결로 된 신호 연결이 있고, MME가 단말 위치를 eNodeB 단위로 안다.", "ref": "TS 23.401 §4.6.3", "when": "통화나 동영상 시청 중인 폰은 CONNECTED다. 화면을 끄고 한동안 쓰지 않은 폰은 IDLE이고, 이때도 등록(EMM-REGISTERED)은 유지된다."}, {"term": "RRC", "full": "Radio Resource Control", "desc": "단말과 eNodeB 사이의 무선 제어 신호다. ECM-CONNECTED의 신호 연결은 RRC 연결과 S1-MME 연결 두 부분으로 이루어진다.", "ref": "TS 23.401 §4.6.3.2"}, {"term": "S1-AP", "desc": "eNodeB와 MME 사이(S1-MME)의 제어 프로토콜이다. Initial UE Message, Initial Context Setup, Paging, UE Context Release가 S1-AP 메시지다.", "ref": "TS 23.401 §4.2.3, §5.3.4.1"}, {"term": "Service Request", "desc": "휴지 단말이 사용자 평면(무선 베어러·S1-U)을 다시 세워 달라고 MME에 보내는 NAS 메시지다. 페이징에 응답할 때도 이 메시지를 보낸다.", "ref": "TS 23.401 §5.3.4.1, §5.3.4.3 (5단계)", "when": "휴지 상태에서 앱을 열어 데이터를 보내려 할 때, 또는 페이징을 받았을 때 보낸다."}, {"term": "Initial UE Message", "desc": "eNodeB가 단말의 첫 NAS 메시지(Service Request 등)를 MME로 넘길 때 쓰는 S1-AP 메시지다. TAI·셀 정보와 S-TMSI가 함께 들어간다.", "ref": "TS 23.401 §5.3.4.1 (2단계)"}, {"term": "Initial Context Setup", "desc": "MME가 eNodeB에 단말 컨텍스트(S-GW 주소·상향 TEID·QoS·보안 정보)를 주는 S1-AP 절차다. eNodeB는 무선 베어러를 세운 뒤 Complete로 자기 주소와 하향 TEID를 알린다.", "ref": "TS 23.401 §5.3.4.1 (4, 7단계)"}, {"term": "DDN", "full": "Downlink Data Notification", "desc": "S-GW가 하향 사용자 평면 TEID가 없는 단말 앞으로 데이터가 왔다고 MME에 알리는 메시지다. 데이터가 온 베어러의 EPS Bearer ID와 ARP가 들어간다. MME는 DDN Ack로 답한다.", "ref": "TS 23.401 §5.3.4.3 (1, 2단계)", "when": "휴지 상태 단말 앞으로 메시지나 원격 명령 패킷이 S-GW에 도착했을 때 보낸다."}, {"term": "ARP", "full": "Allocation and Retention Priority", "desc": "베어러의 우선순위 값이다. S-GW는 더 높은 우선순위 베어러로 데이터가 오면 DDN을 다시 보낸다.", "ref": "TS 23.401 §5.3.4.3"}, {"term": "Paging", "desc": "MME가 휴지 단말을 부르는 절차다. MME는 단말이 등록된 TA 목록의 각 eNodeB에 S1-AP Paging을 보내고, eNodeB가 무선으로 단말을 부른다.", "ref": "TS 23.401 §5.3.4.3 (3a, 4a단계)", "when": "휴지 상태 폰에 메시지가 오거나, 서버가 휴지 상태 IoT 단말에 명령을 보낼 때 일어난다."}, {"term": "eDRX", "full": "extended idle mode DRX", "desc": "휴지 단말이 페이징을 듣는 주기를 길게 늘려 전력을 아끼는 기능이다. 단말이 Attach·TAU 때 요청하고 MME가 허용 여부를 정한다. MME는 단말의 다음 페이징 시점 직전에 페이징한다.", "ref": "TS 23.401 §5.13a, §5.3.4.3 (3a단계)", "when": "평소에는 조용하지만 가끔 망에서 명령을 받아야 하고, 응답이 조금 늦어도 되는 위치 추적기나 스마트 계량기에 쓴다."}, {"term": "Extended buffering", "desc": "단말이 PSM·eDRX 때문에 지금 페이징을 받을 수 없을 때, MME가 DDN Ack로 S-GW에 하향 데이터를 더 오래 버퍼링하게 하는 기능이다. DL Buffering Requested와 버퍼링 시간을 넣는다.", "ref": "TS 23.401 §5.3.4.3 (2단계)", "when": "PSM으로 잠든 검침기에 서버가 설정 변경 명령을 보내면, 검침기가 깨어날 때까지 S-GW가 그 패킷을 보관한다."}], "name": "C-SGN ② 통신·페이징"}, {"set": "csgn-idle", "summary": "데이터를 한동안 주고받지 않은 단말은 휴지(ECM-IDLE) 상태로 내려간다.\n이 전환을 S1 release라고 한다.\n보통 eNodeB가 User Inactivity(사용자 무활동)를 원인으로 S1 UE Context Release Request를 보내며 시작한다.\nMME는 S-GW에 Release Access Bearers를 보내 S1-U의 eNodeB 쪽 정보(주소·TEID)를 지우게 한다.\nMME가 eNodeB에 UE Context Release Command를 보내면, eNodeB는 RRC Connection Release로 단말 무선 연결을 끊고 단말 컨텍스트를 지운다.\n등록(EMM-REGISTERED), PDN 연결, non-GBR 베어러는 MME와 S-GW에 그대로 남는다.\n그래서 다시 통신할 때는 Attach 없이 Service Request만 하면 된다.\nCIoT 단말은 휴지 중 전력을 더 아끼려고 PSM이나 eDRX를 쓴다.\nPSM 단말은 휴지가 된 뒤 Active 타이머가 끝나면 무선 기능을 끄고, 그동안 페이징을 받지 않는다.\n", "flows": [{"id": "epc-0017", "title": "eNodeB가 시작하는 S1 release", "when": ["앱을 닫고 폰을 주머니에 넣어 한동안 데이터가 오가지 않을 때. '한동안'의 길이는 망마다 설정이 다르다", "IoT 단말이 측정값을 보낸 뒤 더 주고받을 데이터가 없을 때"], "notes": ["eNodeB가 단말을 휴지 상태로 보내자고 요청한다. 흔한 원인은 일정 시간 데이터가 없는 User Inactivity다.", "MME가 S-GW에 그 단말의 S1-U 베어러 해제를 요청한다.", "S-GW가 eNodeB 주소와 TEID를 지우고 답한다. 자기 상향 TEID와 베어러는 유지하고, 이후 오는 하향 패킷은 버퍼링한다.", "MME가 eNodeB에 단말 컨텍스트 해제를 지시한다.", "eNodeB가 단말 무선 연결을 끊는다. 단말이 확인하면 eNodeB는 단말 컨텍스트를 지운다.", "eNodeB가 해제를 확인한다. MME는 eNodeB 관련 정보만 지우고 나머지 단말 정보는 유지한다. 단말과 MME 모두 ECM-IDLE이 된다."]}], "terms": [{"term": "S1 release", "desc": "단말의 S1-AP 신호 연결과 모든 S1-U 베어러를 해제해 단말을 ECM-CONNECTED에서 ECM-IDLE로 보내는 절차다. eNodeB나 MME가 시작한다.", "ref": "TS 23.401 §5.3.5", "when": "앱을 닫고 한동안 데이터가 오가지 않을 때, 또는 IoT 단말이 보고를 마쳤을 때 일어난다."}, {"term": "UE Context Release Request / Command / Complete", "match": ["S1 UE Context Release Request", "S1 UE Context Release Command", "S1 UE Context Release Complete", "UE Context Release Request", "UE Context Release Command", "UE Context Release Complete", "UE Context Release"], "desc": "S1 release의 S1-AP 메시지다. Request는 eNodeB가 해제를 요청할 때, Command는 MME가 해제를 지시할 때, Complete는 eNodeB가 해제를 확인할 때 보낸다. 퀴즈 조각에서는 S1 접두어를 빼고 Req·Cmd·Cmpl로 줄여 쓴다.", "ref": "TS 23.401 §5.3.5 (1b, 4, 6단계)"}, {"term": "Release Access Bearers Request / Response", "match": ["Release Access Bearers Request", "Release Access Bearers Response", "Release Access Bearers"], "desc": "MME가 S-GW에 그 단말의 S1-U 베어러 해제를 요청하는 메시지다. S-GW는 eNodeB 주소와 TEID만 지우고, 자신이 할당한 S1-U 설정은 유지한다.", "ref": "TS 23.401 §5.3.5 (2, 3단계)"}, {"term": "RRC Connection Release", "desc": "eNodeB가 단말의 무선 연결을 끊는 메시지다. 단말이 확인하면 eNodeB는 단말 컨텍스트를 지운다.", "ref": "TS 23.401 §5.3.5 (5단계)"}, {"term": "User Inactivity", "desc": "일정 시간 데이터가 없어 eNodeB가 S1 release를 요청할 때 쓰는 원인 값이다. 이 원인이면 MME는 GBR 베어러도 유지한다.", "ref": "TS 23.401 §5.3.5 (1b, 6단계)"}, {"term": "GBR / non-GBR 베어러", "match": ["GBR 베어러", "non-GBR 베어러", "GBR", "non-GBR"], "full": "Guaranteed Bit Rate", "desc": "GBR 베어러는 보장 비트율용 망 자원을 고정으로 잡아 두는 베어러다. 그렇지 않은 베어러는 non-GBR이다. S1 release 뒤에도 non-GBR 베어러는 항상 보존된다.", "ref": "TS 23.401 §4.7.2.1, §5.3.5 (6단계)"}, {"term": "PSM", "full": "Power Saving Mode", "desc": "휴지 단말이 무선 기능을 꺼서 전력을 아끼는 모드다. PSM 중 단말은 페이징을 받지 않는다. MME는 단말을 EMM-REGISTERED로 보되 도달 불가로 처리한다.", "ref": "TS 23.401 §4.3.22", "when": "하루에 몇 번만 값을 보고하고, 망이 먼저 연락할 일이 거의 없는 수도·가스 원격 검침기에 쓴다."}, {"term": "Active Time · Active 타이머", "desc": "PSM에 들어가기 전 휴지 상태로 페이징을 받는 시간이다. 단말이 Attach·TAU 때 요청하고, ECM-IDLE이 될 때 단말과 MME가 타이머를 시작한다. 타이머가 끝나면 단말은 PSM에 들어간다.", "ref": "TS 23.401 §4.3.22", "when": "보고를 마친 검침기가 혹시 올 명령을 잠깐 기다리는 시간이다. 이 시간이 지나면 PSM으로 잠든다."}, {"term": "주기적 TAU", "desc": "단말이 망에 살아 있음을 알리려고 정해진 주기마다 하는 TAU다. PSM 단말은 이 시점에 깨어난다. 보낼 데이터가 생기면 그 전에도 깨어날 수 있다.", "ref": "TS 23.401 §4.6.3.1, §4.3.22", "when": "PSM으로 잠든 검침기가 정해진 주기마다 깨어나 망에 아직 살아 있다고 알릴 때 한다."}, {"term": "Connection Suspend / Resume", "match": ["Connection Suspend", "Connection Resume"], "desc": "User Plane CIoT 최적화에서 S1 release 대신 쓰는 방식이다. eNodeB가 단말 컨텍스트를 지우지 않고 보관해 두었다가, 단말이 돌아오면 Service Request 대신 Resume으로 빠르게 복귀한다.", "ref": "TS 23.401 §4.6.3.1, §4.6.3.2, §5.3.4.3 (5단계)", "when": "짧은 통신을 자주 하는 IoT 단말이 매번 연결을 처음부터 세우지 않고 빠르게 돌아오려 할 때 쓴다."}], "name": "C-SGN ③ 휴지(S1 release)"}, {"set": "csgn-data", "summary": "사용자 데이터가 지나는 길(사용자 평면)과 절차를 지휘하는 신호의 길(제어 평면)은 따로 있다.\n업링크 데이터는 UE → eNodeB → S-GW → P-GW → 외부망 순서로 흐르고, 다운링크는 그 반대다.\neNodeB–S-GW 구간(S1-U)과 S-GW–P-GW 구간(S5)에서는 사용자 패킷을 GTP-U 터널에 담아 보낸다.\n터널 안의 패킷이 어느 베어러 것인지는 TEID로 구분한다.\nTEID는 받는 쪽이 정해서 보내는 쪽에 알려 준다.\n그래서 eNodeB는 S-GW가 정한 상향 TEID를, S-GW는 eNodeB가 정한 하향 TEID를 알아야 한다.\nService Request에서 업링크가 먼저 열리는 이유가 여기에 있다.\neNodeB는 Initial Context Setup Request로 상향 TEID를 바로 받지만, S-GW는 Modify Bearer Request를 받아야 하향 TEID를 안다.\nC-SGN이 쓰는 Control Plane CIoT 최적화는 이 사용자 평면을 쓰지 않는다.\n소량 데이터를 NAS 메시지에 담아 MME로 보내고, MME가 S11-U로 S-GW에 넘긴다.\n", "flows": [{"id": "epc-0016", "title": "Service Request에서 TEID가 오가는 순서", "when": ["휴지 상태에서 앱이 서버에 요청을 보낼 때. 요청(업링크)은 무선 베어러가 서자마자 나갈 수 있지만, 서버의 응답(다운링크)은 Modify Bearer가 끝나야 단말 쪽으로 내려간다"], "notes": ["아직 사용자 평면이 없다. S-GW는 S1 release 때 eNodeB 쪽 TEID를 지웠고, 자기 상향 TEID만 갖고 있다.", "MME가 보관하던 S-GW 주소와 상향 TEID를 eNodeB에 준다. TEID는 받는 쪽이 정하므로 상향 TEID는 S-GW가 정한 값이다.", "무선 베어러가 서면 eNodeB가 상향 TEID를 붙여 업링크 패킷을 S-GW로 보낼 수 있다. 업링크가 먼저 열린다.", "eNodeB가 하향 TEID를 정해 자기 주소와 함께 MME에 알린다.", "MME가 eNodeB 주소와 하향 TEID를 S-GW에 넘긴다.", "S-GW가 하향 TEID를 알게 되어 다운링크가 열린다."]}], "terms": [{"term": "EPS 베어러", "match": ["EPS 베어러", "EPS bearer"], "desc": "단말과 P-GW 사이에서 같은 QoS로 다루는 트래픽 흐름의 단위다. QoS를 다르게 주려면 베어러를 따로 만든다. PDN 연결마다 기본 베어러가 하나 있고, 추가 베어러는 전용(dedicated) 베어러라고 한다.", "ref": "TS 23.401 §4.7.2.1"}, {"term": "EPS Bearer ID", "desc": "단말의 EPS 베어러를 구분하는 번호다. DDN과 Control Plane CIoT의 NAS 데이터에 들어간다.", "ref": "TS 23.401 §5.3.4.3, §5.3.4B.1"}, {"term": "TFT", "full": "Traffic Flow Template", "desc": "베어러에 붙는 패킷 필터 묶음이다. 단말은 상향 TFT로, P-GW는 하향 TFT로 패킷을 어느 베어러에 실을지 정한다.", "ref": "TS 23.401 §4.7.2.1"}, {"term": "GTP-U / GTP-C", "full": "GPRS Tunnelling Protocol", "desc": "GTP-U는 S1-U·S5에서 사용자 패킷을 터널로 나르는 프로토콜이다. S11·S5의 제어 메시지(Create Session, Modify Bearer, DDN 등)는 GTP 제어 프로토콜(GTP-C)로 주고받는다.", "ref": "TS 23.401 §4.2.3; TS 29.281 §3.2"}, {"term": "TEID", "full": "Tunnel Endpoint Identifier", "desc": "GTP 터널의 받는 쪽 끝점을 가리키는 식별자다. 받는 쪽이 값을 정하고, 보내는 쪽은 그 값을 붙여 보낸다. 값은 제어 메시지로 교환한다.", "ref": "TS 29.281 §3.1"}, {"term": "S1-MME", "desc": "eNodeB와 MME 사이의 제어 평면 레퍼런스 포인트다(S1-AP).", "ref": "TS 23.401 §4.2.3"}, {"term": "S1-U", "desc": "eNodeB와 S-GW 사이의 베어러별 사용자 평면 터널이다. Control Plane CIoT 최적화에는 쓰지 않는다.", "ref": "TS 23.401 §4.2.3"}, {"term": "S11 / S11-U", "desc": "S11은 MME와 S-GW 사이의 제어 평면이다. S11-U는 Control Plane CIoT 최적화를 위해 같은 구간에 둔 사용자 평면이다.", "ref": "TS 23.401 §4.2.3"}, {"term": "S5 / S8", "desc": "S-GW와 P-GW 사이의 사용자 평면 터널과 터널 관리 구간이다. 같은 사업자 안이면 S5, 로밍처럼 방문망 S-GW와 홈망 P-GW 사이면 S8이다.", "ref": "TS 23.401 §4.2.3"}, {"term": "SGi", "desc": "P-GW와 외부 패킷 데이터망(인터넷, IMS 등) 사이의 레퍼런스 포인트다.", "ref": "TS 23.401 §4.2.3"}, {"term": "Modify Bearer Request", "match": ["Modify Bearer Request", "Modify Bearer"], "desc": "MME가 S-GW에 eNodeB 주소와 하향 TEID를 알려 주는 GTP-C 메시지다. 이 메시지 뒤에야 S-GW가 단말 쪽으로 하향 데이터를 보낼 수 있다.", "ref": "TS 23.401 §5.3.4.1 (8단계)", "when": "휴지 상태에서 깨어난 단말에 서버 응답을 내려보내기 직전, S-GW가 eNodeB 쪽 하향 경로를 알게 되는 순간이다."}, {"term": "Control Plane CIoT 최적화", "match": ["Control Plane CIoT 최적화", "Control Plane CIoT EPS Optimisation", "Control Plane CIoT"], "full": "Control Plane CIoT EPS Optimisation", "desc": "사용자 데이터를 NAS 메시지에 EPS Bearer ID와 함께 담아 보내는 방식이다. 무선 베어러와 S1-U를 세우지 않아 신호가 줄어든다. 데이터는 eNodeB → MME(S1-AP) → S-GW(S11-U)로 간다.", "ref": "TS 23.401 §5.3.4B.1, §5.3.4B.2", "when": "온도·위치 같은 작은 값을 가끔 올리는 NB-IoT 센서처럼, 무선 베어러를 세우는 신호가 데이터보다 큰 경우에 쓴다."}, {"term": "ROHC", "desc": "IP 헤더 압축 방식이다. Control Plane CIoT에서는 단말과 MME 사이에서 압축한다. 업링크는 단말이 압축하고 MME가 풀고, 다운링크는 그 반대다.", "ref": "TS 23.401 §5.3.4B.1"}, {"term": "Release Assistance Information", "desc": "단말이 NAS 데이터에 함께 넣어 '이후 데이터 없음' 또는 '응답 하향 데이터 한 번만 옴'을 알리는 정보다. MME는 이를 보고 연결을 일찍 해제할 수 있다.", "ref": "TS 23.401 §5.3.4B.2 (1단계), §5.3.5", "when": "센서가 측정값 하나만 보내고 끝일 때, 더 주고받을 데이터가 없다고 알려 연결을 일찍 끊게 한다."}], "name": "C-SGN ④ 업링크·다운링크"}], "csgn-reg": [{"set": "csgn-reg", "summary": "단말(UE)이 LTE 망을 쓰려면 먼저 Attach로 망에 등록해야 한다.\nAttach는 \"인증 → 위치 등록 → 데이터 통로 생성\" 순서로 진행되고, MME가 전체를 지휘한다.\nMME는 HSS에서 인증 벡터를 받아(AIR/AIA) 단말과 EPS AKA 인증을 한다.\n인증이 끝나면 MME는 HSS에 자신을 이 단말의 서빙 MME로 등록하고 가입자 데이터를 받는다(ULR/ULA).\n그다음 MME는 S-GW·P-GW에 기본 베어러를 만들고(Create Session) 단말에 Attach Accept를 보낸다.\n등록이 끝난 단말은 EMM-REGISTERED 상태가 되고, MME가 할당한 임시 식별자 GUTI를 받는다.\nC-SGN은 MME·S-GW(필요하면 P-GW까지)를 한 장비에 합친 노드라서, 이 역할들이 한 장비 안에서 이루어진다.\n", "flows": [{"id": "ims-0018", "title": "LTE 첫 접속(Attach) 전체", "when": ["휴대폰 전원을 켠 직후, 망에 처음 붙을 때", "원격 검침기 같은 IoT 단말을 설치하고 처음 전원을 넣을 때", "새 USIM을 꽂고 처음 켤 때처럼 유효한 GUTI가 없을 때. 이때는 IMSI로 자신을 알린다"], "notes": ["단말이 망 접속을 요청한다. 유효한 GUTI가 있으면 GUTI로, 없으면 IMSI로 자신을 알린다. 실제로는 eNodeB를 거쳐 MME로 간다.", "MME가 HSS에 인증 벡터를 요청한다(S6a).", "HSS가 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다.", "MME가 RAND와 AUTN을 단말에 보낸다(EPS AKA).", "단말(USIM)이 AUTN으로 망을 확인하고 RES를 계산해 돌려준다. MME는 RES가 XRES와 같으면 인증 성공으로 본다.", "MME가 HSS에 자신을 이 단말의 서빙 MME로 등록한다. 첫 접속이라는 표시(Initial-Attach-Indicator)를 넣는다.", "HSS가 가입자 데이터(APN별 PDN 가입 정보, QoS)를 돌려준다. 단말이 이전 MME에 등록돼 있었다면 HSS는 그 전에 이전 MME에 CLR을 보낸다.", "MME가 S-GW에 기본 베어러 생성을 요청한다. S-GW는 이 요청을 P-GW로 넘긴다.", "P-GW가 단말 주소(PDN Address)를 할당하고 기본 베어러를 만든다. 응답은 S-GW를 거쳐 MME로 온다.", "MME가 접속을 수락한다. GUTI와 TA 목록이 들어 있다. eNodeB에는 Initial Context Setup Request에 실려 간다.", "단말이 무선 베어러를 세운 뒤 접속 완료를 알린다.", "MME가 S-GW에 eNodeB 주소와 하향 TEID를 알려 준다.", "S-GW가 응답한다. 이제 S-GW가 단말 쪽으로 하향 데이터를 보낼 수 있고, Attach가 끝난다."]}, {"id": "diam-0034", "title": "Attach 중 MME ↔ HSS (S6a)", "when": ["MME에 이 단말의 가입자 정보가 없을 때. 처음 접속하거나, 마지막 Detach 뒤 담당 MME가 바뀐 경우다", "다른 MME가 담당하는 지역으로 옮긴 단말이 새 MME로 접속할 때. HSS는 ULA 전에 이전 MME에 CLR을 보낸다"], "notes": ["AIR: MME가 HSS에 인증 정보를 요청한다. 단말 인증 전에 보낸다.", "AIA: HSS가 E-UTRAN 인증 벡터(RAND·XRES·AUTN·KASME)를 돌려준다. MME는 이것으로 EPS AKA를 한다.", "ULR: 인증이 끝나면 MME가 자신을 서빙 MME로 HSS에 등록한다.", "ULA: HSS가 가입자 데이터를 돌려준다. MME는 이 데이터로 단말 컨텍스트를 만들고 기본 베어러 생성으로 넘어간다."]}], "terms": [{"term": "C-SGN", "full": "CIoT Serving Gateway Node", "desc": "MME·S-GW·P-GW 같은 EPS 기능을 한 장비에 모은 결합 노드 구현 방식이다. 물리 장비 수를 줄이려는 CIoT 배포용이며, 소량 데이터 전송용 CIoT 최적화를 지원한다.", "ref": "TS 23.401 Annex L.4"}, {"term": "CIoT", "full": "Cellular IoT", "desc": "저복잡도·저속 IoT 단말을 위한 셀룰러 망 기능 전체를 부르는 말이다. NB-IoT가 여기에 속한다.", "ref": "TS 23.401 §3.1"}, {"term": "NB-IoT", "full": "Narrowband-IoT", "desc": "CIoT용 무선 접속 기술이다. 180 kHz(PRB 1개) 대역폭으로 E-UTRA에 접속한다.", "ref": "TS 23.401 §3.1"}, {"term": "MME", "full": "Mobility Management Entity", "desc": "단말과 NAS 신호를 주고받는 제어 노드다. NAS 보안, 휴지 단말 페이징, TA 목록 관리, S-GW·P-GW 선택을 맡는다.", "ref": "TS 23.401 §4.4.2"}, {"term": "S-GW", "full": "Serving Gateway", "desc": "무선망(eNodeB) 쪽 사용자 평면을 끝맺는 게이트웨이다. 한 단말에는 한 시점에 S-GW가 하나다.", "ref": "TS 23.401 §4.4.3.2"}, {"term": "P-GW", "full": "PDN Gateway", "desc": "외부 패킷 데이터망(PDN) 쪽 SGi 인터페이스를 끝맺는 게이트웨이다. 단말 IP 주소를 할당한다.", "ref": "TS 23.401 §4.4.3.3"}, {"term": "HSS", "full": "Home Subscriber Server", "desc": "가입자 데이터와 인증 데이터를 가진 서버다. MME와 S6a 인터페이스로 연결된다.", "ref": "TS 23.401 §4.2.3 (S6a)"}, {"term": "EIR", "full": "Equipment Identity Register", "desc": "단말 기기(IMEI)가 도난·불량 기기인지 확인해 주는 서버다. MME와 S13 인터페이스로 연결된다.", "ref": "TS 23.401 §4.2.3 (S13); TS 29.272 §6.2.1"}, {"term": "NAS", "full": "Non-Access Stratum", "desc": "단말과 MME가 직접 주고받는 신호 계층이다. Attach, Service Request, TAU가 NAS 메시지다. eNodeB는 NAS 메시지를 열어 보지 않고 전달만 한다.", "ref": "TS 23.401 §4.4.2, §5.3.10.4"}, {"term": "IMSI", "full": "International Mobile Subscriber Identity", "desc": "가입자(USIM)를 영구적으로 식별하는 번호다. 무선 구간에 드러나지 않도록 평소에는 임시 식별자를 쓰고, 유효한 GUTI가 없을 때만 Attach에 넣는다.", "ref": "TS 23.401 §5.3.2.1 (1단계)", "when": "새 USIM을 꽂고 처음 켤 때처럼 유효한 GUTI가 없으면 Attach Request에 IMSI가 실린다."}, {"term": "GUTI", "full": "Globally Unique Temporary Identity", "desc": "MME가 단말에 할당하는 임시 식별자다. Attach Accept에 담아 내려 준다.", "ref": "TS 23.401 §5.2.2, §5.3.2.1 (17단계)"}, {"term": "M-TMSI / S-TMSI", "desc": "M-TMSI는 단말과 MME 사이에서 사용자를 식별하는 임시 번호로, IMSI와의 대응은 단말과 MME만 안다. S-TMSI는 MME 코드(MMEC)와 M-TMSI를 담은 짧은 임시 식별자로, Service Request 때 단말을 가리킨다.", "ref": "TS 23.401 §5.3.10.3, §5.3.4.1, §5.3.4B.2"}, {"term": "IMEISV", "desc": "단말 기기 식별 번호(ME Identity)다. Attach 중 MME가 받아 EIR 확인에 쓰고 HSS·P-GW에도 전달한다.", "ref": "TS 23.401 §5.3.2.1 (5b단계)"}, {"term": "EPS AKA", "full": "Authentication and Key Agreement", "desc": "MME가 RAND·AUTN을 보내고 단말이 RES로 답하는 인증 절차다. AUTN으로 단말도 망을 검증하고, 인증이 끝나면 양쪽이 같은 키(KASME)를 갖는다.", "ref": "TS 33.401 §6.1.1"}, {"term": "RAND · AUTN · RES · XRES", "desc": "RAND는 무작위 챌린지, AUTN은 망 인증 토큰이다. RES는 단말(USIM)이 계산한 응답이고, XRES는 HSS가 미리 계산해 준 기대 응답이다. MME는 RES와 XRES가 같으면 인증 성공으로 본다.", "ref": "TS 33.401 §6.1.1; TS 29.272 §7.3.18"}, {"term": "AIR / AIA", "full": "Authentication-Information-Request/Answer", "desc": "MME가 HSS에서 인증 벡터(RAND·XRES·AUTN·KASME)를 받는 S6a 커맨드다.", "ref": "TS 29.272 §5.2.3.1"}, {"term": "ULR / ULA", "full": "Update-Location-Request/Answer", "desc": "MME가 HSS에 자신을 서빙 MME로 등록하고, 가입자 데이터를 받는 S6a 커맨드다.", "ref": "TS 29.272 §5.2.1.1"}, {"term": "CLR / CLA", "full": "Cancel-Location-Request/Answer", "desc": "HSS가 MME에 가입자 정보를 지우라고 하는 S6a 커맨드다. 단말이 새 MME로 옮겨 오면 HSS가 이전 MME에 보낸다.", "ref": "TS 29.272 §5.2.1.2; TS 23.401 §5.3.2.1 (9단계)", "when": "다른 MME가 담당하는 지역으로 옮긴 단말이 새 MME로 접속하면, HSS가 이전 MME에 CLR을 보낸다."}, {"term": "ECR / ECA", "full": "ME-Identity-Check-Request/Answer", "desc": "MME가 EIR에 단말 기기 상태를 묻는 S13 커맨드다.", "ref": "TS 29.272 §6.2.1", "when": "Attach 중에 이 단말기가 도난 신고된 기기인지 확인할 때 쓴다."}, {"term": "PDN 연결", "match": ["PDN 연결", "PDN Connection", "PDN connectivity"], "full": "PDN Connection", "desc": "단말과 외부 패킷망(APN으로 가리킴) 사이의 연결이다. IP 방식이면 단말 IP 주소 하나로 대표된다.", "ref": "TS 23.401 §3.1"}, {"term": "APN", "full": "Access Point Name", "desc": "단말이 연결할 외부 패킷망을 가리키는 이름이다. 단말이 APN을 주지 않으면 가입자 데이터의 기본(Default) APN을 쓴다.", "ref": "TS 23.401 §3.1"}, {"term": "기본 베어러", "match": ["기본 베어러", "Default Bearer"], "full": "Default Bearer", "desc": "PDN 연결을 만들 때 처음 생기는 EPS 베어러다. PDN 연결이 끝날 때까지 유지되어 항상 연결(always-on) 상태를 만든다.", "ref": "TS 23.401 §3.1, §4.7.2.1"}, {"term": "EMM-REGISTERED / EMM-DEREGISTERED", "desc": "EMM은 등록 여부를 나타낸다. REGISTERED면 MME가 단말 위치를 TA 목록 단위로 알고, DEREGISTERED면 위치를 몰라 페이징할 수 없다.", "ref": "TS 23.401 §4.6.2", "when": "전원을 켜고 Attach가 끝난 폰은 REGISTERED다. 전원을 꺼서 Detach한 폰은 DEREGISTERED다."}, {"term": "TA · TAI · TA 목록", "full": "Tracking Area", "desc": "TA는 휴지 단말의 위치를 관리하는 구역이다. TAI는 MCC·MNC·TAC로 TA를 식별한다. MME는 등록할 때 TA 여러 개를 묶은 TA 목록을 단말에 준다.", "ref": "TS 23.401 §4.3.5.3, §5.2.3"}, {"term": "TAU", "full": "Tracking Area Update", "desc": "단말이 TA 목록 밖으로 옮겼거나 주기 타이머가 끝났을 때 MME에 위치를 다시 알리는 절차다.", "ref": "TS 23.401 §4.6.3.1", "when": "버스를 타고 다른 동네로 가서 TA 목록에 없는 TA의 셀에 들어갔을 때, 또는 오래 휴지 상태로 있다가 주기 타이머가 끝났을 때 한다."}], "name": "C-SGN ① 등록·인증"}], "csgn-paging": [{"set": "csgn-paging", "summary": "휴지(ECM-IDLE) 상태 단말은 망과 신호 연결이 없다.\n그래서 다시 통신하려면 누가 먼저 연락하느냐에 따라 두 절차 중 하나를 쓴다.\n단말에 보낼 데이터가 생기면 단말이 Service Request를 보낸다(UE triggered).\n망에서 단말 앞으로 데이터가 오면 S-GW가 데이터를 버퍼링하고 DDN으로 MME에 알린다.\nMME는 단말이 등록된 TA 목록 안의 eNodeB들에 페이징을 보내고, 페이징을 받은 단말이 Service Request로 응답한다(Network triggered).\n두 경우 모두 끝에는 Initial Context Setup과 Modify Bearer로 무선 구간과 S1-U 통로가 다시 열린다.\n절전 기능을 쓰는 CIoT 단말은 페이징을 바로 받지 못할 수 있다.\neDRX 단말은 MME가 다음 페이징 시점 직전에 페이징하고, PSM 단말은 깨어날 때까지 S-GW가 데이터를 더 오래 버퍼링한다.\n", "flows": [{"id": "epc-0008", "title": "망이 시작하는 Service Request (DDN → Paging)", "when": ["화면을 끈 채 주머니에 있는 폰(휴지 상태)에 메신저 메시지나 푸시 알림이 도착할 때", "서버가 휴지 상태의 IoT 단말에 원격 명령(밸브 잠금, 설정 변경 등)을 보낼 때"], "notes": ["S-GW에 하향 데이터가 왔지만 단말 쪽 하향 TEID가 없다(휴지 상태). S-GW는 패킷을 버퍼링하고 MME에 알린다. 데이터가 온 베어러의 EPS Bearer ID와 ARP가 들어간다.", "MME가 받았다고 답한다. 단말이 PSM·eDRX라 지금
